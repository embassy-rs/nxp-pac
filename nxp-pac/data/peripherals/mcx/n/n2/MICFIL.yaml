    description: DMA Interrupt Selection.
    bit_offset: 24
    bit_size: 2
    enum: MicfilAlphaEnumVictor
  - name: dbge
    description: "Module Enable in Debug.\n\nRaw bit values: false (0) = Disabled: Disables after completing the current frame.; true (1) = Enabled: Enables operation."
    bit_offset: 26
    bit_size: 1
  - name: sres
    description: "Software Reset.\n\nRaw bit values: false (0) = NoAction: No action.; true (1) = SwReset: Software reset."
    bit_offset: 27
    bit_size: 1
  - name: dbg
    description: "Debug Mode.\n\nRaw bit values: false (0) = Normal: Normal.; true (1) = Debug: Debug."
    bit_offset: 28
    bit_size: 1
  - name: pdmien
    description: "MICFIL Enable.\n\nRaw bit values: false (0) = Stopped: Stops MICFIL operation.; true (1) = Started: Starts MICFIL operation."
    bit_offset: 29
    bit_size: 1
  - name: dozen
    description: "Stop Enable.\n\nRaw bit values: false (0) = Disable: Disables.; true (1) = Enable: Enables."
    bit_offset: 30
    bit_size: 1
  - name: mdis
    description: "Module Disable.\n\nRaw bit values: false (0) = Normal: Normal mode.; true (1) = LowLeakage: DLL mode."
    bit_offset: 31
    bit_size: 1
