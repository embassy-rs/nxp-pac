fieldset/MicfilAlphaFieldsetAlpha:
  description: MICFIL Control 1.
  fields:
  - name: ch0en
    description: Channel 0 Enable.
    bit_offset: 0
    bit_size: 1
  - name: ch1en
    description: Channel 1 Enable.
    bit_offset: 1
    bit_size: 1
  - name: ch2en
    description: Channel 2 Enable.
    bit_offset: 2
    bit_size: 1
  - name: ch3en
    description: Channel 3 Enable.
    bit_offset: 3
    bit_size: 1
  - name: fsyncen
    description: "Frame Synchronization Enable.\n\nRaw bit values: false (0) = Disable: Disables.; true (1) = Enable: Enables."
    bit_offset: 16
    bit_size: 1
  - name: decfils
    description: "Decimation Filter Enable in Stop.\n\nRaw bit values: false (0) = Stop: Stops decimation filter.; true (1) = Run: Keeps decimation filter running."
    bit_offset: 20
    bit_size: 1
  - name: erren
    description: "Error Interruption Enable.\n\nRaw bit values: false (0) = Disabled: Disables.; true (1) = Enabled: Enables."
    bit_offset: 23
    bit_size: 1
