# NXP mcux-soc-svd 7c1f00bdd6263f0b93466f5e73e5fc55a744b879; native chiptool import.
# Source instance geometry is retained in explicit block variants; see private source bindings.
# Unannotated fieldsets construct zero in software, not a claimed hardware reset.
# Command/W1C/SET/CLR/TOG construction defaults are zero masks; no RMW semantics are implied.
# N public manuals do not document FTEST at 0xc; omitted.
# FSTAT/status/W1C/commands use zero construction defaults; no flash operation is implied.
# Source: MCXN235.xml FMU0 sha256 a498ada26162c88f6767738bffcd22801318264c9cb2cbecbd190403b4dbd6a7
# Source: MCXN236.xml FMU0 sha256 ec813b3b24a785c33c5035ebc25a9c713a18018daf1fdb440035a13bf3549e14
# Source: MCXN247.xml FMU0 sha256 dbbed5781a39012768344882dad168430c742f26e4261c6fd0bda9a34ca4a652
block/FmuAlpha:
  description: Flash.
  items:
  - name: fstat
    description: Flash Status Register.
    byte_offset: 0
    fieldset: FmuAlphaFieldsetDelta
  - name: fcnfg
    description: Flash Configuration Register.
    byte_offset: 4
    fieldset: FmuAlphaFieldsetBravo
  - name: fctrl
    description: Flash Control Register.
    byte_offset: 8
    fieldset: FmuAlphaFieldsetCharlie
  - name: fccob
    description: Flash Common Command Object Registers.
    array:
      len: 8
      stride: 4
    byte_offset: 16
    fieldset: FmuAlphaFieldsetAlpha
fieldset/FmuAlphaFieldsetAlpha:
  description: Flash Common Command Object Registers.
  fields:
  - name: cco_bn
    description: CCOBn.
    bit_offset: 0
    bit_size: 32
fieldset/FmuAlphaFieldsetBravo:
  description: Flash Configuration Register.
  fields:
  - name: ccie
    description: "Command Complete Interrupt Enable.\n\nRaw bit values: false (0) = Ccie0: Command complete interrupt disabled.; true (1) = Ccie1: Command complete interrupt enabled."
    bit_offset: 7
    bit_size: 1
  - name: ersreq
    description: "Mass Erase Request.\n\nRaw bit values: false (0) = Ersreq0: No request or request complete.; true (1) = Ersreq1: Request to run the Mass Erase operation."
    bit_offset: 8
    bit_size: 1
  - name: dfdie
    description: "Double Bit Fault Detect Interrupt Enable.\n\nRaw bit values: false (0) = Dfdie0: Double bit fault detect interrupt disabled.; true (1) = Dfdie1: Double bit fault detect interrupt enabled."
    bit_offset: 16
    bit_size: 1
  - name: ersien0
    description: Erase IFR Sector Enable - Block 0.
    bit_offset: 24
    bit_size: 4
    enum: FmuAlphaEnumKilo
  - name: ersien1
    description: Erase IFR Sector Enable - Block 1 (for dual block configs).
    bit_offset: 28
    bit_size: 4
    enum: FmuAlphaEnumLima
fieldset/FmuAlphaFieldsetCharlie:
  description: Flash Control Register.
  fields:
  - name: rwsc
    description: Read Wait-State Control.
    bit_offset: 0
    bit_size: 4
  - name: fdfd
    description: "Force Double Bit Fault Detect.\n\nRaw bit values: false (0) = Fdfd0: FSTAT[DFDIF] sets only if a double bit fault is detected during a valid flash read access from the platform flash controller.; true (1) = Fdfd1: FSTAT[DFDIF] sets during any valid flash read access from the platform flash controller. An interrupt request is generated if the DFDIE bit is set."
    bit_offset: 16
    bit_size: 1
  - name: abtreq
    description: "Abort Request.\n\nRaw bit values: false (0) = Abtreq0: No request to abort a command write sequence.; true (1) = Abtreq1: Request to abort a command write sequence."
    bit_offset: 24
    bit_size: 1
fieldset/FmuAlphaFieldsetDelta:
  description: Flash Status Register.
  fields:
  - name: fail
    description: "Command Fail Flag.\n\nRaw bit values: false (0) = Fail0: Error not detected.; true (1) = Fail1: Error detected."
    bit_offset: 0
    bit_size: 1
  - name: cmdabt
    description: "Command Abort Flag.\n\nRaw bit values: false (0) = Cmdabt0: No command abort detected.; true (1) = Cmdabt1: Command abort detected."
    bit_offset: 2
    bit_size: 1
  - name: pviol
    description: "Command Protection Violation Flag.\n\nRaw bit values: false (0) = Pviol0: No protection violation detected.; true (1) = Pviol1: Protection violation detected."
    bit_offset: 4
    bit_size: 1
  - name: accerr
    description: "Command Access Error Flag.\n\nRaw bit values: false (0) = Accerr0: No access error detected.; true (1) = Accerr1: Access error detected."
    bit_offset: 5
    bit_size: 1
  - name: cwsabt
    description: "Command Write Sequence Abort Flag.\n\nRaw bit values: false (0) = Cwsabt0: Command write sequence not aborted.; true (1) = Cwsabt1: Command write sequence aborted."
    bit_offset: 6
    bit_size: 1
  - name: ccif
    description: "Command Complete Interrupt Flag.\n\nRaw bit values: false (0) = Ccif0: Flash command, initialization, or power mode recovery in progress.; true (1) = Ccif1: Flash command, initialization, or power mode recovery has completed."
    bit_offset: 7
    bit_size: 1
  - name: cmdprt
    description: Command protection level.
    bit_offset: 8
    bit_size: 2
    enum: FmuAlphaEnumGolf
  - name: cmdp
    description: "Command protection status flag.\n\nRaw bit values: false (0) = Cmdp0: Command protection level and domain ID are stale.; true (1) = Cmdp1: Command protection level (CMDPRT) and domain ID (CMDDID) are set."
    bit_offset: 11
    bit_size: 1
  - name: cmddid
    description: Command domain ID.
    bit_offset: 12
    bit_size: 4
  - name: dfdif
    description: "Double Bit Fault Detect Interrupt Flag.\n\nRaw bit values: false (0) = Dfdif0: Double bit fault not detected during a valid flash read access.; true (1) = Dfdif1: Double bit fault detected (or FCTRL[FDFD] is set) during a valid flash read access."
    bit_offset: 16
    bit_size: 1
  - name: salv_used
    description: "Salvage Used for Erase operation.\n\nRaw bit values: false (0) = SalvUsed0: Salvage not used during last operation.; true (1) = SalvUsed1: Salvage used during the last erase operation."
    bit_offset: 17
    bit_size: 1
  - name: pewen
    description: Program-Erase Write Enable Control.
    bit_offset: 24
    bit_size: 2
    enum: FmuAlphaEnumQuebec
  - name: perdy
    description: "Program-Erase Ready Control/Status Flag.\n\nRaw bit values: false (0) = Perdy0: Program or sector erase command operation not stalled.; true (1) = Perdy1: Program or sector erase command operation ready to execute."
    bit_offset: 31
    bit_size: 1
enum/FmuAlphaEnumGolf:
  bit_size: 2
  variants:
  - name: Cmdprt00
    description: Secure, normal access.
    value: 0
  - name: Cmdprt01
    description: Secure, privileged access.
    value: 1
  - name: Cmdprt10
    description: Nonsecure, normal access.
    value: 2
  - name: Cmdprt11
    description: Nonsecure, privileged access.
    value: 3
enum/FmuAlphaEnumKilo:
  bit_size: 4
  variants:
  - name: Ersien00
    description: Block 0 IFR Sector X is protected from erase by ERSSCR command.
    value: 0
  - name: Ersien01
    description: Block 0 IFR Sector X is not protected from erase by ERSSCR command.
    value: 1
enum/FmuAlphaEnumLima:
  bit_size: 4
  variants:
  - name: Ersien10
    description: Block 1 IFR Sector X is protected from erase by ERSSCR command.
    value: 0
  - name: Ersien11
    description: Block 1 IFR Sector X is not protected from erase by ERSSCR command.
    value: 1
enum/FmuAlphaEnumQuebec:
  bit_size: 2
  variants:
  - name: Pewen00
    description: Writes are not enabled.
    value: 0
  - name: Pewen01
    description: Writes are enabled for one flash or IFR phrase (phrase programming, sector erase).
    value: 1
  - name: Pewen10
    description: Writes are enabled for one flash or IFR page (page programming).
    value: 2
