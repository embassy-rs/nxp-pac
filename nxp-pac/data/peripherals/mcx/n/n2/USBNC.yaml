block/UsbncAlpha:
  description: USBNC.
  items:
  - name: ctrl1
    description: USB OTG Control 1.
    byte_offset: 0
    fieldset: UsbncAlphaFieldsetAlpha
  - name: ctrl2
    description: USB OTG Control 2.
    byte_offset: 4
    fieldset: UsbncAlphaFieldsetBravo
  - name: hsic_ctrl
    description: USB Host HSIC Control.
    byte_offset: 16
    fieldset: UsbncAlphaFieldsetCharlie
fieldset/UsbncAlphaFieldsetAlpha:
  description: USB OTG Control 1.
  fields:
  - name: over_cur_dis
    description: "Disable Overcurrent Detection.\n\nRaw bit values: false (0) = OvrcrntDetctEn: Enables.; true (1) = OvrcrntDetctDis: Disables."
    bit_offset: 7
    bit_size: 1
  - name: over_cur_pol
    description: "Polarity of Overcurrent.\n\nRaw bit values: false (0) = ActiveHiOvrcrnt: High active (high on this signal represents an overcurrent condition).; true (1) = ActiveLowOvrcrnt: Low active (low on this signal represents an overcurrent condition)."
    bit_offset: 8
    bit_size: 1
  - name: pwr_pol
    description: "Power Polarity.\n\nRaw bit values: false (0) = ActiveLoPmic: PMIC Power Pin is Low active.; true (1) = ActiveHiPmic: PMIC Power Pin is High active."
    bit_offset: 9
    bit_size: 1
  - name: wie
    description: "Wake-up Interrupt Enable.\n\nRaw bit values: false (0) = IntDis: Interrupt Disabled.; true (1) = IntEn: Interrupt Enabled."
    bit_offset: 10
    bit_size: 1
  - name: wkup_sw_en
    description: "Software Wake-up Enable.\n\nRaw bit values: false (0) = SwWkupDis: Disables.; true (1) = SwWkupEn: Enables."
    bit_offset: 14
    bit_size: 1
  - name: wkup_sw
    description: "Software Wake-up.\n\nRaw bit values: false (0) = Inactive: Inactive.; true (1) = ForceWkup: Force wake-up."
    bit_offset: 15
    bit_size: 1
  - name: wkup_id_en
    description: "Wake-up on ID Change Enable.\n\nRaw bit values: false (0) = WkupIdDis: Disables.; true (1) = WkupIdEn: Enables."
    bit_offset: 16
    bit_size: 1
  - name: wkup_vbus_en
    description: "Wake-up on VBUS Change Enable.\n\nRaw bit values: false (0) = WkupVbusDis: Disables.; true (1) = WkupVbusEn: Enables."
    bit_offset: 17
    bit_size: 1
  - name: wkup_dpdm_en
    description: "Wake-up on DPDM Change Enable.\n\nRaw bit values: false (0) = DpdmWkupDis: DPDM changes wake-up to be disabled only when VBUS is 0.; true (1) = DpdmWkupEn: DPDM changes wake-up to be enabled, it is for device only."
    bit_offset: 29
    bit_size: 1
  - name: wir
    description: "Wake-up Interrupt Request.\n\nRaw bit values: false (0) = NoWkupReq: No request received.; true (1) = WkupReq: Request received."
    bit_offset: 31
    bit_size: 1
fieldset/UsbncAlphaFieldsetBravo:
  description: USB OTG Control 2.
  fields:
  - name: vbus_source_sel
    description: VBUS Source Select.
    bit_offset: 0
    bit_size: 2
    enum: UsbncAlphaEnumJuliet
  - name: auturesume_en
    description: "Auto Resume Enable.\n\nRaw bit values: false (0) = Default: Default."
    bit_offset: 2
    bit_size: 1
  - name: lowspeed_en
    description: "Low Speed Enable.\n\nRaw bit values: false (0) = Default: Default."
    bit_offset: 3
    bit_size: 1
  - name: utmi_clk_vld
    description: "UTMI Clock Valid.\n\nRaw bit values: false (0) = Default: Default."
    bit_offset: 31
    bit_size: 1
fieldset/UsbncAlphaFieldsetCharlie:
  description: USB Host HSIC Control.
  fields:
  - name: hsic_clk_on
    description: "HSIC Clock ON.\n\nRaw bit values: false (0) = Inactive: Inactive.; true (1) = Active: Active."
    bit_offset: 11
    bit_size: 1
  - name: hsic_en
    description: "Host HSIC Enable.\n\nRaw bit values: false (0) = Disable: Disabled.; true (1) = Enable: Enabled."
    bit_offset: 12
    bit_size: 1
  - name: clk_vld
    description: "Clock Valid.\n\nRaw bit values: false (0) = Invalid: Invalid.; true (1) = Valid: Valid."
    bit_offset: 31
    bit_size: 1
enum/UsbncAlphaEnumJuliet:
  bit_size: 2
  variants:
  - name: SessValid1
