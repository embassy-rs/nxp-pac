fieldset/Ctrl3:
  description: Control.
  bit_size: 16
  fields:
  - name: cmpie
    description: "Compare Interrupt Enable.\n\nRaw bit values: false (0) = Disabled: Disable.; true (1) = Enabled: Enable."
    bit_offset: 0
    bit_size: 1
  - name: cmpirq
    description: "Compare Interrupt Request.\n\nRaw bit values: false (0) = Nomat: No match has occurred.; true (1) = Mat: COMP match has occurred."
    bit_offset: 1
    bit_size: 1
  - name: wde
    description: "Watchdog Enable.\n\nRaw bit values: false (0) = Disabled: Disable.; true (1) = Enabled: Enable."
    bit_offset: 2
    bit_size: 1
  - name: die
    description: "Watchdog Timeout Interrupt Enable.\n\nRaw bit values: false (0) = Disabled: Disable.; true (1) = Enabled: Enable."
    bit_offset: 3
    bit_size: 1
  - name: dirq
    description: "Watchdog Timeout Interrupt Request.\n\nRaw bit values: false (0) = Noint: Not occurred.; true (1) = Int: Occurred."
    bit_offset: 4
    bit_size: 1
  - name: xne
    description: "Select Positive and Negative Edge of INDEX Pulse.\n\nRaw bit values: false (0) = Xne0: Use positive edge.; true (1) = Xne1: Use negative edge."
    bit_offset: 5
    bit_size: 1
  - name: xip
    description: "INDEX Triggered Initialization of Position Counters UPOS and LPOS.\n\nRaw bit values: false (0) = Noint: Does not initialize.; true (1) = Int: Initializes."
    bit_offset: 6
    bit_size: 1
  - name: xie
    description: "INDEX Pulse Interrupt Enable.\n\nRaw bit values: false (0) = Disabled: Disable.; true (1) = Enabled: Enable."
    bit_offset: 7
    bit_size: 1
  - name: xirq
    description: "INDEX Pulse Interrupt Request.\n\nRaw bit values: false (0) = Noind: Not occurred.; true (1) = Index: Occurred."
    bit_offset: 8
    bit_size: 1
  - name: ph1
    description: "Enable Signal Phase Count Mode.\n\nRaw bit values: false (0) = Use: Uses the standard quadrature decoder, where PHASEA and PHASEB represent a two-phase quadrature signal.; true (1) = Bypass: Bypasses the quadrature decoder. A positive transition of the PHASEA input generates a count signal. PHASEB input and CTRL[REV] controls the counter direction. If the value of CTRL[REV] and PHASEB are identical; then count is up. If the value of CTRL[REV] and PHASEB is different, then count is down."
    bit_offset: 9
    bit_size: 1
  - name: rev
    description: "Enable Reverse Direction Counting.\n\nRaw bit values: false (0) = Normal: Counts normally.; true (1) = Reverse: Counts in the reverse direction."
    bit_offset: 10
    bit_size: 1
  - name: swip
    description: "Software-Triggered Initialization of Position Counters UPOS and LPOS.\n\nRaw bit values: false (0) = Noaction: No action.; true (1) = Init: Initialize position counter."
    bit_offset: 11
    bit_size: 1
  - name: hne
    description: "Use Negative Edge of HOME Input.\n\nRaw bit values: false (0) = Pos: Use positive-going edge-to-trigger initialization of position counters UPOS and LPOS.; true (1) = Neg: Use negative-going edge-to-trigger initialization of position counters UPOS and LPOS."
    bit_offset: 12
    bit_size: 1
  - name: hip
    description: "Enable HOME to Initialize Position Counters UPOS and LPOS.\n\nRaw bit values: false (0) = Noaction: No action.; true (1) = Home: HOME signal initializes the position counter."
    bit_offset: 13
    bit_size: 1
  - name: hie
    description: "HOME Interrupt Enable.\n\nRaw bit values: false (0) = Disabled: Disable.; true (1) = Enabled: Enable."
    bit_offset: 14
    bit_size: 1
  - name: hirq
    description: "HOME Signal Transition Interrupt Request.\n\nRaw bit values: false (0) = Notrans: Not occurred.; true (1) = Transi: Occurred."
    bit_offset: 15
    bit_size: 1
