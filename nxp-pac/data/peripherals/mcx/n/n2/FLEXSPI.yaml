fieldset/FlexspiAlphaFieldsetAlphaAlpha:
  description: Flash Control 4.
  fields:
  - name: wmopt1
    description: "Write Mask Option 1.\n\nRaw bit values: false (0) = Disable: When writing to an external device, DQS pin is used as write mask. When flash memory is accessed in individual mode, AHB or IP write burst start address alignment is not limited.; true (1) = Enable: When writing to an external device, DQS pin is not used as write mask. When flash memory is accessed in individual mode, AHB or IP write burst start address alignment is limited."
    bit_offset: 0
    bit_size: 1
  - name: wmena
    description: "Write Mask Enable for Port A.\n\nRaw bit values: false (0) = Val0: Disabled. When writing to external device, DQS(RWDS) pin is not driven.; true (1) = Val1: Enabled. When writing to external device, FlexSPI drives DQS(RWDS) pin as write mask output."
    bit_offset: 2
    bit_size: 1
  - name: wmenb
    description: "Write Mask Enable for Port B.\n\nRaw bit values: false (0) = Val0: Disabled. When writing to external device, DQS(RWDS) pin is not driven.; true (1) = Val1: Enabled. When writing to external device, FlexSPI drives DQS(RWDS) pin as write mask output."
    bit_offset: 3
    bit_size: 1
