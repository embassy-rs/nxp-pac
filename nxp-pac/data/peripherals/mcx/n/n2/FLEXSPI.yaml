    value: 0
  - name: Val2
    description: AHB Write command with JMP_ON_CS instruction used in the sequence.
    value: 2
  - name: Val3
    description: Unknown instruction opcode in the sequence.
    value: 3
  - name: Val4
    description: DUMMY_SDR or DUMMY_RWDS_SDR instruction used in DDR sequence.
    value: 4
  - name: Val5
    description: DUMMY_DDR or DUMMY_RWDS_DDR instruction used in SDR sequence.
    value: 5
