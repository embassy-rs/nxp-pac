fieldset/FlexspiAlphaFieldsetQuebecCharlie:
  description: Module Control 2.
  fields:
  - name: clrahbbufopt
    description: "Clear AHB Buffer.\n\nRaw bit values: false (0) = Val0: Not cleared automatically.; true (1) = Val1: Cleared automatically."
    bit_offset: 11
    bit_size: 1
  - name: clrlearnphase
    description: "Clear Learn Phase Selection.\n\nRaw bit values: false (0) = Val0: No impact.; true (1) = Val1: Reset sample clock phase selection to 0."
    bit_offset: 14
    bit_size: 1
  - name: samedeviceen
    description: "Same Device Enable.\n\nRaw bit values: false (0) = IndividualParallel: In Individual mode, FLSHA1CRx and FLSHA2CRx, FLSHB1CRx and FLSHB2CRx settings are applied to Flash A1, A2, B1, B2 separately. In Parallel mode, FLSHA1CRx register setting is applied to Flash A1 and B1, FLSHA2CRx register setting is applied to Flash A2 and B2. FLSHB1CRx and FLSHB2CRx register settings are ignored.; true (1) = Enable: FLSHA1CR0, FLSHA1CR1, and FLSHA1CR2 register settings are applied to Flash A1, A2, B1, B2. FLSHA2CRx, FLSHB1CRx, and FLSHB2CRx settings are ignored."
    bit_offset: 15
    bit_size: 1
  - name: sckbdiffopt
    description: "SCLK Port B Differential Output.\n\nRaw bit values: false (0) = Val1: Use B_SCLK pad as port B SCLK clock output. Port B flash memory access is available.; true (1) = Val0: Use B_SCLK pad as port A SCLK inverted clock output (Differential clock to A_SCLK). Port B flash memory access is not available."
    bit_offset: 19
    bit_size: 1
  - name: rxclksrc_b
    description: Port B Receiver Clock Source.
    bit_offset: 21
    bit_size: 2
    enum: FlexspiAlphaEnumMikeDelta
  - name: rx_clk_src_diff
    description: "Sample Clock Source Different.\n\nRaw bit values: false (0) = Value0: Use MCR0[RXCLKSRC] for Port A and Port B. MCR2[RXCLKSRC_B] is ignored and MCR0[RXCLKSRC] selects the Sample Clock source for Flash Reading of both ports A and B.; true (1) = Value1: Use MCR0[RXCLKSRC] for Port A, and MCR2[RXCLKSRC_B] for Port B. MCR0[RXCLKSRC] selects the Sample Clock source for Flash Reading of port A (A_SCLK) and MCR2[RXCLKSRC_B] selects the Sample Clock source for Flash Reading of port B (B_SCLK)."
    bit_offset: 23
    bit_size: 1
  - name: resumewait
    description: Resume Wait Duration.
    bit_offset: 24
    bit_size: 8
