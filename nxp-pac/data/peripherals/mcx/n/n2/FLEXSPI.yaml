fieldset/FlexspiAlphaFieldsetIndia:
  description: AHB Bus Control.
  fields:
  - name: aparen
    description: "AHB Parallel Mode Enable.\n\nRaw bit values: false (0) = Individual: Flash is accessed in Individual mode.; true (1) = Enable: Flash is accessed in Parallel mode."
    bit_offset: 0
    bit_size: 1
  - name: clrahbrxbuf
    description: "Clear AHB Receive Buffer.\n\nRaw bit values: false (0) = Val0: No impact.; true (1) = Val1: Enable clear operation."
    bit_offset: 1
    bit_size: 1
  - name: clrahbtxbuf
    description: "Clear AHB Transmit Buffer.\n\nRaw bit values: false (0) = Val0: No impact.; true (1) = Val1: Enable clear operation."
    bit_offset: 2
    bit_size: 1
  - name: cachableen
    description: "Cacheable Read Access Enable.\n\nRaw bit values: false (0) = Val0: Disabled. When an AHB bus cacheable read access occurs, FlexSPI does not check whether it hit the AHB transmit buffer.; true (1) = Val1: Enabled. When an AHB bus cacheable read access occurs, FlexSPI first checks whether the access hit the AHB transmit buffer."
    bit_offset: 3
    bit_size: 1
  - name: bufferableen
    description: "Bufferable Write Access Enable.\n\nRaw bit values: false (0) = Val0: Disabled. For all AHB write accesses (bufferable or nonbufferable), FlexSPI returns AHB Bus Ready after transmitting all data and finishing command.; true (1) = Val1: Enabled. For AHB bufferable write access, FlexSPI returns AHB Bus Ready when the arbitrator grants the AHB command. FlexSPI does not wait for the AHB command to finish."
    bit_offset: 4
    bit_size: 1
  - name: prefetchen
    description: "AHB Read Prefetch Enable.\n\nRaw bit values: false (0) = Value0: Disable.; true (1) = Value1: Enable."
    bit_offset: 5
    bit_size: 1
  - name: readaddropt
    description: "AHB Read Address Option.\n\nRaw bit values: false (0) = Val0: AHB read burst start address alignment is limited when flash memory is accessed in parallel mode or flash is word-addressable.; true (1) = Val1: AHB read burst start address alignment is not limited. FlexSPI fetches more data than the AHB burst requires for address alignment."
    bit_offset: 6
    bit_size: 1
  - name: resumedisable
    description: "AHB Read Resume Disable.\n\nRaw bit values: false (0) = Val0: Suspended AHB read prefetch resumes when AHB is IDLE.; true (1) = Val1: Suspended AHB read prefetch does not resume once aborted,."
    bit_offset: 7
    bit_size: 1
  - name: readszalign
    description: "AHB Read Size Alignment.\n\nRaw bit values: false (0) = Val0: Register settings such as PREFETCH_EN determine AHB read size.; true (1) = Val1: AHB read size to up size to 8 bytes aligned, no prefetching."
    bit_offset: 10
    bit_size: 1
  - name: alignment
    description: AHB Boundary Alignment.
    bit_offset: 20
    bit_size: 2
    enum: FlexspiAlphaEnumFoxtrotAlpha
  - name: aflashbase
    description: AHB Memory-Mapped Flash Base Address.
    bit_offset: 29
    bit_size: 3
