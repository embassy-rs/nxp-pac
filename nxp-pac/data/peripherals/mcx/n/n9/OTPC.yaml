fieldset/OtpcAlphaFieldsetGolf:
  description: Power Control.
  fields:
  - name: hvreq
    description: "Strong switch request.\n\nRaw bit values: false (0) = TurnOff: Turn off.; true (1) = TurnOn: Turn on."
    bit_offset: 0
    bit_size: 1
  - name: lvreq
    description: "Weak switch request.\n\nRaw bit values: false (0) = TurnOff: Turn off.; true (1) = TurnOn: Turn on."
    bit_offset: 1
    bit_size: 1
  - name: pdreq
    description: "Power down request.\n\nRaw bit values: false (0) = NoAction: PD pin is set to low when OTPC is in idle state. It means EFUSE hardmacro is in standby mode. Idle state means OTPC is not in read and program modes.; true (1) = PowerDn: PD pin is set to high when OTPC is in idle state. It means EFUSE hardmacro is in power down mode."
    bit_offset: 2
    bit_size: 1
