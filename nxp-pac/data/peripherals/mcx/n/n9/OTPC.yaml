fieldset/OtpcAlphaFieldsetKilo:
  description: Read and Write Control.
  fields:
  - name: addr
    description: EFUSE address.
    bit_offset: 0
    bit_size: 7
  - name: wr_all1s
    description: "Write all 1s.\n\nRaw bit values: false (0) = UseWdata: Uses the WDATA value.; true (1) = UseAll1s: Writes all 1s."
    bit_offset: 12
    bit_size: 1
  - name: read_efuse
    description: "Read EFUSE.\n\nRaw bit values: false (0) = Program: Starts program operation when the WR_UNLOCK value is 0x9527; otherwise, takes no action.; true (1) = Read: Starts read operation."
    bit_offset: 13
    bit_size: 1
  - name: read_update
    description: "Read update.\n\nRaw bit values: false (0) = NoUpdate: Shadow register does not update.; true (1) = Update: Shadow register updates."
