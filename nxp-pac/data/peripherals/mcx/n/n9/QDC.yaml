fieldset/QdcAlphaFieldsetAlpha:
  description: Control.
  bit_size: 16
  fields:
  - name: cmpie
    description: "Compare Interrupt Enable.\n\nRaw bit values: false (0) = Disabled: Disable.; true (1) = Enabled: Enable."
    bit_offset: 0
    bit_size: 1
  - name: cmpirq
    description: "Compare Interrupt Request.\n\nRaw bit values: false (0) = Nomat: No match has occurred.; true (1) = Mat: COMP match has occurred."
    bit_offset: 1
    bit_size: 1
  - name: wde
    description: "Watchdog Enable.\n\nRaw bit values: false (0) = Disabled: Disable.; true (1) = Enabled: Enable."
    bit_offset: 2
    bit_size: 1
  - name: die
    description: "Watchdog Timeout Interrupt Enable.\n\nRaw bit values: false (0) = Disabled: Disable.; true (1) = Enabled: Enable."
    bit_offset: 3
    bit_size: 1
  - name: dirq
    description: "Watchdog Timeout Interrupt Request.\n\nRaw bit values: false (0) = Noint: Not occurred.; true (1) = Int: Occurred."
    bit_offset: 4
    bit_size: 1
  - name: xne
    description: "Select Positive and Negative Edge of INDEX Pulse.\n\nRaw bit values: false (0) = Xne0: Use positive edge.; true (1) = Xne1: Use negative edge."
    bit_offset: 5
    bit_size: 1
  - name: xip
    description: "INDEX Triggered Initialization of Position Counters UPOS and LPOS.\n\nRaw bit values: false (0) = Noint: Does not initialize.; true (1) = Int: Initializes."
    bit_offset: 6
    bit_size: 1
  - name: xie
    description: "INDEX Pulse Interrupt Enable.\n\nRaw bit values: false (0) = Disabled: Disable.; true (1) = Enabled: Enable."
    bit_offset: 7
    bit_size: 1
  - name: xirq
    description: "INDEX Pulse Interrupt Request.\n\nRaw bit values: false (0) = Noind: Not occurred.; true (1) = Index: Occurred."
    bit_offset: 8
    bit_size: 1
  - name: ph1
    description: "Enable Signal Phase Count Mode.\n\nRaw bit values: false (0) = Use: Uses the standard quadrature decoder, where PHASEA and PHASEB represent a two-phase quadrature signal.; true (1) = Bypass: Bypasses the quadrature decoder. A positive transition of the PHASEA input generates a count signal. PHASEB input and CTRL[REV] controls the counter direction. If the value of CTRL[REV] and PHASEB are identical; then count is up. If the value of CTRL[REV] and PHASEB is different, then count is down."
    bit_offset: 9
    bit_size: 1
  - name: rev
    description: "Enable Reverse Direction Counting.\n\nRaw bit values: false (0) = Normal: Counts normally.; true (1) = Reverse: Counts in the reverse direction."
    bit_offset: 10
    bit_size: 1
  - name: swip
    description: "Software-Triggered Initialization of Position Counters UPOS and LPOS.\n\nRaw bit values: false (0) = Noaction: No action.; true (1) = Init: Initialize position counter."
    bit_offset: 11
    bit_size: 1
  - name: hne
    description: "Use Negative Edge of HOME Input.\n\nRaw bit values: false (0) = Pos: Use positive-going edge-to-trigger initialization of position counters UPOS and LPOS.; true (1) = Neg: Use negative-going edge-to-trigger initialization of position counters UPOS and LPOS."
    bit_offset: 12
    bit_size: 1
  - name: hip
    description: "Enable HOME to Initialize Position Counters UPOS and LPOS.\n\nRaw bit values: false (0) = Noaction: No action.; true (1) = Home: HOME signal initializes the position counter."
    bit_offset: 13
    bit_size: 1
  - name: hie
    description: "HOME Interrupt Enable.\n\nRaw bit values: false (0) = Disabled: Disable.; true (1) = Enabled: Enable."
    bit_offset: 14
    bit_size: 1
  - name: hirq
    description: "HOME Signal Transition Interrupt Request.\n\nRaw bit values: false (0) = Notrans: Not occurred.; true (1) = Transi: Occurred."
    bit_offset: 15
    bit_size: 1
fieldset/QdcAlphaFieldsetBravo:
  description: Control 2.
  bit_size: 16
  fields:
  - name: updhld
    description: "Update Hold Registers.\n\nRaw bit values: false (0) = Disabled: Disable.; true (1) = Enabled: Enable."
    bit_offset: 0
    bit_size: 1
  - name: updpos
    description: "Update Position Registers.\n\nRaw bit values: false (0) = Noaction: No action.; true (1) = Clear: Clear."
    bit_offset: 1
    bit_size: 1
  - name: mod_
    description: "Enable Modulo Counting.\n\nRaw bit values: false (0) = Disabled: Disable.; true (1) = Enabled: Enable."
    bit_offset: 2
    bit_size: 1
  - name: dir
    description: "Count Direction Flag.\n\nRaw bit values: false (0) = Down: Down direction.; true (1) = Up: Up direction."
    bit_offset: 3
    bit_size: 1
  - name: ruie
    description: "Roll-under Interrupt Enable.\n\nRaw bit values: false (0) = Disabled: Disable.; true (1) = Enabled: Enable."
    bit_offset: 4
    bit_size: 1
  - name: ruirq
    description: "Roll-under Interrupt Request.\n\nRaw bit values: false (0) = Noroll: No roll-under has occurred.; true (1) = Roll: Roll-under has occurred."
    bit_offset: 5
    bit_size: 1
  - name: roie
    description: "Roll-over Interrupt Enable.\n\nRaw bit values: false (0) = Disabled: Disable.; true (1) = Enabled: Enable."
    bit_offset: 6
    bit_size: 1
  - name: roirq
    description: "Roll-over Interrupt Request.\n\nRaw bit values: false (0) = Noroll: Did not occur.; true (1) = Roll: Occurred."
    bit_offset: 7
    bit_size: 1
  - name: revmod
    description: "Revolution Counter Modulus Enable.\n\nRaw bit values: false (0) = Index: Use INDEX pulse.; true (1) = Count: Use modulus counting roll-over or roll-under."
    bit_offset: 8
    bit_size: 1
  - name: outctl
    description: "Output Control.\n\nRaw bit values: false (0) = Compare: POSMATCH pulses when a match occurs between the position counters (POS) and the corresponding compare value (COMP ).; true (1) = Read: POSMATCH pulses when the UPOS, LPOS, REV, or POSD registers are read."
    bit_offset: 9
    bit_size: 1
  - name: sabie
    description: "Simultaneous PHASEA and PHASEB Change Interrupt Enable.\n\nRaw bit values: false (0) = Disabled: Disable.; true (1) = Enabled: Enable."
    bit_offset: 10
    bit_size: 1
  - name: sabirq
    description: "Simultaneous PHASEA and PHASEB Change Interrupt Request.\n\nRaw bit values: false (0) = Nosimul: No simultaneous change has occurred.; true (1) = Simul: A simultaneous change has occurred."
    bit_offset: 11
    bit_size: 1
  - name: initpos
    description: "Initialize Position Registers.\n\nRaw bit values: false (0) = Noinit: Don't initialize position counter.; true (1) = Init: Initialize position counter."
    bit_offset: 12
    bit_size: 1
