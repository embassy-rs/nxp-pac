fieldset/Fsr2:
  description: FIFO Status.
  fields:
  - name: full
    description: "FIFO Full Flag.\n\nRaw bit values: false (0) = NotFull: Not full.; true (1) = Full: Full."
    bit_offset: 0
    bit_size: 1
  - name: empty
    description: "FIFO Empty Flag.\n\nRaw bit values: false (0) = NotEmpty: Not empty.; true (1) = Empty: Empty."
    bit_offset: 1
    bit_size: 1
  - name: wm
    description: "FIFO Watermark Status Flag.\n\nRaw bit values: false (0) = MoreThanWlevel: Data in FIFO is more than watermark level.; true (1) = LessThanWlevel: Data in FIFO is less than or equal to watermark level."
    bit_offset: 2
    bit_size: 1
  - name: swbk
    description: "Swing Back One Cycle Complete Flag.\n\nRaw bit values: false (0) = NoSwing: No swing back cycle has completed since the last time the flag was cleared.; true (1) = SwingBack: At least one swing back cycle has occurred since the last time the flag was cleared."
    bit_offset: 3
    bit_size: 1
  - name: of
    description: "FIFO Overflow Flag.\n\nRaw bit values: false (0) = NoOverflow: No overflow has occurred since the last time the flag was cleared.; true (1) = Overflow: At least one FIFO overflow has occurred since the last time the flag was cleared."
    bit_offset: 6
    bit_size: 1
  - name: uf
    description: "FIFO Underflow Flag.\n\nRaw bit values: false (0) = NoUnderflow: No underflow has occurred since the last time the flag was cleared.; true (1) = Underflow: At least one trigger underflow has occurred since the last time the flag was cleared."
    bit_offset: 7
    bit_size: 1
  - name: ptgcoco
    description: "Period Trigger Mode Conversion Complete Flag.\n\nRaw bit values: false (0) = NotStart: Not completed or not started.; true (1) = Completed: Completed."
    bit_offset: 8
    bit_size: 1
