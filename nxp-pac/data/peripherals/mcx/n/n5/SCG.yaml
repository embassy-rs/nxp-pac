fieldset/ScgAlphaFieldsetAlpha:
  description: APLL Override Register.
  fields:
  - name: apllpwren_ovrd
    description: "APLL Power Enable Override if APLL_OVRD_EN=1.\n\nRaw bit values: false (0) = Disabled: APLL clock is powered off.; true (1) = Enabled: APLL clock is powered on."
    bit_offset: 0
    bit_size: 1
  - name: apllclken_ovrd
    description: "APLL Clock Enable Override if APLL_OVRD_EN=1.\n\nRaw bit values: false (0) = Disabled: APLL clock is disabled.; true (1) = Enabled: APLL clock is enabled."
    bit_offset: 1
    bit_size: 1
  - name: apll_ovrd_en
    description: "APLL Override Enable.\n\nRaw bit values: false (0) = Disabled: APLL override is disabled.; true (1) = Enabled: APLL override is enabled."
    bit_offset: 31
    bit_size: 1
fieldset/ScgAlphaFieldsetBravo:
  description: APLL Control Status Register.
  fields:
  - name: apllpwren
    description: "APLL Power Enable.\n\nRaw bit values: false (0) = Disabled: APLL clock is powered off.; true (1) = Enabled: APLL clock is powered on."
    bit_offset: 0
    bit_size: 1
  - name: apllclken
    description: "APLL Clock Enable.\n\nRaw bit values: false (0) = Disabled: APLL clock is disabled.; true (1) = Enabled: APLL clock is enabled."
    bit_offset: 1
    bit_size: 1
  - name: apllsten
    description: "APLL Stop Enable.\n\nRaw bit values: false (0) = DisabledInStop: APLL is disabled in Deep Sleep mode.; true (1) = EnabledInStop: APLL is enabled in Deep Sleep mode."
    bit_offset: 2
    bit_size: 1
  - name: frm_clockstable
    description: "Free running mode clock stable.\n\nRaw bit values: false (0) = Disabled: Free running mode clockstable is disabled.; true (1) = Enabled: Free running mode clockstable is enabled."
    bit_offset: 3
    bit_size: 1
  - name: apllcm
    description: "APLL Clock Monitor.\n\nRaw bit values: false (0) = Disabled: APLL Clock Monitor is disabled.; true (1) = Enabled: APLL Clock Monitor is enabled."
    bit_offset: 16
    bit_size: 1
  - name: apllcmre
    description: "APLL Clock Monitor Reset Enable.\n\nRaw bit values: false (0) = GenerateInterrupt: Clock monitor generates an interrupt when an error is detected.; true (1) = GenerateReset: Clock monitor generates a reset when an error is detected."
    bit_offset: 17
    bit_size: 1
  - name: lk
    description: "Lock Register.\n\nRaw bit values: false (0) = WriteEnabled: Control Status Register can be written.; true (1) = WriteDisabled: Control Status Register cannot be written."
    bit_offset: 23
    bit_size: 1
  - name: apll_lock
    description: "APLL LOCK.\n\nRaw bit values: false (0) = DisabledOrNotValid: APLL is not powered on or not locked.; true (1) = EnabledAndValid: APLL is locked."
    bit_offset: 24
    bit_size: 1
  - name: apllsel
    description: "APLL Selected.\n\nRaw bit values: false (0) = NotApll: APLL is not the system clock source.; true (1) = Apll: APLL is the system clock source."
    bit_offset: 25
    bit_size: 1
  - name: apllerr
    description: "APLL Clock Error.\n\nRaw bit values: false (0) = DisabledOrNoError: APLL Clock Monitor is disabled or has not detected an error.; true (1) = EnabledAndError: APLL Clock Monitor is enabled and detected an error."
    bit_offset: 26
    bit_size: 1
  - name: apll_lock_ie
    description: "APLL LOCK Interrupt Enable.\n\nRaw bit values: false (0) = NotApll: APLL_LOCK interrupt is not enabled.; true (1) = Apll: APLL_LOCK interrupt is enabled."
    bit_offset: 30
    bit_size: 1
fieldset/Apllctrl2:
  description: APLL Control Register.
  fields:
  - name: selr
    description: Bandwidth select R (resistor) value.
    bit_offset: 0
    bit_size: 4
  - name: seli
    description: Bandwidth select I (integration) value.
    bit_offset: 4
    bit_size: 6
  - name: selp
    description: Bandwidth select P (proportional) value.
    bit_offset: 10
    bit_size: 5
  - name: bypasspostdiv2
    description: "Bypass of Divide-by-2 Divider.\n\nRaw bit values: false (0) = NotBypassed: Use the divide-by-2 divider in the postdivider.; true (1) = Bypassed: Bypass of the divide-by-2 divider in the postdivider."
    bit_offset: 16
    bit_size: 1
  - name: limupoff
    description: "Up Limiter.\n\nRaw bit values: false (0) = Disabled: Application set to non-Spectrum and Fractional applications.; true (1) = Enabled: Application set to Spectrum and Fractional applications."
    bit_offset: 17
    bit_size: 1
  - name: banddirect
    description: "Control of the bandwidth of the PLL.\n\nRaw bit values: false (0) = Disabled: The bandwidth is changed synchronously with the feedback-divider.; true (1) = Enabled: Modifies the bandwidth of the PLL directly."
    bit_offset: 18
    bit_size: 1
  - name: bypassprediv
    description: "Bypass of the predivider.\n\nRaw bit values: false (0) = Disabled: Use the predivider.; true (1) = Enabled: Bypass of the predivider."
    bit_offset: 19
    bit_size: 1
  - name: bypasspostdiv
    description: "Bypass of the postdivider.\n\nRaw bit values: false (0) = Disabled: Use the postdivider.; true (1) = Enabled: Bypass of the postdivider."
    bit_offset: 20
    bit_size: 1
  - name: frm
    description: "Free Running Mode Enable.\n\nRaw bit values: false (0) = Disabled: Free running mode disabled.; true (1) = Enabled: Free running mode enabled."
    bit_offset: 22
    bit_size: 1
  - name: source
    description: Clock Source.
    bit_offset: 25
    bit_size: 2
    enum: Source2
fieldset/ScgAlphaFieldsetDelta:
  description: APLL LOCK Configuration Register.
  fields:
  - name: lock_time
    description: Configures the number of reference clocks to count before APLL is considered locked.
    bit_offset: 0
    bit_size: 17
fieldset/Apllmdiv2:
  description: APLL M Divider Register.
  fields:
  - name: mdiv
    description: Feedback divider divider ratio (M-divider).
    bit_offset: 0
    bit_size: 16
  - name: mreq
    description: "Feedback ratio change request.\n\nRaw bit values: false (0) = Disabled: Feedback ratio change is not requested.; true (1) = Enabled: Feedback ratio change is requested."
    bit_offset: 31
    bit_size: 1
fieldset/Apllndiv2:
  description: APLL N Divider Register.
  fields:
  - name: ndiv
    description: Predivider divider ratio (N-divider).
    bit_offset: 0
    bit_size: 8
  - name: nreq
    description: "Predivider ratio change request.\n\nRaw bit values: false (0) = Disabled: Predivider ratio change is not requested.; true (1) = Enabled: Predivider ratio change is requested."
    bit_offset: 31
    bit_size: 1
fieldset/Apllpdiv2:
  description: APLL P Divider Register.
  fields:
  - name: pdiv
    description: Postdivider divider ratio (P-divider).
    bit_offset: 0
    bit_size: 5
  - name: preq
    description: "Postdivider ratio change request.\n\nRaw bit values: false (0) = Disabled: Postdivider ratio change is not requested.; true (1) = Enabled: Postdivider ratio change is requested."
    bit_offset: 31
    bit_size: 1
fieldset/ScgAlphaFieldsetHotel:
  description: APLL Spread Spectrum Control 0 Register.
  fields:
  - name: ss_mdiv_lsb
    description: SS_MDIV.
    bit_offset: 0
    bit_size: 32
fieldset/Apllsscg:
  description: APLL Spread Spectrum Control 1 Register.
  fields:
  - name: ss_mdiv_msb
    description: SS_MDIV[32].
    bit_offset: 0
    bit_size: 1
  - name: ss_mdiv_req
    description: "SS_MDIV[32:0] change request.\n\nRaw bit values: false (0) = Disabled: SS_MDIV change is not requested.; true (1) = Enabled: SS_MDIV change is requested."
    bit_offset: 1
    bit_size: 1
  - name: mf
    description: Modulation Frequency Control.
    bit_offset: 2
    bit_size: 3
  - name: mr
    description: Modulation Depth Control.
    bit_offset: 5
    bit_size: 3
  - name: mc
    description: Modulation Waveform Control.
    bit_offset: 8
    bit_size: 2
    enum: Mc
  - name: dither
    description: "Dither Enable.\n\nRaw bit values: false (0) = Disabled: Dither is not enabled.; true (1) = Enabled: Dither is enabled."
    bit_offset: 10
    bit_size: 1
  - name: sel_ss_mdiv
    description: "SS_MDIV select.\n\nRaw bit values: false (0) = Disabled: Feedback divider ratio is MDIV[15:0].; true (1) = Enabled: Feedback divider ratio is SS_MDIV[32:0]."
    bit_offset: 11
    bit_size: 1
  - name: ss_pd
    description: "SSCG Power Down.\n\nRaw bit values: false (0) = Disabled: SSCG is powered on.; true (1) = Enabled: SSCG is powered off."
    bit_offset: 31
    bit_size: 1
fieldset/Apllsscgstat2:
  description: APLL SSCG Status Register.
  fields:
  - name: ss_mdiv_ack
    description: "SS_MDIV change acknowledge.\n\nRaw bit values: false (0) = Disabled: The SS_MDIV, MF, MR, and MC ratio change is not accepted by the analog PLL.; true (1) = Enabled: The SS_MDIV, MF, MR, and MC ratio change is accepted by the analog PLL."
    bit_offset: 0
    bit_size: 1
fieldset/ScgAlphaFieldsetKilo:
  description: APLL Status Register.
  fields:
  - name: ndivack
    description: "Predivider(N) ratio change acknowledge.\n\nRaw bit values: false (0) = Disabled: The predivider (N) ratio change is not accepted by the analog PLL.; true (1) = Enabled: The predivider (N) ratio change is accepted by the analog PLL."
    bit_offset: 1
    bit_size: 1
  - name: mdivack
    description: "Feedback(M) divider ratio change acknowledge.\n\nRaw bit values: false (0) = Disabled: The feedback (M) ratio change is not accepted by the analog PLL.; true (1) = Enabled: The feedback (M) ratio change is accepted by the analog PLL."
    bit_offset: 2
    bit_size: 1
  - name: pdivack
    description: "Postdivider(P) ratio change acknowledge.\n\nRaw bit values: false (0) = Disabled: The postdivider (P) ratio change is not accepted by the analog PLL.; true (1) = Enabled: The postdivider (P) ratio change is accepted by the analog PLL."
    bit_offset: 3
    bit_size: 1
  - name: frmdet
    description: "Free running detector (active high).\n\nRaw bit values: false (0) = Disabled: Free running is not detected.; true (1) = Enabled: Free running is detected."
    bit_offset: 4
    bit_size: 1
fieldset/Csr2:
  description: Clock Status Register.
  fields:
  - name: scs
    description: System Clock Source.
    bit_offset: 24
    bit_size: 4
    enum: Scs2
fieldset/ScgAlphaFieldsetMike:
  description: FIRC Configuration Register.
  fields:
  - name: range
    description: "Frequency Range.\n\nRaw bit values: false (0) = Firc48mhz: 48 MHz FIRC clock selected.; true (1) = Firc144mhz: 144 MHz FIRC clock selected."
    bit_offset: 0
    bit_size: 1
fieldset/ScgAlphaFieldsetNovember:
  description: FIRC Control Status Register.
  fields:
  - name: fircen
    description: "FIRC Enable.\n\nRaw bit values: false (0) = Disabled: FIRC is disabled.; true (1) = Enabled: FIRC is enabled."
    bit_offset: 0
    bit_size: 1
  - name: fircsten
    description: "FIRC Stop Enable.\n\nRaw bit values: false (0) = DisabledInStopModes: FIRC is disabled in Deep Sleep mode.; true (1) = EnabledInStopModes: FIRC is enabled in Deep Sleep mode."
    bit_offset: 1
    bit_size: 1
  - name: firc_sclk_periph_en
    description: "FIRC 48 MHz Clock to peripherals Enable.\n\nRaw bit values: false (0) = Disabled: FIRC 48 MHz to peripherals is disabled.; true (1) = Enabled: FIRC 48 MHz to peripherals is enabled."
    bit_offset: 4
    bit_size: 1
  - name: firc_fclk_periph_en
    description: "FIRC 144 MHz Clock to peripherals Enable.\n\nRaw bit values: false (0) = Disabled: FIRC 144 MHz to peripherals is disabled.; true (1) = Enabled: FIRC 144 MHz to peripherals is enabled."
    bit_offset: 5
    bit_size: 1
  - name: firctren
    description: "FIRC 144 MHz Trim Enable (FIRCCFG[RANGE]=1).\n\nRaw bit values: false (0) = Disabled: Disables trimming FIRC to an external clock source.; true (1) = Enabled: Enables trimming FIRC to an external clock source."
    bit_offset: 8
    bit_size: 1
  - name: firctrup
    description: "FIRC Trim Update.\n\nRaw bit values: false (0) = Disabled: Disables FIRC trimming updates.; true (1) = Enabled: Enables FIRC trimming updates."
    bit_offset: 9
    bit_size: 1
  - name: trim_lock
    description: "FIRC TRIM LOCK.\n\nRaw bit values: false (0) = FircNotLocked: FIRC auto trim not locked to target frequency range.; true (1) = FircLocked: FIRC auto trim locked to target frequency range."
    bit_offset: 10
    bit_size: 1
  - name: coarse_trim_bypass
    description: "Coarse Auto Trim Bypass.\n\nRaw bit values: false (0) = NotBypassed: FIRC coarse auto trim is not bypassed.; true (1) = Bypassed: FIRC coarse auto trim is bypassed."
    bit_offset: 11
    bit_size: 1
  - name: lk
    description: "Lock Register.\n\nRaw bit values: false (0) = WriteEnabled: Control Status Register can be written.; true (1) = WriteDisabled: Control Status Register cannot be written."
    bit_offset: 23
    bit_size: 1
  - name: fircvld
    description: "FIRC Valid status.\n\nRaw bit values: false (0) = NotEnabledOrNotValid: FIRC is not enabled or clock is not valid.; true (1) = EnabledAndValid: FIRC is enabled and output clock is valid. The clock is valid after there is an output clock from the FIRC analog."
    bit_offset: 24
    bit_size: 1
  - name: fircsel
    description: "FIRC Selected.\n\nRaw bit values: false (0) = NotFirc: FIRC is not the system clock source.; true (1) = Firc: FIRC is the system clock source."
    bit_offset: 25
    bit_size: 1
  - name: fircerr
    description: "FIRC Clock Error.\n\nRaw bit values: false (0) = ErrorNotDetected: Error not detected with the FIRC trimming.; true (1) = ErrorDetected: Error detected with the FIRC trimming."
    bit_offset: 26
    bit_size: 1
  - name: fircerr_ie
    description: "FIRC Clock Error Interrupt Enable.\n\nRaw bit values: false (0) = ErrorNotDetected: FIRCERR interrupt is not enabled.; true (1) = ErrorDetected: FIRCERR interrupt is enabled."
    bit_offset: 27
    bit_size: 1
  - name: fircacc_ie
    description: "FIRC Accurate Interrupt Enable.\n\nRaw bit values: false (0) = Fircaccnot: FIRCACC interrupt is not enabled.; true (1) = Fircaccyes: FIRCACC interrupt is enabled."
    bit_offset: 30
    bit_size: 1
  - name: fircacc
    description: "FIRC Frequency Accurate.\n\nRaw bit values: false (0) = NotEnabledOrNotValid: FIRC is not enabled or clock is not accurate.; true (1) = EnabledAndValid: FIRC is enabled and output clock is accurate. The clock is accurate after 4096 clock cycles of 144 MHz (RANGE=1) or 1365 clock cycles of 48 MHz(RANGE=0) from the FIRC analog."
    bit_offset: 31
    bit_size: 1
