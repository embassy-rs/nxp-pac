    description: Initialization from a FORCE_OUT is disabled.
    value: 0
  - name: Enabled
    description: Initialization from a FORCE_OUT is enabled.
    value: 1
enum/FlexpwmAlphaEnumIndiaAlpha:
  bit_size: 1
  variants:
  - name: Complementary
    description: PWM_A and PWM_B form a complementary PWM pair.
    value: 0
  - name: Independent
    description: PWM_A and PWM_B outputs are independent PWMs.
    value: 1
enum/FlexpwmAlphaEnumJulietAlpha:
  bit_size: 2
  variants:
  - name: ExtSync
    description: EXT_SYNC causes initialization.
    value: 3
  - name: MasterReload
    description: Master reload from submodule 0 causes initialization. This setting should not be used in submodule 0 as it forces the INIT signal to logic 0. The submodule counter will only re-initialize when a master reload occurs.
    value: 1
  - name: MasterSync
    description: Master sync from submodule 0 causes initialization. This setting should not be used in submodule 0 as it forces the INIT signal to logic 0.
    value: 2
  - name: PwmX
    description: Local sync (PWM_X) causes initialization.
    value: 0
enum/FlexpwmAlphaEnumKiloAlpha:
  bit_size: 1
  variants:
  - name: Local
    description: The local RELOAD signal is used to reload registers.
    value: 0
  - name: Master
    description: The master RELOAD signal (from submodule 0) is used to reload registers. This setting should not be used in submodule 0 as it forces the RELOAD signal to logic 0.
    value: 1
enum/FlexpwmAlphaEnumLimaAlpha:
  bit_size: 1
  variants:
  - name: EqualTo
    description: The VAL* registers and the PWM counter are compared using an "equal to" method. This means that PWM edges are only produced when the counter is equal to one of the VAL* register values. This implies that a PWM_A output that is high at the end of a period maintains this state until a match with VAL3 clears the output in the following period.
    value: 0
  - name: EqualToOrGreaterThan
    description: The VAL* registers and the PWM counter are compared using an "equal to or greater than" method. This means that PWM edges are produced when the counter is equal to or greater than one of the VAL* register values. This implies that a PWM_A output that is high at the end of a period could go low at the start of the next period if the starting counter value is greater than (but not necessarily equal to) the new VAL3 value.
    value: 1
