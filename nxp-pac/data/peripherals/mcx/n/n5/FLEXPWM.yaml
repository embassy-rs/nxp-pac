enum/FlexpwmAlphaEnumAlpha:
  bit_size: 4
  variants:
  - name: Automatic
    description: Automatic fault clearing. PWM outputs disabled by this fault are enabled when FSTS[FFPINx] is clear at the start of a half cycle or full cycle depending on the states of FSTS[FHALF] and FSTS[FFULL] without regard to the state of FSTS[FFLAGx]. If neither FFULL nor FHALF is set, then the fault condition cannot be cleared.
    value: 1
  - name: Manual
    description: Manual fault clearing. PWM outputs disabled by this fault are not enabled until FSTS[FFLAGx] is clear at the start of a half cycle or full cycle depending on the states of FSTS[FHALF] and FSTS[FFULL]. If neither FFULL nor FHALF is set, then the fault condition cannot be cleared. This is further controlled by FCTRL[FSAFE].
    value: 0
enum/FlexpwmAlphaEnumBravo:
  bit_size: 4
  variants:
  - name: Flag
    description: Fault on the FAULTx pin.
    value: 1
  - name: NoFlag
    description: No fault on the FAULTx pin.
    value: 0
enum/FlexpwmAlphaEnumCharlie:
  bit_size: 4
  variants:
  - name: PwmOutputsNotReenabled
    description: PWM outputs are not re-enabled at the start of a full cycle.
    value: 0
  - name: PwmOutputsReenabled
    description: PWM outputs are re-enabled at the start of a full cycle.
    value: 1
enum/FlexpwmAlphaEnumDelta:
  bit_size: 4
  variants:
  - name: PwmOutputsNotReenabled
    description: PWM outputs are not re-enabled at the start of a half cycle.
    value: 0
  - name: PwmOutputsReenabled
    description: PWM outputs are re-enabled at the start of a half cycle (as defined by VAL0).
    value: 1
enum/FlexpwmAlphaEnumEcho:
  bit_size: 4
  variants:
  - name: Disabled
    description: FAULTx CPU interrupt requests disabled.
    value: 0
  - name: Enabled
    description: FAULTx CPU interrupt requests enabled.
    value: 1
enum/FlexpwmAlphaEnumFoxtrot:
  bit_size: 4
  variants:
  - name: Logic0
    description: A logic 0 on the fault input indicates a fault condition.
    value: 0
  - name: Logic1
    description: A logic 1 on the fault input indicates a fault condition.
    value: 1
enum/FlexpwmAlphaEnumGolf:
  bit_size: 4
  variants:
  - name: Normal
    description: Normal mode. PWM outputs disabled by this fault are not enabled until FSTS[FFLAGx] is clear at the start of a half cycle or full cycle depending on the states of FSTS[FHALF] and FSTS[FFULL] without regard to the state of FSTS[FFPINx]. If neither FHALF nor FFULL is set, then the fault condition cannot be cleared. The PWM outputs disabled by this fault input will not be re-enabled until the actual FAULTx input signal de-asserts since the fault input will combinationally disable the PWM outputs (as programmed in DISMAPn).
    value: 0
  - name: Safe
    description: Safe mode. PWM outputs disabled by this fault are not enabled until FSTS[FFLAGx] is clear and FSTS[FFPINx] is clear at the start of a half cycle or full cycle depending on the states of FSTS[FHALF] and FSTS[FFULL]. If neither FHLAF nor FFULL is set, then the fault condition cannot be cleared.
    value: 1
enum/FlexpwmAlphaEnumHotel:
  bit_size: 1
  variants:
  - name: Fault
    description: Cause a simulated fault.
    value: 1
  - name: NoFault
    description: No fault.
    value: 0
enum/FlexpwmAlphaEnumIndia:
  bit_size: 1
  variants:
  - name: Disabled
    description: Fault input glitch stretching is disabled.
    value: 0
  - name: Enabled
    description: Input fault signals are stretched to at least 2 IPBus clock cycles.
    value: 1
enum/FlexpwmAlphaEnumJuliet:
  bit_size: 4
  variants:
  - name: Pwm23
    description: PWM23 is used to generate complementary PWM pair in the corresponding submodule.
    value: 0
  - name: Pwm45
    description: PWM45 is used to generate complementary PWM pair in the corresponding submodule.
    value: 1
enum/FlexpwmAlphaEnumKilo:
  bit_size: 4
  variants:
  - name: Disabled
    description: Do not load new values.
    value: 0
  - name: Enabled
    description: Load prescaler, modulus, and PWM values of the corresponding submodule.
    value: 1
enum/FlexpwmAlphaEnumLima:
  bit_size: 4
  variants:
  - name: Disabled
    description: The direct combinational path from the fault inputs to the PWM outputs is disabled and the filtered and latched fault signals are used to disable the PWM outputs.
    value: 1
  - name: Enabled
    description: There is a combinational link from the fault inputs to the PWM outputs. The fault inputs are combined with the filtered and latched fault signals to disable the PWM outputs.
    value: 0
enum/FlexpwmAlphaEnumMike:
  bit_size: 4
  variants:
  - name: Disabled
    description: PWM counter is stopped, but PWM outputs hold the current state.
    value: 0
  - name: Enabled
    description: PWM counter is started in the corresponding submodule.
