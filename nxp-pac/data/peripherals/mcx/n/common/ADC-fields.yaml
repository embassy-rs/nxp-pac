# MCXN field definitions; identical layouts share one type, including software defaults.
# Field/variant documentation is retained rather than width-based merging.
# Curated from N2/N5/N9 native imports; source hashes remain on block entries.
includes:
  - ../../common/ADC-fields.yaml
fieldset/CalGar2:
  description: Calibration General A-Side Registers.
  fields:
  - name: cal_gar_val
    description: Calibration General A Side Register Element.
    bit_offset: 0
    bit_size: 11
fieldset/CalGbr:
  description: Calibration General B-Side Registers.
