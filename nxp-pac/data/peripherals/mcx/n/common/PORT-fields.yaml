# MCXN-specific pad capabilities and EFT registers, shared across N2/N5/N9.
# Sparse PCR and EFT geometry is in the numbered PORT blocks.
# EFT fieldset suffixes are the exact masks of implemented pad bits.
includes:
  - ../../common/PORT.yaml
block/PortCommon:
  description: Registers common to every MCXN PORT instance.
  items:
  - name: verid
    description: Version ID.
    byte_offset: 0
    access: Read
    fieldset: Verid
  - name: gpclr
    description: Global Pin Control Low.
    byte_offset: 16
    fieldset: GpclrPins
  - name: gpchr
    description: Global Pin Control High.
    byte_offset: 20
    fieldset: GpchrPins
  - name: config
    description: Configuration.
    byte_offset: 32
    fieldset: Config
fieldset/Calib:
  description: Calibration.
  fields:
  - name: ncal
    description: Calibration of NMOS Output Driver.
    bit_offset: 0
    bit_size: 6
  - name: pcal
    description: Calibration of PMOS Output Driver.
    bit_offset: 16
    bit_size: 6
fieldset/Edcr:
  description: EFT Detect Clear.
  fields:
  - name: edhc
    description: "EFT Detect High Clear.\n\nRaw bit values: false (0) = Edhc0: Does not clear.; true (1) = Edhc1: Clears."
    bit_offset: 0
    bit_size: 1
  - name: edlc
    description: "EFT Detect Low Clear.\n\nRaw bit values: false (0) = Edlc0: Does not clear.; true (1) = Edlc1: Clears."
    bit_offset: 1
    bit_size: 1
