# MCXN23XRM Rev. 4, sections 22.1/22.3/22.5; MCXNP184M150F70RM Rev. 7, sections 30.1/30.3/30.5.
# Use the explicit EAR/SYN offset lists, not the generic channel maximum or SYN0-SYN8 heading.
block/Erm:
  description: Error recording module. Supervisor word accesses only; enable the corresponding memory clock before channel register accesses. Initialize ECC memory and clear captured flags before enabling interrupts. Register slots do not imply usable error routing; N23 channels 5 and 6 are reserved targets, and RAMF is unavailable on 352-KB parts. Follow the selected part's memory and ECC restrictions. Secure and privileged configuration is recommended by NXP, not enforced by this register view.
  items:
  - name: cr0
    description: Interrupt notification enables for channel slots 0-7. N23 targets 5 and 6 are reserved; channel 6 has no RAMF target on 352-KB parts.
    byte_offset: 0
    fieldset: Cr0
  - name: cr1
    description: Interrupt notification enables for channel slots 8 and 9.
    byte_offset: 4
    fieldset: Cr1
  - name: sr0
    description: Error status for channel slots 0-7. Write one to clear only the intended flags and their interrupt notifications; avoid read-modify-write. N23 targets 5 and 6 are reserved; channel 6 has no RAMF target on 352-KB parts.
    byte_offset: 16
    fieldset: Sr0
  - name: sr1
    description: Error status for channel slots 8 and 9. Write one to clear only the intended flags and their interrupt notifications; avoid read-modify-write.
    byte_offset: 20
    fieldset: Sr1
  - name: ear
    only_in: '^MCXN23[56]$'
    description: Channel 0-4 address of the last recorded ECC event. Writes are ignored.
    byte_offset: 256
    access: Read
    array:
      len: 5
      stride: 16
    fieldset: Ear
  - name: ear
    only_in: '^MCXN(24[67]|52[67]|53[67]|54[67]|55[67]|94[67])$'
    description: Channel 0-6 address of the last recorded ECC event. Writes are ignored. Channel 6 has no RAMF target on 352-KB parts; register presence does not establish supported ECC routing.
    byte_offset: 256
    access: Read
    array:
      len: 7
      stride: 16
    fieldset: Ear
  - name: syn
    only_in: '^MCXN23[56]$'
    description: Channel 0-4 syndrome of the last recorded ECC event. Writes are ignored. Identifies a single inverted data or address bit, but provides no additional diagnosis for non-correctable multi-bit inversions.
    byte_offset: 260
    access: Read
    array:
      len: 5
      stride: 16
    fieldset: Syn
  - name: syn
    only_in: '^MCXN(24[67]|52[67]|53[67]|54[67]|55[67]|94[67])$'
    description: Channel 0-6 syndrome of the last recorded ECC event. Writes are ignored. Identifies a single inverted data or address bit, but provides no additional diagnosis for non-correctable multi-bit inversions. Channel 6 has no RAMF target on 352-KB parts; register presence does not establish supported ECC routing.
    byte_offset: 260
    access: Read
    array:
      len: 7
      stride: 16
    fieldset: Syn
  - name: syn8
    description: Documented PKC RAM syndrome register. Writes are ignored. The chip integration table describes byte parity reporting, whereas generic register prose describes ECC syndrome; do not infer ECC decoding for this parity route.
    byte_offset: 388
    access: Read
    fieldset: Syn
  - name: corr_err_cnt
    description: Correctable error counts for channel slots 0-9. Saturate at 255; write zero to reset, nonzero writes have no effect. Channels 7-9 report non-correctable errors and do not increment counts. N23 targets 5 and 6 are reserved; RAMF is unavailable on 352-KB parts.
    byte_offset: 264
    array:
      len: 10
      stride: 16
    fieldset: CorrErrCnt
