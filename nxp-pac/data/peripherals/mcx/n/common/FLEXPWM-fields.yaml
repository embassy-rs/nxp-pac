fieldset/Sm3ctrl:
  description: Control Register.
  bit_size: 16
  fields:
  - name: dblen
    description: "Double Switching Enable.\n\nRaw bit values: false (0) = Disabled: Double switching disabled.; true (1) = Enabled: Double switching enabled."
    bit_offset: 0
    bit_size: 1
  - name: dblx
    description: "PWM_X Double Switching Enable.\n\nRaw bit values: false (0) = Disabled: PWM_X double pulse disabled.; true (1) = Enabled: PWM_X double pulse enabled."
    bit_offset: 1
    bit_size: 1
  - name: ldmod
    description: "Load Mode Select.\n\nRaw bit values: false (0) = NextPwmReload: Buffered registers of this submodule are loaded and take effect at the next PWM reload if MCTRL[LDOK] is set.; true (1) = MtctrlLdokSet: Buffered registers of this submodule are loaded and take effect immediately upon MCTRL[LDOK] being set. In this case, it is not necessary to set CTRL[FULL] or CTRL[HALF]."
    bit_offset: 2
    bit_size: 1
  - name: split
    description: "Split the DBLPWM signal to PWM_A and PWM_B.\n\nRaw bit values: false (0) = Disabled: DBLPWM is not split. PWM_A and PWM_B each have double pulses.; true (1) = Enabled: DBLPWM is split to PWM_A and PWM_B."
    bit_offset: 3
    bit_size: 1
  - name: prsc
    description: Prescaler.
    bit_offset: 4
    bit_size: 3
    enum: SmctrlPrsc
  - name: compmode
    description: "Compare Mode.\n\nRaw bit values: false (0) = EqualTo: The VAL* registers and the PWM counter are compared using an \"equal to\" method. This means that PWM edges are only produced when the counter is equal to one of the VAL* register values. This implies that a PWM_A output that is high at the end of a period maintains this state until a match with VAL3 clears the output in the following period.; true (1) = EqualToOrGreaterThan: The VAL* registers and the PWM counter are compared using an \"equal to or greater than\" method. This means that PWM edges are produced when the counter is equal to or greater than one of the VAL* register values. This implies that a PWM_A output that is high at the end of a period could go low at the start of the next period if the starting counter value is greater than (but not necessarily equal to) the new VAL3 value."
    bit_offset: 7
    bit_size: 1
  - name: dt
    description: Deadtime.
    bit_offset: 8
    bit_size: 2
  - name: full
    description: "Full Cycle Reload.\n\nRaw bit values: false (0) = Disabled: Full-cycle reloads disabled.; true (1) = Enabled: Full-cycle reloads enabled."
    bit_offset: 10
    bit_size: 1
  - name: half
    description: "Half Cycle Reload.\n\nRaw bit values: false (0) = Disabled: Half-cycle reloads disabled.; true (1) = Enabled: Half-cycle reloads enabled."
    bit_offset: 11
    bit_size: 1
  - name: ldfq
    description: Load Frequency.
    bit_offset: 12
    bit_size: 4
    enum: SmctrlLdfq
