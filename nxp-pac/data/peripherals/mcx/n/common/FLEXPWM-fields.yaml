  description: Output Trigger Control Register.
  bit_size: 16
  fields:
  - name: out_trig_en
    description: Output Trigger Enables.
    bit_offset: 0
    bit_size: 6
    enum: OutTrigEn
  - name: trgfrq
    description: "Trigger Frequency.\n\nRaw bit values: false (0) = Everypwm: Trigger outputs are generated during every PWM period even if the PWM is not reloaded every period due to CTRL[LDFQ] being non-zero.; true (1) = Finalpwm: Trigger outputs are generated only during the final PWM period prior to a reload opportunity when the PWM is not reloaded every period due to CTRL[LDFQ] being non-zero."
