    bit_offset: 8
    bit_size: 1
  - name: cb1ie
    description: "Capture B 1 Interrupt Enable.\n\nRaw bit values: false (0) = Disabled: Interrupt request disabled for STS[CFB1].; true (1) = Enabled: Interrupt request enabled for STS[CFB1]."
    bit_offset: 9
    bit_size: 1
  - name: ca0ie
    description: "Capture A 0 Interrupt Enable.\n\nRaw bit values: false (0) = Disabled: Interrupt request disabled for STS[CFA0].; true (1) = Enabled: Interrupt request enabled for STS[CFA0]."
    bit_offset: 10
    bit_size: 1
  - name: ca1ie
    description: "Capture A 1 Interrupt Enable.\n\nRaw bit values: false (0) = Disabled: Interrupt request disabled for STS[CFA1].; true (1) = Enabled: Interrupt request enabled for STS[CFA1]."
