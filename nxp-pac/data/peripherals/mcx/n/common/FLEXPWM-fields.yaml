    bit_size: 1
  - name: frac23_en
    description: "Fractional Cycle Placement Enable for PWM_A.\n\nRaw bit values: false (0) = Disabled: Disable fractional cycle placement for PWM_A.; true (1) = Enabled: Enable fractional cycle placement for PWM_A."
    bit_offset: 2
    bit_size: 1
  - name: frac45_en
    description: "Fractional Cycle Placement Enable for PWM_B.\n\nRaw bit values: false (0) = Disabled: Disable fractional cycle placement for PWM_B.; true (1) = Enabled: Enable fractional cycle placement for PWM_B."
