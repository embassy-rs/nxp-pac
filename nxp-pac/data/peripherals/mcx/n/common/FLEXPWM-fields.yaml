    description: Clock Source Select.
    bit_offset: 0
    bit_size: 2
    enum: SmctrlClkSel
  - name: reload_sel
    description: "Reload Source Select.\n\nRaw bit values: false (0) = Local: The local RELOAD signal is used to reload registers.; true (1) = Master: The master RELOAD signal (from submodule 0) is used to reload registers. This setting should not be used in submodule 0 as it forces the RELOAD signal to logic 0."
    bit_offset: 2
    bit_size: 1
  - name: force_sel
    description: Force Select.
    bit_offset: 3
    bit_size: 3
    enum: SmctrlForceSel
  - name: force
    description: Force Initialization.
    bit_offset: 6
    bit_size: 1
  - name: frcen
    description: "Force Enable.\n\nRaw bit values: false (0) = Disabled: Initialization from a FORCE_OUT is disabled.; true (1) = Enabled: Initialization from a FORCE_OUT is enabled."
    bit_offset: 7
    bit_size: 1
  - name: init_sel
    description: Initialization Control Select.
    bit_offset: 8
    bit_size: 2
    enum: SmctrlInitSel
  - name: pwmx_init
    description: PWM_X Initial Value.
    bit_offset: 10
    bit_size: 1
  - name: pwm45_init
    description: PWM45 Initial Value.
    bit_offset: 11
    bit_size: 1
  - name: pwm23_init
    description: PWM23 Initial Value.
    bit_offset: 12
    bit_size: 1
  - name: indep
    description: "Independent or Complementary Pair Operation.\n\nRaw bit values: false (0) = Complementary: PWM_A and PWM_B form a complementary PWM pair.; true (1) = Independent: PWM_A and PWM_B outputs are independent PWMs."
    bit_offset: 13
    bit_size: 1
  - name: dbgen
    description: Debug Enable.
    bit_offset: 15
    bit_size: 1
