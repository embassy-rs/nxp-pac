  - name: pola
    description: "PWM_A Output Polarity.\n\nRaw bit values: false (0) = NotInverted: PWM_A output not inverted. A high level on the PWM_A pin represents the \"on\" or \"active\" state.; true (1) = Inverted: PWM_A output inverted. A low level on the PWM_A pin represents the \"on\" or \"active\" state."
