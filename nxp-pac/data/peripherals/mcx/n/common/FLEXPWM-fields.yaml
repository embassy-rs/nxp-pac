  - name: polx
    description: "PWM_X Output Polarity.\n\nRaw bit values: false (0) = NotInverted: PWM_X output not inverted. A high level on the PWM_X pin represents the \"on\" or \"active\" state.; true (1) = Inverted: PWM_X output inverted. A low level on the PWM_X pin represents the \"on\" or \"active\" state."
