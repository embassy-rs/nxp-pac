fieldset/EtbCounterCtrl:
  fields:
  - name: cnten
    description: "Enables the ETB counter.\n\nRaw bit values: false (0) = Disable: ETB counter is disabled.; true (1) = Enable: ETB counter is enabled."
    bit_offset: 0
    bit_size: 1
  - name: rspt
    description: Response Type.
    bit_offset: 1
    bit_size: 2
    enum: EtbCounterCtrlRspt
  - name: rlrq
    description: "Reload request.\n\nRaw bit values: false (0) = Disable: No effect.; true (1) = Enable: Clears pending debug halt, NMI, or IRQ interrupt requests."
    bit_offset: 3
    bit_size: 1
fieldset/EtbCounterReload:
  fields:
  - name: reload
    description: Byte count reload value.
    bit_offset: 0
    bit_size: 11
fieldset/EtbCounterValue:
