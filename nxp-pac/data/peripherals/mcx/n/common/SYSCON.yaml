    description: Byte count counter value.
    bit_offset: 0
    bit_size: 11
fieldset/EtbStatus:
  fields:
  - name: irq
    description: "ETB Interrupt.\n\nRaw bit values: false (0) = Disable: ETB interrupt is not asserted.; true (1) = Enable: ETB interrupt is asserted when ETB count expires. Write 1 to clear it."
    bit_offset: 1
    bit_size: 1
  - name: nmi
    description: "ETB NMI.\n\nRaw bit values: false (0) = Disable: ETB NMI is not asserted.; true (1) = Enable: ETB NMI is asserted. Write 1 to clear it."
    bit_offset: 2
    bit_size: 1
  - name: dbg_halt_req
    description: "Debug halt request.\n\nRaw bit values: false (0) = Disable: The debug halt request signal is not asserted.; true (1) = Enable: The debug halt request signal is asserted when the ETB count expires."
