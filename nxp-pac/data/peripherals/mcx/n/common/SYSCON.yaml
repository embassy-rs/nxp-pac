fieldset/KeyRetainCtrl:
  fields:
  - name: key_retain_valid
    description: "Indicates if the PUF key has been retained in the VBAT domain and has not been reset or otherwise invalidated by software.\n\nRaw bit values: false (0) = NotValid: PUF key is not retained in VBAT domain.; true (1) = Valid: PUF key is retained in VBAT domain."
    bit_offset: 0
    bit_size: 1
  - name: key_retain_done
    description: "Indicates the successful completion of the key_save or key_load routine. Once set, to clear the key_retain_done flag, both key_save and key_load should be cleared by software.\n\nRaw bit values: false (0) = NotDone: Key save / load sequence has not completed.; true (1) = Done: Key save / load sequence has completed."
    bit_offset: 1
    bit_size: 1
  - name: key_save
    description: "Do not set both KEY_SAVE and KEY_LOAD at the same time.\n\nRaw bit values: false (0) = Disable: Key save sequence is disabled.; true (1) = Enable: Key save sequence is enabled."
    bit_offset: 16
    bit_size: 1
  - name: key_load
    description: "Do not set both KEY_SAVE and KEY_LOAD at the same time.\n\nRaw bit values: false (0) = Disable: Key load sequence is disabled.; true (1) = Enable: Key load sequence is enabled."
    bit_offset: 17
    bit_size: 1
