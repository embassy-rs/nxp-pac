fieldset/ElsAsFlag0:
  fields:
  - name: flag_ap_enable_cpu0
    description: "This flag bit is set as 1 when DAP enables AP0 for CPU0 (CM33) debug access. The register is cleared 0 by PMC reset event.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 0
    bit_size: 1
  - name: flag_ap_enable_cpu1
    description: "This flag bit is set as 1 when DAP enables AP1 for CPU1 (CM33) debug access. The register is cleared 0 by PMC reset event.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 1
    bit_size: 1
  - name: flag_ap_enable_dsp
    description: "This flag bit is set as 1 when DAP enables AP3 for DSP (CoolFlux) debug access. The register is cleared 0 by PMC reset event.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 2
    bit_size: 1
  - name: efuse_attack_detect
    description: "OTPC can output attack_detect signal when it detects attack when load shadow registers. The output will be cleared by reset. ELS_AS_FLAG is reset by PoR, so the status can be recorded.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 3
    bit_size: 1
  - name: flag_lvd_core_occured
    description: "This flag register is set 1 when VDD_CORE LVD event is triggered. This register is cleared 0 by PMC reset event.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 5
    bit_size: 1
  - name: flag_wdt0_reset_occured
    description: "This flag bit is set as 1 when WatchDog Timer 0 reset is enabled and reset event is triggered. This register is cleared 0 by AO domain POR.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 8
    bit_size: 1
  - name: flag_cwdt0_reset_occured
    description: "This flag bit is set as 1 when Code WatchDog Timer 0 reset is enabled and reset event is triggered. This register is cleared 0 by AO domain POR.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 9
    bit_size: 1
  - name: flag_wdt0_irq_occured
    description: "This flag bit is set as 1 when WatchDog Timer 0 IRQ is enabled and IRQ event is triggered. This register is cleared 0 by PMC reset event.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 10
    bit_size: 1
  - name: flag_cwdt0_irq_occured
    description: "This flag bit is set as 1 when Code WatchDog Timer 0 IRQ is enabled and IRQ event is triggered. This register is cleared 0 by PMC reset event.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 11
    bit_size: 1
  - name: flag_qk_error
    description: "This flag bit is set as 1 when QK_ERROR is flagged from QK PUF block. This register is cleared 0 by PMC reset event.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 12
    bit_size: 1
  - name: flag_els_glitch_detected
    description: "This flag bit is set as 1 when GDET error is flagged. This register is cleared 0 by PMC reset event.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 13
    bit_size: 1
  - name: flag_ana_glitch_detected
    description: "This flag bit is set as 1 when ANALOG GDET error is flagged in SYSCON block. This register is cleared 0 by PMC reset event.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 14
    bit_size: 1
  - name: flag_tamper_event_detected
    description: "This flag bit is set as 1 when tamper event is flagged from TDET. This register is cleared 0 by AO domain POR or by PMC reset event, if tamper detection event is cleared by software.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 15
    bit_size: 1
  - name: flag_flash_ecc_invalid
    description: "This flag bit is set as 1 when FLASH controller indicates ECC error. This register is cleared 0 by PMC reset event.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 16
    bit_size: 1
  - name: flag_sec_viol_irq_ocurred
    description: "This flag bit is set as 1 when security violation is indicated from FLASH sub-system or AHB bus matrix.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 17
    bit_size: 1
  - name: flag_cpu0_ns_c_acc_occured
    description: "This flag bit is set as 1 when CPU0 (CM33) makes non-secure code transactions. This register is cleared 0 by PMC reset event.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 18
    bit_size: 1
  - name: flag_cpu0_ns_d_acc_occured
    description: "This flag bit is set as 1 when CPU0 (CM33) makes non-secure data transactions. This register is cleared 0 by PMC reset event.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 19
    bit_size: 1
  - name: flag_lvd_vsys_occured
    description: "This flag register is set 1 when VDD_SYS LVD event is triggered. This register is cleared 0 by PMC reset event.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 20
    bit_size: 1
  - name: flag_lvd_vddio_occured
    description: "This flag register is set 1 when VDD LVD event is triggered. This register is cleared 0 by PMC reset event.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 21
    bit_size: 1
  - name: flag_wdt1_reset_occured
    description: "This flag bit is set as 1 when WatchDog Timer 1 reset is enabled and reset event is triggered. This register is cleared 0 by AO domain POR.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 22
    bit_size: 1
  - name: flag_cwdt1_reset_occured
    description: "This flag bit is set as 1 when Code WatchDog Timer 1 reset is enabled and reset event is triggered. This register is cleared 0 by AO domain POR.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 23
    bit_size: 1
  - name: flag_wdt1_irq_occured
    description: "This flag bit is set as 1 when WatchDog Timer 1 IRQ is enabled and IRQ event is triggered. This register is cleared 0 by PMC reset event.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 24
    bit_size: 1
  - name: flag_cwdt1_irq_occured
    description: "This flag bit is set as 1 when Code WatchDog Timer 1 IRQ is enabled and IRQ event is triggered. This register is cleared 0 by PMC reset event.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 25
    bit_size: 1
  - name: flag_temptamper_det_irq_occured
    description: "This flag bit is set as 1 when temperature temper IRQ is enabled and IRQ event is triggered. This register is cleared 0 by PMC reset event.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 26
    bit_size: 1
  - name: flag_voltamper_det_irq_occured
    description: "This flag bit is set as 1 when voltage temper IRQ is enabled and IRQ event is triggered. This register is cleared 0 by PMC reset event.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 27
    bit_size: 1
  - name: flag_lhttamper_det_irq_occured
    description: "This flag bit is set as 1 when light temper IRQ is enabled and IRQ event is triggered. This register is cleared 0 by PMC reset event.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 28
    bit_size: 1
  - name: flag_clktamper_det_irq_occured
    description: "This flag bit is set as 1 when clock temper IRQ is enabled and IRQ event is triggered. This register is cleared 0 by PMC reset event.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 29
    bit_size: 1
fieldset/ElsAsFlag1:
  fields:
  - name: flag_hvd_core_occured
    description: "This flag bit is set as 1 when HVD from VDD_CORE power domain is triggered.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 29
    bit_size: 1
  - name: flag_hvd_vsys_occured
    description: "This flag bit is set as 1 when HVD from VDD_SYS power domain is triggered.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 30
    bit_size: 1
  - name: flag_hvd_vddio_occured
    description: "This flag bit is set as 1 when HVD from VDD power domain is triggered.\n\nRaw bit values: false (0) = Disable: Not Triggered.; true (1) = Enable: Triggered."
    bit_offset: 31
    bit_size: 1
fieldset/ElsAsSt0:
  fields:
  - name: st_temporal_state
    description: TEMPORAL_STATE[3:0] in the ELS_TEMPORAL_STATE register reflects this register.
    bit_offset: 0
    bit_size: 4
  - name: st_cpu0_dbgen
    description: When CPU0 (CM33) "deben" input is state 1, this bit indicates state 1.
    bit_offset: 4
    bit_size: 1
  - name: st_cpu0_niden
    description: When CPU0 (CM33) "niden" input is state 1, this bit indicates state 1.
    bit_offset: 5
    bit_size: 1
  - name: st_cpu0_spiden
    description: When CPU0 (CM33) "spiden" input is state 1, this bit indicates state 1.
    bit_offset: 6
    bit_size: 1
  - name: st_cpu0_spniden
    description: When CPU0 (CM33) "spniden" input is state 1, this bit indicates state 1.
    bit_offset: 7
    bit_size: 1
  - name: st_cpu1_dbgen
    description: When CPU1 (CM33) "deben" input is state 1, this bit indicates state 1.
    bit_offset: 8
    bit_size: 1
  - name: st_cpu1_niden
    description: When CPU1 (CM33) "niden" input is state 1, this bit indicates state 1.
    bit_offset: 9
    bit_size: 1
  - name: st_dap_enable_cpu0
    description: When DAP to AP0 for CPU0 (CM33) debug access is allowed, this bit indicates state 1.
    bit_offset: 10
    bit_size: 1
  - name: st_dap_enable_cpu1
    description: When DAP to AP1 for CPU1 (CM33) debug access is allowed, this bit indicates state 1.
    bit_offset: 11
    bit_size: 1
  - name: st_dap_enable_dsp
    description: When DAP to AP3 for DSP (CoolFlux) debug access is allowed, this bit indicates state 1.
    bit_offset: 12
    bit_size: 1
  - name: st_allow_test_access
    description: When JTAG TAP access is allowed, this bit indicates state 1.
    bit_offset: 14
    bit_size: 1
  - name: st_xo32k_failed
    description: When XO32K oscillation fail flag is state 1, this bit indicates state 1.
    bit_offset: 15
    bit_size: 1
  - name: st_xo40m_failed
    description: When XO40M oscillation fail flag is state 1, this bit indicates state 1.
    bit_offset: 16
    bit_size: 1
  - name: st_ifr_load_failed
    description: When IFR load fail flag is state 1, this bit indicates state 1.
    bit_offset: 17
    bit_size: 1
  - name: st_glitch_detect_flag
    description: GLITCH_DETECT_FLAG is state of 4-bit Glitch Ripple Counter output.
    bit_offset: 18
    bit_size: 4
fieldset/ElsAsSt1:
  fields:
  - name: st_qk_puf_score
    description: These register bits indicate the state of "qk_puf_score[3:0]" outputs from QK PUF block.
    bit_offset: 0
    bit_size: 4
  - name: st_qk_zeroized
    description: This register bit indicates the state of "qk_zeroized" output from QK PUF block.
    bit_offset: 4
    bit_size: 1
  - name: st_main_clk_is_ext
    description: When MAIN_CLK is running from external clock source either XO32M, XO32K or GPIO CLKIN, this bit indicates state 1.
    bit_offset: 5
    bit_size: 1
  - name: st_dcdc_vout
    description: VOUT[1:0] setting on DCDC0 register in SPC block will reflect to this register. Default is 1.0V.
    bit_offset: 6
    bit_size: 2
  - name: st_dcdc_ds
    description: DCDC drive strength setting. Default is normal drive.
    bit_offset: 8
    bit_size: 2
  - name: st_boot_mode
    description: ISP pin status during boot. By default ISP pin is pulled up. If want to enter ISP mode during boot, ISP pin should be pull down when out of reset.
    bit_offset: 10
    bit_size: 2
  - name: st_boot_retry_cnt
    description: BOOT_RETRY_CNT[3:0] in the ELS_BOOT_RETRY_CNT register reflects this register.
    bit_offset: 12
    bit_size: 4
  - name: st_ldo_core_vout
    description: VOUT[1:0] setting on LDO Core register in SPC block will reflect to this register. Default is 1.0V.
    bit_offset: 16
    bit_size: 2
  - name: st_ldo_core_ds
    description: LDO_CORE drive strength setting. Default is normal drive.
    bit_offset: 18
    bit_size: 2
