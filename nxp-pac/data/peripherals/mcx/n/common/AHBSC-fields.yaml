  bit_size: 2
  variants:
  - name: Enabled
    description: Enables privilege checking of secure mode access.
    value: 1
  - name: Disabled
    description: Disables privilege checking of secure mode access.
    value: 2
enum/EnableSPrivCheck2:
  bit_size: 2
  variants:
  - name: Enabled
    description: Enables the privilege checking of secure mode access.
    value: 1
  - name: Disabled
    description: Disables the privilege checking of secure mode access.
    value: 2
enum/EnableSecureChecking:
  bit_size: 2
  variants:
  - name: Enabled
    description: Enables secure checking. Violation can be detected when the security level of a transaction does not meet the security rule of the slave or memory to be accessed.
    value: 1
  - name: Disabled
    description: Disables secure checking. Even if the security level of a transaction does not conform to the security rule of the slave or memory, it will not be detected as a violation.
    value: 2
