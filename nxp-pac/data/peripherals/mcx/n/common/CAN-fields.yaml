# MCXN field definitions; identical layouts share one type, including software defaults.
# Different field/variant documentation is retained rather than width-based merging.
# Curated from the N2/N5/N9 native imports; source hashes remain on the block entry.
includes:
  - ../../common/CAN-fields.yaml
fieldset/Cbt2:
  description: CAN Bit Timing.
  fields:
  - name: epseg2
    description: Extended Phase Segment 2.
    bit_offset: 0
    bit_size: 5
  - name: epseg1
    description: Extended Phase Segment 1.
    bit_offset: 5
    bit_size: 5
  - name: epropseg
    description: Extended Propagation Segment.
    bit_offset: 10
    bit_size: 6
  - name: erjw
    description: Extended Resync Jump Width.
    bit_offset: 16
    bit_size: 5
  - name: epresdiv
    description: Extended Prescaler Division Factor.
    bit_offset: 21
    bit_size: 10
  - name: btf
    description: "Bit Timing Format Enable.\n\nRaw bit values: false (0) = Disable: Disable.; true (1) = Enable: Enable."
    bit_offset: 31
    bit_size: 1
fieldset/Ctrl1Pn2:
  description: Pretended Networking Control 1.
  fields:
  - name: fcs
    description: Filtering Combination Selection.
    bit_offset: 0
    bit_size: 2
    enum: Fcs
  - name: idfs
    description: ID Filtering Selection.
    bit_offset: 2
    bit_size: 2
    enum: Idfs
  - name: plfs
    description: Payload Filtering Selection.
    bit_offset: 4
    bit_size: 2
    enum: Plfs
  - name: nmatch
    description: Number of Messages Matching the Same Filtering Criteria.
    bit_offset: 8
    bit_size: 8
    enum: Nmatch
  - name: wumf_msk
    description: "Wake-up by Matching Flag Mask.\n\nRaw bit values: false (0) = Disable: Disable.; true (1) = Enable: Enable."
    bit_offset: 16
    bit_size: 1
  - name: wtof_msk
    description: "Wake-up by Timeout Flag Mask.\n\nRaw bit values: false (0) = Disable: Disable.; true (1) = Enable: Enable."
    bit_offset: 17
    bit_size: 1
fieldset/Ctrl22:
  description: Control 2.
  fields:
  - name: edfltdis
    description: "Edge Filter Disable.\n\nRaw bit values: false (0) = Enable: Enabled.; true (1) = Disable: Disabled."
    bit_offset: 11
    bit_size: 1
  - name: isocanfden
    description: "ISO CAN FD Enable.\n\nRaw bit values: false (0) = NonIso: Disable.; true (1) = Iso: Enable."
    bit_offset: 12
    bit_size: 1
  - name: bte
    description: "Bit Timing Expansion Enable.\n\nRaw bit values: false (0) = Disable: Disable.; true (1) = Enable: Enable."
    bit_offset: 13
    bit_size: 1
  - name: prexcen
    description: "Protocol Exception Enable.\n\nRaw bit values: false (0) = Disable: Disabled.; true (1) = Enable: Enabled."
    bit_offset: 14
    bit_size: 1
  - name: eacen
    description: "Entire Frame Arbitration Field Comparison Enable for RX Message Buffers.\n\nRaw bit values: false (0) = RtrCompareNo: Disable.; true (1) = RtrCompareYes: Enable."
    bit_offset: 16
    bit_size: 1
  - name: rrs
    description: "Remote Request Storing.\n\nRaw bit values: false (0) = RemoteResponseFrameNotGenerated: Generated.; true (1) = RemoteResponseFrameGenerated: Stored."
    bit_offset: 17
    bit_size: 1
  - name: mrp
    description: "Message Buffers Reception Priority.\n\nRaw bit values: false (0) = Id1: Matching starts from Legacy RX FIFO or Enhanced RX FIFO and continues on message buffers.; true (1) = Id3: Matching starts from message buffers and continues on Legacy RX FIFO or Enhanced RX FIFO."
    bit_offset: 18
    bit_size: 1
  - name: tasd
    description: Transmission Arbitration Start Delay.
    bit_offset: 19
    bit_size: 5
  - name: rffn
    description: Number of Legacy Receive FIFO Filters.
    bit_offset: 24
    bit_size: 4
  - name: boffdonemsk
    description: "Bus Off Done Interrupt Mask.\n\nRaw bit values: false (0) = Disable: Disable.; true (1) = Enable: Enable."
    bit_offset: 30
    bit_size: 1
  - name: errmsk_fast
    description: "Error Interrupt Mask for Errors Detected in the Data Phase of Fast CAN FD Frames.\n\nRaw bit values: false (0) = Disable: Disable.; true (1) = Enable: Enable."
    bit_offset: 31
    bit_size: 1
fieldset/Erfcr2:
  description: Enhanced RX FIFO Control.
  fields:
  - name: erfwm
    description: Enhanced RX FIFO Watermark.
    bit_offset: 0
    bit_size: 5
  - name: nfe
    description: Number of Enhanced RX FIFO Filter Elements.
    bit_offset: 8
    bit_size: 6
  - name: nexif
    description: Number of Extended ID Filter Elements.
    bit_offset: 16
    bit_size: 7
  - name: dmalw
    description: DMA Last Word.
    bit_offset: 26
    bit_size: 5
  - name: erfen
    description: "Enhanced RX FIFO enable.\n\nRaw bit values: false (0) = Disable: Disable.; true (1) = Enable: Enable."
    bit_offset: 31
    bit_size: 1
fieldset/Erfier2:
  description: Enhanced RX FIFO Interrupt Enable.
  fields:
  - name: erfdaie
    description: "Enhanced RX FIFO Data Available Interrupt Enable.\n\nRaw bit values: false (0) = Disable: Disable.; true (1) = Enable: Enable."
    bit_offset: 28
    bit_size: 1
  - name: erfwmiie
    description: "Enhanced RX FIFO Watermark Indication Interrupt Enable.\n\nRaw bit values: false (0) = Disable: Disable.; true (1) = Enable: Enable."
    bit_offset: 29
    bit_size: 1
  - name: erfovfie
    description: "Enhanced RX FIFO Overflow Interrupt Enable.\n\nRaw bit values: false (0) = Disable: Disable.; true (1) = Enable: Enable."
    bit_offset: 30
    bit_size: 1
  - name: erfufwie
    description: "Enhanced RX FIFO Underflow Interrupt Enable.\n\nRaw bit values: false (0) = Disable: Disable.; true (1) = Enable: Enable."
    bit_offset: 31
    bit_size: 1
fieldset/Erfsr2:
  description: Enhanced RX FIFO Status.
  fields:
  - name: erfel
    description: Enhanced RX FIFO Elements.
    bit_offset: 0
    bit_size: 6
  - name: erff
    description: "Enhanced RX FIFO Full Flag.\n\nRaw bit values: false (0) = NotFull: Not full.; true (1) = Full: Full."
    bit_offset: 16
    bit_size: 1
  - name: erfe
    description: "Enhanced RX FIFO Empty Flag.\n\nRaw bit values: false (0) = NotEmpty: Not empty.; true (1) = Empty: Empty."
    bit_offset: 17
    bit_size: 1
  - name: erfclr
    description: "Enhanced RX FIFO Clear.\n\nRaw bit values: false (0) = NoEffect: No effect.; true (1) = Clear: Clear enhanced RX FIFO content."
    bit_offset: 27
    bit_size: 1
  - name: erfda
    description: "Enhanced RX FIFO Data Available Flag.\n\nRaw bit values: false (0) = NoMessageStored: No such occurrence.; true (1) = MessageStored: At least one message stored in Enhanced RX FIFO."
    bit_offset: 28
    bit_size: 1
  - name: erfwmi
    description: "Enhanced RX FIFO Watermark Indication Flag.\n\nRaw bit values: false (0) = WatermarkNo: No such occurrence.; true (1) = WatermarkYes: Number of messages in FIFO is greater than the watermark."
    bit_offset: 29
    bit_size: 1
  - name: erfovf
    description: "Enhanced RX FIFO Overflow Flag.\n\nRaw bit values: false (0) = NoOverflow: No such occurrence.; true (1) = Overflow: Overflow."
    bit_offset: 30
    bit_size: 1
  - name: erfufw
    description: "Enhanced RX FIFO Underflow Flag.\n\nRaw bit values: false (0) = NoUnderflow: No such occurrence.; true (1) = Underflow: Underflow."
    bit_offset: 31
    bit_size: 1
fieldset/Esr12:
  description: Error and Status 1.
  fields:
  - name: wakint
    description: "Wake-up Interrupt Flag.\n\nRaw bit values: false (0) = Disable: No such occurrence.; true (1) = Enable: Indicates that a recessive-to-dominant transition was received on the CAN bus."
    bit_offset: 0
    bit_size: 1
  - name: errint
    description: "Error Interrupt Flag.\n\nRaw bit values: false (0) = Disable: No such occurrence.; true (1) = Enable: Indicates setting of any error flag in the Error and Status register."
    bit_offset: 1
    bit_size: 1
  - name: boffint
    description: "Bus Off Interrupt Flag.\n\nRaw bit values: false (0) = Disable: No such occurrence.; true (1) = Enable: FlexCAN module entered Bus Off state."
    bit_offset: 2
    bit_size: 1
  - name: rx
    description: "FlexCAN in Reception Flag.\n\nRaw bit values: false (0) = Disable: Not receiving.; true (1) = Enable: Receiving."
    bit_offset: 3
    bit_size: 1
  - name: fltconf
    description: Fault Confinement State.
    bit_offset: 4
    bit_size: 2
    enum: Fltconf
  - name: tx
    description: "FlexCAN In Transmission.\n\nRaw bit values: false (0) = TransmitMessageNo: Not transmitting.; true (1) = TransmitMessageYes: Transmitting."
    bit_offset: 6
    bit_size: 1
  - name: idle
    description: "Idle.\n\nRaw bit values: false (0) = CanBusNotIdle: Not IDLE.; true (1) = CanBusIdle: IDLE."
    bit_offset: 7
    bit_size: 1
  - name: rxwrn
    description: "RX Error Warning Flag.\n\nRaw bit values: false (0) = RxerrcntLt96: No such occurrence.; true (1) = RxerrcntGte96: RXERRCNT is greater than or equal to 96."
    bit_offset: 8
    bit_size: 1
  - name: txwrn
    description: "TX Error Warning Flag.\n\nRaw bit values: false (0) = TxerrcntLt96: No such occurrence.; true (1) = TxerrcntGte96: TXERRCNT is 96 or greater."
    bit_offset: 9
    bit_size: 1
  - name: stferr
    description: "Stuffing Error Flag.\n\nRaw bit values: false (0) = StuffingErrorNo: No error.; true (1) = StuffingErrorYes: Error occurred since last read of this register."
    bit_offset: 10
    bit_size: 1
  - name: frmerr
    description: "Form Error Flag.\n\nRaw bit values: false (0) = FormErrorNo: No error.; true (1) = FormErrorYes: Error occurred since last read of this register."
    bit_offset: 11
    bit_size: 1
  - name: crcerr
    description: "Cyclic Redundancy Check Error Flag.\n\nRaw bit values: false (0) = CrcErrorNo: No error.; true (1) = CrcErrorYes: Error occurred since last read of this register."
    bit_offset: 12
    bit_size: 1
  - name: ackerr
    description: "Acknowledge Error Flag.\n\nRaw bit values: false (0) = AckErrorNo: No error.; true (1) = AckErrorYes: Error occurred since last read of this register."
    bit_offset: 13
    bit_size: 1
  - name: bit0err
    description: "Bit0 Error Flag.\n\nRaw bit values: false (0) = Bit0ErrorNo: No such occurrence.; true (1) = Bit0ErrorYes: At least one bit sent as dominant is received as recessive."
    bit_offset: 14
    bit_size: 1
  - name: bit1err
    description: "Bit1 Error Flag.\n\nRaw bit values: false (0) = Bit1ErrorNo: No such occurrence.; true (1) = Bit1ErrorYes: At least one bit sent as recessive is received as dominant."
    bit_offset: 15
    bit_size: 1
  - name: rwrnint
    description: "RX Warning Interrupt Flag.\n\nRaw bit values: false (0) = RxWarningIntNo: No such occurrence.; true (1) = RxWarningIntYes: RX error counter changed from less than 96 to greater than or equal to 96."
    bit_offset: 16
    bit_size: 1
  - name: twrnint
    description: "TX Warning Interrupt Flag.\n\nRaw bit values: false (0) = TxWarningIntNo: No such occurrence.; true (1) = TxWarningIntYes: TX error counter changed from less than 96 to greater than or equal to 96."
    bit_offset: 17
    bit_size: 1
  - name: synch
    description: "CAN Synchronization Status Flag.\n\nRaw bit values: false (0) = CanBusSyncNo: Not synchronized.; true (1) = CanBusSyncYes: Synchronized."
    bit_offset: 18
    bit_size: 1
  - name: boffdoneint
    description: "Bus Off Done Interrupt Flag.\n\nRaw bit values: false (0) = BusOffNotDone: No such occurrence.; true (1) = BusOffDone: FlexCAN module has completed Bus Off process."
    bit_offset: 19
    bit_size: 1
  - name: errint_fast
    description: "Fast Error Interrupt Flag.\n\nRaw bit values: false (0) = ErrorsDataPhaseNo: No such occurrence.; true (1) = ErrorsDataPhaseYes: Error flag set in the data phase of CAN FD frames that have BRS = 1."
    bit_offset: 20
    bit_size: 1
  - name: errovr
    description: "Error Overrun Flag.\n\nRaw bit values: false (0) = OverrunNotOccurred: No overrun.; true (1) = OverrunOccurred: Overrun."
    bit_offset: 21
    bit_size: 1
  - name: stferr_fast
    description: "Fast Stuffing Error Flag.\n\nRaw bit values: false (0) = StuffingErrorNo: No such occurrence.; true (1) = StuffingErrorYes: A stuffing error occurred since last read of this register."
    bit_offset: 26
    bit_size: 1
  - name: frmerr_fast
    description: "Fast Form Error Flag.\n\nRaw bit values: false (0) = FormErrorNo: No such occurrence.; true (1) = FormErrorYes: A form error occurred since last read of this register."
    bit_offset: 27
    bit_size: 1
  - name: crcerr_fast
    description: "Fast Cyclic Redundancy Check Error Flag.\n\nRaw bit values: false (0) = CrcErrorNo: No such occurrence.; true (1) = CrcErrorYes: A CRC error occurred since last read of this register."
    bit_offset: 28
    bit_size: 1
  - name: bit0err_fast
    description: "Fast Bit0 Error Flag.\n\nRaw bit values: false (0) = Bit0ErrorNo: No such occurrence.; true (1) = Bit0ErrorYes: At least one bit transmitted as dominant is received as recessive."
    bit_offset: 30
    bit_size: 1
  - name: bit1err_fast
    description: "Fast Bit1 Error Flag.\n\nRaw bit values: false (0) = Bit1ErrorNo: No such occurrence.; true (1) = Bit1ErrorYes: At least one bit transmitted as recessive is received as dominant."
    bit_offset: 31
    bit_size: 1
fieldset/Esr22:
