  - name: imb
    description: "Inactive Message Buffer.\n\nRaw bit values: false (0) = InactiveMailboxNo: Message buffer indicated by ESR2[LPTM] is not inactive.; true (1) = InactiveMailboxYes: At least one message buffer is inactive."
    bit_offset: 13
    bit_size: 1
  - name: vps
