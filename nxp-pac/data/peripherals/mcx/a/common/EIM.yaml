# MCXAP144M240F61RM Rev. 2, section 8.6; MCXAP172M240F70RM Rev. 1, section 15.3.
# Only channel 0 is documented by the channel table and register map.
block/Eim:
  description: Error injection module. Program descriptors before enabling the channel and then global injection. Only word accesses are supported.
  items:
  - name: eimcr
    description: Error Injection Module Configuration Register.
    byte_offset: 0
    fieldset: Eimcr
  - name: eichen
    description: Error Injection Channel Enable register.
    byte_offset: 4
    fieldset: Eichen
  - name: eichd0_word0
    description: Error Injection Channel Descriptor 0, Word0. A successful write clears EICHEN.EICH0EN; re-enable after configuring the mask.
    byte_offset: 256
    fieldset: Eichd0Word0
  - name: eichd0_word1
    description: Error Injection Channel Descriptor 0, Word1. A successful write clears EICHEN.EICH0EN; re-enable after configuring the mask.
    byte_offset: 260
    fieldset: Eichd0Word1
fieldset/Eichd0Word0:
  description: Error Injection Channel Descriptor 0, Word0.
  fields:
  - name: chkbit_mask
    description: Checkbit Mask.
    bit_offset: 25
    bit_size: 7
  bit_size: 32
  reset_value: 0
fieldset/Eichd0Word1:
  description: Error Injection Channel Descriptor 0, Word1.
  fields:
  - name: b0_3data_mask
    description: Data Mask Field.
    bit_offset: 0
    bit_size: 32
  bit_size: 32
  reset_value: 0
fieldset/Eichen:
  description: Error Injection Channel Enable register.
  fields:
  - name: eich0en
    description: Error Injection Channel 0 Enable.
    bit_offset: 31
    bit_size: 1
  bit_size: 32
  reset_value: 0
fieldset/Eimcr:
  description: Error Injection Module Configuration Register.
  fields:
  - name: geien
    description: Global Error Injection Enable.
    bit_offset: 0
    bit_size: 1
  bit_size: 32
  reset_value: 0
