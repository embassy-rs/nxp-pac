fieldset/Smctrl:
  description: Control Register.
  bit_size: 16
  fields:
  - name: dblen
    description: Double Switching Enable.
    bit_offset: 0
    bit_size: 1
  - name: dblx
    description: PWM_X Double Switching Enable.
    bit_offset: 1
    bit_size: 1
  - name: ldmod
    description: "Load Mode Select.\n\nRaw bit values: false (0) = NextPwmReload: Buffered registers of this submodule are loaded and take effect at the next PWM reload if MCTRL[LDOK] is set.; true (1) = MtctrlLdokSet: Buffered registers of this submodule are loaded and take effect immediately upon MCTRL[LDOK] being set. In this case, it is not necessary to set CTRL[FULL] or CTRL[HALF]."
    bit_offset: 2
    bit_size: 1
  - name: split
    description: Split the DBLPWM signal to PWM_A and PWM_B.
    bit_offset: 3
    bit_size: 1
  - name: prsc
    description: Prescaler.
    bit_offset: 4
    bit_size: 3
    enum: SmctrlPrsc
  - name: compmode
    description: "Compare Mode.\n\nRaw bit values: false (0) = EqualTo: The VAL* registers and the PWM counter are compared using an \"equal to\" method. This means that PWM edges are only produced when the counter is equal to one of the VAL* register values. This implies that a PWM_A output that is high at the end of a period maintains this state until a match with VAL3 clears the output in the following period.; true (1) = EqualToOrGreaterThan: The VAL* registers and the PWM counter are compared using an \"equal to or greater than\" method. This means that PWM edges are produced when the counter is equal to or greater than one of the VAL* register values. This implies that a PWM_A output that is high at the end of a period could go low at the start of the next period if the starting counter value is greater than (but not necessarily equal to) the new VAL3 value."
    bit_offset: 7
    bit_size: 1
  - name: dt
    description: Deadtime.
    bit_offset: 8
    bit_size: 2
  - name: full
    description: Full Cycle Reload.
    bit_offset: 10
    bit_size: 1
  - name: half
    description: Half Cycle Reload.
    bit_offset: 11
    bit_size: 1
  - name: ldfq
    description: Load Frequency.
    bit_offset: 12
    bit_size: 4
    enum: SmctrlLdfq
fieldset/Smctrl2:
  description: Control 2 Register.
  bit_size: 16
  fields:
  - name: clk_sel
    description: Clock Source Select.
    bit_offset: 0
    bit_size: 2
    enum: SmctrlClkSel
  - name: reload_sel
    description: "Reload Source Select.\n\nRaw bit values: false (0) = Local: The local RELOAD signal is used to reload registers.; true (1) = Master: The master RELOAD signal (from submodule 0) is used to reload registers. This setting should not be used in submodule 0 as it forces the RELOAD signal to logic 0."
    bit_offset: 2
    bit_size: 1
  - name: force_sel
    description: Force Select.
    bit_offset: 3
    bit_size: 3
    enum: SmctrlForceSel
  - name: force
    description: Force Initialization.
    bit_offset: 6
    bit_size: 1
  - name: frcen
    description: Force Enable.
    bit_offset: 7
    bit_size: 1
  - name: init_sel
    description: Initialization Control Select.
    bit_offset: 8
    bit_size: 2
