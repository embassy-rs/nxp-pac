    description: "Trigger Frequency.\n\nRaw bit values: false (0) = Everypwm: Trigger outputs are generated during every PWM period even if the PWM is not reloaded every period due to CTRL[LDFQ] being non-zero.; true (1) = Finalpwm: Trigger outputs are generated only during the final PWM period prior to a reload opportunity when the PWM is not reloaded every period due to CTRL[LDFQ] being non-zero."
    bit_offset: 12
    bit_size: 1
  - name: pwbot1
    description: "Mux Output Trigger 1 Source Select.\n\nRaw bit values: false (0) = PwmOutTrig1Signal: Route the PWM_OUT_TRIG1 signal to PWM_MUX_TRIG1 port.; true (1) = PwmbOutput: Route the PWM_B output to the PWM_MUX_TRIG1 port."
    bit_offset: 14
    bit_size: 1
  - name: pwaot0
    description: "Mux Output Trigger 0 Source Select.\n\nRaw bit values: false (0) = PwmOutTrig0Signal: Route the PWM_OUT_TRIG0 signal to PWM_MUX_TRIG0 port.; true (1) = PwmaOutput: Route the PWM_A output to the PWM_MUX_TRIG0 port."
    bit_offset: 15
    bit_size: 1
