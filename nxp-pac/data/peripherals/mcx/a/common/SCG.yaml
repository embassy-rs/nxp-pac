fieldset/Apllcsr:
  only_in: '^MCXA(286|287|456|457|536|537|556|557|566|567|577)$'
  description: APLL Control Status Register.
  fields:
  - name: apllpwren
    description: APLL Power Enable.
    bit_offset: 0
    bit_size: 1
  - name: apllclken
    description: APLL Clock Enable.
    bit_offset: 1
    bit_size: 1
  - name: apllsten
    description: "APLL Stop Enable.\n\nRaw bit values: false (0) = DisabledInStop: APLL is disabled in Deep Sleep mode.; true (1) = EnabledInStop: APLL is enabled in Deep Sleep mode."
    bit_offset: 2
    bit_size: 1
  - name: frm_clockstable
    description: Free running mode clock stable.
    bit_offset: 3
    bit_size: 1
  - name: apllcm
    description: APLL Clock Monitor.
    bit_offset: 16
    bit_size: 1
  - name: apllcmre
    description: "APLL Clock Monitor Reset Enable.\n\nRaw bit values: false (0) = GenerateInterrupt: Clock monitor generates an interrupt when an error is detected.; true (1) = GenerateReset: Clock monitor generates a reset when an error is detected."
    bit_offset: 17
    bit_size: 1
  - name: lk
    description: "Lock Register.\n\nRaw bit values: false (0) = WriteEnabled: Control Status Register can be written.; true (1) = WriteDisabled: Control Status Register cannot be written."
    bit_offset: 23
    bit_size: 1
  - name: apll_lock
    description: "APLL LOCK.\n\nRaw bit values: false (0) = DisabledOrNotValid: APLL is not powered on or not locked.; true (1) = EnabledAndValid: APLL is locked."
    bit_offset: 24
    bit_size: 1
  - name: apllsel
    description: APLL Selected.
    bit_offset: 25
    bit_size: 1
  - name: apllerr
    description: "APLL Clock Error.\n\nRaw bit values: false (0) = DisabledOrNoError: APLL Clock Monitor is disabled or has not detected an error.; true (1) = EnabledAndError: APLL Clock Monitor is enabled and detected an error."
    bit_offset: 26
    bit_size: 1
  - name: apll_lock_ie
    description: APLL LOCK Interrupt Enable.
    bit_offset: 30
    bit_size: 1
fieldset/Apllctrl:
  only_in: '^MCXA(286|287|456|457|536|537|556|557|566|567|577)$'
  description: APLL Control Register.
  fields:
  - name: selr
    description: Bandwidth select R (resistor) value.
    bit_offset: 0
    bit_size: 4
  - name: seli
    description: Bandwidth select I (integration) value.
    bit_offset: 4
    bit_size: 6
  - name: selp
    description: Bandwidth select P (proportional) value.
    bit_offset: 10
    bit_size: 5
  - name: bypasspostdiv2
    description: Bypass of Divide-by-2 Divider.
    bit_offset: 16
    bit_size: 1
  - name: limupoff
    description: Up Limiter.
    bit_offset: 17
    bit_size: 1
  - name: banddirect
    description: Control of the bandwidth of the PLL.
    bit_offset: 18
    bit_size: 1
  - name: bypassprediv
    description: Bypass of the predivider.
    bit_offset: 19
    bit_size: 1
  - name: bypasspostdiv
    description: Bypass of the postdivider.
    bit_offset: 20
    bit_size: 1
  - name: frm
    description: Free Running Mode Enable.
    bit_offset: 22
    bit_size: 1
  - name: skew_en
    description: Skew mode.
    bit_offset: 24
    bit_size: 1
  - name: source
    description: Clock Source.
    bit_offset: 25
    bit_size: 2
    enum: ApllctrlSource
fieldset/AplllockCnfg:
  only_in: '^MCXA(286|287|456|457|536|537|556|557|566|567|577)$'
  description: APLL LOCK Configuration Register.
  fields:
  - name: lock_time
    description: Configures the number of reference clocks to count before APLL is considered locked.
    bit_offset: 0
    bit_size: 17
fieldset/Apllmdiv:
  description: APLL M Divider Register.
  fields:
  - name: mdiv
    description: Feedback divider divider ratio (M-divider).
    bit_offset: 0
    bit_size: 16
  - name: mreq
    description: Feedback ratio change request.
    bit_offset: 31
    bit_size: 1
fieldset/Apllndiv:
  description: APLL N Divider Register.
  fields:
  - name: ndiv
    description: Predivider divider ratio (N-divider).
    bit_offset: 0
    bit_size: 8
  - name: nreq
    description: Predivider ratio change request.
    bit_offset: 31
    bit_size: 1
fieldset/Apllpdiv:
  description: APLL P Divider Register.
  fields:
  - name: pdiv
    description: Postdivider divider ratio (P-divider).
    bit_offset: 0
    bit_size: 5
  - name: preq
    description: Postdivider ratio change request.
    bit_offset: 31
    bit_size: 1
fieldset/Apllsscg0:
  only_in: '^MCXA(286|287|456|457|536|537|556|557|566|567|577)$'
  description: APLL Spread Spectrum Control 0 Register.
  fields:
  - name: ss_mdiv_lsb
    description: SS_MDIV.
    bit_offset: 0
    bit_size: 32
fieldset/Apllsscg1:
  description: APLL Spread Spectrum Control 1 Register.
  fields:
  - name: ss_mdiv_msb
    description: SS_MDIV[32].
    bit_offset: 0
    bit_size: 1
  - name: ss_mdiv_req
    description: SS_MDIV[32:0] change request.
    bit_offset: 1
    bit_size: 1
  - name: mf
    description: Modulation Frequency Control.
    bit_offset: 2
    bit_size: 3
  - name: mr
    description: Modulation Depth Control.
    bit_offset: 5
    bit_size: 3
  - name: mc
    description: Modulation Waveform Control.
    bit_offset: 8
    bit_size: 2
    enum: Apllsscg1Mc
  - name: dither
    description: Dither Enable.
    bit_offset: 10
    bit_size: 1
  - name: sel_ss_mdiv
    description: SS_MDIV select.
    bit_offset: 11
    bit_size: 1
  - name: ss_pd
    description: SSCG Power Down.
    bit_offset: 31
    bit_size: 1
fieldset/Apllsscgstat:
  description: APLL SSCG Status Register.
  fields:
  - name: ss_mdiv_ack
    description: SS_MDIV change acknowledge.
    bit_offset: 0
    bit_size: 1
fieldset/Apllstat:
  only_in: '^MCXA(286|287|456|457|536|537|556|557|566|567|577)$'
  description: APLL Status Register.
  fields:
  - name: lock
    description: Lock detector output (active high).
    bit_offset: 0
    bit_size: 1
  - name: ndivack
    description: Predivider(N) ratio change acknowledge.
    bit_offset: 1
    bit_size: 1
  - name: mdivack
    description: Feedback(M) divider ratio change acknowledge.
    bit_offset: 2
    bit_size: 1
  - name: pdivack
    description: Postdivider(P) ratio change acknowledge.
    bit_offset: 3
    bit_size: 1
  - name: frmdet
    description: Free running detector (active high).
    bit_offset: 4
    bit_size: 1
fieldset/Aplltestctrl:
  only_in: '^MCXA(286|287|456|457|536|537|556|557|566|567|577)$'
  description: APLL Test Control Register.
  fields:
  - name: nfunctest
    description: Input to functional test the predivider (N-divider).
    bit_offset: 0
    bit_size: 7
  - name: mfunctest
    description: Input to functional test the feedback-divider (M-divider).
    bit_offset: 7
    bit_size: 15
  - name: pfunctest
    description: Input to functional test the postdivider (P-divider).
    bit_offset: 22
    bit_size: 4
  - name: testv_en
    description: Enable test mux.
    bit_offset: 26
    bit_size: 1
  - name: testv_sel
    description: Select analog signal channel that need to be test.
    bit_offset: 27
    bit_size: 3
    enum: AplltestctrlTestvSel
  - name: bypasspll
    description: Bypass PLL.
    bit_offset: 31
    bit_size: 1
fieldset/Apllteststat:
  only_in: '^MCXA(286|287|456|457|536|537|556|557|566|567|577)$'
  description: APLL Test Status Register.
  fields:
  - name: nmotest
    description: Output to observe the functional predivider test.
    bit_offset: 0
    bit_size: 2
  - name: mmotest
    description: Output to observe the functional feedback-divider test.
    bit_offset: 2
    bit_size: 2
  - name: pmotest
    description: Output to observe the functional postdivider test.
    bit_offset: 4
    bit_size: 2
  - name: pll_xfunc_test_pulse
    description: PLL functional divider test clock pulse.
    bit_offset: 29
    bit_size: 1
  - name: pll_xfunc_test_en
    description: Enable PLL functional divider test clock pulse.
    bit_offset: 30
    bit_size: 1
  - name: pll_xmo_test_en
    description: Enable to observe the xMOTEST flags.
    bit_offset: 31
    bit_size: 1
fieldset/Csr:
  description: Clock Status Register.
  fields:
  - name: scs
    description: System Clock Source.
    bit_offset: 24
    bit_size: 4
    enum: Scs
fieldset/Firccfg:
  description: FIRC Configuration Register.
  fields:
  - name: freq_sel
    description: Frequency Range.
    bit_offset: 1
    bit_size: 3
    enum: FreqSel
fieldset/Firccsr:
  description: FIRC Control Status Register.
  fields:
  - name: fircen
    description: FIRC Enable.
    bit_offset: 0
    bit_size: 1
  - name: fircsten
    description: "FIRC Stop Enable.\n\nRaw bit values: false (0) = DisabledInStopModes: FIRC is disabled in Deep Sleep mode.; true (1) = EnabledInStopModes: FIRC is enabled in Deep Sleep mode."
    bit_offset: 1
    bit_size: 1
  - name: firc_sclk_periph_en
    description: FIRC 48 MHz Clock to peripherals Enable.
    bit_offset: 4
    bit_size: 1
  - name: firc_fclk_periph_en
    description: FIRC 144 MHz Clock to peripherals Enable.
    bit_offset: 5
    bit_size: 1
  - name: firctren
    only_in: '^MCXA(286|287|456|457|536|537|556|557|566|567|577)$'
    description: FIRC 144 MHz Trim Enable (FIRCCFG[RANGE]=1).
    bit_offset: 8
    bit_size: 1
  - name: firctrup
    only_in: '^MCXA(286|287|456|457|536|537|556|557|566|567|577)$'
    description: FIRC Trim Update.
    bit_offset: 9
    bit_size: 1
  - name: trim_lock
    only_in: '^MCXA(286|287|456|457|536|537|556|557|566|567|577)$'
    description: "FIRC TRIM LOCK.\n\nRaw bit values: false (0) = FircNotLocked: FIRC auto trim not locked to target frequency range.; true (1) = FircLocked: FIRC auto trim locked to target frequency range."
    bit_offset: 10
    bit_size: 1
  - name: coarse_trim_bypass
    only_in: '^MCXA(286|287|456|457|536|537|556|557|566|567|577)$'
    description: Coarse Auto Trim Bypass.
    bit_offset: 11
    bit_size: 1
  - name: lk
    description: "Lock Register.\n\nRaw bit values: false (0) = WriteEnabled: Control Status Register can be written.; true (1) = WriteDisabled: Control Status Register cannot be written."
    bit_offset: 23
    bit_size: 1
  - name: fircvld
    description: "FIRC Valid status.\n\nRaw bit values: false (0) = NotEnabledOrNotValid: FIRC is not enabled or clock is not valid.; true (1) = EnabledAndValid: FIRC is enabled and output clock is valid. The clock is valid after there is an output clock from the FIRC analog."
    bit_offset: 24
    bit_size: 1
  - name: fircsel
    description: FIRC Selected.
    bit_offset: 25
    bit_size: 1
  - name: fircerr
    description: "FIRC Clock Error.\n\nRaw bit values: false (0) = ErrorNotDetected: Error not detected with the FIRC trimming.; true (1) = ErrorDetected: Error detected with the FIRC trimming."
    bit_offset: 26
    bit_size: 1
  - name: fircerr_ie
    description: "FIRC Clock Error Interrupt Enable.\n\nRaw bit values: false (0) = ErrorNotDetected: FIRCERR interrupt is not enabled.; true (1) = ErrorDetected: FIRCERR interrupt is enabled."
    bit_offset: 27
    bit_size: 1
  - name: fircacc_ie
    description: "FIRC Accurate Interrupt Enable.\n\nRaw bit values: false (0) = Fircaccnot: FIRCACC interrupt is not enabled.; true (1) = Fircaccyes: FIRCACC interrupt is enabled."
    bit_offset: 30
    bit_size: 1
  - name: fircacc
    description: "FIRC Frequency Accurate.\n\nRaw bit values: false (0) = NotEnabledOrNotValid: FIRC is not enabled or clock is not accurate.; true (1) = EnabledAndValid: FIRC is enabled and output clock is accurate. The clock is accurate after 4096 clock cycles of 144 MHz (RANGE=1) or 1365 clock cycles of 48 MHz(RANGE=0) from the FIRC analog."
    bit_offset: 31
    bit_size: 1
fieldset/Fircstat:
  only_in: '^MCXA(286|287|456|457|536|537|556|557|566|567|577)$'
  description: FIRC Auto-trimming Status Register.
  fields:
  - name: trimfine
    description: Trim Fine.
    bit_offset: 0
    bit_size: 8
  - name: trimcoar
    description: Trim Coarse.
    bit_offset: 8
    bit_size: 6
fieldset/Firctcfg:
  only_in: '^MCXA(286|287|456|457|536|537|556|557|566|567|577)$'
  description: FIRC Trim Configuration Register.
  fields:
  - name: trimsrc
    description: Trim Source.
    bit_offset: 0
    bit_size: 2
    enum: FirctcfgTrimsrc
  - name: trimdiv
    description: FIRC Trim Predivider.
    bit_offset: 16
    bit_size: 7
fieldset/Firctest:
  only_in: '^MCXA(286|287|456|457|536|537|556|557|566|567|577)$'
  description: FIRC Test Register.
  fields:
  - name: testen
    description: "Test Enable.\n\nRaw bit values: false (0) = FircTestDis: FIRC test is disabled.; true (1) = FircTestEn: FIRC test is enabled."
    bit_offset: 0
    bit_size: 1
  - name: testsel
    description: Test Select.
    bit_offset: 3
    bit_size: 2
    enum: Testsel
  - name: overstress
    description: "Over Stress Test.\n\nRaw bit values: false (0) = OverstressDis: Over stress test is disabled.; true (1) = OverstressEn: Over stress test is enabled."
    bit_offset: 5
    bit_size: 1
  - name: test_buf_en
    description: "Test Buffer Enable.\n\nRaw bit values: false (0) = TestBufEnDis: Test buffer is disabled.; true (1) = TestBufEnEn: Test buffer is enabled."
    bit_offset: 6
    bit_size: 1
  - name: test_buf_flip
    description: "Test Buffer Flip.\n\nRaw bit values: false (0) = TestBufFlipDis: Input of the buffer is not flipped.; true (1) = TestBufFlipEn: Input of the buffer is flipped."
    bit_offset: 7
    bit_size: 1
  - name: clk_valid
    description: "Analog output clk_valid_lv.\n\nRaw bit values: false (0) = ClkValid0: clk_valid_lv is not set.; true (1) = ClkValid1: clk_valid_lv is set."
    bit_offset: 16
    bit_size: 1
  - name: start_valid
    description: "Analog output start_valid_lv.\n\nRaw bit values: false (0) = StartValid0: start_valid_lv is not set.; true (1) = StartValid1: start_valid_lv is set."
    bit_offset: 17
    bit_size: 1
fieldset/Firctrim:
  description: FIRC Trim Register.
  fields:
  - name: trimfine
    description: Trim Fine.
    bit_offset: 0
    bit_size: 8
  - name: trimcoar
    description: Trim Coarse.
    bit_offset: 8
    bit_size: 6
  - name: trimtemp
    only_in: '^MCXA(286|287|456|457|536|537|556|557|566|567|577)$'
    description: Trim Temperature.
    bit_offset: 16
    bit_size: 2
  - name: trimtemp
    only_in: '^MCXA(175|176|185|186|255|256|265|266|345|346|355|356|365|366)$'
    description: Trim Temperature.
    bit_offset: 16
    bit_size: 4
  - name: trimstart
    description: Trim Start.
    bit_offset: 24
    bit_size: 6
fieldset/Ldocsr:
  description: LDO Control and Status Register.
  fields:
  - name: ldoen
    description: LDO Enable.
    bit_offset: 0
    bit_size: 1
  - name: vout_sel
    description: LDO output voltage select.
    bit_offset: 1
