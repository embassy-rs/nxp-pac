    bit_size: 1
  - name: locknsmpu
    description: "Control write access to Nonsecure MPU memory regions.\n\nRaw bit values: false (0) = Enable: Unlock these registers. privileged access to Nonsecure MPU memory regions is allowed.; true (1) = Disable: Disable writes to the MPU_CTRL_NS, MPU_RNR_NS, MPU_RBAR_NS, MPU_RLAR_NS, MPU_RBAR_A_NSn and MPU_RLAR_A_NSn. All writes to the registers are ignored."
