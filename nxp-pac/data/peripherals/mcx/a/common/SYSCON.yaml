    bit_offset: 10
    bit_size: 1
  - name: dis_mbecc_err_inst
    description: "Bus error on data multi-bit ECC error control Set this field to 0 if you want to enable flash speculative.\n\nRaw bit values: false (0) = Enable: Enables bus error on multi-bit ECC error for instruction.; true (1) = Disable: Disables bus error on multi-bit ECC error for instruction."
