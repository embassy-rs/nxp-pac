fieldset/BusclkdivA17:
  reset_value: 1
  fields:
  - name: div
    description: Clock divider value.
    bit_offset: 0
    bit_size: 8
  - name: reset
    description: "Resets the divider counter.\n\nRaw bit values: false (0) = Released: Divider is not reset.; true (1) = Asserted: Divider is reset."
    bit_offset: 29
    bit_size: 1
  - name: halt
    description: "Halts the divider counter.\n\nRaw bit values: false (0) = Run: Divider clock is running.; true (1) = Halt: Divider clock is stopped."
    bit_offset: 30
    bit_size: 1
  - name: unstab
    description: "Divider status flag.\n\nRaw bit values: false (0) = Stable: Divider clock is stable.; true (1) = Ongoing: Clock frequency is not stable."
    bit_offset: 31
    bit_size: 1
  only_in: ^(MCXA(173|174|343|344|345|346|355|356|365|366))$
fieldset/Clkunlock:
  fields:
  - name: unlock
    description: "Controls clock configuration registers access (for example, SLOWCLKDIV, BUSCLKDIV, AHBCLKDIV, FROHFDIV, FROLFDIV, PLLxCLKDIV, MRCC_xxx_CLKDIV, MRCC_xxx_CLKSEL, MRCC_GLB_xxx).\n\nRaw bit values: false (0) = Enable: Updates are allowed to all clock configuration registers.; true (1) = Freeze: Freezes all clock configuration registers update."
    bit_offset: 0
    bit_size: 1
  only_in: ^(MCXA(173|174|175|176|185|186|255|256|265|266|286|287|343|344|345|346|355|356|365|366|456|457|536|537|556|557|566|567|577))$
