    description: Write to set End-of-computation status flag (PKC_INT_STATUS[INT_PDONE]=1) to trigger a PKC interrupt via software, e.
    bit_offset: 0
    bit_size: 1
  bit_size: 32
  reset_value: 0
fieldset/PkcIntStatus:
  description: Interrupt status.
  fields:
  - name: int_pdone
    description: End-of-computation status flag.
    bit_offset: 0
    bit_size: 1
  bit_size: 32
  reset_value: 0
