# Shared documented fields: MCXAP144M240F61SRM Rev. 2, section 16.6; MCXAP172M240F70RM Rev. 1, section 71.6.
# Family-specific blocks expose only their documented register maps.
block/PkcShared:
  description: Public-key coprocessor raw register interface. Invalid or unimplemented accesses raise a security alert and reset PKC; system response can include a global reset. No accesses are performed automatically.
  items:
  - name: pkc_status
    description: Status Register.
    byte_offset: 0
    access: Read
    fieldset: PkcStatus
  - name: pkc_ctrl
    description: PKC control. RESET must already have been cleared in an earlier write and observed cleared before a GO write; clearing RESET and setting GO in the same write raises a security alarm. Set only one GO bit with GOANY=0. After changing RESET or STOP, poll that bit until the new value is read back. STOP must already be disabled before changing RESET; do not enable STOP while changing RESET. This reset controls the PKC kernel, not device lifecycle.
    byte_offset: 4
    fieldset: PkcCtrl
  - name: pkc_cfg
    description: Configuration. May be written only with PKC_CTRL.RESET=1; otherwise a security alarm is triggered. The documented noise/randomization/idle features are unavailable in this IP version.
    byte_offset: 8
    fieldset: PkcCfg
  - name: pkc_mode1
    description: Mode register, parameter set 1.
    byte_offset: 16
    fieldset: PkcMode1
  - name: pkc_xyptr1
    description: X+Y pointer register, parameter set 1.
    byte_offset: 20
    fieldset: PkcXyptr1
  - name: pkc_zrptr1
    description: Z+R pointer register, parameter set 1.
    byte_offset: 24
    fieldset: PkcZrptr1
  - name: pkc_len1
    description: Length register, parameter set 1.
    byte_offset: 28
    fieldset: PkcLen1
  - name: pkc_mode2
    description: Mode register, parameter set 2.
    byte_offset: 32
    fieldset: PkcMode2
  - name: pkc_xyptr2
    description: X+Y pointer register, parameter set 2.
    byte_offset: 36
    fieldset: PkcXyptr2
  - name: pkc_zrptr2
    description: Z+R pointer register, parameter set 2.
    byte_offset: 40
    fieldset: PkcZrptr2
  - name: pkc_len2
    description: Length register, parameter set 2.
    byte_offset: 44
    fieldset: PkcLen2
  - name: pkc_uptr
    description: Universal pointer FUP program. Do not update while GOANY=1 during an L2 calculation; hardware does not prevent this and the result can be corrupted or a security alarm raised.
    byte_offset: 64
    fieldset: PkcUptr
  - name: pkc_uptrt
    description: Universal pointer FUP table. Do not update while GOANY=1 during an L2 calculation; hardware does not prevent this and the result can be corrupted or a security alarm raised.
    byte_offset: 68
    fieldset: PkcUptrt
  - name: pkc_ulen
    description: Universal pointer length. Do not update while GOANY=1 during an L2 calculation; hardware does not prevent this and the result can be corrupted or a security alarm raised.
    byte_offset: 72
    fieldset: PkcUlen
  - name: pkc_soft_rst
    description: Software reset.
    byte_offset: 4016
    access: Write
    fieldset: PkcSoftRst
  - name: pkc_access_err
    description: Read-only error status. Unimplemented SFR accesses set APB_NOTAV and raise a security alert; do not probe undefined offsets.
    byte_offset: 4032
    access: Read
    fieldset: PkcAccessErr
  - name: pkc_access_err_clr
    description: Clear Access Error.
    byte_offset: 4036
    access: Write
    fieldset: PkcAccessErrClr
  - name: pkc_int_clr_enable
    description: Interrupt enable clear.
    byte_offset: 4056
    access: Write
    fieldset: PkcIntClrEnable
  - name: pkc_int_set_enable
    description: Interrupt enable set.
    byte_offset: 4060
    access: Write
    fieldset: PkcIntSetEnable
  - name: pkc_int_status
    description: Interrupt status.
    byte_offset: 4064
    access: Read
    fieldset: PkcIntStatus
  - name: pkc_int_enable
    description: Interrupt enable.
    byte_offset: 4068
    access: Read
    fieldset: PkcIntEnable
  - name: pkc_int_clr_status
    description: Interrupt status clear.
    byte_offset: 4072
    access: Write
    fieldset: PkcIntClrStatus
  - name: pkc_int_set_status
    description: Interrupt status set.
    byte_offset: 4076
    access: Write
    fieldset: PkcIntSetStatus
fieldset/PkcAccessErr:
  description: Access Error.
  fields:
  - name: apb_notav
    description: An unimplemented SFR was accessed. Such accesses raise a security alert and reset PKC, not merely return an unused value.
    bit_offset: 0
    bit_size: 1
  - name: apb_wrgmd
    description: Wrong access mode, including writing read-only SFRs. Raises a security alert.
    bit_offset: 1
    bit_size: 1
  - name: apb_master
    description: APB Master that triggered first APB error (APB_WRGMD or APB_NOTAV) This bit field always reads 0.
    bit_offset: 4
    bit_size: 4
  - name: ahb
    description: AHB Error.
    bit_offset: 10
    bit_size: 1
  - name: pkcc
    description: Error in PKC coprocessor kernel.
    bit_offset: 16
    bit_size: 1
  - name: fdet
    description: Error due to error detection circuitry.
    bit_offset: 17
    bit_size: 1
  - name: ctrl
    description: Error in PKC software control.
    bit_offset: 18
    bit_size: 1
  - name: ucrc
    description: Error in layer2 CRC check.
    bit_offset: 19
    bit_size: 1
  bit_size: 32
  reset_value: 0
fieldset/PkcAccessErrClr:
  description: Clear Access Error.
  fields:
  - name: err_clr
    description: Write 1 to reset PKC_ACCESS_ERR SFR.
    bit_offset: 0
    bit_size: 1
  bit_size: 32
  reset_value: 0
fieldset/PkcCfg:
  description: Configuration register.
  fields:
  - name: idleop
    description: Idle operation feature not available in this version (flag is don't care).
    bit_offset: 0
    bit_size: 1
  - name: clkrnd
    description: Clock randomization feature not available in this version (flag is don't care).
    bit_offset: 3
    bit_size: 1
  - name: redmulnoise
    description: Noise in reduced multiplier mode feature not available in this version (flag is don't care).
    bit_offset: 4
    bit_size: 1
  - name: rnddly
    description: Random delay feature not available in this version (flag is don't care).
    bit_offset: 5
    bit_size: 3
  - name: sbxnoise
    description: Noise feature not available in this version (flag is don't care).
    bit_offset: 8
    bit_size: 1
  - name: alpnoise
    description: Noise feature not available in this version (flag is don't care).
    bit_offset: 9
    bit_size: 1
  - name: fmulnoise
    description: Noise feature not available in this version (flag is don't care).
    bit_offset: 10
    bit_size: 1
  bit_size: 32
  reset_value: 1817
fieldset/PkcCtrl:
  description: PKC control. Clear RESET in an earlier write and poll it cleared before setting GO. Poll RESET/STOP after modifications; STOP must already be disabled before changing RESET. Invalid combinations trigger security alarms.
  fields:
  - name: reset
    description: PKC kernel reset, not device lifecycle. STOP must already be disabled before changing RESET. Poll RESET until the new value is observed. Clear RESET in a separate earlier write before setting any GO bit.
    bit_offset: 0
    bit_size: 1
  - name: stop
    description: Freeze the calculation. Poll STOP after changes until the new value is read back. Disable STOP and observe it disabled before changing RESET.
    bit_offset: 1
    bit_size: 1
  - name: god1
    description: Control bit to start direct operation using parameter set 1. RESET must already have been cleared in an earlier write and observed cleared; GOANY must be zero and only one GO bit may be set.
    bit_offset: 2
    bit_size: 1
  - name: god2
    description: Control bit to start direct operation using parameter set 2. RESET must already have been cleared in an earlier write and observed cleared; GOANY must be zero and only one GO bit may be set.
    bit_offset: 3
    bit_size: 1
  - name: gom1
    description: Control bit to start MC pattern using parameter set 1. RESET must already have been cleared in an earlier write and observed cleared; GOANY must be zero and only one GO bit may be set.
    bit_offset: 4
    bit_size: 1
  - name: gom2
    description: Control bit to start MC pattern using parameter set 2. RESET must already have been cleared in an earlier write and observed cleared; GOANY must be zero and only one GO bit may be set.
    bit_offset: 5
    bit_size: 1
  - name: gou
    description: Control bit to start pipe operation. RESET must already have been cleared in an earlier write and observed cleared; GOANY must be zero and only one GO bit may be set. Requires nonzero ULEN and valid UPTR/UPTRT addresses.
    bit_offset: 6
    bit_size: 1
  - name: gf2conv
    description: Convert to GF2 calculation modes.
    bit_offset: 7
    bit_size: 1
  - name: clrcache
    description: Clear universal pointer cache.
    bit_offset: 8
    bit_size: 1
  - name: cache_en
    description: Enable universal pointer cache.
    bit_offset: 9
    bit_size: 1
  - name: redmul
    description: Reduced multiplier mode.
    bit_offset: 10
    bit_size: 2
    enum: Redmul
  bit_size: 32
  reset_value: 1
fieldset/PkcIntClrEnable:
  description: Interrupt enable clear.
  fields:
  - name: en_pdone
    description: Write to clear PDONE interrupt enable flag (PKC_INT_ENABLE[EN_PDONE]=0).
