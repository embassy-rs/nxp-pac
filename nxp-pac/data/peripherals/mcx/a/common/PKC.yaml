fieldset/PkcSoftRst:
  description: Software reset.
  fields:
  - name: soft_rst
    description: Write 1 to reset module (0 has no effect).
    bit_offset: 0
    bit_size: 1
  bit_size: 32
  reset_value: 0
fieldset/PkcStatus:
  description: Status Register.
  fields:
  - name: activ
    description: PKC ACTIV.
    bit_offset: 0
    bit_size: 1
  - name: carry
    description: Carry overflow flag.
    bit_offset: 1
    bit_size: 1
  - name: zero
    description: Zero result flag.
    bit_offset: 2
    bit_size: 1
  - name: goany
    description: Combined GO status. For L2 operation, clears at the start of the final calculation, not its completion; ACTIV clears after the final calculation completes.
    bit_offset: 3
    bit_size: 1
  - name: locked
    description: Parameter set locked.
    bit_offset: 5
    bit_size: 2
  bit_size: 32
  reset_value: 0
fieldset/PkcUlen:
  description: Universal pointer length. Do not update while GOANY=1 during an L2 calculation. Hardware does not reject all such updates; they may corrupt the result or raise a security alarm. Hardware decrements ULEN for each processed FUP entry. Reaching zero clears GOANY at the start of the final calculation; completion is indicated by ACTIV clearing.
  fields:
  - name: len
    description: Length of universal pointer calculation. Do not update while GOANY=1 during an L2 calculation. Hardware does not reject all such updates; they may corrupt the result or raise a security alarm. Hardware decrements ULEN for each processed FUP entry. Reaching zero clears GOANY at the start of the final calculation; completion is indicated by ACTIV clearing.
    bit_offset: 0
    bit_size: 8
  bit_size: 32
  reset_value: 0
fieldset/PkcUptr:
  description: Universal pointer FUP program. Do not update while GOANY=1 during an L2 calculation. Hardware does not reject all such updates; they may corrupt the result or raise a security alarm. Hardware increments UPTR by six for each processed FUP program entry.
  fields:
  - name: ptr
    description: Pointer to start address of PKC FUP program. Do not update while GOANY=1 during an L2 calculation. Hardware does not reject all such updates; they may corrupt the result or raise a security alarm. Hardware increments UPTR by six for each processed FUP program entry.
    bit_offset: 0
    bit_size: 32
  bit_size: 32
  reset_value: 0
fieldset/PkcUptrt:
  description: Universal pointer FUP table. Do not update while GOANY=1 during an L2 calculation. Hardware does not reject all such updates; they may corrupt the result or raise a security alarm. UPTRT is not automatically updated by hardware.
  fields:
  - name: ptr
    description: Pointer to start address of PKC FUP table. Do not update while GOANY=1 during an L2 calculation. Hardware does not reject all such updates; they may corrupt the result or raise a security alarm. UPTRT is not automatically updated by hardware.
    bit_offset: 0
    bit_size: 32
  bit_size: 32
  reset_value: 0
