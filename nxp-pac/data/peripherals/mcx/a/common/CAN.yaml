    bit_offset: 17
    bit_size: 1
  - name: doze
    description: "Doze Mode Enable.\n\nRaw bit values: false (0) = LowPowerDozeDisabled: Disable.; true (1) = LowPowerDozeEnabled: Enable."
    bit_offset: 18
    bit_size: 1
  - name: waksrc
    description: Wake-Up Source.
    bit_offset: 19
    bit_size: 1
  - name: lpmack
    description: "Low-Power Mode Acknowledge.\n\nRaw bit values: false (0) = LowPowerNo: Not in a low-power mode.; true (1) = LowPowerYes: In a low-power mode."
    bit_offset: 20
    bit_size: 1
  - name: wrnen
    description: "Warning Interrupt Enable.\n\nRaw bit values: false (0) = TwrnintRwrnintInactive: Disable.; true (1) = TwrnintRwrnintActive: Enable."
    bit_offset: 21
    bit_size: 1
  - name: slfwak
