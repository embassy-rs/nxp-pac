    bit_offset: 22
    bit_size: 1
  - name: supv
    description: "Supervisor Mode.\n\nRaw bit values: false (0) = Id1: User mode.; true (1) = Id2: Supervisor mode."
    bit_offset: 23
    bit_size: 1
  - name: frzack
