
includes:
  - ../../common/CAN-fields.yaml
block/Can:
  description: CAN.
  items:
  - name: mcr
    description: Module Configuration.
    byte_offset: 0
    fieldset: Mcr
  - name: ctrl1
    description: Control 1.
    byte_offset: 4
    fieldset: Ctrl1
  - name: timer
    description: Free-Running Timer.
    byte_offset: 8
    fieldset: Timer
  - name: rxmgmask
    description: RX Message Buffers Global Mask.
    byte_offset: 16
    fieldset: Rxmgmask
  - name: rx14mask
    description: Receive 14 Mask.
    byte_offset: 20
    fieldset: Rx14mask
  - name: rx15mask
    description: Receive 15 Mask.
    byte_offset: 24
    fieldset: Rx15mask
  - name: ecr
    description: Error Counter.
    byte_offset: 28
    fieldset: Ecr
  - name: esr1
    description: Error and Status 1.
    byte_offset: 32
    fieldset: Esr1
  - name: imask1
    description: Interrupt Masks 1.
    byte_offset: 40
    fieldset: Imask1
  - name: iflag1
    description: Interrupt Flags 1.
    byte_offset: 48
    fieldset: Iflag1
  - name: ctrl2
    description: Control 2.
    byte_offset: 52
    fieldset: Ctrl2
  - name: esr2
    description: Error and Status 2.
    byte_offset: 56
    access: Read
    fieldset: Esr2
  - name: crcr
    description: Cyclic Redundancy Check.
    byte_offset: 68
    access: Read
    fieldset: Crcr
  - name: rxfgmask
    description: Legacy RX FIFO Global Mask.
    byte_offset: 72
    fieldset: Rxfgmask
  - name: rxfir
