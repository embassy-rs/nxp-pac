    array:
      len: 32
      stride: 16
    byte_offset: 128
    fieldset: MbbCs
  - name: mb_16b_cs
    description: Message Buffer 0 CS Register.
    array:
      len: 21
      stride: 24
    byte_offset: 128
    fieldset: MbbCs
  - name: mb_32b_cs
    description: Message Buffer 0 CS Register.
    array:
      len: 12
      stride: 40
    byte_offset: 128
    fieldset: MbbCs
  - name: mb_64b_cs
    description: Message Buffer 0 CS Register.
    array:
      len: 7
      stride: 72
    byte_offset: 128
    fieldset: MbbCs
  - name: mb_8b_cs
    description: Message Buffer 0 CS Register.
    array:
      len: 32
      stride: 16
    byte_offset: 128
    fieldset: MbbCs
  - name: id
    description: Message Buffer 0 ID Register.
    array:
      len: 32
      stride: 16
    byte_offset: 132
    fieldset: MbbId
  - name: mb_16b_id
    description: Message Buffer 0 ID Register.
    array:
      len: 21
      stride: 24
    byte_offset: 132
    fieldset: MbbId
  - name: mb_32b_id
    description: Message Buffer 0 ID Register.
    array:
      len: 12
      stride: 40
    byte_offset: 132
    fieldset: MbbId
  - name: mb_64b_id
    description: Message Buffer 0 ID Register.
    array:
      len: 7
      stride: 72
    byte_offset: 132
    fieldset: MbbId
  - name: mb_8b_id
    description: Message Buffer 0 ID Register.
    array:
      len: 32
      stride: 16
    byte_offset: 132
    fieldset: MbbId
  - name: word0
    description: Message Buffer 0 WORD0 Register.
    array:
      len: 32
      stride: 16
    byte_offset: 136
  - name: word1
    description: Message Buffer 0 WORD1 Register.
    array:
      len: 32
      stride: 16
    byte_offset: 140
  - name: rximr
    description: Receive Individual Mask.
    array:
      len: 32
      stride: 4
    byte_offset: 2176
    fieldset: Rximr
  - name: ctrl1_pn
    description: Pretended Networking Control 1.
    byte_offset: 2816
    fieldset: Ctrl1Pn
  - name: ctrl2_pn
    description: Pretended Networking Control 2.
    byte_offset: 2820
    fieldset: Ctrl2Pn
  - name: wu_mtc
    description: Pretended Networking Wake-Up Match.
    byte_offset: 2824
    fieldset: WuMtc
  - name: flt_id1
    description: Pretended Networking ID Filter 1.
    byte_offset: 2828
    fieldset: FltId1
  - name: flt_dlc
    description: Pretended Networking Data Length Code (DLC) Filter.
    byte_offset: 2832
    fieldset: FltDlc
  - name: pl1_lo
    description: Pretended Networking Payload Low Filter 1.
    byte_offset: 2836
    fieldset: Pl1Lo
  - name: pl1_hi
    description: Pretended Networking Payload High Filter 1.
    byte_offset: 2840
    fieldset: Pl1Hi
  - name: flt_id2_idmask
    description: Pretended Networking ID Filter 2 or ID Mask.
    byte_offset: 2844
    fieldset: FltId2Idmask
  - name: pl2_plmask_lo
    description: Pretended Networking Payload Low Filter 2 and Payload Low Mask.
    byte_offset: 2848
    fieldset: WmbD03
  - name: pl2_plmask_hi
    description: Pretended Networking Payload High Filter 2 and Payload High Mask.
    byte_offset: 2852
    fieldset: WmbD47
  - name: wmb
    description: 'Array of registers: WMB_CS, WMB_D03, WMB_D47, WMB_ID.'
    array:
      len: 4
      stride: 16
    byte_offset: 2880
    block: Wmb
  - name: eprs
    description: Enhanced CAN Bit Timing Prescalers.
    byte_offset: 3056
    fieldset: Eprs
  - name: encbt
    description: Enhanced Nominal CAN Bit Timing.
    byte_offset: 3060
    fieldset: Encbt
  - name: edcbt
    description: Enhanced Data Phase CAN Bit Timing.
    byte_offset: 3064
    fieldset: Edcbt
  - name: etdc
    description: Enhanced Transceiver Delay Compensation.
    byte_offset: 3068
    fieldset: Etdc
  - name: fdctrl
    description: CAN FD Control.
    byte_offset: 3072
    fieldset: Fdctrl
  - name: fdcbt
    description: CAN FD Bit Timing.
    byte_offset: 3076
    fieldset: Fdcbt
  - name: fdcrc
    description: CAN FD CRC.
    byte_offset: 3080
    access: Read
    fieldset: Fdcrc
  - name: erfcr
    description: Enhanced RX FIFO Control.
    byte_offset: 3084
    fieldset: Erfcr
  - name: erfier
    description: Enhanced RX FIFO Interrupt Enable.
    byte_offset: 3088
    fieldset: Erfier
  - name: erfsr
    description: Enhanced RX FIFO Status.
    byte_offset: 3092
    fieldset: Erfsr
  - name: erfifo_cs
    description: Enhanced RX FIFO output element CS field. Reads the CS word of the oldest element in the Enhanced RX FIFO.
    byte_offset: 8192
    access: Read
    fieldset: MbbCs
  - name: erfifo_id
    description: Enhanced RX FIFO output element ID field. Reads the ID word of the oldest element in the Enhanced RX FIFO.
    byte_offset: 8196
    access: Read
    fieldset: MbbId
  - name: erfifo_data
    description: Enhanced RX FIFO output element DATA words. Reads the payload of the oldest element in the Enhanced RX FIFO (up to 16 words / 64 bytes).
    array:
      len: 16
      stride: 4
    byte_offset: 8200
    access: Read
  - name: erffel
    description: Enhanced RX FIFO Filter Element.
    array:
      len: 32
      stride: 4
    byte_offset: 12288
    fieldset: Erffel
block/Wmb:
  description: 'Array of registers: WMB_CS, WMB_D03, WMB_D47, WMB_ID.'
  items:
  - name: wmb_cs
    description: Wake-Up Message Buffer.
    byte_offset: 0
    access: Read
    fieldset: WmbCs
  - name: wmb_id
    description: Wake-Up Message Buffer for ID.
    byte_offset: 4
    access: Read
    fieldset: WmbId
  - name: wmb_d03
    description: Wake-Up Message Buffer for Data 0-3.
    byte_offset: 8
    access: Read
    fieldset: WmbD03
  - name: wmb_d47
    description: Wake-Up Message Buffer Register Data 4-7.
    byte_offset: 12
    access: Read
    fieldset: WmbD47
fieldset/Cbt:
  description: CAN Bit Timing.
  fields:
  - name: epseg2
    description: Extended Phase Segment 2.
    bit_offset: 0
    bit_size: 5
  - name: epseg1
    description: Extended Phase Segment 1.
    bit_offset: 5
    bit_size: 5
  - name: epropseg
    description: Extended Propagation Segment.
    bit_offset: 10
    bit_size: 6
  - name: erjw
    description: Extended Resync Jump Width.
    bit_offset: 16
    bit_size: 5
  - name: epresdiv
    description: Extended Prescaler Division Factor.
    bit_offset: 21
    bit_size: 10
  - name: btf
    description: Bit Timing Format Enable.
    bit_offset: 31
    bit_size: 1
fieldset/Ctrl1Pn:
  description: Pretended Networking Control 1.
  fields:
  - name: fcs
    description: Filtering Combination Selection.
    bit_offset: 0
    bit_size: 2
    enum: Fcs
  - name: idfs
    description: ID Filtering Selection.
    bit_offset: 2
    bit_size: 2
    enum: Idfs
  - name: plfs
    description: Payload Filtering Selection.
    bit_offset: 4
    bit_size: 2
    enum: Plfs
  - name: nmatch
    description: Number of Messages Matching the Same Filtering Criteria.
    bit_offset: 8
    bit_size: 8
    enum: Nmatch
  - name: wumf_msk
    description: Wake-up by Matching Flag Mask.
    bit_offset: 16
    bit_size: 1
  - name: wtof_msk
    description: Wake-up by Timeout Flag Mask.
    bit_offset: 17
    bit_size: 1
fieldset/Ctrl2:
  description: Control 2.
  fields:
  - name: pes
    description: "Payload Byte and Bit Order Selection.\n\nRaw bit values: false (0) = BigEnd: Big-endian.; true (1) = LittleEnd: Little-endian."
    bit_offset: 0
    bit_size: 1
  - name: asd
    description: "ACK Suppression Disable.\n\nRaw bit values: false (0) = Enable: Enabled.; true (1) = Disable: Disabled."
    bit_offset: 1
    bit_size: 1
  - name: edfltdis
    description: "Edge Filter Disable.\n\nRaw bit values: false (0) = Enable: Enabled.; true (1) = Disable: Disabled."
    bit_offset: 11
    bit_size: 1
  - name: isocanfden
    description: "ISO CAN FD Enable.\n\nRaw bit values: false (0) = NonIso: Disable.; true (1) = Iso: Enable."
    bit_offset: 12
    bit_size: 1
  - name: bte
    description: Bit Timing Expansion Enable.
    bit_offset: 13
    bit_size: 1
  - name: prexcen
    description: Protocol Exception Enable.
    bit_offset: 14
    bit_size: 1
  - name: eacen
    description: "Entire Frame Arbitration Field Comparison Enable for RX Message Buffers.\n\nRaw bit values: false (0) = RtrCompareNo: Disable.; true (1) = RtrCompareYes: Enable."
    bit_offset: 16
    bit_size: 1
  - name: rrs
    description: "Remote Request Storing.\n\nRaw bit values: false (0) = RemoteResponseFrameNotGenerated: Generated.; true (1) = RemoteResponseFrameGenerated: Stored."
    bit_offset: 17
    bit_size: 1
  - name: mrp
    description: "Message Buffers Reception Priority.\n\nRaw bit values: false (0) = Id1: Matching starts from Legacy RX FIFO or Enhanced RX FIFO and continues on message buffers.; true (1) = Id3: Matching starts from message buffers and continues on Legacy RX FIFO or Enhanced RX FIFO."
    bit_offset: 18
    bit_size: 1
  - name: tasd
    description: Transmission Arbitration Start Delay.
    bit_offset: 19
    bit_size: 5
  - name: rffn
    description: Number of Legacy Receive FIFO Filters.
    bit_offset: 24
    bit_size: 4
  - name: boffdonemsk
    description: Bus Off Done Interrupt Mask.
    bit_offset: 30
    bit_size: 1
  - name: errmsk_fast
    description: Error Interrupt Mask for Errors Detected in the Data Phase of Fast CAN FD Frames.
    bit_offset: 31
    bit_size: 1
fieldset/Erfcr:
  description: Enhanced RX FIFO Control.
  fields:
  - name: erfwm
    description: Enhanced RX FIFO Watermark.
    bit_offset: 0
    bit_size: 5
  - name: nfe
    description: Number of Enhanced RX FIFO Filter Elements.
    bit_offset: 8
    bit_size: 6
  - name: nexif
    description: Number of Extended ID Filter Elements.
    bit_offset: 16
    bit_size: 7
  - name: dmalw
    description: DMA Last Word.
    bit_offset: 26
    bit_size: 5
  - name: erfen
    description: Enhanced RX FIFO enable.
    bit_offset: 31
    bit_size: 1
fieldset/Erfier:
  description: Enhanced RX FIFO Interrupt Enable.
  fields:
  - name: erfdaie
    description: Enhanced RX FIFO Data Available Interrupt Enable.
    bit_offset: 28
    bit_size: 1
  - name: erfwmiie
    description: Enhanced RX FIFO Watermark Indication Interrupt Enable.
    bit_offset: 29
    bit_size: 1
  - name: erfovfie
    description: Enhanced RX FIFO Overflow Interrupt Enable.
    bit_offset: 30
    bit_size: 1
  - name: erfufwie
    description: Enhanced RX FIFO Underflow Interrupt Enable.
    bit_offset: 31
    bit_size: 1
fieldset/Erfsr:
  description: Enhanced RX FIFO Status.
  fields:
  - name: erfel
    description: Enhanced RX FIFO Elements.
    bit_offset: 0
    bit_size: 6
  - name: erff
    description: Enhanced RX FIFO Full Flag.
    bit_offset: 16
    bit_size: 1
  - name: erfe
    description: Enhanced RX FIFO Empty Flag.
    bit_offset: 17
    bit_size: 1
  - name: erfclr
    description: "Enhanced RX FIFO Clear.\n\nRaw bit values: false (0) = NoEffect: No effect.; true (1) = Clear: Clear enhanced RX FIFO content."
    bit_offset: 27
    bit_size: 1
  - name: erfda
    description: Enhanced RX FIFO Data Available Flag.
    bit_offset: 28
    bit_size: 1
  - name: erfwmi
    description: "Enhanced RX FIFO Watermark Indication Flag.\n\nRaw bit values: false (0) = WatermarkNo: No such occurrence.; true (1) = WatermarkYes: Number of messages in FIFO is greater than the watermark."
    bit_offset: 29
    bit_size: 1
  - name: erfovf
    description: Enhanced RX FIFO Overflow Flag.
    bit_offset: 30
    bit_size: 1
  - name: erfufw
    description: Enhanced RX FIFO Underflow Flag.
    bit_offset: 31
    bit_size: 1
fieldset/Esr1:
  description: Error and Status 1.
  fields:
  - name: wakint
    description: Wake-up Interrupt Flag.
    bit_offset: 0
    bit_size: 1
  - name: errint
    description: Error Interrupt Flag.
    bit_offset: 1
    bit_size: 1
  - name: boffint
    description: Bus Off Interrupt Flag.
    bit_offset: 2
    bit_size: 1
  - name: rx
    description: FlexCAN in Reception Flag.
    bit_offset: 3
    bit_size: 1
  - name: fltconf
    description: Fault Confinement State.
    bit_offset: 4
    bit_size: 2
    enum: Fltconf
  - name: tx
    description: "FlexCAN In Transmission.\n\nRaw bit values: false (0) = TransmitMessageNo: Not transmitting.; true (1) = TransmitMessageYes: Transmitting."
    bit_offset: 6
    bit_size: 1
  - name: idle
    description: "Idle.\n\nRaw bit values: false (0) = CanBusNotIdle: Not IDLE.; true (1) = CanBusIdle: IDLE."
    bit_offset: 7
    bit_size: 1
  - name: rxwrn
    description: "RX Error Warning Flag.\n\nRaw bit values: false (0) = RxerrcntLt96: No such occurrence.; true (1) = RxerrcntGte96: RXERRCNT is greater than or equal to 96."
    bit_offset: 8
    bit_size: 1
  - name: txwrn
    description: "TX Error Warning Flag.\n\nRaw bit values: false (0) = TxerrcntLt96: No such occurrence.; true (1) = TxerrcntGte96: TXERRCNT is 96 or greater."
    bit_offset: 9
    bit_size: 1
  - name: stferr
    description: "Stuffing Error Flag.\n\nRaw bit values: false (0) = StuffingErrorNo: No error.; true (1) = StuffingErrorYes: Error occurred since last read of this register."
    bit_offset: 10
    bit_size: 1
  - name: frmerr
    description: "Form Error Flag.\n\nRaw bit values: false (0) = FormErrorNo: No error.; true (1) = FormErrorYes: Error occurred since last read of this register."
    bit_offset: 11
    bit_size: 1
  - name: crcerr
    description: "Cyclic Redundancy Check Error Flag.\n\nRaw bit values: false (0) = CrcErrorNo: No error.; true (1) = CrcErrorYes: Error occurred since last read of this register."
    bit_offset: 12
    bit_size: 1
  - name: ackerr
    description: "Acknowledge Error Flag.\n\nRaw bit values: false (0) = AckErrorNo: No error.; true (1) = AckErrorYes: Error occurred since last read of this register."
    bit_offset: 13
    bit_size: 1
  - name: bit0err
    description: "Bit0 Error Flag.\n\nRaw bit values: false (0) = Bit0ErrorNo: No such occurrence.; true (1) = Bit0ErrorYes: At least one bit sent as dominant is received as recessive."
    bit_offset: 14
    bit_size: 1
  - name: bit1err
    description: "Bit1 Error Flag.\n\nRaw bit values: false (0) = Bit1ErrorNo: No such occurrence.; true (1) = Bit1ErrorYes: At least one bit sent as recessive is received as dominant."
    bit_offset: 15
    bit_size: 1
  - name: rwrnint
    description: "RX Warning Interrupt Flag.\n\nRaw bit values: false (0) = RxWarningIntNo: No such occurrence.; true (1) = RxWarningIntYes: RX error counter changed from less than 96 to greater than or equal to 96."
    bit_offset: 16
    bit_size: 1
  - name: twrnint
    description: "TX Warning Interrupt Flag.\n\nRaw bit values: false (0) = TxWarningIntNo: No such occurrence.; true (1) = TxWarningIntYes: TX error counter changed from less than 96 to greater than or equal to 96."
    bit_offset: 17
    bit_size: 1
  - name: synch
    description: "CAN Synchronization Status Flag.\n\nRaw bit values: false (0) = CanBusSyncNo: Not synchronized.; true (1) = CanBusSyncYes: Synchronized."
    bit_offset: 18
    bit_size: 1
  - name: boffdoneint
    description: "Bus Off Done Interrupt Flag.\n\nRaw bit values: false (0) = BusOffNotDone: No such occurrence.; true (1) = BusOffDone: FlexCAN module has completed Bus Off process."
    bit_offset: 19
    bit_size: 1
  - name: errint_fast
    description: "Fast Error Interrupt Flag.\n\nRaw bit values: false (0) = ErrorsDataPhaseNo: No such occurrence.; true (1) = ErrorsDataPhaseYes: Error flag set in the data phase of CAN FD frames that have BRS = 1."
    bit_offset: 20
    bit_size: 1
  - name: errovr
    description: "Error Overrun Flag.\n\nRaw bit values: false (0) = OverrunNotOccurred: No overrun.; true (1) = OverrunOccurred: Overrun."
    bit_offset: 21
    bit_size: 1
  - name: stferr_fast
    description: "Fast Stuffing Error Flag.\n\nRaw bit values: false (0) = StuffingErrorNo: No such occurrence.; true (1) = StuffingErrorYes: A stuffing error occurred since last read of this register."
    bit_offset: 26
    bit_size: 1
  - name: frmerr_fast
    description: "Fast Form Error Flag.\n\nRaw bit values: false (0) = FormErrorNo: No such occurrence.; true (1) = FormErrorYes: A form error occurred since last read of this register."
    bit_offset: 27
    bit_size: 1
  - name: crcerr_fast
    description: "Fast Cyclic Redundancy Check Error Flag.\n\nRaw bit values: false (0) = CrcErrorNo: No such occurrence.; true (1) = CrcErrorYes: A CRC error occurred since last read of this register."
    bit_offset: 28
    bit_size: 1
  - name: bit0err_fast
    description: "Fast Bit0 Error Flag.\n\nRaw bit values: false (0) = Bit0ErrorNo: No such occurrence.; true (1) = Bit0ErrorYes: At least one bit transmitted as dominant is received as recessive."
    bit_offset: 30
    bit_size: 1
  - name: bit1err_fast
    description: "Fast Bit1 Error Flag.\n\nRaw bit values: false (0) = Bit1ErrorNo: No such occurrence.; true (1) = Bit1ErrorYes: At least one bit transmitted as recessive is received as dominant."
    bit_offset: 31
    bit_size: 1
fieldset/Esr2:
  description: Error and Status 2.
  fields:
  - name: imb
    description: "Inactive Message Buffer.\n\nRaw bit values: false (0) = InactiveMailboxNo: Message buffer indicated by ESR2[LPTM] is not inactive.; true (1) = InactiveMailboxYes: At least one message buffer is inactive."
    bit_offset: 13
    bit_size: 1
  - name: vps
    description: Valid Priority Status.
    bit_offset: 14
    bit_size: 1
  - name: lptm
    description: Lowest Priority TX Message Buffer.
    bit_offset: 16
    bit_size: 7
fieldset/Etdc:
  description: Enhanced Transceiver Delay Compensation.
  fields:
  - name: etdcval
    description: Enhanced Transceiver Delay Compensation Value.
    bit_offset: 0
    bit_size: 8
  - name: etdcfail
    description: "Transceiver Delay Compensation Fail.\n\nRaw bit values: false (0) = InRange: In range.; true (1) = OutOfRange: Out of range."
    bit_offset: 15
    bit_size: 1
  - name: etdcoff
    description: Enhanced Transceiver Delay Compensation Offset.
    bit_offset: 16
    bit_size: 7
  - name: tdmdis
    description: "Transceiver Delay Measurement Disable.\n\nRaw bit values: false (0) = Enable: Enable.; true (1) = Disable: Disable."
    bit_offset: 30
    bit_size: 1
  - name: etdcen
    description: Transceiver Delay Compensation Enable.
    bit_offset: 31
    bit_size: 1
fieldset/Fdctrl:
  description: CAN FD Control.
  fields:
  - name: tdcval
    description: Transceiver Delay Compensation Value.
    bit_offset: 0
    bit_size: 6
  - name: tdcoff
    description: Transceiver Delay Compensation Offset.
    bit_offset: 8
    bit_size: 5
  - name: tdcfail
    description: "Transceiver Delay Compensation Fail.\n\nRaw bit values: false (0) = InRange: In range.; true (1) = OutOfRange: Out of range."
    bit_offset: 14
    bit_size: 1
  - name: tdcen
    description: Transceiver Delay Compensation Enable.
    bit_offset: 15
    bit_size: 1
  - name: mbdsr0
    description: Message Buffer Data Size for Region 0.
    bit_offset: 16
    bit_size: 2
    enum: Mbdsr0
  - name: fdrate
    description: "Bit Rate Switch Enable.\n\nRaw bit values: false (0) = Nominal: Disable.; true (1) = BitRateSwitching: Enable."
    bit_offset: 31
    bit_size: 1
fieldset/FltId1:
  description: Pretended Networking ID Filter 1.
  fields:
  - name: flt_id1
    description: ID Filter 1 for Pretended Networking filtering.
    bit_offset: 0
    bit_size: 29
  - name: flt_rtr
    description: "Remote Transmission Request Filter.\n\nRaw bit values: false (0) = Reject: Reject remote frame (accept data frame).; true (1) = Accept: Accept remote frame."
    bit_offset: 29
    bit_size: 1
  - name: flt_ide
    description: "ID Extended Filter.\n\nRaw bit values: false (0) = Standard: Standard.; true (1) = Extended: Extended."
    bit_offset: 30
    bit_size: 1
fieldset/Mcr:
  description: Module Configuration.
  fields:
  - name: maxmb
    description: Number of the Last Message Buffer.
    bit_offset: 0
    bit_size: 7
  - name: idam
    description: ID Acceptance Mode.
    bit_offset: 8
    bit_size: 2
    enum: Idam
  - name: fden
    description: "CAN FD Operation Enable.\n\nRaw bit values: false (0) = CanFdDisabled: Disable.; true (1) = CanFdEnabled: Enable."
    bit_offset: 11
    bit_size: 1
  - name: aen
    description: "Abort Enable.\n\nRaw bit values: false (0) = AbortDisabled: Disabled.; true (1) = AbortEnabled: Enabled."
    bit_offset: 12
    bit_size: 1
  - name: lprioen
    description: "Local Priority Enable.\n\nRaw bit values: false (0) = LocalPriorityDisabled: Disable.; true (1) = LocalPriorityEnabled: Enable."
    bit_offset: 13
    bit_size: 1
  - name: pnet_en
    description: "Pretended Networking Enable.\n\nRaw bit values: false (0) = PnDisabled: Disable.; true (1) = PnEnabled: Enable."
    bit_offset: 14
    bit_size: 1
  - name: dma
    description: "DMA Enable.\n\nRaw bit values: false (0) = Id1: Disable.; true (1) = Id2: Enable."
    bit_offset: 15
    bit_size: 1
  - name: irmq
    description: "Individual RX Masking and Queue Enable.\n\nRaw bit values: false (0) = IndividualRxMaskingDisabled: Disable.; true (1) = IndividualRxMaskingEnabled: Enable."
