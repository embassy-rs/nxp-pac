block/Freqme:
  description: FREQME.
  items:
  - name: ctrl_r
    description: Control (in Read mode).
    byte_offset: 0
    access: Read
    fieldset: CtrlR
  - name: ctrl_w
    description: Control (in Write mode).
    byte_offset: 0
    access: Write
    fieldset: CtrlW
  - name: ctrlstat
    description: Control Status.
    byte_offset: 4
    fieldset: Ctrlstat
  - name: min
    description: Minimum.
    byte_offset: 8
    fieldset: Min
  - name: max
    description: Maximum.
    byte_offset: 12
    fieldset: Max
fieldset/CtrlR:
  description: Control (in Read mode).
  fields:
  - name: result
    description: Indicates the measurement result-either the target clock counter value (for Frequency Measurement mode) or pulse width measurement (for Pulse Width Measurement mode).
    bit_offset: 0
    bit_size: 31
  - name: measure_in_progress
    description: "Measurement In Progress.\n\nRaw bit values: false (0) = CycleDone: Complete.; true (1) = InProgress: In progress."
    bit_offset: 31
    bit_size: 1
fieldset/CtrlW:
  description: Control (in Write mode).
  fields:
  - name: ref_scale
    description: Reference Clock Scaling Factor.
    bit_offset: 0
    bit_size: 5
  - name: pulse_mode
    description: "Pulse Width Measurement Mode Select.\n\nRaw bit values: false (0) = FreqMeMode: Frequency Measurement mode.; true (1) = PulseMeMode: Pulse Width Measurement mode."
    bit_offset: 8
    bit_size: 1
  - name: pulse_pol
    description: "Pulse Polarity.\n\nRaw bit values: false (0) = HighPeriod: High period.; true (1) = LowPeriod: Low period."
    bit_offset: 9
    bit_size: 1
  - name: lt_min_int_en
    description: Less Than Minimum Interrupt Enable.
    bit_offset: 12
    bit_size: 1
  - name: gt_max_int_en
    description: Greater Than Maximum Interrupt Enable.
    bit_offset: 13
    bit_size: 1
  - name: result_ready_int_en
    description: Result Ready Interrupt Enable.
    bit_offset: 14
    bit_size: 1
  - name: continuous_mode_en
    description: Continuous Mode Enable.
    bit_offset: 30
    bit_size: 1
  - name: measure_in_progress
    description: "Measurement In Progress.\n\nRaw bit values: false (0) = ForceTerminate: Terminates measurement.; true (1) = InitiateAFreqmeCycle: Initiates measurement."
    bit_offset: 31
    bit_size: 1
fieldset/Ctrlstat:
  description: Control Status.
  fields:
  - name: ref_scale
    description: Reference Scale.
    bit_offset: 0
    bit_size: 5
  - name: pulse_mode
    description: "Pulse Mode.\n\nRaw bit values: false (0) = Freq: Frequency Measurement mode.; true (1) = Pulse: Pulse Width Measurement mode."
    bit_offset: 8
    bit_size: 1
  - name: pulse_pol
    description: "Pulse Polarity.\n\nRaw bit values: false (0) = High: High period.; true (1) = Low: Low period."
    bit_offset: 9
    bit_size: 1
  - name: lt_min_int_en
    description: Less Than Minimum Interrupt Enable.
    bit_offset: 12
    bit_size: 1
  - name: gt_max_int_en
    description: Greater Than Maximum Interrupt Enable.
    bit_offset: 13
    bit_size: 1
  - name: result_ready_int_en
    description: Result Ready Interrupt Enable.
    bit_offset: 14
    bit_size: 1
  - name: lt_min_stat
    description: "Less Than Minimum Results Status.\n\nRaw bit values: false (0) = InRange: Greater than MIN[MIN_VALUE].; true (1) = LtMin: Less than MIN[MIN_VALUE]."
    bit_offset: 24
    bit_size: 1
  - name: gt_max_stat
    description: "Greater Than Maximum Result Status.\n\nRaw bit values: false (0) = InRange: Less than MAX[MAX_VALUE].; true (1) = GtMax: Greater than MAX[MAX_VALUE]."
    bit_offset: 25
    bit_size: 1
  - name: result_ready_stat
    description: Result Ready Status.
    bit_offset: 26
    bit_size: 1
  - name: continuous_mode_en
    description: Continuous Mode Enable Status.
    bit_offset: 30
    bit_size: 1
  - name: measure_in_progress
    description: "Measurement in Progress Status.\n\nRaw bit values: false (0) = Idle: Not in progress.; true (1) = Ongoing: In progress."
    bit_offset: 31
    bit_size: 1
fieldset/Max:
  description: Maximum.
  fields:
  - name: max_value
    description: Maximum Value.
    bit_offset: 0
    bit_size: 31
fieldset/Min:
  description: Minimum.
  fields:
  - name: min_value
    description: Minimum Value.
    bit_offset: 0
    bit_size: 31
