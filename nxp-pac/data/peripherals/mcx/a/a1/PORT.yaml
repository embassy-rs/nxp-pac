  description: Calibration 0.
  fields:
  - name: ncal
    description: Calibration of NMOS Output Driver.
    bit_offset: 0
    bit_size: 6
  - name: pcal
    description: Calibration of PMOS Output Driver.
    bit_offset: 16
    bit_size: 6
fieldset/Config:
  description: Configuration.
  fields:
  - name: range
    description: "Port Voltage Range.\n\nRaw bit values: false (0) = Range0: 1.71 V-3.6 V.; true (1) = Range1: 2.70 V-3.6 V."
    bit_offset: 0
    bit_size: 1
fieldset/Gpchr:
  description: Global Pin Control High.
  fields:
  - name: gpwd
    description: Global Pin Write Data.
    bit_offset: 0
    bit_size: 16
  - name: gpwe
    description: "Global Pin Write Enable.\n\nRaw bit values: false (0) = Gpwe0: Not updated.; true (1) = Gpwe1: Updated."
    bit_offset: 16
    bit_size: 1
    array:
      len: 16
      stride: 1
fieldset/Pcr:
  description: Pin Control 2.
  fields:
  - name: ps
    description: "Pull Select.\n\nRaw bit values: false (0) = Ps0: Enables internal pulldown resistor.; true (1) = Ps1: Enables internal pullup resistor."
    bit_offset: 0
    bit_size: 1
  - name: pe
    description: "Pull Enable.\n\nRaw bit values: false (0) = Pe0: Disables.; true (1) = Pe1: Enables."
    bit_offset: 1
    bit_size: 1
  - name: sre
    description: "Slew Rate Enable.\n\nRaw bit values: false (0) = Sre0: Fast.; true (1) = Sre1: Slow."
    bit_offset: 3
    bit_size: 1
  - name: ode
    description: "Open Drain Enable.\n\nRaw bit values: false (0) = Ode0: Disables.; true (1) = Ode1: Enables."
    bit_offset: 5
    bit_size: 1
  - name: dse
    description: "Drive Strength Enable.\n\nRaw bit values: false (0) = Dse0: Low.; true (1) = Dse1: High."
    bit_offset: 6
    bit_size: 1
  - name: mux
    description: Pin Multiplex Control.
    bit_offset: 8
    bit_size: 4
    enum: Mux
  - name: ibe
    description: "Input Buffer Enable.\n\nRaw bit values: false (0) = Ibe0: Disables.; true (1) = Ibe1: Enables."
    bit_offset: 12
    bit_size: 1
  - name: inv
    description: "Invert Input.\n\nRaw bit values: false (0) = Inv0: Does not invert.; true (1) = Inv1: Inverts."
    bit_offset: 13
    bit_size: 1
  - name: lk
    description: "Lock Register.\n\nRaw bit values: false (0) = Lk0: Does not lock.; true (1) = Lk1: Locks."
    bit_offset: 15
    bit_size: 1
