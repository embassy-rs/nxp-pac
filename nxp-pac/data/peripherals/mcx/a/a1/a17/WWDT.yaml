# MCXA173/174: MCXAP100M180F41RM Rev.2; explicit MCXA174 XML onboarding.
# Backing widths and resets restored from the pinned XML; no build-time SVD input.
block/Wwdt:
  description: Windowed Watchdog Timer.
  items:
  - name: mod_
    description: Mode.
    byte_offset: 0
    fieldset: Mod
  - name: tc
    description: Timer Constant.
    byte_offset: 4
    fieldset: Tc
  - name: feed
    description: Feed Sequence.
    byte_offset: 8
    access: Write
    fieldset: Feed
  - name: tv
    description: Timer Value.
    byte_offset: 12
    access: Read
    fieldset: Tv
  - name: warnint
    description: Warning Interrupt Compare Value.
    byte_offset: 20
    fieldset: Warnint
  - name: window
    description: Window Compare Value.
    byte_offset: 24
    fieldset: Window
fieldset/Feed:
  description: Feed Sequence.
  fields:
  - name: feed
    description: Feed Value.
    bit_offset: 0
    bit_size: 8
  bit_size: 32
  reset_value: 0
fieldset/Mod:
  description: Mode.
  fields:
  - name: wden
    description: "Watchdog Enable.\n\nRaw bit values: false (0) = Stop: Timer stopped.; true (1) = Run: Timer running."
    bit_offset: 0
    bit_size: 1
  - name: wdreset
    description: "Watchdog Reset Enable.\n\nRaw bit values: false (0) = Interrupt: Interrupt.; true (1) = Reset: Reset."
    bit_offset: 1
    bit_size: 1
  - name: wdtof
    description: Watchdog Timeout Flag.
    bit_offset: 2
    bit_size: 1
  - name: wdint
    description: Warning Interrupt Flag.
    bit_offset: 3
    bit_size: 1
  - name: wdprotect
    description: "Watchdog Update Mode.\n\nRaw bit values: false (0) = Flexible: Flexible.; true (1) = Threshold: Threshold."
    bit_offset: 4
    bit_size: 1
  - name: lock
    description: Lock.
    bit_offset: 5
    bit_size: 1
  bit_size: 32
  reset_value: 0
fieldset/Tc:
  description: Timer Constant.
  fields:
  - name: count
    description: Watchdog Timeout Value.
    bit_offset: 0
    bit_size: 24
  bit_size: 32
  reset_value: 255
fieldset/Tv:
  description: Timer Value.
  fields:
  - name: count
    description: Counter Timer Value.
    bit_offset: 0
    bit_size: 24
  bit_size: 32
  reset_value: 255
fieldset/Warnint:
  description: Warning Interrupt Compare Value.
  fields:
  - name: warnint
    description: Watchdog Warning Interrupt Compare Value.
    bit_offset: 0
    bit_size: 10
  bit_size: 32
  reset_value: 0
fieldset/Window:
  description: Window Compare Value.
  fields:
  - name: window
    description: Watchdog Window Value.
    bit_offset: 0
    bit_size: 24
  bit_size: 32
  reset_value: 16777215
