    bit_offset: 8
    bit_size: 8
  - name: pcssck
    description: PCS-to-SCK Delay.
    bit_offset: 16
    bit_size: 8
  - name: sckpcs
    description: SCK-to-PCS Delay.
    bit_offset: 24
    bit_size: 8
  bit_size: 32
  reset_value: 0
fieldset/Ccr1:
