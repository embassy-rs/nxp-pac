    description: FIFO Control.
    byte_offset: 88
    fieldset: Fcr
  - name: fsr
    description: FIFO Status.
    byte_offset: 92
    access: Read
    fieldset: Fsr
  - name: tcr
    description: Transmit Command.
    byte_offset: 96
    fieldset: Tcr
  - name: tdr
    description: Transmit Data.
    byte_offset: 100
    access: Write
    fieldset: Tdr
  - name: rsr
    description: Receive Status.
    byte_offset: 112
    access: Read
    fieldset: Rsr
  - name: rdr
    description: Receive Data.
    byte_offset: 116
    access: Read
    fieldset: Rdr
  - name: rdror
    description: Receive Data Read Only.
    byte_offset: 120
    access: Read
    fieldset: Rdr
  - name: tcbr
    description: Transmit Command Burst.
    byte_offset: 1020
    access: Write
    fieldset: Tcbr
  - name: tdbr
    description: Transmit Data Burst.
    array:
      len: 128
      stride: 4
    byte_offset: 1024
    access: Write
    fieldset: Rdbr
  - name: rdbr
    description: Receive Data Burst.
    array:
      len: 128
      stride: 4
    byte_offset: 1536
    access: Read
    fieldset: Rdbr
fieldset/Ccr:
