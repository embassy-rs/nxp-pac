    description: Configuration 0.
    byte_offset: 32
    fieldset: Cfgr0
  - name: cfgr1
    description: Configuration 1.
    byte_offset: 36
    fieldset: Cfgr1
  - name: dmr0
    description: Data Match 0.
    byte_offset: 48
    fieldset: Dmr0
  - name: dmr1
    description: Data Match 1.
    byte_offset: 52
    fieldset: Dmr1
  - name: ccr
    description: Clock Configuration.
    byte_offset: 64
    fieldset: Ccr
  - name: ccr1
    description: Clock Configuration 1.
    byte_offset: 68
    fieldset: Ccr1
