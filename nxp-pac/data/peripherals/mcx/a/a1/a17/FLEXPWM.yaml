enum/Flexpwm1Fauto:
  bit_size: 4
  variants:
  - name: Manual
    description: Manual fault clearing. PWM outputs disabled by this fault are not enabled until FSTS[FFLAGx] is
      clear at the start of a half cycle or full cycle depending on the states of FSTS[FHALF] and FSTS[FFULL]. If
      neither FFULL nor FHALF is set, then the fault condition cannot be cleared. This is further controlled by
      FCTRL[FSAFE].
    value: 0
  - name: Automatic
    description: Automatic fault clearing. PWM outputs disabled by this fault are enabled when FSTS[FFPINx] is clear
      at the start of a half cycle or full cycle depending on the states of FSTS[FHALF] and FSTS[FFULL] without
      regard to the state of FSTS[FFLAGx]. If neither FFULL nor FHALF is set, then the fault condition cannot be
      cleared.
    value: 1
enum/Flexpwm1Fflag:
  bit_size: 4
  variants:
  - name: NoFlag
    description: No fault on the FAULTx pin.
    value: 0
  - name: Flag
    description: Fault on the FAULTx pin.
    value: 1
enum/Flexpwm1Ffull:
  bit_size: 4
  variants:
  - name: PwmOutputsNotReenabled
    description: PWM outputs are not re-enabled at the start of a full cycle.
    value: 0
  - name: PwmOutputsReenabled
    description: PWM outputs are re-enabled at the start of a full cycle.
    value: 1
enum/Flexpwm1Fhalf:
  bit_size: 4
  variants:
  - name: PwmOutputsNotReenabled
    description: PWM outputs are not re-enabled at the start of a half cycle.
    value: 0
  - name: PwmOutputsReenabled
    description: PWM outputs are re-enabled at the start of a half cycle (as defined by VAL0).
    value: 1
enum/Flexpwm1Fie:
  bit_size: 4
  variants:
  - name: Disabled
    description: FAULTx CPU interrupt requests disabled.
    value: 0
  - name: Enabled
    description: FAULTx CPU interrupt requests enabled.
    value: 1
enum/Flexpwm1Flvl:
  bit_size: 4
  variants:
  - name: Logic0
    description: A logic 0 on the fault input indicates a fault condition.
    value: 0
  - name: Logic1
    description: A logic 1 on the fault input indicates a fault condition.
    value: 1
enum/Flexpwm1Fsafe:
  bit_size: 4
  variants:
  - name: Normal
    description: Normal mode. PWM outputs disabled by this fault are not enabled until FSTS[FFLAGx] is clear at
      the start of a half cycle or full cycle depending on the states of FSTS[FHALF] and FSTS[FFULL] without regard
      to the state of FSTS[FFPINx]. If neither FHALF nor FFULL is set, then the fault condition cannot be cleared.
      The PWM outputs disabled by this fault input will not be re-enabled until the actual FAULTx input signal de-asserts
      since the fault input will combinationally disable the PWM outputs (as programmed in DISMAPn).
    value: 0
  - name: Safe
    description: Safe mode. PWM outputs disabled by this fault are not enabled until FSTS[FFLAGx] is clear and FSTS[FFPINx]
      is clear at the start of a half cycle or full cycle depending on the states of FSTS[FHALF] and FSTS[FFULL].
      If neither FHLAF nor FFULL is set, then the fault condition cannot be cleared.
    value: 1
enum/Flexpwm1Ipol:
  bit_size: 4
  variants:
  - name: Pwm23
    description: PWM23 is used to generate complementary PWM pair in the corresponding submodule.
    value: 0
  - name: Pwm45
    description: PWM45 is used to generate complementary PWM pair in the corresponding submodule.
    value: 1
enum/Flexpwm1Ldok:
  bit_size: 4
  variants:
  - name: Disabled
    description: Do not load new values.
    value: 0
  - name: Enabled
    description: Load prescaler, modulus, and PWM values of the corresponding submodule.
    value: 1
enum/Flexpwm1Nocomb:
  bit_size: 4
  variants:
  - name: Enabled
    description: There is a combinational link from the fault inputs to the PWM outputs. The fault inputs are combined
      with the filtered and latched fault signals to disable the PWM outputs.
    value: 0
  - name: Disabled
    description: The direct combinational path from the fault inputs to the PWM outputs is disabled and the filtered
      and latched fault signals are used to disable the PWM outputs.
    value: 1
enum/Flexpwm1Run:
  bit_size: 4
  variants:
  - name: Disabled
    description: PWM counter is stopped, but PWM outputs hold the current state.
    value: 0
  - name: Enabled
    description: PWM counter is started in the corresponding submodule.
    value: 1
enum/Flexpwm1Sm0captctrlxEdgx0:
  bit_size: 2
  variants:
  - name: Disabled
    description: Disabled.
    value: 0
  - name: FallingEdge
    description: Capture falling edges.
    value: 1
  - name: RisingEdge
    description: Capture rising edges.
    value: 2
  - name: AnyEdge
    description: Capture any edge.
    value: 3
enum/Flexpwm1Sm0captctrlxEdgx1:
  bit_size: 2
  variants:
  - name: Disabled
    description: Disabled.
    value: 0
  - name: FallingEdge
    description: Capture falling edges.
    value: 1
  - name: RisingEdge
    description: Capture rising edges.
    value: 2
  - name: AnyEdge
    description: Capture any edge.
    value: 3
enum/Flexpwm1Sm0captctrlxInpSelx:
  bit_size: 1
  variants:
  - name: PwmX
    description: Raw PWM_X input signal selected as source.
    value: 0
  - name: EdgeCounter
    description: Edge Counter.
    value: 1
enum/Flexpwm1Sm0captctrlxOneshotx:
  bit_size: 1
  variants:
  - name: FreeRunning
    description: Free Running.
    value: 0
  - name: OneShot
    description: One Shot.
    value: 1
enum/Flexpwm1Sm0ctrl2ClkSel:
  bit_size: 2
  variants:
  - name: Ipbus
    description: The IPBus clock is used as the clock for the local prescaler and counter.
    value: 0
  - name: ExtClk
    description: EXT_CLK is used as the clock for the local prescaler and counter.
    value: 1
  - name: AuxClk
    description: Submodule 0's clock (AUX_CLK) is used as the source clock for the local prescaler and counter.
      This setting should not be used in submodule 0 as it forces the clock to logic 0.
    value: 2
enum/Flexpwm1Sm0ctrl2ForceSel:
  bit_size: 3
  variants:
  - name: Local
    description: The local force signal, CTRL2[FORCE], from this submodule is used to force updates.
    value: 0
  - name: Master
    description: The master force signal from submodule 0 is used to force updates. This setting should not be used
      in submodule 0 as it holds the FORCE OUTPUT signal to logic 0.
    value: 1
  - name: LocalReload
    description: The local reload signal from this submodule is used to force updates without regard to the state
      of LDOK.
    value: 2
  - name: MasterReload
    description: The master reload signal from submodule0 is used to force updates if LDOK is set. This setting
      should not be used in submodule0 as it holds the FORCE OUTPUT signal to logic 0.
    value: 3
  - name: LocalSync
    description: The local sync signal from this submodule is used to force updates.
    value: 4
  - name: MasterSync
    description: The master sync signal from submodule0 is used to force updates. This setting should not be used
      in submodule0 as it holds the FORCE OUTPUT signal to logic 0.
    value: 5
  - name: ExtForce
    description: The external force signal, EXT_FORCE, from outside the eFlexPWM module causes updates.
    value: 6
  - name: ExtSync
    description: The external sync signal, EXT_SYNC, from outside the eFlexPWM module causes updates.
    value: 7
enum/Flexpwm1Sm0ctrl2Indep:
  bit_size: 1
  variants:
  - name: Complementary
    description: PWM_A and PWM_B form a complementary PWM pair.
    value: 0
  - name: Independent
    description: PWM_A and PWM_B outputs are independent PWMs.
    value: 1
enum/Flexpwm1Sm0ctrl2InitSel:
  bit_size: 2
  variants:
  - name: PwmX
    description: Local sync (PWM_X) causes initialization.
    value: 0
  - name: MasterReload
    description: Master reload from submodule 0 causes initialization. This setting should not be used in submodule
      0 as it forces the INIT signal to logic 0. The submodule counter will only re-initialize when a master reload
      occurs.
    value: 1
  - name: MasterSync
    description: Master sync from submodule 0 causes initialization. This setting should not be used in submodule
      0 as it forces the INIT signal to logic 0.
    value: 2
  - name: ExtSync
    description: EXT_SYNC causes initialization.
    value: 3
enum/Flexpwm1Sm0ctrl2ReloadSel:
  bit_size: 1
  variants:
  - name: Local
    description: The local RELOAD signal is used to reload registers.
    value: 0
  - name: Master
    description: The master RELOAD signal (from submodule 0) is used to reload registers. This setting should not
      be used in submodule 0 as it forces the RELOAD signal to logic 0.
    value: 1
enum/Flexpwm1Sm0ctrlCompmode:
  bit_size: 1
  variants:
  - name: EqualTo
    description: The VAL* registers and the PWM counter are compared using an "equal to" method. This means that
      PWM edges are only produced when the counter is equal to one of the VAL* register values. This implies that
      a PWM_A output that is high at the end of a period maintains this state until a match with VAL3 clears the
      output in the following period.
    value: 0
  - name: EqualToOrGreaterThan
    description: The VAL* registers and the PWM counter are compared using an "equal to or greater than" method.
      This means that PWM edges are produced when the counter is equal to or greater than one of the VAL* register
      values. This implies that a PWM_A output that is high at the end of a period could go low at the start of
      the next period if the starting counter value is greater than (but not necessarily equal to) the new VAL3
      value.
    value: 1
enum/Flexpwm1Sm0ctrlLdfq:
  bit_size: 4
  variants:
  - name: Everypwm
    description: Every PWM opportunity.
    value: 0
  - name: Every2pwm
    description: Every 2 PWM opportunities.
    value: 1
  - name: Every3pwm
    description: Every 3 PWM opportunities.
    value: 2
  - name: Every4pwm
    description: Every 4 PWM opportunities.
    value: 3
  - name: Every5pwm
    description: Every 5 PWM opportunities.
    value: 4
  - name: Every6pwm
    description: Every 6 PWM opportunities.
    value: 5
  - name: Every7pwm
    description: Every 7 PWM opportunities.
    value: 6
  - name: Every8pwm
    description: Every 8 PWM opportunities.
    value: 7
  - name: Every9pwm
    description: Every 9 PWM opportunities.
    value: 8
  - name: Every10pwm
    description: Every 10 PWM opportunities.
    value: 9
  - name: Every11pwm
    description: Every 11 PWM opportunities.
    value: 10
  - name: Every12pwm
    description: Every 12 PWM opportunities.
    value: 11
  - name: Every13pwm
    description: Every 13 PWM opportunities.
    value: 12
  - name: Every14pwm
    description: Every 14 PWM opportunities.
    value: 13
  - name: Every15pwm
    description: Every 15 PWM opportunities.
    value: 14
  - name: Every16pwm
    description: Every 16 PWM opportunities.
    value: 15
enum/Flexpwm1Sm0ctrlLdmod:
  bit_size: 1
  variants:
  - name: NextPwmReload
    description: Buffered registers of this submodule are loaded and take effect at the next PWM reload if MCTRL[LDOK]
      is set.
    value: 0
  - name: MtctrlLdokSet
    description: Buffered registers of this submodule are loaded and take effect immediately upon MCTRL[LDOK] being
      set. In this case, it is not necessary to set CTRL[FULL] or CTRL[HALF].
    value: 1
enum/Flexpwm1Sm0ctrlPrsc:
  bit_size: 3
  variants:
  - name: One
    description: Prescaler 1.
    value: 0
  - name: Two
    description: Prescaler 2.
    value: 1
  - name: Four
    description: Prescaler 4.
    value: 2
  - name: Eight
    description: Prescaler 8.
    value: 3
  - name: Sixteen
    description: Prescaler 16.
    value: 4
  - name: Thirtytwo
    description: Prescaler 32.
    value: 5
  - name: Sixtyfour
    description: Prescaler 64.
    value: 6
  - name: Hundredtwentyeight
    description: Prescaler 128.
    value: 7
enum/Flexpwm1Sm0dmaenCaptde:
  bit_size: 2
  variants:
  - name: Disabled
    description: Read DMA requests disabled.
    value: 0
  - name: Exceedfifo
    description: Exceeding a FIFO watermark sets the DMA read request. This requires at least one of DMAEN[CX1DE],
      or DMAEN[CX0DE] to be set to determine which watermark(s) the DMA request is sensitive.
    value: 1
  - name: LocalSync
    description: A local synchronization (VAL1 matches counter) sets the read DMA request.
    value: 2
  - name: LocalReload
    description: A local reload (STS[RF] being set) sets the read DMA request.
    value: 3
enum/Flexpwm1Sm0dmaenFand:
  bit_size: 1
  variants:
  - name: Or
    description: Selected FIFO watermarks are OR'ed together.
    value: 0
  - name: And
    description: Selected FIFO watermarks are AND'ed together.
    value: 1
enum/Flexpwm1Sm0intenCmpie:
  bit_size: 6
  variants:
  - name: Disabled
    description: The corresponding STS[CMPF] bit will not cause an interrupt request.
    value: 0
  - name: Enabled
    description: The corresponding STS[CMPF] bit will cause an interrupt request.
    value: 1
enum/Flexpwm1Sm0octrlPwmafs:
  bit_size: 2
  variants:
  - name: Logic0
    description: Output is forced to logic 0 state prior to consideration of output polarity control.
    value: 0
  - name: Logic1
    description: Output is forced to logic 1 state prior to consideration of output polarity control.
    value: 1
  - name: Tristated2
    description: Output is put in a high-impedance state.
    value: 2
  - name: Tristated3
    description: Output is put in a high-impedance state.
    value: 3
enum/Flexpwm1Sm0octrlPwmbfs:
  bit_size: 2
  variants:
