    description: "Command Fail Flag.\n\nRaw bit values: false (0) = Zz27: Error not detected.; true (1) = Zz28: Error detected."
    bit_offset: 0
    bit_size: 1
  - name: cmdabt
    description: "Command Abort Flag.\n\nRaw bit values: false (0) = Zz25: No command abort detected.; true (1) = Zz26: Command abort detected."
    bit_offset: 2
    bit_size: 1
  - name: pviol
    description: "Command Protection Violation Flag.\n\nRaw bit values: false (0) = Zz23: No protection violation detected.; true (1) = Zz24: Protection violation detected."
    bit_offset: 4
    bit_size: 1
  - name: accerr
    description: "Command Access Error Flag.\n\nRaw bit values: false (0) = Zz21: No access error detected.; true (1) = Zz22: Access error detected."
    bit_offset: 5
    bit_size: 1
  - name: cwsabt
    description: "Command Write Sequence Abort Flag.\n\nRaw bit values: false (0) = Zz19: Command write sequence not aborted.; true (1) = Zz20: Command write sequence aborted."
    bit_offset: 6
    bit_size: 1
  - name: ccif
    description: "Command Complete Interrupt Flag.\n\nRaw bit values: false (0) = Zz17: Flash command or initialization in progress.; true (1) = Zz18: Flash command or initialization has completed."
    bit_offset: 7
    bit_size: 1
  - name: cmdprt
    description: Command Protection Level.
    bit_offset: 8
    bit_size: 2
    enum: Cmdprt
  - name: cmdp
    description: "Command Protection Status Flag.\n\nRaw bit values: false (0) = Zz11: Command protection level and domain ID are stale.; true (1) = Zz12: Command protection level (CMDPRT) and domain ID (CMDDID) are set."
    bit_offset: 11
    bit_size: 1
  - name: cmddid
    description: Command Domain ID.
    bit_offset: 12
    bit_size: 4
  - name: dfdif
    description: "Double Bit Fault Detect Interrupt Flag.\n\nRaw bit values: false (0) = Zz9: Double bit fault not detected during a valid flash read access from the FMC.; true (1) = Zz10: Double bit fault detected (or FCTRL[FDFD] is set) during a valid flash read access from the FMC."
    bit_offset: 16
    bit_size: 1
  - name: salv_used
    description: "Salvage Used for Erase operation.\n\nRaw bit values: false (0) = Zz7: Salvage not used during the last operation.; true (1) = Zz8: Salvage used during the last erase operation."
    bit_offset: 17
    bit_size: 1
  - name: pewen
    description: Program-Erase Write Enable Control.
    bit_offset: 24
    bit_size: 2
    enum: Pewen
  - name: perdy
    description: "Program/Erase Ready Control/Status Flag.\n\nRaw bit values: false (0) = Zz1: Program or sector erase command operation is not stalled.; true (1) = Zz2: Program or sector erase command operation is stalled."
    bit_offset: 31
    bit_size: 1
fieldset/Ftest:
  description: Flash Test Register.
  fields:
  - name: tmectl
    description: "Test Mode Entry Control.\n\nRaw bit values: false (0) = Zz69: FTEST register always reads 0 and writes to FTEST are ignored.; true (1) = Zz70: FTEST register is readable and can be written to enable writability of TME."
    bit_offset: 0
    bit_size: 1
  - name: tmewr
    description: "Test Mode Entry Writable.\n\nRaw bit values: false (0) = Zz67: TME bit is not writable.; true (1) = Zz68: TME bit is writable."
    bit_offset: 1
    bit_size: 1
  - name: tme
    description: "Test Mode Entry.\n\nRaw bit values: false (0) = Zz65: Test mode entry not requested.; true (1) = Zz66: Test mode entry requested."
    bit_offset: 2
    bit_size: 1
  - name: tmode
    description: "Test Mode Status.\n\nRaw bit values: false (0) = Zz63: Test mode not active.; true (1) = Zz64: Test mode active."
    bit_offset: 3
    bit_size: 1
  - name: tmelock
    description: "Test Mode Entry Lock.\n\nRaw bit values: false (0) = Zz61: FTEST register not locked from accepting writes.; true (1) = Zz62: FTEST register locked from accepting writes."
    bit_offset: 4
    bit_size: 1
