enum/DftData:
  bit_size: 4
  variants:
  - name: Zz232
    description: CKBD pattern. For READ operations only, compare DOUT with checkerboard data pattern for each read cycle.
    value: 0
  - name: Zz233
    description: ICKBD pattern. For READ operations only, compare DOUT with inverse checkerboard data pattern for each read cycle.
    value: 1
  - name: Zz234
    description: Diagonal pattern. Used for READ operations only, compare DOUT to diagonal pattern.
    value: 2
  - name: Zz235
    description: Fixed data pattern. For READ operations, comparison to DOUT for selected groups; refer to R_ADR_CTRL[GRPSEL] for modules with multiple groups.
    value: 3
  - name: Zz236
    description: Random data pattern which will be generated based on the initial seed set in R_DATA; for READ operations, used for DOUT comparison of selected groups. For PROG operations, used to control DIN of selected groups.
    value: 4
  - name: Zz237
    description: DOUT based pattern. For READ operations only, DOUT of selected group will be latched in R_DATA. If more than one group is selected in R_ADR_CTRL[GRPSEL], the group with the lower index will be latched.
    value: 5
  - name: Zz238
    description: R_DATA based pattern. For READ operations, expected DOUT value of selected groups equals to R_DATA when XADR[0]==YADR[0] or ~R_DATA when XADR[0]!=YADR[0]. For PROG operations, DIN of selected groups equals R_DATA when XADR[0]==YADR[0] or ~R_DATA when XADR[0]!=YADR[0].
    value: 6
  - name: Zz239
    description: SCAN-IO pattern. For READ operations, control expected DOUT value of selected groups to SCAN-IO data pattern. For PROG operations, control DIN of selected groups to SCAN-IO data pattern.
    value: 7
  - name: Zz240
    description: REPAIR set. For PROG operation to IFR1(7,1) and IFR1(7,2), R_REPAIR0_0 and R_REPAIR0_1 or R_REPAIR1_0 and R_REPAIR1_1 will control DIN. For READ operation on IFR1(7,1) and IFR1(7,2), DOUT will be compared against R_REPAIR0_0 and R_REPAIR0_1 or R_REPAIR1_0 andR_REPAIR1_1. When this option is selected, only one flash block can be selected.
    value: 8
  - name: Zz241
    description: REPAIR load. For READ operation only, DOUT from IFR1(7,1) and IFR1(7,2) is loaded to R_REPAIR0 and R_REPAIR1.
    value: 9
enum/DftXadr:
  bit_size: 4
  variants:
  - name: Zz252
    description: XADR fixed, no change at all.
    value: 0
  - name: Zz253
    description: XADR increased by 1 after row. For READ operation, XADR increases by 1 after reading the last word of row. For PROG operation, XADR increases by 1 after NVSTR falls.
    value: 1
  - name: Zz254
    description: XADR increased for diagonal. For PROG-DIAGONAL operation, XADR is increased to create diagonal pattern.
    value: 2
  - name: Zz255
    description: XADR increased by sector. During ERASE operation, XADR increased by number of rows in a sector when NVSTR falls.
    value: 3
  - name: Zz256
    description: XADR inversed. XADR is inversed after reading one word or after programming one row when NVSTR falls.
    value: 4
  - name: Zz257
    description: XADR increased by 2 after row. For READ operation, XADR is increased by 2 after reading the last word of a row. For PROG operation, XADR is increased by 2 when NVSTR falls.
    value: 5
  - name: Zz258
    description: XADR[0] inversed. XADR[0] is inversed after reading one word or after programming one row when NVSTR falls.
    value: 6
  - name: Zz259
    description: XADR increased by 1. For READ operations only, XADR increased by 1 after each read cycle.
    value: 7
  - name: Zz260
    description: XADR decreased by 1 after row. For READ operations only, XADR is decreased by 1 after YADR decreases to 0.
    value: 8
  - name: Zz261
    description: XADR decreased by 1. For READ operations only, XADR is decreased by 1 after each read cycle.
    value: 9
enum/DftYadr:
  bit_size: 4
  variants:
  - name: Zz242
    description: YADR fixed, no change at all.
    value: 0
  - name: Zz243
    description: YADR for ICKBD. For PROG and READ operations, YADR changed to generate inverse checkerboard pattern.
    value: 1
  - name: Zz244
    description: YADR for CKBD. For PROG and READ operations, YADR changed to generate checkerboard pattern.
    value: 2
  - name: Zz245
    description: YADR increased by 1. For READ operations, YADR increased by 1 after each read cycle. For PROG operations, YADR increased by 1 after YE falls.
    value: 3
  - name: Zz246
    description: YADR increased for diagonal. For PROG-DIAGONAL operation, YADR is increased to create diagonal pattern.
    value: 4
  - name: Zz247
    description: YADR inversed. YADR is inversed after reading one word or after programming one word when YE falls.
    value: 5
  - name: Zz248
    description: YADR[0] inversed. YADR[0] is inversed after reading one word or after programming one word when YE falls.
    value: 6
  - name: Zz249
    description: YADR increased by 1 after last row. For READ operations only, YADR is increased by 1 after XADR reaches last row.
    value: 7
  - name: Zz250
    description: YADR decreased by 1. For READ operations only, YADR is decreased by 1 after each read cycle.
    value: 8
  - name: Zz251
    description: YADR decreased by 1 after first row. For READ operations only, YADR is decreased by 1 after XADR decreases to 0.
    value: 9
