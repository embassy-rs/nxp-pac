fieldset/CmdCheck:
  description: FMU Command Check Register.
  fields:
  - name: alignfail_phr
    description: "Phrase Alignment Fail.\n\nRaw bit values: false (0) = Zz149: The address is phrase-aligned.; true (1) = Zz150: The address is not phrase-aligned."
    bit_offset: 0
    bit_size: 1
  - name: alignfail_pg
    description: "Page Alignment Fail.\n\nRaw bit values: false (0) = Zz147: The address is page-aligned.; true (1) = Zz148: The address is not page-aligned."
    bit_offset: 1
    bit_size: 1
  - name: alignfail_scr
    description: "Sector Alignment Fail.\n\nRaw bit values: false (0) = Zz145: The address is sector-aligned.; true (1) = Zz146: The address is not sector-aligned."
    bit_offset: 2
    bit_size: 1
  - name: alignfail_blk
    description: "Block Alignment Fail.\n\nRaw bit values: false (0) = Zz143: The address is block-aligned.; true (1) = Zz144: The address is not block-aligned."
    bit_offset: 3
    bit_size: 1
  - name: addr_fail
    description: "Address Fail.\n\nRaw bit values: false (0) = Zz141: The address is within the flash or IFR address space.; true (1) = Zz142: The address is outside the flash or IFR address space."
    bit_offset: 4
    bit_size: 1
  - name: ifr_cmd
    description: "IFR Command.\n\nRaw bit values: false (0) = Zz139: The command operates on a main flash address.; true (1) = Zz140: The command operates on an IFR address."
    bit_offset: 5
    bit_size: 1
  - name: all_cmd
    description: "All Blocks Command.\n\nRaw bit values: false (0) = Zz137: The command operates on a single flash block.; true (1) = Zz138: The command operates on all flash blocks."
    bit_offset: 6
    bit_size: 1
  - name: range_fail
    description: "Address Range Fail.\n\nRaw bit values: false (0) = Zz135: The address range is valid.; true (1) = Zz136: The address range is invalid."
    bit_offset: 7
    bit_size: 1
  - name: scr_align_chk
    description: "Sector Alignment Check.\n\nRaw bit values: false (0) = Zz133: No sector alignment check.; true (1) = Zz134: Sector alignment check."
    bit_offset: 8
    bit_size: 1
  - name: option_fail
    description: "Option Check Fail.\n\nRaw bit values: false (0) = Zz131: Option check passes for read command or command is not a read command.; true (1) = Zz132: Option check fails for read command."
    bit_offset: 9
    bit_size: 1
  - name: illegal_cmd
    description: "Illegal Command.\n\nRaw bit values: false (0) = Zz129: Command is legal.; true (1) = Zz130: Command is illegal."
    bit_offset: 10
    bit_size: 1
