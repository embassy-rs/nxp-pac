    bit_offset: 7
    bit_size: 1
  - name: ersreq
    description: "Mass Erase (Erase All) Request.\n\nRaw bit values: false (0) = Zz35: No request or request complete.; true (1) = Zz36: Request to run the Mass Erase operation."
    bit_offset: 8
    bit_size: 1
  - name: dfdie
    description: "Double Bit Fault Detect Interrupt Enable.\n\nRaw bit values: false (0) = Zz33: Double bit fault detect interrupt disabled.; true (1) = Zz34: Double bit fault detect interrupt enabled; an interrupt request is generated whenever the FSTAT[DFDIF] flag is set."
    bit_offset: 16
    bit_size: 1
  - name: ersien0
    description: Erase IFR Sector Enable - Block 0.
    bit_offset: 24
    bit_size: 4
    enum: Ersien0
  - name: ersien1
    description: Erase IFR Sector Enable - Block 1 (for dual block configs).
    bit_offset: 28
    bit_size: 4
    enum: Ersien1
