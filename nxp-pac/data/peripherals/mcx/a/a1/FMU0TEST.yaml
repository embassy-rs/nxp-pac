    description: Read Wait-State Control.
    bit_offset: 0
    bit_size: 4
    enum: Rwsc
  - name: lsactive
    description: "Low Speed Active Mode.\n\nRaw bit values: false (0) = Zz43: Full speed active mode requested.; true (1) = Zz44: Low speed active mode requested."
    bit_offset: 8
    bit_size: 1
  - name: fdfd
    description: "Force Double Bit Fault Detect.\n\nRaw bit values: false (0) = Zz41: FSTAT[DFDIF] sets only if a double bit fault is detected during a valid flash read access from the FMC.; true (1) = Zz42: FSTAT[DFDIF] sets during any valid flash read access from the FMC; an interrupt request is generated if the DFDIE bit is set."
    bit_offset: 16
    bit_size: 1
  - name: abtreq
    description: "Abort Request.\n\nRaw bit values: false (0) = Zz39: No request to abort a command write sequence.; true (1) = Zz40: Request to abort a command write sequence."
    bit_offset: 24
    bit_size: 1
