fieldset/BistDumpCtrl:
  description: BIST Datadump Control Register.
  fields:
  - name: bist_done
    description: "BIST Done.\n\nRaw bit values: false (0) = Zz439: The BIST (or data dump) is running.; true (1) = Zz440: The BIST (or data dump) has completed."
    bit_offset: 16
    bit_size: 1
  - name: bist_fail
    description: "BIST Fail.\n\nRaw bit values: false (0) = Zz437: The last BIST operation completed successfully (or could not fail).; true (1) = Zz438: The last BIST operation failed."
    bit_offset: 17
    bit_size: 1
  - name: datadump
    description: Data Dump Enable.
    bit_offset: 18
    bit_size: 1
  - name: datadump_trig
    description: Data Dump Trigger.
    bit_offset: 19
    bit_size: 1
  - name: datadump_patt
    description: Data Dump Pattern Select.
    bit_offset: 20
    bit_size: 2
    enum: DatadumpPatt
  - name: datadump_mrgen
    description: "Data Dump Margin Enable.\n\nRaw bit values: false (0) = Zz431: Normal read pulse shape.; true (1) = Zz432: Margin read pulse shape."
    bit_offset: 22
    bit_size: 1
  - name: datadump_mrgtype
    description: "Data Dump Margin Type.\n\nRaw bit values: false (0) = Zz429: DIN method used.; true (1) = Zz430: TM method used."
    bit_offset: 23
    bit_size: 1
