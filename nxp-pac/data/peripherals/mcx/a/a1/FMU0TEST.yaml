fieldset/Mctl:
  description: FMU Control Register.
  fields:
  - name: corehld
    description: "Core Hold.\n\nRaw bit values: false (0) = Zz125: CPU access is allowed.; true (1) = Zz126: CPU access must be blocked."
    bit_offset: 0
    bit_size: 1
  - name: lsact_en
    description: "LSACTIVE Feature Enable.\n\nRaw bit values: false (0) = Zz123: LSACTIVE feature disabled completely: FCTRL[LSACTIVE] is forced low and no longer writable, LVE cannot assert at the TSMC array interface.; true (1) = Zz124: LSACTIVE feature fully enabled and controllable by SoC and internal UINT SM."
    bit_offset: 2
    bit_size: 1
  - name: lsactwren
    description: "LSACTIVE Write Enable.\n\nRaw bit values: false (0) = Zz121: Unrestricted write access allowed.; true (1) = Zz122: Write access while CMP set must match CMDDID and CMDPRT."
    bit_offset: 3
    bit_size: 1
  - name: master_repair_en
    description: "Master Repair Enable.\n\nRaw bit values: false (0) = Zz119: Repair disabled.; true (1) = Zz120: Repair enable determined by bit 0 of each REPAIR register."
    bit_offset: 4
    bit_size: 1
  - name: rfcmden
    description: "RF Active Command Enable Control.\n\nRaw bit values: false (0) = Zz117: Flash commands blocked (CCIF not writable).; true (1) = Zz118: Flash commands allowed."
    bit_offset: 5
    bit_size: 1
  - name: cwsabten
    description: "Command Write Sequence Abort Enable.\n\nRaw bit values: false (0) = Zz115: CWS abort feature is disabled.; true (1) = Zz116: CWS abort feature is enabled."
    bit_offset: 6
    bit_size: 1
  - name: mrgrddis
    description: "Margin Read Disable.\n\nRaw bit values: false (0) = Zz113: Margin Read Settings are enabled.; true (1) = Zz114: Margin Read Settings are disabled."
    bit_offset: 7
    bit_size: 1
  - name: mrgrd0
    description: Margin Read Setting for Program.
    bit_offset: 8
    bit_size: 4
  - name: mrgrd1
    description: Margin Read Setting for Erase.
    bit_offset: 12
    bit_size: 4
  - name: ersaack
    description: "Mass Erase (Erase All) Acknowledge.\n\nRaw bit values: false (0) = Zz111: Mass Erase operation is not active (operation has completed or has not started).; true (1) = Zz112: Mass Erase operation is active (controller acknowledges that the soc_ersall_req input is asserted and will continue with the operation)."
    bit_offset: 16
    bit_size: 1
  - name: scan_obs
    description: "Scan Observability Control.\n\nRaw bit values: false (0) = Zz109: Normal functional behavior.; true (1) = Zz110: Enables observation of signals that may otherwise be ATPG untestable."
    bit_offset: 19
    bit_size: 1
  - name: bist_ctl
    description: "BIST IP Control.\n\nRaw bit values: false (0) = Zz107: BIST IP disabled.; true (1) = Zz108: BIST IP enabled."
    bit_offset: 20
    bit_size: 1
  - name: smwr_ctl
    description: "SMWR IP Control.\n\nRaw bit values: false (0) = Zz105: SMWR IP disabled.; true (1) = Zz106: SMWR IP enabled."
    bit_offset: 21
    bit_size: 1
  - name: salv_dis
    description: "Salvage Disable.\n\nRaw bit values: false (0) = Zz103: Salvage enabled (ECC used during erase verify).; true (1) = Zz104: Salvage disabled (ECC not used during erase verify)."
    bit_offset: 24
    bit_size: 1
  - name: soc_ecc_ctl
    description: "SOC ECC Control.\n\nRaw bit values: false (0) = Zz101: ECC is enabled for SOC read access.; true (1) = Zz102: ECC is disabled for SOC read access."
    bit_offset: 25
    bit_size: 1
  - name: fmu_ecc_ctl
    description: "FMU ECC Control.\n\nRaw bit values: false (0) = Zz99: ECC is enabled for FMU program operations.; true (1) = Zz100: ECC is disabled for FMU program operations."
    bit_offset: 26
    bit_size: 1
  - name: bist_pwr_dis
    description: "BIST Power Mode Disable.\n\nRaw bit values: false (0) = Zz97: BIST DFT logic has full control of SLM and LVE when BIST is enabled (including during commands).; true (1) = Zz98: BIST DFT logic has no control of SLM and LVE; power mode RTL is in complete control of SLM and LVE values."
    bit_offset: 29
    bit_size: 1
  - name: osc_h
    description: "Oscillator control.\n\nRaw bit values: false (0) = Zz95: Use APB clock.; true (1) = Zz96: Use a known fixed-frequency clock, e.g. 12 MHz."
    bit_offset: 31
    bit_size: 1
