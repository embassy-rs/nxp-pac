fieldset/RamCtrlA1:
  description: RAM Control.
  fields:
  - name: rama_ecc_enable
    description: RAMA0 ECC enable.
    bit_offset: 0
    bit_size: 1
  - name: rama_cg_override
    description: RAMA bank clock gating control, only avaiable when RAMA_ECC_ENABLE = 0.
    bit_offset: 16
    bit_size: 1
  - name: ramx_cg_override
    description: RAMX bank clock gating control.
    bit_offset: 17
    bit_size: 1
  - name: ramb_cg_override
    description: RAMB bank clock gating control.
    bit_offset: 18
    bit_size: 1
fieldset/RemapA1:
  description: AHB Matrix Remap Control.
  fields:
  - name: cpu0_sbus
    description: RAMX0 address remap for CPU System bus.
    bit_offset: 0
    bit_size: 2
    enum: RemapCpu0Sbus
  - name: dma0
    description: RAMX0 address remap for DMA0.
    bit_offset: 2
    bit_size: 2
    enum: RemapDma0
  - name: usb0
    description: RAMX0 address remap for USB0.
    bit_offset: 4
    bit_size: 2
    enum: Usb0
  - name: lock
    description: "This 1-bit field provides a mechanism to limit writes to this register to protect its contents. Once set, this bit remains asserted until a system reset.\n\nRaw bit values: false (0) = Lock0: This register is not locked and can be altered.; true (1) = Lock1: This register is locked and cannot be altered until a system reset."
    bit_offset: 31
    bit_size: 1
fieldset/SramXenA1:
  description: RAM XEN Control.
  fields:
  - name: ramx0_xen
    description: RAMX0 Execute permission control.
    bit_offset: 0
    bit_size: 1
  - name: ramx1_xen
    description: RAMX1 Execute permission control.
    bit_offset: 1
    bit_size: 1
  - name: rama0_xen
    description: RAMA0 Execute permission control.
    bit_offset: 2
    bit_size: 1
  - name: rama1_xen
    description: RAMAx (excepts RAMA0) Execute permission control.
    bit_offset: 3
    bit_size: 1
  - name: ramb_xen
    description: RAMBx Execute permission control.
    bit_offset: 4
    bit_size: 1
  - name: lock
    description: "This 1-bit field provides a mechanism to limit writes to this register (and SRAM_XEN_DP) to protect its contents. Once set, this bit remains asserted until a system reset.\n\nRaw bit values: false (0) = Lock0: This register is not locked and can be altered.; true (1) = Lock1: This register is locked and cannot be altered."
    bit_offset: 31
    bit_size: 1
fieldset/SramXenDpA1:
  description: RAM XEN Control (Duplicate).
  fields:
  - name: ramx0_xen
    description: Refer to SRAM_XEN for more details.
    bit_offset: 0
    bit_size: 1
  - name: ramx1_xen
    description: Refer to SRAM_XEN for more details.
    bit_offset: 1
    bit_size: 1
  - name: rama0_xen
    description: Refer to SRAM_XEN for more details.
    bit_offset: 2
    bit_size: 1
  - name: rama1_xen
    description: Refer to SRAM_XEN for more details.
    bit_offset: 3
    bit_size: 1
  - name: ramb_xen
    description: Refer to SRAM_XEN for more details.
    bit_offset: 4
    bit_size: 1
