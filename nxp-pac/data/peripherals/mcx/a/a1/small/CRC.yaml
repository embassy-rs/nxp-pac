# MCXAP64M96FS3RM Rev. 7 (2024-10-22), CRC chapter.
# Small-group source XML register resets restored by explicit offline onboarding.
# Compatible curated A1 layouts reused where applicable; shared sources remain unchanged.
block/Crc:
  description: CRC.
  items:
  - name: data16
    byte_offset: 0
    bit_size: 16
    fieldset: RawData16
  - name: data32
    byte_offset: 0
    fieldset: RawData32
  - name: data8
    byte_offset: 0
    bit_size: 8
    fieldset: RawData8
  - name: gpoly16
    byte_offset: 4
    bit_size: 16
    fieldset: RawGpoly16
  - name: gpoly32
    byte_offset: 4
    fieldset: RawGpoly32
  - name: gpoly8
    byte_offset: 4
    bit_size: 8
    fieldset: RawGpoly8
  - name: ctrl
    description: Control.
    byte_offset: 8
    fieldset: Ctrl
fieldset/Ctrl:
  description: Control.
  fields:
  - name: tcrc
    description: "TCRC.\n\nRaw bit values: false (0) = B16: 16 bits.; true (1) = B32: 32 bits."
    bit_offset: 24
    bit_size: 1
  - name: was
    description: "Write as Seed.\n\nRaw bit values: false (0) = Data: Data values.; true (1) = Seed: Seed values."
    bit_offset: 25
    bit_size: 1
  - name: fxor
    description: "Complement Read of CRC Data Register.\n\nRaw bit values: false (0) = Noxor: Disables XOR on reading data.; true (1) = Invert: Inverts or complements the read value of the CRC Data."
    bit_offset: 26
    bit_size: 1
  - name: totr
    description: Transpose Type for Read.
    bit_offset: 28
    bit_size: 2
    enum: Tot
  - name: tot
    description: Transpose Type for Write.
    bit_offset: 30
    bit_size: 2
    enum: Tot
  reset_value: 0
enum/Tot:
  bit_size: 2
  variants:
  - name: Notrnps
    description: No transposition.
    value: 0
  - name: BtsTrnps
    description: Bits in bytes are transposed, but bytes are not transposed.
    value: 1
  - name: BytsBtsTrnps
    description: Both bits in bytes and bytes are transposed.
    value: 2
  - name: BytsTrnps
    description: Only bytes are transposed, no bits in a byte are transposed.
    value: 3
fieldset/RawData16:
  fields: []
  bit_size: 16
  reset_value: 65535
fieldset/RawData32:
  fields: []
  bit_size: 32
  reset_value: 4294967295
fieldset/RawData8:
  fields: []
  bit_size: 8
  reset_value: 255
fieldset/RawGpoly16:
  fields: []
  bit_size: 16
  reset_value: 4129
fieldset/RawGpoly32:
  fields: []
  bit_size: 32
  reset_value: 4129
fieldset/RawGpoly8:
  fields: []
  bit_size: 8
  reset_value: 33
