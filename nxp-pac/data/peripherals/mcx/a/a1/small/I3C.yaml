  variants:
  - name: AllDisabled
    description: Application cannot generate IBI, CR, or HJ.
    value: 0
  - name: Ibi
    description: Application can generate an IBI.
    value: 1
  - name: IbiHasData
    description: When bit 0 = 1, the IBI has data from the SCTRL register.
    value: 2
  - name: MasterRequest
    description: Application can generate a Controller Request for a secondary controller.
    value: 4
  - name: HotJoin
    description: Application can generate a Hot-Join event.
    value: 8
  - name: BamatchForBus
    description: Application can use SCONFIG[BAMATCH] for bus-available timing.
    value: 16
enum/Ibidis:
  bit_size: 1
  variants:
  - name: InterruptsEnabled
    description: In-Band Interrupts not disabled.
    value: 0
  - name: InterruptsDisabled
    description: In-Band Interrupts disabled.
    value: 1
enum/Ibiresp:
  bit_size: 2
  variants:
  - name: Ack
    description: ACK (acknowledge).
    value: 0
  - name: Nack
    description: NACK (reject).
    value: 1
  - name: AckWithMandatory
    description: Acknowledge with mandatory byte.
    value: 2
  - name: Manual
    description: Manual.
    value: 3
enum/Ibitype:
  bit_size: 2
  variants:
  - name: None
    description: NONE.
    value: 0
  - name: Ibi
    description: In-Band Interrupt.
    value: 1
  - name: Mr
    description: Controller Request.
    value: 2
  - name: Hj
    description: Hot-Join.
    value: 3
enum/Idena:
  bit_size: 2
  variants:
  - name: Application
    description: Application.
    value: 0
  - name: Hw
    description: Hardware.
    value: 1
  - name: HwBut
    description: Hardware, but the I3C module instance handles ID 48b.
    value: 2
  - name: Partno
    description: A part number register (PARTNO).
    value: 3
enum/Idreg:
  bit_size: 4
  variants:
  - name: AllDisabled
    description: All ID register features below are disabled.
    value: 0
  - name: IdInstance
    description: ID Instance is a register, and is used if there is no PARTNO register.
    value: 1
  - name: Idrand
    description: An ID Random field is available.
    value: 2
  - name: Dcr
    description: A Device Characteristic Register (DCR) is available.
    value: 4
  - name: Bcr
    description: A Bus Characteristics Register (BCR) is available.
    value: 8
enum/Int:
  bit_size: 1
  variants:
  - name: Interruptsno
    description: Not supported.
    value: 0
  - name: Interruptsyes
    description: Supported.
    value: 1
enum/Laststatic:
  bit_size: 1
  variants:
  - name: I3c
    description: I3C dynamic address.
    value: 0
  - name: I2c
    description: I2C static address.
    value: 1
enum/Master:
  bit_size: 1
  variants:
  - name: Masternotsupported
    description: Not supported.
    value: 0
  - name: Mastersupported
    description: Supported.
    value: 1
enum/MctrlDir:
  bit_size: 1
  variants:
  - name: Dirwrite
    description: Write.
    value: 0
  - name: Dirread
    description: Read.
    value: 1
enum/MdatactrlRxtrig:
  bit_size: 2
  variants:
  - name: NotEmpty
    description: Trigger when not empty.
    value: 0
  - name: QuarterOrMore
    description: Trigger when 1/4 full or more.
    value: 1
  - name: HalfOrMore
    description: Trigger when 1/2 full or more.
    value: 2
  - name: ThreeQuarterOrMore
    description: Trigger when 3/4 full or more.
    value: 3
enum/MdatactrlTxtrig:
  bit_size: 2
  variants:
  - name: Empty
    description: Trigger when empty.
    value: 0
  - name: QuarterOrLess
    description: Trigger when 1/4 full or less.
    value: 1
  - name: HalfOrLess
    description: Trigger when 1/2 full or less.
    value: 2
  - name: FullOrLess
    description: Default. Trigger when 1 less than full or less.
    value: 3
enum/MdmactrlDmafb:
  bit_size: 2
  variants:
  - name: NotUsed
    description: DMA is not used.
    value: 0
  - name: EnableOneFrame
    description: Enable DMA for one frame.
    value: 1
  - name: Enable
    description: Enable DMA until DMA is turned off.
    value: 2
enum/MdmactrlDmatb:
  bit_size: 2
  variants:
  - name: NotUsed
    description: DMA is not used.
    value: 0
  - name: EnableOneFrame
    description: Enable DMA for one frame (ended by DMA or Terminated).
    value: 1
  - name: Enable
    description: Enable DMA until DMA is turned off.
    value: 2
enum/MdmactrlDmawidth:
  bit_size: 2
  variants:
  - name: Byte0
    description: Byte.
    value: 0
  - name: Byte1
    description: Byte.
    value: 1
  - name: HalfWord
    description: Halfword (16 bits).
    value: 2
enum/Mrdis:
  bit_size: 1
  variants:
  - name: MrEnabled
    description: Controller Requests not disabled.
    value: 0
  - name: MrDisabled
    description: Controller Requests disabled.
    value: 1
enum/Mstena:
  bit_size: 2
  variants:
  - name: MasterOff
    description: CONTROLLER_OFF.
    value: 0
  - name: MasterOn
    description: CONTROLLER_ON.
    value: 1
  - name: MasterCapable
    description: CONTROLLER_CAPABLE.
    value: 2
  - name: I2cMasterMode
    description: I2C_CONTROLLER_MODE.
    value: 3
enum/MwmsgSdrControlDir:
  bit_size: 1
  variants:
  - name: Write
    description: Write.
    value: 0
  - name: Read
    description: Read.
    value: 1
enum/Nobyte:
  bit_size: 1
  variants:
  - name: Ibibyte
    description: With mandatory IBI byte.
    value: 0
  - name: NoIbibyte
    description: Without mandatory IBI byte.
    value: 1
enum/Request:
  bit_size: 3
  variants:
  - name: None
    description: NONE.
    value: 0
  - name: Emitstartaddr
    description: EMITSTARTADDR.
    value: 1
  - name: Emitstop
    description: EMITSTOP.
    value: 2
  - name: Ibiacknack
    description: IBIACKNACK.
    value: 3
  - name: Processdaa
    description: PROCESSDAA.
    value: 4
  - name: Forceexit
    description: Force Exit and Target Reset.
    value: 6
  - name: Autoibi
    description: AUTOIBI.
    value: 7
enum/Saddr:
  bit_size: 2
  variants:
  - name: NoStatic
    description: No static address.
    value: 0
  - name: Static
    description: Static address is fixed in hardware.
    value: 1
  - name: HwControl
    description: Hardware controls the static address dynamically (for example, from the pin strap).
    value: 2
  - name: Config
    description: SCONFIG register supplies the static address.
    value: 3
enum/ScapabilitiesTimectrl:
  bit_size: 1
  variants:
  - name: NoTimeControlType
