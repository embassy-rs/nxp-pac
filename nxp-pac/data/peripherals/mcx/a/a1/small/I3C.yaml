    description: IBI.
    value: 1
  - name: MasterRequest
    description: CONTROLLER_REQUEST.
    value: 2
  - name: HotJoinRequest
    description: HOT_JOIN_REQUEST.
    value: 3
enum/SdatactrlRxempty:
  bit_size: 1
  variants:
  - name: Rxisnotempty
    description: Not empty.
    value: 0
  - name: Rxisempty
    description: Empty.
    value: 1
enum/SdatactrlRxtrig:
  bit_size: 2
  variants:
  - name: Triggrnotempty
    description: Trigger when not empty.
    value: 0
  - name: Triggronefourth
    description: Trigger when 1/4 or more full.
    value: 1
  - name: Triggronehalf
    description: Trigger when 1/2 or more full.
    value: 2
  - name: Triggrthreefourths
    description: Trigger when 3/4 or more full.
    value: 3
enum/SdatactrlTxfull:
  bit_size: 1
  variants:
  - name: Txisnotfull
    description: Not full.
    value: 0
  - name: Txisfull
    description: Full.
    value: 1
enum/SdatactrlTxtrig:
  bit_size: 2
  variants:
  - name: Triggrempty
    description: Trigger when empty.
    value: 0
  - name: Triggronefourth
    description: Trigger when 1/4 full or less.
    value: 1
  - name: Triggronehalf
    description: Trigger when 1/2 full or less.
    value: 2
  - name: Triggroneless
    description: Default. Trigger when 1 less than full or less.
