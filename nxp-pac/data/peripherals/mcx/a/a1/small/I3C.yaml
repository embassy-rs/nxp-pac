  - name: EnableOneFrame
    description: DMA is enabled for one frame.
    value: 1
  - name: Enable
    description: DMA enabled until turned off.
    value: 2
enum/SdmactrlDmatb:
  bit_size: 2
  variants:
  - name: NotUsed
    description: DMA not used.
    value: 0
  - name: EnableOneFrame
    description: DMA enabled for one frame (ended by DMA or terminated).
    value: 1
  - name: Enable
    description: DMA enabled until turned off.
    value: 2
enum/SdmactrlDmawidth:
  bit_size: 2
  variants:
  - name: Byte0
    description: Byte.
    value: 0
  - name: Byte1
    description: Byte.
    value: 1
  - name: HalfWord
    description: Half word (16 bits).
    value: 2
enum/SdynaddrDavalid:
  bit_size: 1
  variants:
  - name: Danotassigned
    description: 'DANOTASSIGNED: a Dynamic Address is not assigned.'
    value: 0
  - name: Daassigned
    description: 'DAASSIGNED: a Dynamic Address is assigned.'
    value: 1
enum/SstatusStart:
  bit_size: 1
  variants:
  - name: StartNotDetected
    description: No START seen.
    value: 0
  - name: StartDetected
    description: A START or repeated START was seen after the START bit was last cleared.
    value: 1
enum/SstatusTimectrl:
  bit_size: 2
  variants:
  - name: NoTimeControl
    description: NO_TIME_CONTROL.
    value: 0
  - name: Sync
    description: SYNC_MODE.
    value: 1
  - name: AsyncMode
    description: ASYNC_MODE.
    value: 2
  - name: Bothsyncasync
    description: BOTHSYNCASYNC.
    value: 3
enum/SstatusTxnotfull:
  bit_size: 1
  variants:
  - name: Full
    description: Transmit buffer full.
    value: 0
  - name: NotFull
    description: Transmit buffer not full.
    value: 1
enum/State:
  bit_size: 3
  variants:
  - name: Idle
    description: IDLE.
    value: 0
  - name: Slvreq
    description: SLVREQ.
    value: 1
  - name: Msgsdr
    description: MSGSDR.
    value: 2
  - name: Normact
    description: NORMACT.
    value: 3
  - name: Ddr
    description: MSGDDR.
    value: 4
  - name: Daa
    description: DAA.
    value: 5
  - name: Ibiack
    description: IBIACK.
    value: 6
  - name: Ibircv
    description: IBIRCV.
    value: 7
enum/Stccch:
  bit_size: 1
  variants:
  - name: Idle
    description: No CCC message is being handled.
    value: 0
  - name: Busy
    description: A CCC message is being handled automatically.
    value: 1
enum/Stmsg:
  bit_size: 1
  variants:
  - name: Idle
    description: Bus target not listening or responding.
    value: 0
  - name: Busy
    description: This bus target is listening to the bus traffic or responding.
    value: 1
enum/Stnotstop:
  bit_size: 1
  variants:
  - name: Stopped
    description: I3C module is in a STOP condition.
    value: 0
  - name: Busy
    description: The bus is busy (has activity).
    value: 1
enum/Streqrd:
  bit_size: 1
  variants:
  - name: Idle
    description: REQ in process is not an SDR read from this target.
    value: 0
  - name: Busy
    description: The REQ in process is an SDR read from this target, or an In-Band Interrupt (IBI) is being pushed out.
    value: 1
enum/Streqwr:
  bit_size: 1
  variants:
  - name: Idle
    description: REQ in process is not SDR write data from the controller.
    value: 0
  - name: Busy
    description: REQ in process is SDR write data from the controller to this bus target (or all targets), but not in ENTDAA
      mode.
    value: 1
enum/Type:
  bit_size: 2
  variants:
  - name: I3c
    description: I3C.
    value: 0
  - name: I2c
    description: I2C.
    value: 1
  - name: Ddr
    description: DDR.
    value: 2
