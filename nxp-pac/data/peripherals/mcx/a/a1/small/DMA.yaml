# MCXAP64M96FS3RM Rev. 7 (2024-10-22), DMA chapter.
# Small-group source XML register resets restored by explicit offline onboarding.
# Compatible curated A1 layouts reused where applicable; shared sources remain unchanged.
fieldset/ChGrpri:
  description: Channel Arbitration Group.
  fields:
  - name: grpri
    description: Arbitration Group For Channel n.
    bit_offset: 0
    bit_size: 5
  reset_value: 0
fieldset/MpCsr:
  description: Management Page Control.
  fields:
  - name: edbg
    description: Enable Debug.
    bit_offset: 1
    bit_size: 1
  - name: erca
    description: Enable Round Robin Channel Arbitration.
    bit_offset: 2
    bit_size: 1
  - name: hae
    description: "Halt After Error.\n\nRaw bit values: false (0) = NormalOperation: Normal operation.; true (1) = Halt: Any error causes the HALT field to be set to 1."
    bit_offset: 4
    bit_size: 1
  - name: halt
    description: "Halt DMA Operations.\n\nRaw bit values: false (0) = NormalOperation: Normal operation.; true (1) = Stall: Stall the start of any new channels."
    bit_offset: 5
    bit_size: 1
  - name: gclc
    description: Global Channel Linking Control.
    bit_offset: 6
    bit_size: 1
  - name: gmrc
    description: Global Master ID Replication Control.
    bit_offset: 7
    bit_size: 1
  - name: ecx
    description: "Cancel Transfer With Error.\n\nRaw bit values: false (0) = NormalOperation: Normal operation.; true (1) = Cancel: Cancel the remaining data transfer."
    bit_offset: 8
    bit_size: 1
  - name: cx
    description: "Cancel Transfer.\n\nRaw bit values: false (0) = NormalOperation: Normal operation.; true (1) = DataTransferCancel: Cancel the remaining data transfer."
    bit_offset: 9
    bit_size: 1
  - name: active_id
    description: Active Channel ID.
    bit_offset: 24
    bit_size: 2
  - name: active
    description: "DMA Active Status.\n\nRaw bit values: false (0) = Idle: eDMA is idle.; true (1) = Execution: eDMA is executing a channel."
    bit_offset: 31
    bit_size: 1
  reset_value: 3211264
fieldset/MpEs:
  description: Management Page Error Status.
  fields:
  - name: dbe
    description: "Destination Bus Error.\n\nRaw bit values: false (0) = NoError: No destination bus error.; true (1) = BusError: Last recorded error was a bus error on a destination write."
    bit_offset: 0
    bit_size: 1
  - name: sbe
    description: "Source Bus Error.\n\nRaw bit values: false (0) = NoError: No source bus error.; true (1) = BusError: Last recorded error was a bus error on a source read."
    bit_offset: 1
    bit_size: 1
  - name: sge
    description: "Scatter/Gather Configuration Error.\n\nRaw bit values: false (0) = NoError: No scatter/gather configuration error.; true (1) = ConfigurationError: Last recorded error was a configuration error detected in the TCDn_DLAST_SGA field."
    bit_offset: 2
    bit_size: 1
  - name: nce
    description: "NBYTES/CITER Configuration Error.\n\nRaw bit values: false (0) = NoError: No NBYTES/CITER configuration error.; true (1) = ConfigurationError: The last recorded error was NBYTES equal to zero or a CITER not equal to BITER error."
    bit_offset: 3
    bit_size: 1
  - name: doe
    description: "Destination Offset Error.\n\nRaw bit values: false (0) = NoError: No destination offset configuration error.; true (1) = ConfigurationError: Last recorded error was a configuration error detected in the TCDn_DOFF field."
    bit_offset: 4
    bit_size: 1
  - name: dae
    description: "Destination Address Error.\n\nRaw bit values: false (0) = NoError: No destination address configuration error.; true (1) = ConfigurationError: Last recorded error was a configuration error detected in the TCDn_DADDR field."
    bit_offset: 5
    bit_size: 1
  - name: soe
    description: "Source Offset Error.\n\nRaw bit values: false (0) = NoError: No source offset configuration error.; true (1) = ConfigurationError: Last recorded error was a configuration error detected in the TCDn_SOFF field."
    bit_offset: 6
    bit_size: 1
  - name: sae
    description: "Source Address Error.\n\nRaw bit values: false (0) = NoError: No source address configuration error.; true (1) = ConfigurationError: Last recorded error was a configuration error detected in the TCDn_SADDR field."
    bit_offset: 7
    bit_size: 1
  - name: ecx
    description: "Transfer Canceled.\n\nRaw bit values: false (0) = NoCanceledTransfers: No canceled transfers.; true (1) = CanceledTransfer: Last recorded entry was a canceled transfer by the error cancel transfer input."
    bit_offset: 8
    bit_size: 1
  - name: errchn
    description: Error Channel Number or Canceled Channel Number.
    bit_offset: 24
    bit_size: 2
  - name: vld
    description: "Valid.\n\nRaw bit values: false (0) = NoFieldSetOne: No CHn_ES[ERR] fields are set to 1.; true (1) = AtleastOneField: At least one CHn_ES[ERR] field is set to 1, indicating a valid error exists that software has not cleared."
    bit_offset: 31
    bit_size: 1
  reset_value: 0
fieldset/MpHrs:
  description: Management Page Hardware Request Status.
  fields:
  - name: hrs
    description: Hardware Request Status.
    bit_offset: 0
    bit_size: 32
  reset_value: 0
fieldset/MpInt:
  description: Management Page Interrupt Request Status.
  fields:
  - name: int
    description: Interrupt Request Status.
    bit_offset: 0
    bit_size: 4
  reset_value: 0
block/Dma4:
  description: DMA MP.
  items:
  - name: mp_csr
    description: Management Page Control.
    byte_offset: 0
    fieldset: MpCsr
  - name: mp_es
    description: Management Page Error Status.
    byte_offset: 4
    access: Read
    fieldset: MpEs
  - name: mp_int
    description: Management Page Interrupt Request Status.
    byte_offset: 8
    access: Read
    fieldset: MpInt
  - name: mp_hrs
    description: Management Page Hardware Request Status.
    byte_offset: 12
    access: Read
    fieldset: MpHrs
  - name: ch_grpri
    description: Channel Arbitration Group.
    array:
      len: 4
      stride: 4
    byte_offset: 256
    fieldset: ChGrpri
