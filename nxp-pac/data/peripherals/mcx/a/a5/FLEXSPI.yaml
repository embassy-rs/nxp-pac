fieldset/Flshcr4:
  description: Flash Control 4.
  fields:
  - name: wmopt1
    description: Write Mask Option 1.
    bit_offset: 0
    bit_size: 1
  - name: wmena
    description: "Write Mask Enable for Port A.\n\nRaw bit values: false (0) = Val0: Disabled. When writing to external device, DQS(RWDS) pin is not driven.; true (1) = Val1: Enabled. When writing to external device, FlexSPI drives DQS(RWDS) pin as write mask output."
    bit_offset: 2
    bit_size: 1
  - name: wmenb
    description: "Write Mask Enable for Port B.\n\nRaw bit values: false (0) = Val0: Disabled. When writing to external device, DQS(RWDS) pin is not driven.; true (1) = Val1: Enabled. When writing to external device, FlexSPI drives DQS(RWDS) pin as write mask output."
    bit_offset: 3
    bit_size: 1
  - name: sckrstdisabled
    description: "SCLK Reset Disable.\n\nRaw bit values: false (0) = Val0: SCLK is reset to default level before PCS signal is deasserted.; true (1) = Val1: SCLK is reset to default level after PCS signal is deasserted."
    bit_offset: 4
    bit_size: 1
  - name: dqsposcap
    description: "DQS POS Capture.\n\nRaw bit values: false (0) = Val0: DQS falling edge is used to capture the RX data.; true (1) = Val1: DQS rising edge is used to capture the RX data."
    bit_offset: 5
    bit_size: 1
  - name: wmopt1b
    description: "Write Mask Option 1B.\n\nRaw bit values: false (0) = Val0: DQSB used as Write Mask when writing to external device.; true (1) = Val1: DQSB not used as Write Mask when writing to external device."
    bit_offset: 6
    bit_size: 1
  - name: wmopt2b
    description: "Write Mask Option 2B.\n\nRaw bit values: false (0) = Val0: DQSB is used as Write Mask when writing to external device.; true (1) = Val1: DQSB is not used as Write Mask when writing to external device."
    bit_offset: 7
    bit_size: 1
  - name: wmoptdiff
    description: "Write Mask Option Differential.\n\nRaw bit values: false (0) = Val0: Write Mask behaves same on PORTA and PORTB, controlled by WMOPT1 and WMOPT2.; true (1) = Val1: Write Mask behaves differently. WMOPT1 and WMOPT2 control PORTA. WMOPT1B and WMOPT2B control PORTB."
    bit_offset: 8
    bit_size: 1
