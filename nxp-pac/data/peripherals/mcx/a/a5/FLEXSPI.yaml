    description: "Software Reset.\n\nRaw bit values: false (0) = Val0: No impact.; true (1) = Val1: Software reset."
    bit_offset: 0
    bit_size: 1
  - name: mdis
    description: "Module Disable.\n\nRaw bit values: false (0) = Val0: No impact.; true (1) = Val1: Module disable."
    bit_offset: 1
    bit_size: 1
  - name: endcfg
    description: AHB and IPS Bus Endian Configuration.
    bit_offset: 2
    bit_size: 2
    enum: Endcfg
  - name: rxclksrc
    description: Sample Clock Source for Flash Reading.
    bit_offset: 4
    bit_size: 2
    enum: Rxclksrc
  - name: ardfen
    description: "AHB Read Access to IP Receive FIFO Enable.\n\nRaw bit values: false (0) = Val0: AHB read access disabled. IP bus reads IP receive FIFO. AHB Bus read access to IP receive FIFO memory space produces bus error.; true (1) = Val1: AHB read access enabled. AHB bus reads IP receive FIFO. IP Bus read access to IP receive FIFO memory space returns data zero and causes no bus error."
    bit_offset: 6
    bit_size: 1
  - name: atdfen
    description: "AHB Write Access to IP Transmit FIFO Enable.\n\nRaw bit values: false (0) = Val0: AHB write access disabled. IP bus writes to IP transmit FIFO. AHB bus write access to IP transmit FIFO memory space produces bus error.; true (1) = Val1: AHB write access enabled. AHB bus writes to IP transmit FIFO. IP Bus write access to IP transmit FIFO memory space is ignored and causes no bus error."
    bit_offset: 7
    bit_size: 1
