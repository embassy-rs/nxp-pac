    description: Serial Root Clock Divider.
    bit_offset: 8
    bit_size: 3
    enum: Serclkdiv
  - name: hsen
    description: "Half Speed Serial Flash Memory Access Enable.\n\nRaw bit values: false (0) = Val0: Disable.; true (1) = Val1: Enable."
    bit_offset: 11
    bit_size: 1
  - name: dozeen
    description: "Doze Mode Enable.\n\nRaw bit values: false (0) = Val0: Disable.; true (1) = Val1: Enable."
    bit_offset: 12
    bit_size: 1
  - name: combinationen
    description: Combination Mode Enable.
    bit_offset: 13
    bit_size: 1
  - name: sckfreerunen
    description: SCLK Free-running Enable.
    bit_offset: 14
    bit_size: 1
  - name: learnen
