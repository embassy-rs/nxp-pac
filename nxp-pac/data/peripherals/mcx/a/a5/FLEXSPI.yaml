    bit_offset: 16
    bit_size: 16
fieldset/Mcr2:
  description: Module Control 2.
  fields:
  - name: abortoncmden
    description: "Abort on Command Enable.\n\nRaw bit values: false (0) = Val0: When command abort request is received during CMD instruction, command sequence waits for the CMD instruction to complete instead of aborting immediately.; true (1) = Val1: When command abort request is received during CMD instruction, command sequence is aborted immediately."
    bit_offset: 0
    bit_size: 1
  - name: abortonraddren
    description: Allow Command Sequence Abort during RADDR.
    bit_offset: 1
    bit_size: 1
  - name: abortoncaddren
    description: Allow Command Sequence Abort during CADDR.
    bit_offset: 2
    bit_size: 1
  - name: abortonmodeen
    description: Allow Command Sequence Abort during MODE.
    bit_offset: 3
    bit_size: 1
  - name: abortondummyen
    description: Allow Command Sequence Abort during DUMMY.
    bit_offset: 4
    bit_size: 1
  - name: abortonwriteen
    description: Allow Command Sequence Abort during WRITE.
    bit_offset: 5
    bit_size: 1
  - name: abortonreaden
    description: Allow Command Sequence Abort during READ.
    bit_offset: 6
    bit_size: 1
  - name: abortonlearnen
    description: Allow Command Sequence Abort during LEARN.
    bit_offset: 7
    bit_size: 1
  - name: abortondatszen
    description: Allow Command Sequence Abort during DATSZ.
    bit_offset: 8
    bit_size: 1
  - name: clrahbbufopt
    description: "Clear AHB Buffer.\n\nRaw bit values: false (0) = Val0: Not cleared automatically.; true (1) = Val1: Cleared automatically."
    bit_offset: 11
    bit_size: 1
  - name: sck2opt
    description: "SCLK2 Toggle Output.\n\nRaw bit values: false (0) = Val0: SCLK2 output clock toggles for READ and LEARN instructions only.; true (1) = Val1: SCLK2 output clock toggles for entire sequence."
    bit_offset: 12
    bit_size: 1
  - name: tstmd
    description: "Test Mode Enable.\n\nRaw bit values: false (0) = Val0: Disable. Sequence execution is started when IP or AHB command triggers it as normal.; true (1) = Val1: Enable. Sequence execution is not started after IP or AHB command triggers it. It remains blocked until ipt_tester_trigger input (another pin for test) is high. A high pulse of serial clock domain is required."
    bit_offset: 13
    bit_size: 1
  - name: clrlearnphase
    description: "Clear Learn Phase Selection.\n\nRaw bit values: false (0) = Val0: No impact.; true (1) = Val1: Reset sample clock phase selection to 0."
    bit_offset: 14
    bit_size: 1
  - name: samedeviceen
    description: "Same Device Enable.\n\nRaw bit values: false (0) = IndividualParallel: In Individual mode, FLSHA1CRx and FLSHA2CRx, FLSHB1CRx and FLSHB2CRx settings are applied to Flash A1, A2, B1, B2 separately. In Parallel mode, FLSHA1CRx register setting is applied to Flash A1 and B1, FLSHA2CRx register setting is applied to Flash A2 and B2. FLSHB1CRx and FLSHB2CRx register settings are ignored.; true (1) = Enable: FLSHA1CR0, FLSHA1CR1, and FLSHA1CR2 register settings are applied to Flash A1, A2, B1, B2. FLSHA2CRx, FLSHB1CRx, and FLSHB2CRx settings are ignored."
    bit_offset: 15
    bit_size: 1
  - name: flashdqsopt
    description: "Flash DQS Option.\n\nRaw bit values: false (0) = Val0: FlexSPI drives toggling SCLK output until it receives all flash read data bits. There will be an extra SCLK cycle after all read data bits are returned on SPI bus.; true (1) = Val1: FlexSPI drives SCLK output according to read data size and pad number (no extra SCLK toggling). If there is DQS latency, FlexSPI receives less data than required. Never set this bit if there is DQS latency."
    bit_offset: 16
    bit_size: 1
  - name: rxdelayopt
    description: Option bit for RX data sampling (when MCR0[RXCLKSRC] is not set to 0x3), for internal use only.
    bit_offset: 17
    bit_size: 2
    enum: Rxdelayopt
  - name: sckbdiffopt
    description: "SCLK Port B Differential Output.\n\nRaw bit values: false (0) = Val1: Use B_SCLK pad as port B SCLK clock output. Port B flash memory access is available.; true (1) = Val0: Use B_SCLK pad as port A SCLK inverted clock output (Differential clock to A_SCLK). Port B flash memory access is not available."
    bit_offset: 19
    bit_size: 1
  - name: clkphaserst
    description: Clock Phase Reset.
    bit_offset: 20
    bit_size: 1
  - name: rxclksrc_b
    description: Port B Receiver Clock Source.
