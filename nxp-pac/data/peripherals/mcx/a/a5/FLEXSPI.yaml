    description: AHB Controller ID.
    bit_offset: 16
    bit_size: 4
  - name: priority
    description: AHB Controller Read Priority.
    bit_offset: 24
    bit_size: 3
  - name: regionen
    description: "AHB Receive Buffer Address Region Enable.\n\nRaw bit values: false (0) = Value0: Disabled. The buffer hit is based on the value of MSTRID only.; true (1) = Value1: Enabled. The buffer hit is based on the value of MSTRID and the address within AHBBUFREGIONSTARTn and AHBREGIONENDn."
    bit_offset: 30
    bit_size: 1
  - name: prefetchen
    description: "AHB Read Prefetch Enable.\n\nRaw bit values: false (0) = Value0: Disabled.; true (1) = Value1: Enabled when is enabled."
    bit_offset: 31
    bit_size: 1
