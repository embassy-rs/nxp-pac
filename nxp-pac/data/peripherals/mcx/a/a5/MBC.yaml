    byte_offset: 8
    access: Read
    fieldset: Mem2Glbcfg
  - name: mbc0_mem3_glbcfg
    description: MBC Global Configuration Register.
    byte_offset: 12
    fieldset: Mem3Glbcfg
  - name: mbc0_memn_glbac0
    description: MBC Global Access Control.
    byte_offset: 32
    fieldset: MemnGlbac0
  - name: mbc0_memn_glbac1
    description: 'Effectively read-only: detailed manual says this policy is not writable despite generic map RW.'
    byte_offset: 36
    fieldset: MemnGlbac1
    access: Read
  - name: mbc0_memn_glbac2
    description: 'Effectively read-only: detailed manual says this policy is not writable despite generic map RW.'
    byte_offset: 40
    fieldset: MemnGlbac2
    access: Read
  - name: mbc0_memn_glbac3
