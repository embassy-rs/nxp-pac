# MCXAP172M240F70RM Rev. 1, sections64.1/64.5.1. Includes MEM1 words2/3 and effective RO fixed policies.
block/Mbc:
  description: Memory block checker. Word writes only. GLIKEY index15 protects MBC registers. Choosing a locked global policy locks the corresponding block selector until reset. Chip-specific flash accesses are SecureUser; the manual advises not setting NSE.
