    description: GDET reference clock enable bit.
    bit_offset: 0
    bit_size: 1
  - name: trng_refclk_en
    description: ELS TRNG reference clock enable bit.
    bit_offset: 1
    bit_size: 1
fieldset/RefClkCtrlClr:
  description: FRO 48MHz Reference Clock Control Clear.
  fields:
  - name: gdet_refclk_en_clr
    description: GDET reference clock enable clear bit.
    bit_offset: 0
    bit_size: 1
  - name: trng_refclk_en_clr
    description: ELS TRNG reference clock enable clear bit.
    bit_offset: 1
    bit_size: 1
fieldset/RefClkCtrlSet:
  description: FRO 48MHz Reference Clock Control Set.
  fields:
  - name: gdet_refclk_en_set
    description: GDET reference clock enable set bit.
    bit_offset: 0
    bit_size: 1
  - name: trng_refclk_en_set
    description: ELS TRNG reference clock enable set bit.
    bit_offset: 1
    bit_size: 1
