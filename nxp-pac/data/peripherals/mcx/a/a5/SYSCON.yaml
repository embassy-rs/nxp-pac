  - name: usb_hs
    description: RAMX0 address remap for USB-HS.
    bit_offset: 26
    bit_size: 2
    enum: RemapUsbHs
  - name: lock
    description: This 1-bit field provides a mechanism to limit writes to this register to protect its contents. Once set, this bit remains asserted until a system reset.
    bit_offset: 31
    bit_size: 1
    enum: ProtlvlLock
