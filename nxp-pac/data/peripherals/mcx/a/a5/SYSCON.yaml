  - name: dma0
    description: RAMX0 address remap for DMA0.
    bit_offset: 8
    bit_size: 2
    enum: RemapDma0
  - name: dma1
    description: RAMX0 address remap for DMA1.
    bit_offset: 10
    bit_size: 2
    enum: RemapDma1
  - name: pkc_els
    description: RAMX0 address remap for PKC_ELS.
    bit_offset: 12
    bit_size: 2
    enum: RemapPkcEls
  - name: coolflux_y_espi
    description: RAMX0 address remap for ESPI.
    bit_offset: 20
    bit_size: 2
