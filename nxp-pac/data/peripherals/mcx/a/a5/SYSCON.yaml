enum/ApHsDevNeedclk:
  bit_size: 1
  variants:
  - name: HwCtrl
    description: HOST_NEEDCLK is under hardware control.
    value: 0
  - name: Forced
    description: HOST_NEEDCLK is forced high.
    value: 1
enum/DevNeedclk:
  bit_size: 1
  variants:
  - name: Low
    description: DEV_NEEDCLK is low.
    value: 0
  - name: High
    description: DEV_NEEDCLK is high.
    value: 1
enum/HostNeedclk:
  bit_size: 1
  variants:
  - name: Low
    description: HOST_NEEDCLK is low.
    value: 0
  - name: High
    description: HOST_NEEDCLK is high.
    value: 1
enum/HsDevWakeupN:
  bit_size: 1
  variants:
  - name: ForceWup
    description: Forces USB1_PHY to wake-up.
    value: 0
  - name: NormalWup
    description: Normal USB1_PHY behavior.
    value: 1
enum/I3c0SclFilt:
  bit_size: 4
  variants:
  - name: Disable
    description: Disabled filter function when I3C0 SDA_FILT=0b0000.
    value: 0
  - name: FiltCnt
    description: Enable Spike filter on SCL input. Non_zero value means width of Glitch on SCL line to be filtered in number of half cycles of CLK_FLT.
    value: 1
enum/I3c0SdaFilt:
  bit_size: 4
  variants:
  - name: Disable
    description: Disabled filter function when I3C0 SCL_FILT=0b0000.
    value: 0
  - name: FiltNum
    description: Enable Spike filter on SDA input. Non_zero value means width of Glitch on SDA line to be filtered in number of half cycles of CLK_FLT.
    value: 1
enum/I3c1SclFilt:
  bit_size: 4
  variants:
  - name: Disable
    description: Disabled filter function when SDA_FILT=0b0000.
    value: 0
  - name: FiltNum
    description: Enable Spike filter on SCL input. Non_zero value means width of Glitch on SCL line to be filtered in number of half cycles of CLK_FLT.
    value: 1
enum/I3c1SdaFilt:
  bit_size: 4
  variants:
  - name: Disable
    description: Disabled filter function when I3C1 SCL_FILT=0b0000.
    value: 0
  - name: FiltNum
    description: Enable Spike filter on SDA input. Non_zero value means width of Glitch on SDA line to be filtered in number of half cycles of CLK_FLT.
    value: 1
enum/I3c2SclFilt:
  bit_size: 4
  variants:
  - name: Disable
    description: Disabled filter function when I3C2 SDA_FILT=0b0000.
    value: 0
  - name: FiltNum
    description: Enable Spike filter on SCL input. Non_zero value means width of Glitch on SCL line to be filtered in number of half cycles of CLK_FLT.
    value: 1
enum/I3c2SdaFilt:
  bit_size: 4
  variants:
  - name: Disable
    description: Disabled filter function when I3C2 SCL_FILT=0b0000.
    value: 0
  - name: FiltNum
    description: Enable Spike filter on SDA input. Non_zero value means width of Glitch on SDA line to be filtered in number of half cycles of CLK_FLT.
    value: 1
enum/LockIfr1:
  bit_size: 1
  variants:
  - name: Enable
    description: No lock access to IFR1.
    value: 0
  - name: Disable
    description: Lock access to IFR1.
    value: 1
enum/MiscphantomRamSize:
  bit_size: 2
  variants:
  - name: Size256kb
    description: 256KB (RAMX0~X3, RAMA0~A7).
    value: 0
  - name: Size512kb
    description: 512KB (RAMX0~X3, RAMA0~A11, RAMB0~B3).
    value: 1
  - name: SizeMax
    description: 640KB.
    value: 3
enum/PhySel:
  bit_size: 1
  variants:
  - name: Phy
    description: Selects external PHY.
    value: 0
  - name: T1s
    description: Selects on-chip 10BASE-T1S.
    value: 1
enum/PolHsDevNeedclk:
  bit_size: 1
  variants:
  - name: Falling
    description: Falling edge of DEV_NEEDCLK triggers wake-up.
    value: 0
  - name: Rising
    description: Rising edge of DEV_NEEDCLK triggers wake-up.
    value: 1
enum/PolHsHostNeedclk:
  bit_size: 1
  variants:
  - name: Falling
    description: Falling edge of HOST_NEEDCLK triggers wake-up.
    value: 0
  - name: Rising
    description: Rising edge of HOST_NEEDCLK triggers wake-up.
    value: 1
enum/RemapCoolfluxYEspi:
  bit_size: 2
  variants:
  - name: CoolfluxYEspi0
    description: 'RAMX0: alias space is disabled.'
    value: 0
  - name: CoolfluxYEspi1
    description: 'RAMX0: same alias space as CPU0_SBUS.'
    value: 1
enum/RemapDma1:
  bit_size: 2
  variants:
  - name: Dma10
    description: 'RAMX0: alias space is disabled.'
    value: 0
  - name: Dma11
    description: 'RAMX0: same alias space as CPU0_SBUS.'
    value: 1
enum/RemapPkcEls:
  bit_size: 2
  variants:
  - name: PkcEls0
    description: 'RAMX0: alias space is disabled.'
    value: 0
  - name: PkcEls1
    description: 'RAMX0: same alias space as CPU0_SBUS.'
    value: 1
enum/RemapUsbFsEnet:
  bit_size: 2
  variants:
  - name: UsbFsEnet0
    description: 'RAMX0: alias space is disabled.'
    value: 0
  - name: UsbFsEnet1
    description: 'RAMX0: same alias space as CPU0_SBUS.'
    value: 1
enum/RemapUsbHs:
  bit_size: 2
  variants:
  - name: UsbHs0
    description: 'RAMX0: alias space is disabled.'
    value: 0
  - name: UsbHs1
    description: 'RAMX0: same alias space as CPU0_SBUS.'
    value: 1
fieldset/AhbmatprioA5:
  description: AHB Matrix Priority Control.
  fields:
  - name: cpu0_cbus
    description: CPU0 C-AHB bus master priority level.
    bit_offset: 0
    bit_size: 2
    enum: AhbmatprioCpu0Sbus
  - name: cpu0_sbus
    description: CPU0 S-AHB bus master priority level.
    bit_offset: 2
    bit_size: 2
    enum: AhbmatprioCpu0Sbus
  - name: cpu1_cbus_smart_dma_i
    description: SmartDMA-I bus master priority level.
    bit_offset: 4
    bit_size: 2
    enum: AhbmatprioCpu0Sbus
  - name: cpu1_sbus_smart_dma_d
    description: SmartDMA-D bus master priority level.
    bit_offset: 6
    bit_size: 2
    enum: AhbmatprioCpu0Sbus
  - name: dma0
    description: DMA0 controller bus master priority level.
    bit_offset: 8
    bit_size: 2
    enum: AhbmatprioCpu0Sbus
  - name: dma1
    description: DMA1 controller bus master priority level.
    bit_offset: 10
    bit_size: 2
    enum: AhbmatprioCpu0Sbus
  - name: pkc_els
    description: PKC and ELS bus master priority level.
    bit_offset: 12
    bit_size: 2
    enum: AhbmatprioCpu0Sbus
  - name: coolflux_y_espi
    description: ESPI bus master priority level.
    bit_offset: 20
    bit_size: 2
    enum: AhbmatprioCpu0Sbus
  - name: usb_fs_enet
    description: ENET bus master priority level.
    bit_offset: 24
    bit_size: 2
    enum: AhbmatprioCpu0Sbus
  - name: usb_hs
    description: USB-HS bus master priority level.
    bit_offset: 26
    bit_size: 2
    enum: AhbmatprioCpu0Sbus
fieldset/Bufferingahb2vpb0:
  description: Buffering of write accesses on the Synchronous System configuration APB interface.
  fields:
  - name: inputmux0
    description: Enables buffering of write accesses on the peripheral input mux distribute APB interface:.
    bit_offset: 1
    bit_size: 1
  - name: i3c0
    description: Enables buffering of write accesses on I3C0 APB interface.
    bit_offset: 2
    bit_size: 1
  - name: ctimer0
    description: Enables buffering of write accesses on CTIMER0 APB interface.
    bit_offset: 4
    bit_size: 1
  - name: ctimer1
    description: Enables buffering of write accesses on CTIMER1 APB interface.
    bit_offset: 5
    bit_size: 1
  - name: ctimer2
    description: Enables buffering of write accesses on CTIMER2 APB interface.
    bit_offset: 6
    bit_size: 1
  - name: ctimer3
    description: Enables buffering of write accesses on CTIMER3 APB interface.
    bit_offset: 7
    bit_size: 1
  - name: ctimer4
    description: Enables buffering of write accesses on CTIMER4 APB interface.
    bit_offset: 8
    bit_size: 1
  - name: freqme
    description: Enables buffering of write accesses on freqme APB interface.
    bit_offset: 9
    bit_size: 1
  - name: utick
    description: Enables buffering of write accesses on micro Tick APB interface.
    bit_offset: 11
    bit_size: 1
  - name: wwdt0
    description: Enables buffering of write accesses on wwdt0 APB interface.
    bit_offset: 12
    bit_size: 1
  - name: wwdt1
    description: Enables buffering of write accesses on wwdt1 APB interface.
    bit_offset: 13
    bit_size: 1
  - name: smart_dma0
    description: Enables buffering of write accesses on SmartDMA0 APB interface.
    bit_offset: 14
    bit_size: 1
fieldset/DeviceId0A5:
  description: Device ID.
  fields:
  - name: ram_size
    description: Indicates the device's ram size.
    bit_offset: 0
    bit_size: 4
    enum: RamSize
  - name: flash_size
    description: Indicates the device's flash size.
    bit_offset: 4
    bit_size: 4
    enum: FlashSize
  - name: rom_rev_minor
    description: Indicates the device's ROM revision.
    bit_offset: 20
    bit_size: 4
  - name: security
    description: CM33_SECURITY_EXTENSION_DISABLE[3:0], which is loaded from soctrim0[87:84].
    bit_offset: 24
    bit_size: 4
    enum: Security
fieldset/EnetCtrl:
  description: Ethernet Control.
  fields:
  - name: phy_intf
    description: Selects external PHY interface.
    bit_offset: 2
    bit_size: 1
    enum: PhyIntf
  - name: phy_sel
    description: Selects external PHY or on-chip 10BASE-T1S.
    bit_offset: 3
    bit_size: 1
    enum: PhySel
fieldset/EnetSbdFlowCtrl:
  description: Sideband Flow Control.
  fields:
  - name: sel_ch0
    description: Sideband Flow Control for channel0.
    bit_offset: 0
    bit_size: 1
fieldset/Flashsizecfg:
  description: Flash size configuration.
  fields:
  - name: maxaddr0
    description: Size of Flash Block 0.
    bit_offset: 0
    bit_size: 8
  - name: maxaddr1
    description: Size of Flash Block 1.
    bit_offset: 8
    bit_size: 8
fieldset/I3cMiscCtrl:
  description: Chip Special I3C Control.
  fields:
  - name: i3c0_scl_filt
    description: Disables/enables the I3C0 filter function on SCL pin.
    bit_offset: 0
    bit_size: 4
    enum: I3c0SclFilt
  - name: i3c0_sda_filt
    description: Disables/enables the I3C0 filter function on SDA pin.
    bit_offset: 4
    bit_size: 4
    enum: I3c0SdaFilt
  - name: i3c1_scl_filt
    description: Disables/enables the I3C1 filter I3C1 function on SCL pin.
    bit_offset: 8
    bit_size: 4
    enum: I3c1SclFilt
  - name: i3c1_sda_filt
    description: Disables/enables the I3C1 filter function on SDA pin.
    bit_offset: 12
    bit_size: 4
    enum: I3c1SdaFilt
  - name: i3c2_scl_filt
    description: Disables/enables the I3C2 filter function on SCL pin.
    bit_offset: 16
    bit_size: 4
    enum: I3c2SclFilt
  - name: i3c2_sda_filt
    description: Disables/enables the I3C2 filter function on SDA pin.
    bit_offset: 20
    bit_size: 4
    enum: I3c2SdaFilt
fieldset/Miscphantom:
  description: MISC Phantom control register.
  fields:
  - name: ram_size
    description: System RAM size phantom control.
    bit_offset: 0
    bit_size: 2
    enum: MiscphantomRamSize
  - name: rama_ecc
    description: RAMA ECC enable.
    bit_offset: 8
    bit_size: 1
  - name: flexcan_fd_en
    description: FLEXCAN_FD enable.
    bit_offset: 17
    bit_size: 1
fieldset/NvmCtrlA5:
  description: NVM Control.
  fields:
  - name: dis_flash_spec
    description: Flash speculation control.
    bit_offset: 0
    bit_size: 1
    enum: DisFlashSpec
  - name: dis_data_spec
    description: Flash data speculation control.
    bit_offset: 1
    bit_size: 1
    enum: DisDataSpec
  - name: lock_ifr1
    description: FLASH IFR1 lock access control.
    bit_offset: 9
    bit_size: 1
    enum: LockIfr1
  - name: flash_stall_en
    description: FLASH stall on busy control.
    bit_offset: 10
    bit_size: 1
    enum: FlashStallEn
  - name: dis_mbecc_err_inst
    description: Bus error on data multi-bit ECC error control Set this field to 0 if you want to enable flash speculative.
    bit_offset: 16
    bit_size: 1
    enum: DisMbeccErrInst
  - name: dis_mbecc_err_data
    description: Bus error on data multi-bit ECC error control Set this field to 0 if you want to enable flash speculative.
    bit_offset: 17
    bit_size: 1
    enum: DisMbeccErrData
fieldset/RamCaspCtrl:
  description: Controls Shared RAM Integration.
  fields:
  - name: interleave
    description: Controls RAM access for RAMA1 and RAMA2.
    bit_offset: 0
    bit_size: 1
