fieldset/Data:
  description: 'TSI Data and Status Register. TSICNT is read-only. EOSF, OVERRUNF, OUTRGF and DPD_OUTRGF are write-one-to-clear:
    write only intended flag bits, not read-modify-write. DMA transfer clears EOSF/OUTRGF automatically. DPD_OUTRGF
    can be read only with GENCS.TSIEN_DPD=1. OVERRUNF encoding descriptions contradict the assertion prose; no polarity
    enum is supplied.'
  bit_size: 32
  reset_value: 0
  fields:
  - name: tsicnt
    description: TSI Conversion Counter Value
    bit_offset: 0
    bit_size: 16
  - name: tsicnt_overflow_flag
    description: 'TSI Counter Overflow Flag. Encodings: 0: The DATA[TSICNT] value has no overflow occurrence in
      the last scan process; 1: The DATA[TSICNT] value has an overflow occurrence in the last scan process'
    bit_offset: 16
    bit_size: 1
  - name: eosf
    description: 'End of Scan Flag. Encodings: 0: Scan is not done; 1: Scan is done'
    bit_offset: 27
    bit_size: 1
  - name: overrunf
    description: Overrun flag, write-one-to-clear according to the register diagram. The assertion prose says a
      trigger or configuration write during an active scan asserts the flag, but the encoding list reverses that
      polarity (59.6.1.25); no polarity enum is supplied.
    bit_offset: 29
    bit_size: 1
  - name: outrgf
    description: 'Out of Range Flag. Encodings: 0: The counter value is not out of range; 1: The counter value is
      out of range'
    bit_offset: 30
    bit_size: 1
  - name: dpd_outrgf
    description: 'DPD Out of Range Flag. Encodings: 0: The counter value is not out of range; 1: The counter value
      is out of range'
    bit_offset: 31
    bit_size: 1
fieldset/Misc:
  description: TSI Miscellaneous Register. DPD_MODE_ENABLE=1 updates the 3 V domain configuration latch; 0 holds
    it. CAP_BANK_148FF is named in fF but 59.6.1.26 gives pF values; see source conflict note, do not infer a unit
    conversion from its name.
  bit_size: 32
  reset_value: 0
  fields:
  - name: cap_bank_2500ff
    description: 'Enable the 2500fF caps inside cap bank. Encodings: 0: Enable another 2.5 pF in cap bank; 1: Enable
      another 5.0 pF in cap bank; 2: Enable another 7.5 pF in cap bank; 3: Enable another 10 pF in cap bank; 4:
      Enable another 12.5 pF in cap bank; 5: Enable another 15 pF in cap bank; 6: Enable another 17.5 pF in cap
      bank; 7: Enable another 20 pF in cap bank'
    bit_offset: 0
    bit_size: 3
  - name: cap_bank_312ff
    description: 'Enable the 312fF caps inside cap bank. Encodings: 0: Enable another 0.3125 pF; 1: Enable another
      0.625 pF; 2: Enable another 0.936 pF; 3: Enable another 1.25 pF; 4: Enable another 1.56 pF; 5: Enable another
      1.87 pF; 6: Enable another 2.19 pF; 7: Enable another 2.5 pF'
    bit_offset: 4
    bit_size: 3
  - name: dpd_mode_enable
    description: 'DPD_MODE_ENABLE. Encodings: 0: Configuration information in 3v domain logic is latched; 1: Configuration
      information in 3v domain logic is updating from configuration registers simultaneously'
    bit_offset: 19
    bit_size: 1
  - name: cap_bank_148ff
    description: 'CAP_BANK_148FF. Encodings: 0: Enable another 148 pF in cap bank; 1: Enable another 296 pF in cap
      bank; 2: Enable another 444 pF in cap bank; 3: Enable another 592 pF in cap bank; 4: Enable another 740 pF
      in cap bank; 5: Enable another 888 pF in cap bank; 6: Enable another 1036 pF in cap bank; 7: Enable another
      1184 pF in cap bank'
    bit_offset: 20
    bit_size: 3
  - name: cap_bank_en
    description: 'Cap bank function enable signal. Encodings: 0: Disable cap bank function; 1: Enable cap bank function'
    bit_offset: 23
    bit_size: 1
  - name: clk_divider
    description: TSI Clock Divider
    bit_offset: 24
    bit_size: 5
  - name: counting_clk_high
    description: 'COUNTING_CLK_HIGH. Encodings: 0: Using default process inside SSC; 1: Follow the counting signal
      from AIP front end'
    bit_offset: 31
    bit_size: 1
