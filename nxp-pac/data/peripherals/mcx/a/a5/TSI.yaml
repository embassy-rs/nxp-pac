      is 3; 4: The added value for up-down counter is 4; 5: The added value for up-down counter is 5; 6: The added
      value for up-down counter is 6; 7: The added value for up-down counter is 7'
    bit_offset: 8
    bit_size: 3
  - name: move_nocharge_max
    description: MOVE_NOCHARGE_MAX
    bit_offset: 16
    bit_size: 6
  - name: move_nocharge_min
    description: 'MOVE_NOCHARGE_MIN. Encodings: 0: The SSC output bit 1''s min period will be (1 + TSI_SSC0[BASE_
      NOCHARGE_NUM]) clock cycle of system clock; 1: The SSC output bit 1''s min period will be (2 + TSI_SSC0[BASE_
      NOCHARGE_NUM]) clock cycles of system clock; 2: The SSC output bit 1''s min period will be (3 + TSI_SSC0[BASE_
      NOCHARGE_NUM]) clock cycles of system clock; 3: The SSC output bit 1''s min period will be (4 + TSI_SSC0[BASE_
      NOCHARGE_NUM]) clock cycles of system clock; 4: The SSC output bit 1''s min period will be (5 + TSI_SSC0[BASE_
      NOCHARGE_NUM]) clock cycles of system clock; 5: The SSC output bit 1''s min period will be (6 + TSI_SSC0[BASE_
      NOCHARGE_NUM]) clock cycles of system clock; 6: The SSC output bit 1''s min period will be (7 + TSI_SSC0[BASE_
      NOCHARGE_NUM]) clock cycles of system clock; 7: The SSC output bit 1''s min period will be (8 + TSI_SSC0[BASE_
      NOCHARGE_NUM]) clock cycles of system clock; 8: The SSC output bit 1''s min period will be (9 + TSI_SSC0[BASE_
      NOCHARGE_NUM]) clock cycles of system clock; 9: The SSC output bit 1''s min period will be (10 + TSI_SSC0[BASE_
      NOCHARGE_NUM]) clock cycles of system clock; 10: The SSC output bit 1''s min period will be (11 + TSI_SSC0[BASE_
      NOCHARGE_NUM]) clock cycles of system clock; 11: The SSC output bit 1''s min period will be (12 + TSI_SSC0[BASE_
      NOCHARGE_NUM]) clock cycles of system clock; 12: The SSC output bit 1''s min period will be (13 + TSI_SSC0[BASE_
      NOCHARGE_NUM]) clock cycles of system clock; 13: The SSC output bit 1''s min period will be (14 + TSI_SSC0[BASE_
      NOCHARGE_NUM]) clock cycles of system clock; 14: The SSC output bit 1''s min period will be (15 + TSI_SSC0[BASE_
      NOCHARGE_NUM]) clock cycles of system clock; 15: The SSC output bit 1''s min period will be (16 + TSI_SSC0[BASE_
      NOCHARGE_NUM]) clock cycles of system clock'
    bit_offset: 28
    bit_size: 4
fieldset/Baseline:
  description: TSI Baseline Register. The manual inconsistently labels THRESHOLD_TRACE_EN reserved while listing
    enable values, and lists both BASE_TRACE_EN encodings reserved despite describing low-power tracing. Fields
    are raw descriptions, not an assurance of supported tracing. THESHOLD_RATIO references an otherwise undocumented
    TEST_FINGER_EN.
  bit_size: 32
  reset_value: 65536
  fields:
  - name: tsi_baseline
    description: TSI_BASELINE
    bit_offset: 0
    bit_size: 16
  - name: base_trace_debounce
    description: 'BASE_TRACE_DEBOUNCE. Encodings: 0: The current counter value takes 0 ratio; 1: The current counter
      value takes 1/16 ratio; 2: The current counter value takes 2/16 ratio; 3: The current counter value takes
      3/16 ratio; 4: The current counter value takes 4/16 ratio; 5: The current counter value takes 5/16 ratio;
      6: The current counter value take 6/16 ratio; 7: The current counter value takes 7/16 ratio; 8: The current
      counter value takes 8/16 ratio; 9: The current counter value takes 9/16 ratio; 10: The current counter value
      takes 10/16 ratio; 11: The current counter value takes 11/16 ratio; 12: The current counter value takes 12/16
      ratio; 13: The current counter value takes 13/16 ratio; 14: The current counter value takes 14/16 ratio; 15:
      The current counter value takes 15/16 ratio'
    bit_offset: 16
    bit_size: 4
  - name: base_trace_en
    description: BASE_TRACE_EN
    bit_offset: 20
    bit_size: 1
  - name: theshold_ratio
    description: 'THESHOLD_RATIO. Encodings: 0: The thresholdh = baseline+counter/2, and thresholdl = baseline-counter/2;
      1: The thresholdh = baseline+counter/4, and thresholdl = baseline-counter/4; 2: The thresholdh = baseline+counter/8,
      and thresholdl = baseline-counter/8; 3: The thresholdh = baseline+counter/16, and thresholdl = baseline-counter/16;
      4: The thresholdh = baseline+counter/32, and thresholdl = baseline-counter/32; 5: The thresholdh = baseline+counter/64,
      and thresholdl = baseline-counter/64; 6: The thresholdh = baseline+counter/128, and thresholdl = baseline-counter/128;
      7: The thresholdh = baseline+counter/256, and thresholdl = baseline-counter/256'
    bit_offset: 28
    bit_size: 3
  - name: threshold_trace_en
    description: 'THRESHOLD_TRACE_EN. Encodings: 0: Disable threshold trace function; 1: Enable threshold trace
      function'
    bit_offset: 31
    bit_size: 1
fieldset/Shield:
  description: TSI Shield Register. M_SEN_RES has only example values 0, 1, 2 and 14; the source does not establish
    a complete resistor conversion for all 6-bit values. Kept numeric without inventing holes or a formula.
  bit_size: 32
  reset_value: 67108864
  fields:
  - name: m_sen_res
    description: 'Six-bit raw resistor trim. Documented examples only: 0=10 kohm, 1=10+(2.5/3) kohm (auto-calibration),
      2=12.5 kohm, 14=25 kohm. Other codes unspecified.'
    bit_offset: 25
    bit_size: 6
