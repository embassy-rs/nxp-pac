fieldset/Test:
  description: TSI TEST Register. TSI_TEST_EN is asserted only by a full-register write of 0x55AA55AA, not by setting
    bit 0; writing bit 0 to zero disables test mode. DPD_TEST_EOSF is write-one-to-clear. CLKSOC_SEL and RUN_CTRL
    require ipt_test_mod=1; the referenced test guide is not supplied and CLKSOC_SEL values are reserved. This register
    model does not authorize hardware test operations.
  bit_size: 32
  reset_value: 0
  fields:
  - name: tsi_test_en
    description: 'TSI_TEST_EN. Encodings: 0: Test mode is disabled; 1: Test mode is enabled'
    bit_offset: 0
    bit_size: 1
  - name: dpd_test_en
    description: 'DPD_TEST_EN. Encodings: 0: IP is not entering dpd test mode; 1: IP is entering dpd test mode'
    bit_offset: 1
    bit_size: 1
  - name: dpd_test_eosf
    description: 'End of Scan Flag in DPD test mode. Encodings: 0: Scan is not done in DPD test mode; 1: Scan is
      done in DPD test mode'
    bit_offset: 8
    bit_size: 1
  - name: tsi_ana_test_setting
    description: 'TSI_ANA_TEST_SETTING. Encodings: 0: Normal operation mode; 1: Test mode 1, Vref test; 2: Test
      mode 2, Vprechrg voltage test; 3: Test mode 3, Comparator test; 4: Test mode 4, Precharge function test; 5:
      Test mode 5, 4uA bias test; 6: Test mode 6, 2uA bias test; 7: Test mode 7, Function monitor test'
    bit_offset: 16
    bit_size: 4
  - name: clksoc_sel
    description: CLKSOC_SEL
    bit_offset: 20
    bit_size: 1
  - name: run_ctrl
    description: 'RUN_CTRL. Encodings: 0: Gate analog switch clock; 1: Not gate analog switch clock'
    bit_offset: 21
    bit_size: 1
