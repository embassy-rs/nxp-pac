# MCXAP172M240F70RM final Rev. 1 (2026-03-30), chapter 59.
# MCXA577.xml is supplemental; source conflicts are retained in descriptions.
# reset_value supplies fieldset construction defaults, not hardware observations.
# All 32 reset bits are specified by the manual map (known mask 0xFFFFFFFF).
# Mixed-access fields and W1C/strobes are documented, not enforced by this schema.
block/Tsi:
  description: Touch sensing input, TSI0 at 0x400C3000. Up to 70 channel-selection bits; actual bonded pins depend
    on device/package. Select at most one role per channel.
  only_in: ^MCXA(456|457|577)$
  items:
  - name: config
    description: TSI CONFIG Register (TSI_CONFIG) for self-capacitor. Self-capacitor view of offset 0, selected
      by MODE=0; aliases CONFIG_MUTUAL. Do not set S_SEN and S_NOISE together (59.3.2).
    byte_offset: 0
    bit_size: 32
    access: ReadWrite
    fieldset: Config
  - name: config_mutual
    description: 'TSI CONFIG register (TSI_CONFIG) for mutual-capacitor (CONFIG_MUTUAL). Mutual-capacitor view of
      offset 0, selected by MODE=1; aliases CONFIG. The manual reset image is 0x2802007E, including MODE=0: this
      is a bank reset image, not a ready-to-write mutual-mode configuration. M_PMIRRORR and M_NMIRROR must match.'
    byte_offset: 0
    bit_size: 32
    access: ReadWrite
    fieldset: ConfigMutual
  - name: tshd
    description: TSI Threshold Register
    byte_offset: 4
    bit_size: 32
    access: ReadWrite
    fieldset: Tshd
  - name: gencs
    description: TSI General Control and Status Register. TSIEN and STM must not change during a scan. SWTS is a
      write-only start strobe, reading zero; it starts a software scan when STM=0. Clear DATA.EOSF before ESOR,
      and DATA.OUTRGF before OUTRG_EN or DMAEN_OUTRG. ACTIVE use requires TSIEN_DPD=0, TSIEN=1 and SPC configuration;
      low-power scan supports channels 0-3 and wakes through WUU, not the NVIC (59.1.3).
    byte_offset: 8
    bit_size: 32
    access: ReadWrite
    fieldset: Gencs
  - name: mul
    description: 'TSI Mutual-cap Register. M_TRIM_USED[31:16] is omitted: 59.6.1.6 calls it "Not use, just reserved",
      despite the XML exposing it. M_MODE=3 is not allowed.'
    byte_offset: 12
    bit_size: 32
    access: ReadWrite
    fieldset: Mul
  - name: sinc
    description: TSI SINC Filter Register. Low four bits report SSC/filter state; configuration is in bits 16 and
      above. SINC_CUTOFF encodings 8-15 are NC. Its prose says default div=0 while code 0 is listed as div=1; preserve
      the raw code rather than interpreting the inconsistent default wording.
    byte_offset: 16
    bit_size: 32
    access: ReadWrite
    fieldset: Sinc
  - name: ssc0
    description: TSI SSC Register 0
    byte_offset: 20
    bit_size: 32
    access: ReadWrite
    fieldset: Ssc0
  - name: ssc1
    description: TSI SSC Register 1
    byte_offset: 24
    bit_size: 32
    access: ReadWrite
    fieldset: Ssc1
  - name: ssc2
    description: TSI SSC Register 2
    byte_offset: 28
    bit_size: 32
    access: ReadWrite
    fieldset: Ssc2
  - name: baseline
    description: TSI Baseline Register. The manual inconsistently labels THRESHOLD_TRACE_EN reserved while listing
      enable values, and lists both BASE_TRACE_EN encodings reserved despite describing low-power tracing. Fields
      are raw descriptions, not an assurance of supported tracing. THESHOLD_RATIO references an otherwise undocumented
      TEST_FINGER_EN.
    byte_offset: 32
    bit_size: 32
    access: ReadWrite
    fieldset: Baseline
  - name: shield
    description: TSI Shield Register. M_SEN_RES has only example values 0, 1, 2 and 14; the source does not establish
      a complete resistor conversion for all 6-bit values. Kept numeric without inventing holes or a formula.
    byte_offset: 40
    bit_size: 32
    access: ReadWrite
    fieldset: Shield
  - name: self_sel_31_0
    description: Self-cap mode channels selection(CH31~CH0)
    byte_offset: 44
    bit_size: 32
    access: ReadWrite
    fieldset: SelfSel310
  - name: self_sel_63_32
    description: Self-cap mode channels selection(CH63~CH32)
    byte_offset: 48
    bit_size: 32
    access: ReadWrite
    fieldset: SelfSel6332
  - name: self_sel_69_64
    description: Self-cap mode channels selection(CH69~CH64)
    byte_offset: 52
    bit_size: 32
    access: ReadWrite
    fieldset: SelfSel6964
  - name: shield_sel_31_0
    description: Shield mode channels selection(CH31~CH0)
    byte_offset: 56
    bit_size: 32
    access: ReadWrite
    fieldset: ShieldSel310
  - name: shield_sel_63_32
    description: Shield mode channels selection(CH63~CH32)
    byte_offset: 60
    bit_size: 32
    access: ReadWrite
    fieldset: ShieldSel6332
  - name: shield_sel_69_64
    description: Shield mode channels selection(CH69~CH64)
    byte_offset: 64
    bit_size: 32
    access: ReadWrite
    fieldset: ShieldSel6964
  - name: mutual_tx_sel_31_0
    description: Mutual TX mode channels selection(CH31~CH0)
    byte_offset: 68
    bit_size: 32
    access: ReadWrite
    fieldset: MutualTxSel310
  - name: mutual_tx_sel_63_32
    description: Mutual TX mode channels selection(CH63~CH32)
    byte_offset: 72
    bit_size: 32
    access: ReadWrite
    fieldset: MutualTxSel6332
  - name: mutual_tx_sel_69_64
    description: Mutual TX mode channels selection(CH69~CH64)
    byte_offset: 76
    bit_size: 32
    access: ReadWrite
    fieldset: MutualTxSel6964
  - name: mutual_rx_sel_31_0
    description: Mutual RX mode channels selection(CH31~CH0)
    byte_offset: 80
    bit_size: 32
    access: ReadWrite
    fieldset: MutualRxSel310
  - name: mutual_rx_sel_63_32
    description: Mutual RX mode channels selection(CH63~CH32)
    byte_offset: 84
    bit_size: 32
    access: ReadWrite
    fieldset: MutualRxSel6332
  - name: mutual_rx_sel_69_64
    description: Mutual RX mode channels selection (CH69~CH64)
    byte_offset: 88
    bit_size: 32
    access: ReadWrite
    fieldset: MutualRxSel6964
  - name: data
    description: 'TSI Data and Status Register. TSICNT is read-only. EOSF, OVERRUNF, OUTRGF and DPD_OUTRGF are write-one-to-clear:
      write only intended flag bits, not read-modify-write. DMA transfer clears EOSF/OUTRGF automatically. DPD_OUTRGF
      can be read only with GENCS.TSIEN_DPD=1. OVERRUNF encoding descriptions contradict the assertion prose; no
      polarity enum is supplied.'
    byte_offset: 256
    bit_size: 32
    access: ReadWrite
    fieldset: Data
  - name: misc
    description: TSI Miscellaneous Register. DPD_MODE_ENABLE=1 updates the 3 V domain configuration latch; 0 holds
      it. CAP_BANK_148FF is named in fF but 59.6.1.26 gives pF values; see source conflict note, do not infer a
      unit conversion from its name.
    byte_offset: 264
    bit_size: 32
    access: ReadWrite
    fieldset: Misc
  - name: trig
    description: TSI AUTO TRIG Register
    byte_offset: 268
    bit_size: 32
    access: ReadWrite
    fieldset: Trig
  - name: test
    description: TSI TEST Register. TSI_TEST_EN is asserted only by a full-register write of 0x55AA55AA, not by
      setting bit 0; writing bit 0 to zero disables test mode. DPD_TEST_EOSF is write-one-to-clear. CLKSOC_SEL and
      RUN_CTRL require ipt_test_mod=1; the referenced test guide is not supplied and CLKSOC_SEL values are reserved.
      This register model does not authorize hardware test operations.
    byte_offset: 272
    bit_size: 32
    access: ReadWrite
    fieldset: Test
fieldset/Config:
  description: TSI CONFIG Register (TSI_CONFIG) for self-capacitor. Self-capacitor view of offset 0, selected by
    MODE=0; aliases CONFIG_MUTUAL. Do not set S_SEN and S_NOISE together (59.3.2).
  bit_size: 32
  reset_value: 8388608
  fields:
  - name: mode
    description: 'MODE. Encodings: 0: Self-cap mode, this address is TSI_SEL_CONFIG; 1: Mutual-cap mode, this address
      is TSI_MUL_CONFIG'
    bit_offset: 0
    bit_size: 1
    enum: ConfigMode
  - name: filter_trim
    description: 'FILTER_TRIM. Encodings: 0: filter bypass; 1: 5.3ns; 2: 21.1ns; 3: 25ns'
    bit_offset: 4
    bit_size: 2
    enum: ConfigFilterTrim
  - name: self_bypass_flt
    description: 'self_bypass_flt. Encodings: 0: LPF is not bypassed (default); 1: LPF is bypassed'
    bit_offset: 6
    bit_size: 1
  - name: xin_scale_down_trim
    description: Numeric boost discharge scale code 0..7 means 1/(code+1); 8..15 reserved.
    bit_offset: 8
    bit_size: 4
  - name: xin_scale_down
    description: Numeric scale code 0..7 means 1/(code+1); 8..15 reserved.
    bit_offset: 12
    bit_size: 4
  - name: self_boost_scale
    description: 'self_boost_scale. Encodings: 0: 500 nA (default); 1: 1 uA; 2: 1.5 uA; 3: 2 uA; 4: 2.5 uA; 5: 3
      uA; 6: 3.5 uA; 7: 4 uA'
    bit_offset: 16
    bit_size: 3
  - name: s_noise
    description: 'S_NOISE. Encodings: 0: Noise cancellation off (default); 1: Noise cancellation on'
    bit_offset: 19
    bit_size: 1
  - name: s_xch
    description: 'S_XCH. Encodings: 0: 1/16 (default); 1: 1/8; 2: 1/4; 3: 1/2; 4: 1/1; 5: 2/1; 6: 4/1; 7: 8/1'
    bit_offset: 20
    bit_size: 3
  - name: s_xin
    description: 'S_XIN. Encodings: 0: 1/8; 1: 1/4 (default)'
    bit_offset: 23
    bit_size: 1
  - name: s_sen
    description: 'S_SEN. Encodings: 0: Sensitivity boost off (default); 1: Sensitivity boost on'
    bit_offset: 27
    bit_size: 1
  - name: s_xdn
    description: Codes 0..3 mean 1/16, 1/8, 1/4, 1/2; 4..7 are NA.
    bit_offset: 28
    bit_size: 3
  - name: self_boost_mode
    description: 'self_boost_mode. Encodings: 0: Cap boost mode (default); 1: Current boost mode'
    bit_offset: 31
    bit_size: 1
