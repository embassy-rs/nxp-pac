# MCXAP172M240F70RM Rev. 1, sections65.3/65.4.1.
# IN39 selector width conflicts (two bits in general text; bits27:14 in table/XML). It is not guessed here.
block/Itrc:
  description: 'Intrusion/tamper response controller. Selector pairs jointly encode selection and persistent locking; they are not independent enables. Undefined IN39 layout is intentionally unmodeled. Software-event writes trigger response signals, including writes that appear harmless. Output indices0..6: 0=ITRC_IRQ interrupt, 1=SGI_UDF_RESET, 2=Can initiate PoR reset of CORE and SYSTEM domains (VBAT unaffected), 3=RAM_ZEROIZE: hardware zeroizes PKC/ECC SRAM during reset, 4=CHIP_RESET request to CMC, 5=TMPR_OUT0, 6=TMPR_OUT1.'
  items:
  - name: status
    byte_offset: 0
    fieldset: Status
    description: Latched input/output status. Clear the originating source before writing one to clear a latched status.
  - name: status1
    byte_offset: 4
    fieldset: Status1
    description: Latched input/output status. Clear the originating source before writing one to clear a latched status.
  - name: out_sel
    byte_offset: 8
    array:
      len: 7
      stride: 8
    block: OutSelect0
  - name: out_sel_1
    byte_offset: 72
    array:
      len: 7
      stride: 8
    block: OutSelect1
  - name: out_sel_2
    byte_offset: 136
    array:
      len: 7
      stride: 8
    block: OutSelect2
  - name: sw_event0
    byte_offset: 240
    access: Write
    fieldset: SwEvent
  - name: sw_event1
    byte_offset: 244
    access: Write
    fieldset: SwEvent
