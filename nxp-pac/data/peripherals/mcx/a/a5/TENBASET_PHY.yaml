    description: Operation. Specifies operation to be performed 00b - WRITE_COMPERR. Write frame operation but generates
      C22 compliance error 01b - WRITE. Write frame operation 10b - READ. Read frame operation 11b - READ_COMPERR.
      Read frame operation but generates C22 compliance error
    bit_offset: 12
    bit_size: 2
