# MCXAP172M240F70RM final Rev. 1, chapter 54.
# Reset annotations are software Default values, not hardware observations; no unknown reset bits in the mapped tables.
block/TenbasetPhy:
  description: 'MCX-A5 10BASE-T1S digital PHY at 0x4002d000 (XML T1S0; metadata _10BASE_T1S0). All registers and
    fieldset storage are 16-bit. No analog PMD, driver or protocol state machine is implemented here. Fixed 10 Mbit/s
    half duplex. Read-only subfields are documented, not enforced within writable fieldsets. PHYSTAT is clear-on-read;
    interrupt capture and diagnostic flags are write-one-to-clear. PLCADIAG3/4 counters clear by writing all zeros,
    not ones. Interrupt enable set/clear registers are aliases. PCSDIAG1/2 and PLCARECST are ordinary read-only
    values: chapter 54 does not specify read-clear behavior. Numeric fields are raw to preserve legal ranges and
    reserved holes; do not treat multibit values as booleans. reset_value supplies software Default from the manual
    reset tables, not observed hardware; live flags can change after reset release.'
  only_in: ^MCXA(536|537|566|567|577)$
  items:
  - name: phyctrl
    description: PHY control. RESET is the soft-reset command (the manual says write clears bits). SPD1/SPD0 and
      DUPLX are fixed read-only indicators (10 Mbit/s, half duplex).
    byte_offset: 0
    bit_size: 16
    access: ReadWrite
    fieldset: Phyctrl
  - name: phystat
    description: PHY status. LJAB and RJAB are clear-on-read; reads are destructive.
    byte_offset: 2
    bit_size: 16
    access: Read
    fieldset: Phystat
  - name: phyid0
    description: PHY Identifier0.
    byte_offset: 4
    bit_size: 16
    access: Read
    fieldset: Phyid0
  - name: phyid1
    description: PHY Identifier1.
    byte_offset: 6
    bit_size: 16
    access: Read
    fieldset: Phyid1
  - name: base1ext
    description: PHY BASE-T1 Extended.
    byte_offset: 68
    bit_size: 16
    access: Read
    fieldset: Base1Ext
  - name: pmapmdctrl
    description: PMA/PMD Control.
    byte_offset: 104
    bit_size: 16
    access: Read
    fieldset: Pmapmdctrl
  - name: pmactrl
    description: PMA CTRL.
    byte_offset: 146
    bit_size: 16
    access: ReadWrite
    fieldset: Pmactrl
  - name: pmastat
    description: PMA Status.
    byte_offset: 148
    bit_size: 16
    access: Read
    fieldset: Pmastat
  - name: pmatm
    description: PMA Test Mode.
    byte_offset: 150
    bit_size: 16
