  - name: intenset1
    description: 'Interrupt Enable Set1. Set alias for interrupt enable state: writing one enables the corresponding
      interrupt; zero has no effect.'
    byte_offset: 354
    bit_size: 16
    access: ReadWrite
    fieldset: Intenset1
  - name: intenclr1
    description: 'Interrupt Enable Clear1. Clear alias for interrupt enable state: writing one disables the corresponding
      interrupt; zero has no effect.'
    byte_offset: 356
    bit_size: 16
    access: ReadWrite
    fieldset: Intenclr1
  - name: intstat1
    description: Interrupt Status1.
    byte_offset: 358
    bit_size: 16
    access: Read
    fieldset: Intstat1
  - name: intencapt2
    description: Interrupt Capture2. Captured interrupt flags are write-one-to-clear; write only intended acknowledgement
      bits.
    byte_offset: 368
    bit_size: 16
    access: ReadWrite
    fieldset: Intencapt2
  - name: intenset2
    description: 'Interrupt Enable Set1. Set alias for interrupt enable state: writing one enables the corresponding
      interrupt; zero has no effect.'
    byte_offset: 370
    bit_size: 16
    access: ReadWrite
    fieldset: Intenset2
  - name: intenclr2
    description: 'Interrupt Enable Clear2. Clear alias for interrupt enable state: writing one disables the corresponding
      interrupt; zero has no effect.'
    byte_offset: 372
