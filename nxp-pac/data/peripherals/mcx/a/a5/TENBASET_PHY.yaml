    byte_offset: 416
    bit_size: 16
    access: ReadWrite
    fieldset: Plcadiag1
  - name: plcadiag2
    description: PLCA NXP prop diagnostics. Diagnostic flags are write-one-to-clear.
    byte_offset: 418
    bit_size: 16
    access: ReadWrite
    fieldset: Plcadiag2
  - name: plcadiag3
    description: PLCA Beacon Counter Diagnostics. Write all zeros to clear the receive-beacon counter; this is not
      write-one-to-clear.
    byte_offset: 420
    bit_size: 16
    access: ReadWrite
    fieldset: Plcadiag3
  - name: plcadiag4
    description: PLCA TO Counter Diagnostics. Write all zeros to clear the transmit-opportunity counter; this is
      not write-one-to-clear.
    byte_offset: 422
    bit_size: 16
    access: ReadWrite
    fieldset: Plcadiag4
  - name: txcdiag
