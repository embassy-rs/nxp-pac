    description: PCS Control.
    byte_offset: 166
    bit_size: 16
    access: ReadWrite
    fieldset: Pcsctrl
  - name: pcsstat
    description: PCS Status.
    byte_offset: 168
    bit_size: 16
    access: Read
    fieldset: Pcsstat
  - name: pcsdiag1
    description: PCS Remote Jabber Counter.
    byte_offset: 170
    bit_size: 16
    access: Read
    fieldset: Pcsdiag1
  - name: pcsdiag2
    description: PCS Physical Collisions Counter.
    byte_offset: 172
    bit_size: 16
    access: Read
    fieldset: Pcsdiag2
  - name: plcaidver
    description: PLCA Identification and Version.
    byte_offset: 192
    bit_size: 16
    access: Read
    fieldset: Plcaidver
  - name: plcactrl0
    description: PLCA Control0.
    byte_offset: 194
