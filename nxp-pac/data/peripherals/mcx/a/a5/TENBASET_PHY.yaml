    description: Disable SMI Preamble. Disabled SMI preamble (32 x 1'b1) generation 0b - Disabled 1b - Enabled
    bit_offset: 7
    bit_size: 1
  - name: hold
    description: Hold. Specifies the hold time for the MDIO output. The IEEE802.3 clause 22 specifies a minimum
      hold time of 10ns 000b - HOLD_1. 1 PCLK cycle (default) 001b - HOLD_2. 2 PCLK cycles 010b - HOLD_3. 3 PCLK
      cycles 011b - HOLD_4. 4 PCLK cycles 100b - HOLD_5. 5 PCLK cycles 101b - 6 PCLK cycles 6 110b - HOLD_7. 7 PCLK
      cycles 111b - HOLD_8. 8 PCLK cycles
    bit_offset: 8
    bit_size: 3
