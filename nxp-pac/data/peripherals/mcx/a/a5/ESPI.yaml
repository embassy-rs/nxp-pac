fieldset/Pcfg:
  description: 'Port Configuration. Configure type/address before enabling the port; TYPE must not change while
    enabled. Only one port may be OOB; if multiple ports are marked OOB, only the lowest-numbered port receives
    host writes. Only one port may be used for mastering and only one for flash; attempts to configure a second
    port are refused. Mastering, OOB and flash are not available with LPC. DIRECTION may change with caution. ERRORIGN
    polarity conflicts between its field and DIRECTION prose. STALLRD/STALLWR are documented here, but 52.4.2 says
    application stalling is no longer supported: raw fields do not guarantee this feature. TYPE=8 follows the register
    definition; 52.3.1.3.3 incorrectly calls Mailbox Shared 1010b.'
