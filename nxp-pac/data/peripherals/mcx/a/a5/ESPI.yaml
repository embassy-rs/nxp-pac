# MCXAP172M240F70RM final Rev. 1 (2026-03-30), chapter 52.
# MCXA577.xml is supplemental; source conflicts are retained in descriptions.
# reset_value supplies fieldset construction defaults, not hardware observations.
# All 32 reset bits are specified by the manual map (known mask 0xFFFFFFFF).
# Mixed-access fields and W1C/strobes are documented, not enforced by this schema.
block/Espi:
  description: eSPI0 target peripheral at 0x4001F000, with five ports and two external DMA request channels. Mode-dependent
    register aliases are intentional; choose the view matching PCFG.TYPE.
  only_in: ^MCXA(556|557|577)$
  items:
  - name: mctrl
    description: Master Control. ENABLE may transition only 0->1/2 or 1/2->0; never directly between active modes
      or to 3. PENA is a five-port independent enable mask, valid only after port TYPE/configuration is set.
    byte_offset: 0
    bit_size: 32
    access: ReadWrite
    fieldset: Mctrl
  - name: mstat
    description: Master Status. Mixed read-only status and write-one-to-clear sticky causes. PORTINT causes must
      be handled in PnSTAT. Read, handle data, then clear intended causes; wait at least 50 PCLK cycles before clearing
      to avoid reassertion (52.8.1.3). Avoid read-modify-write.
    byte_offset: 4
    bit_size: 32
    access: ReadWrite
    fieldset: Mstat
  - name: intenset
    description: Interrupt Enable Set. Write-one-to-set interrupt enable bits; port masks are independent bit masks,
      not one-bit enumerations. Port-local interrupt rules must also be enabled.
    byte_offset: 8
    bit_size: 32
    access: ReadWrite
    fieldset: Intenset
  - name: intenclr
    description: 'Interrupt Clear. Alias for clearing the interrupt enables: write one to disable only the intended
      enables. It does not clear pending event causes.'
    byte_offset: 12
    bit_size: 32
    access: ReadWrite
    fieldset: Intenclr
  - name: intstat
    description: Masked Interrupt Status. Masked interrupt status is MSTAT AND interrupt enables. The memory map
      and XML mark RW although the function describes a computed status; no undocumented clear-on-write or read
      side effect is assumed.
    byte_offset: 16
    bit_size: 32
    access: ReadWrite
    fieldset: Intstat
  - name: dmactrl
    description: DMA Control. Two external DMA request channels, with ports 0-4 or Port80. Software primes the first
      block; DMA enable refills. The function says "up to 3 ports" but 52.3.1.9 and the register expose two DMA
      requests. The DMA1EN/DMA0EN tables mention action 3 for mailbox while their encoding lists reserve 3; no variant
      3 is provided.
    byte_offset: 20
    bit_size: 32
    access: ReadWrite
    fieldset: Dmactrl
  - name: rambase
    description: RAM Base. RAM base, at least 4 KiB aligned. Bits 11:0 are always zero and omitted. Map reset is
      0x20000000; the function says the system selects the initial base. A generated default is not an observation
      of allocated memory.
    byte_offset: 24
    bit_size: 32
    access: ReadWrite
    fieldset: Rambase
  - name: mapbase
    description: Mapped Base
    byte_offset: 28
    bit_size: 32
    access: ReadWrite
    fieldset: Mapbase
  - name: irqpush
    description: IRQ Push. Push an IRQ only after clearing the previous MSTAT.IRQUPD (must be zero). DONE reports
      completion.
    byte_offset: 32
    bit_size: 32
    access: ReadWrite
    fieldset: Irqpush
  - name: wirewo
    description: Virtual Wire MCU-to-host. Wait for DONE=1 before writing new wire values. A write clears DONE,
      hardware sets it after transmission; DONE does not generate an interrupt and must be polled. BOOT_DONE and
      BOOT_ERRN should be set after power-on. LPC START/FORCE prose does not match all field names; no additional
      alias fields are invented.
    byte_offset: 36
    bit_size: 32
    access: ReadWrite
    fieldset: Wirewo
  - name: wirero
    description: Virtual Wire Host-to-MCU
    byte_offset: 40
    bit_size: 32
    access: Read
    fieldset: Wirero
  - name: p80stat
    description: Port 80 Status
    byte_offset: 48
    bit_size: 32
    access: ReadWrite
    fieldset: P80stat
  - name: stataddr
    description: Status Block Address. Eight-byte status block, aligned to eight bytes. BASE=1/2 is called Base1/Base2
      here, whereas MAPBASE and PnADDR use BASE0/BASE1; retain raw numeric BASE because naming conflicts.
    byte_offset: 52
    bit_size: 32
    access: ReadWrite
    fieldset: Stataddr
  - name: espicap
    description: eSPI Capabilities. Advertised capabilities and limits; host still chooses configuration. SAFERA
      defines only encodings 0-3 in a four-bit field; other values are unspecified, not inferred. MAXSPD=5-7 is
      unspecified.
    byte_offset: 64
    bit_size: 32
    access: ReadWrite
    fieldset: Espicap
  - name: espicfg
    description: eSPI Configuration
    byte_offset: 68
    bit_size: 32
    access: Read
    fieldset: Espicfg
  - name: espimisc
    description: eSPI Miscellaneous. GPIO_IN is input status; GPIO output controls depend on whether Alert is dedicated.
      PWRSAV only affects eSPI clock gating, not LPC; may delay writes by less than 200 ns.
    byte_offset: 72
    bit_size: 32
    access: ReadWrite
    fieldset: Espimisc
  - name: rpmc_support1
    description: 'RPMC Support 1. Configure before eSPI starts; do not change while eSPI works. TARGET_RPMC_SUPPORTED
      is a numeric count: prose says 1-based total up to 63, but the encoding list labels 3 as "up to 63"; no four-entry
      enum is used.'
    byte_offset: 80
    bit_size: 32
    access: ReadWrite
    fieldset: RpmcSupport1
  - name: rpmc_support2
    description: RPMC Support 2. Configure before eSPI starts; do not change while eSPI works.
    byte_offset: 84
    bit_size: 32
    access: ReadWrite
    fieldset: RpmcSupport2
  - name: wirein_gpio
    description: WIREIN_GPIO. LEVEL and VALID are four independent corresponding bits, not two-state 4-bit values.
      Captures controller virtual-wire writes; target software forwards them to GPIO.
    byte_offset: 88
    bit_size: 32
    access: Read
    fieldset: WireinGpio
  - name: wireout_gpio
    description: 'WIREOUT_GPIO. SOURCE CONFLICT: memory map/XML mark read-only, but 52.8.1.21 says the target CPU
      writes this register to transmit virtual wires. Conservatively retain Read access pending vendor clarification;
      no write accessor is proposed. LEVEL and VALID are independent bit masks.'
    byte_offset: 92
    bit_size: 32
    access: Read
    fieldset: WireoutGpio
  - name: pcfg
    description: 'Port Configuration. Configure type/address before enabling the port; TYPE must not change while
      enabled. Only one port may be OOB; if multiple ports are marked OOB, only the lowest-numbered port receives
      host writes. Only one port may be used for mastering and only one for flash; attempts to configure a second
      port are refused. Mastering, OOB and flash are not available with LPC. DIRECTION may change with caution.
      ERRORIGN polarity conflicts between its field and DIRECTION prose. STALLRD/STALLWR are documented here, but
      52.4.2 says application stalling is no longer supported: raw fields do not guarantee this feature. TYPE=8
      follows the register definition; 52.3.1.3.3 incorrectly calls Mailbox Shared 1010b.'
    byte_offset: 256
    bit_size: 32
    access: ReadWrite
    fieldset: Pcfg
    array:
      len: 5
      stride: 32
  - name: pstat
    description: Port Status. RDSTAT/WRSTAT depend on port type; change them through PIRULESTAT, not ordinary writes.
      Interrupt cause bits 8-14 are sticky write-one-to-clear, even with interrupts masked. Clearing INTERR also
      clears ERR0-ERR3. RPMC_FLASH_DEVICE may toggle for non-RPMC commands and must then be ignored.
    byte_offset: 260
    bit_size: 32
    access: ReadWrite
    fieldset: Pstat
    array:
      len: 5
      stride: 32
  - name: pirulestat
    description: Set Interrupt Rules and User Status. Contains interrupt masks, user status, status commands and
      completion tags. SRST and SSTCL must not be written together; SRST takes precedence. SSTCL is mode-dependent
      command bits, not a global enable enum. Program CPU_TAG before completion commands.
    byte_offset: 264
    bit_size: 32
    access: ReadWrite
    fieldset: Pirulestat
    array:
      len: 5
      stride: 32
  - name: paddr
    description: Port Address. Normal-port address view; aliases POMFLEN at each port offset +0x0C. Address alignment
      must match the port range; split mailbox alignment includes both halves. Do not change address while enabled.
    byte_offset: 268
    bit_size: 32
    access: ReadWrite
    fieldset: Paddr
    array:
      len: 5
      stride: 32
  - name: pomflen
    description: Port OOB, Mastering, and Flash Length. OOB/master/flash length view; aliases PADDR at +0x0C. LEN
      is zero-relative; obey host payload limit and maximum 124 bytes, or 120 for bus mastering. Flash erase uses
      its low three bits as sector encoding. TRANS semantics depend on port type; prepare before issuing SSTCL.
    byte_offset: 268
    bit_size: 32
    access: ReadWrite
    fieldset: Pomflen
    array:
      len: 5
      stride: 32
  - name: pdatain
    description: 'Port Data Input. Host input byte for endpoint/index-and-data; otherwise zero-relative last message
      length, including the four address bytes for SAF. SOURCE CONFLICT: SAF examples (52.6.1 and 52.6.3) require
      incoming TAG[29:26] and length[11:0], but the register table (52.8.1.27) marks 31:26 reserved and defines
      DIR[8] with DATA_LEN[7:0]. This model retains the conservative table layout and has no incoming TAG accessor;
      it does not supply the incoming SAF tag/length view required by those examples. CPU_TAG in PIRULESTAT is an
      outgoing completion tag, not a replacement for the missing incoming tag. Status depends on data consumption
      and port type; the source does not completely specify per-read clearing semantics. Mailbox state is explicitly
      maintained through PIRULESTAT. Do not assume a universal clear-on-read rule.'
    byte_offset: 272
    bit_size: 32
    access: Read
    fieldset: Pdatain
    array:
      len: 5
      stride: 32
  - name: pdataout
    description: Port Data Out. Output-byte view; aliases PRAMUSE at +0x14. Writing endpoint data makes it pending
      for the host. The function paragraph repeats input-register wording, but the field definition says data to
      send to host; the latter is used.
    byte_offset: 276
    bit_size: 32
    access: ReadWrite
    fieldset: Pdataout
    array:
      len: 5
      stride: 32
  - name: pramuse
    description: Port RAM Use. Mailbox/master RAM-allocation view; aliases PDATAOUT at +0x14. Per-direction length
      is 4<<LEN bytes (4..512); split mailboxes use twice that RAM. OFF must be aligned modulo the mailbox range.
    byte_offset: 276
    bit_size: 32
    access: ReadWrite
    fieldset: Pramuse
    array:
      len: 5
      stride: 32
fieldset/Mctrl:
  description: Master Control. ENABLE may transition only 0->1/2 or 1/2->0; never directly between active modes
    or to 3. PENA is a five-port independent enable mask, valid only after port TYPE/configuration is set.
  bit_size: 32
  reset_value: 0
  fields:
  - name: enable
    description: 'Enable. Encodings: 0: Disabled. Block is not operational.; 1: eSPI (Enhanced Serial Peripheral
      Interface); 2: LPC (Low Pin Count)'
    bit_offset: 0
    bit_size: 2
    enum: MctrlEnable
  - name: rtc_int_bmc
    description: 'RTC-Integrated-BMC. Encodings: 0: BMC does not support an integrated RTC.; 1: BMC supports an
      integrated RTC to which eSPI controller can forward RTC targeting IO cycles. (**ESPI slave regs: 0x8, bit
      29**).'
    bit_offset: 2
    bit_size: 1
  - name: pena
    description: Independent enable bits for ports 0..4; configure each port before setting its bit.
    bit_offset: 8
    bit_size: 5
  - name: p80ena
    description: Port 80 Enable
    bit_offset: 16
    bit_size: 1
  - name: sblkena
    description: Status Block Enable
    bit_offset: 17
    bit_size: 1
  - name: clk_div_disable
    description: 'Clock Division Disable. Encodings: 0: Clock division is enabled.; 1: Clock division is disabled.'
    bit_offset: 18
    bit_size: 1
  - name: early_sample
    description: Early Sample
    bit_offset: 19
    bit_size: 1
fieldset/Mstat:
  description: Master Status. Mixed read-only status and write-one-to-clear sticky causes. PORTINT causes must be
    handled in PnSTAT. Read, handle data, then clear intended causes; wait at least 50 PCLK cycles before clearing
    to avoid reassertion (52.8.1.3). Avoid read-modify-write.
  bit_size: 32
  reset_value: 0
  fields:
  - name: portint
    description: Port Interrupt
    bit_offset: 0
    bit_size: 5
  - name: p80int
    description: Port80 Interrupt Request
    bit_offset: 8
    bit_size: 1
  - name: busrst
    description: 'Bus Reset. Encodings: 1: The bit entered or exited reset. Sticky, must clear.'
    bit_offset: 9
    bit_size: 1
  - name: irqupd
    description: 'Interrupt Request Update Completion. Encodings: 1: The bus had an IRQ update completion (for eSPI,
      IRQPush done; for LPC, SERIRQ done). Sticky, must clear.'
    bit_offset: 10
    bit_size: 1
  - name: wirechg
    description: 'Wire Change. Encodings: 1: For eSPI, one or more input VWires have changed since last cleared
      for eSPI. For LPC, SERIRQ started. Sticky, write to clear.'
    bit_offset: 11
    bit_size: 1
  - name: hstall
    description: 'Host Stall. Encodings: 1: Host is stalled on a read from or write to a port that has the STALLRD
      or STALLWR bit set in the PnCFG register. The application must write 1 to this bit to clear and release the
      host. The stall should not allowed to persist.'
    bit_offset: 12
    bit_size: 1
  - name: crcerr
    description: 'Cyclic Redundancy Check (CRC) Error. Encodings: 1: CRC from the master did not match the computed
      CRC. The state of the app may be in error (due to bad data). Write 1 to clear.'
    bit_offset: 13
    bit_size: 1
  - name: gpio
    description: 'General Purpose Input/Output (GPIO). Encodings: 1: ESPIMISC[GPIO] has had an input change. Only
      detected if INTENSET has configured this bit to interrupt. Write 1 to clear.'
    bit_offset: 14
    bit_size: 1
  - name: busy
    description: 'Bus Busy. Encodings: 0: Idle; 1: Busy'
    bit_offset: 16
    bit_size: 1
  - name: inrst
    description: 'Bus Reset. Encodings: 0: Bus not in reset; 1: Bus is in reset'
    bit_offset: 17
    bit_size: 1
  - name: comppend
    description: 'Completion Pending. Encodings: 0: No completions pending; 1: Completions are pending for eSPI.
      Indicates quiet mode for LPC'
    bit_offset: 18
    bit_size: 1
  - name: mastpend
    description: 'Master Pending. Encodings: 0: No mastering pending; 1: Mastering is pending (flash or memory)'
    bit_offset: 19
    bit_size: 1
  - name: alertpend
    description: 'Alert Pending. Encodings: 0: No alert request pending; 1: Alert request pin is pending, whether
      a separate pin or master-in slave-out (MISO). For LPC, indicates that SERIRQ is in process.'
    bit_offset: 20
    bit_size: 1
fieldset/Intenset:
  description: Interrupt Enable Set. Write-one-to-set interrupt enable bits; port masks are independent bit masks,
    not one-bit enumerations. Port-local interrupt rules must also be enabled.
  bit_size: 32
  reset_value: 0
  fields:
  - name: portint
    description: 'Port interrupt. Encodings: 1: Corresponding port interrupts main processor, if it matches IRule'
    bit_offset: 0
    bit_size: 5
  - name: p80int
    description: 'Port80 Interrupt. Encodings: 0: Disabled; 1: Port80 interrupts main processor on update from host'
    bit_offset: 8
    bit_size: 1
  - name: busrst
    description: 'Bus Reset. Encodings: 0: Disabled; 1: A change in bus reset status interrupts CPU'
    bit_offset: 9
    bit_size: 1
  - name: irqupd
    description: 'IRQ Update. Encodings: 0: Disabled; 1: Completion of an IRQ update interrupts CPU'
    bit_offset: 10
    bit_size: 1
  - name: wirechg
    description: 'Wire Change. Encodings: 0: Disabled; 1: When one or more VWire inputs have changed, interrupts
      CPU'
    bit_offset: 11
    bit_size: 1
  - name: hstall
    description: 'Host Stall. Encodings: 0: Disabled; 1: When the MSTAT[HSTALL] is 1, interrupt main processor'
    bit_offset: 12
    bit_size: 1
  - name: crcerr
    description: 'CRC Error. Encodings: 0: Disabled; 1: When CRC error detected, interrupts CPU'
    bit_offset: 13
    bit_size: 1
  - name: gpio
    description: 'GPIO. Encodings: 0: Disabled; 1: When ESPICFG GPIO changes input value, interrupts CPU'
    bit_offset: 14
    bit_size: 1
  - name: cs_int
    description: 'CS_INT. Encodings: 0: Disabled; 1: When CS falls, interrupts the main processor (wake_async is
      asserted)'
    bit_offset: 15
    bit_size: 1
  - name: cportint
    description: 'Coprocessor Interrupt. Encodings: 0: Disabled; 1: no description available'
    bit_offset: 16
    bit_size: 5
  - name: cp80int
    description: 'Coprocessor Port80 Interrupt. Encodings: 0: Disabled; 1: Port80 interrupts coprocessor on update
      from host'
    bit_offset: 24
    bit_size: 1
  - name: cbusrst
    description: 'Coprocessor Burst. Encodings: 0: Disabled; 1: Change in bus reset status interrupts coprocessor'
    bit_offset: 25
    bit_size: 1
  - name: cirqupd
    description: 'Coprocessor Interrupt Update. Encodings: 0: Disabled; 1: Completion of an IRQ update interrupts
      coprocessor'
    bit_offset: 26
    bit_size: 1
  - name: cwirechg
    description: 'Coprocessor Wire Change. Encodings: 0: Disabled; 1: When one one or more Vwire inputs have changed,
      interrupts coprocessor'
    bit_offset: 27
    bit_size: 1
  - name: chstall
    description: 'Coprocessor Host Stall. Encodings: 0: Disabled; 1: When MSTAT[HSTALL] is 1, interrupts coprocessor'
    bit_offset: 28
    bit_size: 1
  - name: ccrcerr
    description: 'Coprocessor Error. Encodings: 0: Disabled; 1: When CRC error detected, interrupts coprocessor'
    bit_offset: 29
    bit_size: 1
  - name: cgpio
    description: 'Coprocessor GPIO. Encodings: 0: Disabled; 1: When ESPICFG GPIO changes input value, interrupts
      coprocessor'
    bit_offset: 30
    bit_size: 1
fieldset/Intenclr:
  description: 'Interrupt Clear. Alias for clearing the interrupt enables: write one to disable only the intended
    enables. It does not clear pending event causes.'
  bit_size: 32
  reset_value: 0
  fields:
  - name: portint
    description: 'Port Interrupt. Encodings: 1: Writes 0 to corresponding port interrupt enable'
    bit_offset: 0
    bit_size: 5
  - name: p80int
    description: 'Port80 Interrupt. Encodings: 1: Writes 0 to Port80 interrupt enable'
    bit_offset: 8
    bit_size: 1
  - name: busrst
    description: 'Bus Reset. Encodings: 1: Writes 0 to reset change interrupt enable'
    bit_offset: 9
    bit_size: 1
  - name: irqupd
    description: 'IRQ Update. Encodings: 1: Writes 0 to IRQ completion interrupt enable'
    bit_offset: 10
    bit_size: 1
  - name: wirechg
    description: 'Wire Change. Encodings: 1: Writes 0 to Wire Change interrupt enable'
    bit_offset: 11
    bit_size: 1
  - name: hstall
    description: 'Host Stall. Encodings: 1: Writes 0 to HSTALL interrupt enable'
    bit_offset: 12
    bit_size: 1
  - name: crcerr
    description: 'CRC Error. Encodings: 1: Writes 0 to CRCERR interrupt enable'
    bit_offset: 13
    bit_size: 1
  - name: gpio
    description: 'GPIO. Encodings: 1: Writes 0 to GPIO interrupt enable'
    bit_offset: 14
    bit_size: 1
  - name: cs_int
    description: 'CS_INT. Encodings: 0: Disabled; 1: Clear CS falls enable'
    bit_offset: 15
    bit_size: 1
  - name: cportint
    description: 'Coprocessor Interrupt. Encodings: 1: Writes 0 to corresponding coprocessor port interrupt enable'
    bit_offset: 16
    bit_size: 5
  - name: cp80int
    description: 'Coprocesssor Port80 Interrupt. Encodings: 1: Writes 0 to coprocessor Port80 interrupt enable.'
    bit_offset: 24
    bit_size: 1
  - name: cbusrst
    description: 'Coprocessor Burst. Encodings: 1: Writes 0 to coprocessor Reset change interrupt enable'
    bit_offset: 25
    bit_size: 1
  - name: cirqupd
    description: 'Coprocessor IRQ Update. Encodings: 1: Writes 0 to coprocessor IRQ completion interrupt enable'
    bit_offset: 26
    bit_size: 1
  - name: cwirechg
    description: 'Coprocessor Wire Change. Encodings: 1: Writes 0 to coprocessor Wire Change interrupt enable'
    bit_offset: 27
    bit_size: 1
  - name: chstall
    description: 'Coprocessor Host Stall. Encodings: 1: Writes 0 to coprocessor HSTALL interrupt enable'
    bit_offset: 28
    bit_size: 1
  - name: ccrcerr
    description: 'Coprocessor CRC Error. Encodings: 1: Writes 0 to coprocessor CRCERR interrupt enable'
    bit_offset: 29
    bit_size: 1
  - name: cgpio
    description: 'Coprocessor GPIO. Encodings: 1: Writes 0 to coprocessor GPIO interrupt enable'
    bit_offset: 30
    bit_size: 1
fieldset/Intstat:
  description: Masked Interrupt Status. Masked interrupt status is MSTAT AND interrupt enables. The memory map and
    XML mark RW although the function describes a computed status; no undocumented clear-on-write or read side effect
    is assumed.
  bit_size: 32
  reset_value: 0
  fields:
  - name: portint
    description: 'Port Interrupt. Encodings: 0: Disabled; 1: Corresponding port interrupts main processor if it
      matches IRule'
    bit_offset: 0
    bit_size: 5
  - name: p80int
    description: 'Port80 Interrupt. Encodings: 0: Disabled; 1: Port80 interrupts main processor on update from host'
    bit_offset: 8
    bit_size: 1
  - name: busrst
    description: 'Bus Reset. Encodings: 0: Disabled; 1: A change in Bus Reset status interrupts CPU'
    bit_offset: 9
    bit_size: 1
  - name: irqupd
    description: 'IRQ Update. Encodings: 0: Disabled; 1: Completion of an IRQ update interrupts CPU'
    bit_offset: 10
    bit_size: 1
  - name: wirechg
    description: 'Wire Change. Encodings: 0: Disabled; 1: The VWire input change interrupt is enabled and pending
      for the CPU'
    bit_offset: 11
    bit_size: 1
  - name: hstall
    description: 'Host Stall. Encodings: 0: Disabled; 1: The HSTALL interrupt is enabled and pending for the CPU'
    bit_offset: 12
    bit_size: 1
  - name: crcerr
    description: 'CRC Error. Encodings: 0: Disabled; 1: The CRC error interrupt is enabled and pending for the CPU'
    bit_offset: 13
    bit_size: 1
  - name: gpio
    description: 'GPIO. Encodings: 0: Disabled; 1: The GPIO input change interrupt is enabled and pending for the
      CPU'
    bit_offset: 14
    bit_size: 1
  - name: cportint
    description: 'Coprocessor Interrupt. Encodings: 0: Disabled; 1: Interrupt is enabled and pending for the coprocessor'
    bit_offset: 16
    bit_size: 5
  - name: cp80int
    description: 'Coprocessor Port80 Interrupt. Encodings: 0: Disabled; 1: Port80 interrupt is enabled and pending
      for the CPU. Port80 interrupts coprocessor on update from host.'
    bit_offset: 24
    bit_size: 1
  - name: cbusrst
    description: 'Coprocessor Burst. Encodings: 0: Disabled; 1: Bus reset status change interrupt is enabled and
      pending for the CPU. A change in bus reset status interrupts coprocessor.'
    bit_offset: 25
    bit_size: 1
  - name: cirqupd
    description: 'Coprocessor IRQ Update. Encodings: 0: Disabled; 1: IRQ update interrupt is enabled and pending
      for the CPU.'
    bit_offset: 26
    bit_size: 1
  - name: cwirechg
    description: 'Coprocessor Wire Change. Encodings: 0: Disabled; 1: When one one or more Vwire input has changed,
      interrupts coprocessor.'
    bit_offset: 27
    bit_size: 1
  - name: chstall
    description: 'Coprocessor Host Stall. Encodings: 0: Disabled; 1: When MSTAT[HSTALL] is 1, interrupts coprocessor.'
    bit_offset: 28
    bit_size: 1
  - name: ccrcerr
    description: 'Coprocessor CRC Error. Encodings: 0: Disabled; 1: When a CRC error detected, interrupts coprocessor.'
    bit_offset: 29
    bit_size: 1
  - name: cgpio
    description: 'Coprocessor GPIO. Encodings: 0: Disabled; 1: When ESPICFG GPIO changes input value, interrupts
      coprocessor.'
    bit_offset: 30
    bit_size: 1
fieldset/Dmactrl:
  description: DMA Control. Two external DMA request channels, with ports 0-4 or Port80. Software primes the first
    block; DMA enable refills. The function says "up to 3 ports" but 52.3.1.9 and the register expose two DMA requests.
    The DMA1EN/DMA0EN tables mention action 3 for mailbox while their encoding lists reserve 3; no variant 3 is
    provided.
  bit_size: 32
  reset_value: 0
  fields:
  - name: dma0en
    description: 'DMA 0 Enable. Encodings: 0: Disabled. The DMA channel is not used.; 1: Triggers on Host Read empty
      (whether endpoint and a byte or mailbox and many bytes). Allows reload of memory.; 2: Triggers on Host Write
