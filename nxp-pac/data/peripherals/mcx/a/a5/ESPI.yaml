    description: 'Host Read Data Status. Encodings: 0: Endpoint or index-and-data: Empty. Mailbox: Empty (host read
      to end). Master/Flash: No requests.; 1: Endpoint or index-and-data: Data waiting from MCU. Mailbox: Started
      (by MCU). Master/Flash: Started. From-host: goes to Pending next. To-host: goes to Complete next. SAF: host
      made request: Started.; 2: Mailbox: Complete (by MCU). Master/Flash: Complete. SAF: Complete.; 3: Mailbox:
      Partially read (by host). Master/Flash: From-host only, Pending (request made); goes to Complete next. SAF:
      MCU has setup completion.'
    bit_offset: 0
    bit_size: 2
  - name: wrstat
    description: 'Status of Host Writes. Encodings: 0: Endpoint: Empty. Index-and-data: Empty. Mailbox: Empty. Master/flash:
      Not last request.; 1: Endpoint: data waiting from host. Index-and-data: data waiting from host (index may
      have been written before). Mailbox: Started (by host). Master/flash: last request from-host/read-flash (writes
      to MCU). SAF: Request from master was or is Flash Read.; 2: Endpoint: Empty, but last was CMD. Index-and-data:
      wrote index. Mailbox: complete/last (host to end). Master/flash: last request to-host/write-flash (read from
      MCU). SAF: Request from Master was or is Flash Write.; 3: Endpoint: CMD waiting from host. Index-and-data:
