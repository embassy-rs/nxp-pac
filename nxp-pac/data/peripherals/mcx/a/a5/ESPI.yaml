      Single: write only. Mailbox Split or Mailbox Shared: ignore read.; 2: Endpoint or index-and-data: ignore write.
      Mailbox Single: read only. Mailbox Split or Mailbox Shared: ignore write.; 3: Endpoint or index-and-data:
      Ignore both. Mailbox Single: ignore both. Mailbox Split or Mailbox Shared: ignore both.'
