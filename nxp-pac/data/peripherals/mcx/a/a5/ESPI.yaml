      ports are marked OOB, only the lowest-numbered port receives host writes. Only one port may be used for mastering
      and only one for flash; attempts to configure a second port are refused. Mastering, OOB and flash are not
      available with LPC. Legal codes: 0=unconfigured, 1=ACPI endpoint, 2=ACPI index-and-data, 4=bus-master memory,
      5=bus-master flash, 8=mailbox shared, 9=mailbox single, 10=mailbox split, 11=mailbox OOB split, 12=mailbox
      OEM; other codes reserved.'
    bit_offset: 0
    bit_size: 4
    enum: PcfgType
