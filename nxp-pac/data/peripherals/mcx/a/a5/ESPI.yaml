    bit_offset: 0
    bit_size: 16
  - name: base_asz
    description: 'The meaning is dependent on type of port:. Encodings: 0: Offset from 0 in host memory or I/O space.;
      1: Uses BASE0 offset in host memory; 2: Uses BASE1 offset in host memory'
    bit_offset: 16
    bit_size: 2
    enum: PaddrBaseAsz
  - name: idxoff
    description: Index Offset
    bit_offset: 24
    bit_size: 4
  - name: idx1st
    description: 'For index-and-data register only:. Encodings: 0: Index is higher address than data (for example,
      data at OFF, index at OFF+IDXOFF); 1: Index is lower address than data (for example, index at OFF, data at
      OFF+IDXOFF)'
    bit_offset: 28
    bit_size: 1
fieldset/Pomflen:
  description: Port OOB, Mastering, and Flash Length. OOB/master/flash length view; aliases PADDR at +0x0C. LEN
    is zero-relative; obey host payload limit and maximum 124 bytes, or 120 for bus mastering. Flash erase uses
    its low three bits as sector encoding. TRANS semantics depend on port type; prepare before issuing SSTCL.
  bit_size: 32
  reset_value: 0
  fields:
  - name: len
    description: Length in Bytes
    bit_offset: 0
    bit_size: 7
  - name: trans
    description: 'Transfer Request. Encodings: 0: OOB: to host; Master: to host 32 (host reads with 32-bit address);
      SAF: Completion fail; 1: Master: to host 64 (host reads w/64-bit address); MAF: read flash (location in RAM);
      SAF: completion with data; 2: Master: from host 32 (host writes w/32-bit address); MAF: write flash (location
      in RAM); SAF: completion with no data; 3: Master: from host 64 (host writes w/64-bit address); MAF: erase
      flash (sector in RAM)'
    bit_offset: 12
    bit_size: 2
fieldset/Pdatain:
  description: 'Port Data Input. Host input byte for endpoint/index-and-data; otherwise zero-relative last message
    length, including the four address bytes for SAF. SOURCE CONFLICT: SAF examples (52.6.1 and 52.6.3) require
    incoming TAG[29:26] and length[11:0], but the register table (52.8.1.27) marks 31:26 reserved and defines DIR[8]
    with DATA_LEN[7:0]. This model retains the conservative table layout and has no incoming TAG accessor; it does
    not supply the incoming SAF tag/length view required by those examples. CPU_TAG in PIRULESTAT is an outgoing
    completion tag, not a replacement for the missing incoming tag. Status depends on data consumption and port
    type; the source does not completely specify per-read clearing semantics. Mailbox state is explicitly maintained
    through PIRULESTAT. Do not assume a universal clear-on-read rule.'
  bit_size: 32
  reset_value: 0
  fields:
  - name: data_len
    description: Endpoint/index-and-data input byte; otherwise zero-relative last message count, including the four
      address bytes for SAF. This conservative 8-bit register-table field conflicts with SAF examples requiring
      length[11:0]; do not treat it as the complete example-defined incoming SAF length.
    bit_offset: 0
    bit_size: 8
  - name: dir
    description: 'Direction of last access. Encodings: 0: Read by host; 1: Write by host'
    bit_offset: 8
    bit_size: 1
  - name: idx
    description: Index of Last Access
    bit_offset: 16
    bit_size: 10
fieldset/Pdataout:
  description: Port Data Out. Output-byte view; aliases PRAMUSE at +0x14. Writing endpoint data makes it pending
    for the host. The function paragraph repeats input-register wording, but the field definition says data to send
    to host; the latter is used.
  bit_size: 32
  reset_value: 0
  fields:
  - name: data
    description: Data to Send to Host
    bit_offset: 0
    bit_size: 8
fieldset/Pramuse:
  description: Port RAM Use. Mailbox/master RAM-allocation view; aliases PDATAOUT at +0x14. Per-direction length
    is 4<<LEN bytes (4..512); split mailboxes use twice that RAM. OFF must be aligned modulo the mailbox range.
  bit_size: 32
  reset_value: 0
  fields:
  - name: 'off'
    description: Offset into RAM
    bit_offset: 0
    bit_size: 12
  - name: len
    description: Length
    bit_offset: 16
    bit_size: 3
