fieldset/Usbcmd:
  description: USB Command. F70RM 44.6.1.19 (text line 113363). RST and IAA are self-clearing commands.
    Host reset requires HCH=1. Device reset requires flushed endpoints and RS=0. FS_2:FS_1 jointly select
    1024,512,256,128,64,32,16,8 frame-list elements. ITC legal values are 0,1,2,4,8,16,32,64. RM ASP/ASPE
    prose defaults (3/1) conflict with the register-map/diagram reset 0x00080000; the diagram is retained
    without guessing a mode-specific alternative.
  bit_size: 32
  reset_value: 524288
  fields:
  - name: rs
    description: 'Run/Stop. Raw encoding: 0b - Stopped executing; 1b - Running.'
    bit_offset: 0
    bit_size: 1
  - name: rst
    description: Controller Reset.
    bit_offset: 1
    bit_size: 1
  - name: fs_1
    description: Frame List Size 1.
    bit_offset: 2
    bit_size: 2
