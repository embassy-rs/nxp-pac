fieldset/Frindex:
  description: USB Frame Index. F70RM 44.6.1.22 (text line 114351). Raw numeric frame/microframe counter.
    In Host mode it updates every 125 microseconds; bits n:3 index the periodic frame list, with n selected
    by USBCMD frame-list size. Bits 13:3 contain the frame number and bits 2:0 the microframe. Only 32-bit
    writes are defined, and Host-mode writes require the Halted state (USBSTS.HCH=1, USBCMD.RS=0); writes
    also affect the SOF value. In Device mode the register is read-only and the received SOF updates the
    frame/microframe counter. The table in RM 44.6.1.22 refers to USBCMD frame-list-size encodings, not
    legal FRINDEX counter values.
  bit_size: 32
  reset_value: 0
  fields:
  - name: frindex
    description: 'Frame Index. Raw numeric counter: bits 13:3 frame number, bits 2:0 microframe; not a
      frame-list-size selector.'
    bit_offset: 0
    bit_size: 14
