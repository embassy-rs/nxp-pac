    description: 'Periodic Schedule Enable. Raw encoding: 0b - Do not process the periodic schedule; 1b
      - Process the periodic schedule.'
    bit_offset: 4
    bit_size: 1
  - name: ase
    description: 'Asynchronous Schedule Enable. Raw encoding: 0b - Do not process the asynchronous schedule;
      1b - Access the asynchronous schedule.'
    bit_offset: 5
    bit_size: 1
  - name: iaa
    description: Interrupt on Async Advance Doorbell.
    bit_offset: 6
    bit_size: 1
  - name: asp
    description: Asynchronous Schedule Park Mode Count.
    bit_offset: 8
    bit_size: 2
  - name: aspe
    description: 'Asynchronous Schedule Park Mode Enable. Raw encoding: 0b - Disables; 1b - Enables.'
    bit_offset: 11
    bit_size: 1
  - name: sutw
    description: Setup Trip Wire (Device mode only).
    bit_offset: 13
    bit_size: 1
  - name: atdtw
    description: Add dTD Trip Wire (Device mode only).
    bit_offset: 14
    bit_size: 1
  - name: fs_2
    description: 'Frame List Size 2 (Host mode only). Raw encoding: 000b - 1024 elements (4096 bytes);
      001b - 512 elements (2048 bytes); 010b - 256 elements (1024 bytes); 011b - 128 elements (512 bytes);
      100b - 64 elements (256 bytes); 101b - 32 elements (128 bytes); 110b - 16 elements (64 bytes); 111b
      - 8 elements (32 bytes).'
    bit_offset: 15
