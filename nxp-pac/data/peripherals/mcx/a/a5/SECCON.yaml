# MCXAP172M240F70RM Rev. 1, section22.5.3.
# Application-facing BEACON is RO after ROM handoff; unknown resets are not asserted as zero hardware states.
block/Seccon:
  items:
  - name: cpu0stckcal
    byte_offset: 80
    fieldset: Cpu0stckcal
  - name: msfcfg
    byte_offset: 1564
    fieldset: Msfcfg
    description: GLIKEY-protected one-way erase-disable locks until system reset, not reversible Boolean configuration. Protected by GLIKEY index3.
  - name: cfpa_lc_state
    byte_offset: 1596
    fieldset: CfpaLcState
    access: Read
  - name: ram_xen
    byte_offset: 1624
    fieldset: RamXen
  - name: ram_xen_dp
    byte_offset: 1628
    fieldset: RamXenDp
    description: Protected by GLIKEY index2; unlike RAM_XEN this duplicate has no LOCK field.
  - name: gdet0_ctrl
    byte_offset: 1644
    fieldset: Gdet0Ctrl
  - name: els_otp_lc_state
    byte_offset: 1664
    fieldset: ElsOtpLcState
    access: Read
  - name: els_otp_lc_state_dp
    byte_offset: 1668
    fieldset: ElsOtpLcStateDp
    access: Read
  - name: debug_lock_en
    byte_offset: 1952
    fieldset: DebugLockEn
  - name: debug_features
    byte_offset: 1956
    fieldset: DebugFeatures
    description: Reset on PoR only. Hardware reset bits are unknown, not guaranteed disabled or zero.
  - name: debug_features_dp
    byte_offset: 1960
    fieldset: DebugFeaturesDp
    description: Protected by GLIKEY index1 with GLIKEY reset function. Do not assume the same reset behavior as PoR-only DEBUG_FEATURES.
  - name: swd_access_cpu0
    byte_offset: 1972
    fieldset: SwdAccessCpu0
    description: ROM-used write-once register, reset only by POR. Readback encodings differ from write commands. Not an ordinary application configuration register; no command enum or operation is provided.
  - name: debug_auth_beacon
    byte_offset: 1984
    fieldset: DebugAuthBeacon
    access: Read
    description: Application-side view after ROM handoff is read-only. The generic map RW covers ROM/hardware access; ROM sets this value before user code. Reset on PoR only.
  description: 'Core/application-side security-controller register view. Source model only: no provisioning, authentication, lock, erase or lifecycle operation is performed. Unknown reset bits remain unknown; generated defaults are construction values, not observed device state.'
enum/Cpu0stckcalSkew:
  bit_size: 1
  variants:
  - name: Exact
    description: TENMS value is exact
    value: 0
  - name: Inexact
    description: TENMS value is not exact or not given
    value: 1
enum/Cpu0stckcalNoref:
  bit_size: 1
  variants:
  - name: YesRef
    description: Reference clock is provided
    value: 0
  - name: NoRef
    description: No reference clock is provided
    value: 1
fieldset/Cpu0stckcal:
  description: Secure CPU0 System Tick Calibration Hardware reset contains unknown bits. Known-zero mask0x03FFFFFF; all other reset bits are unknown. Generated zero default is only a construction value, NOT a complete hardware reset value.
  bit_size: 32
  fields:
  - name: tenms
    description: Reload value for 10 ms (100 Hz) timing, subject to system clock skew errors. If the value reads as zero, the calibration value is not known.
    bit_offset: 0
    bit_size: 24
  - name: skew
    description: Whether the TENMS value is exact.
    bit_offset: 24
    bit_size: 1
    enum: Cpu0stckcalSkew
  - name: noref
    description: Whether the device provides a reference clock to the processor.
    bit_offset: 25
    bit_size: 1
    enum: Cpu0stckcalNoref
