      0110b - Reserved 0111b - Reserved'
    bit_offset: 18
    bit_size: 4
  - name: tdcsz
    description: 'Read-only. Tx DMA Descriptor Cache Size in terms of 16-bytes descriptors:. - 00: Cache Not configured
