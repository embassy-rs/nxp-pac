block/Enet:
  description: 'MCX-A5 10/100 Ethernet QoS controller at ENET0 MAC base 0x4001c000. One MTL Tx/Rx queue and one
    DMA Tx/Rx channel; no generic-IP queue/channel arrays. Only the actual registers in the chapter 51.7 maps are
    exposed, not their generic "up to" counts. Feature reset words describe the fixed implementation: 32-bit addresses,
    2 KiB Tx/Rx FIFOs, one MAC address, no TSO, hash table, AV/DCB, split-header, L3/L4 filters or PTP offload.
    PPSOUTNUM resets to zero despite mapped PPS registers; register presence is not a claim of an external PPS output.
    Raw numeric encodings must obey the manual and implemented features; generic prose mentioning absent options
    is not capability evidence. RCWE changes selected read-clear flags to write-one-to-clear; five map/XML read-only
    registers are ReadWrite here because detailed descriptions explicitly require acknowledgement writes. Reads
    can consume status/FIFO data. Avoid read-modify-write on mixed status/control registers. Per-field read-only
    restrictions are documented, not enforced by the flat IR. reset_value is a software Default from documented
    reset tables, not a live hardware observation.'
  only_in: ^MCXA(536|537|566|567|577)$
