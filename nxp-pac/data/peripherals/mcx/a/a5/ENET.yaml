fieldset/DmaCh0CurrentAppRxbuffer:
  description: F70RM Rev. 1 section 51.7.5.16; manual text line 156961.
  bit_size: 32
  reset_value: 0
  fields:
  - name: currbufaptr
    description: Read-only. Application Receive Buffer Address Pointer. The DMA updates this pointer during Rx operation.
      This pointer is cleared on reset.
    bit_offset: 0
