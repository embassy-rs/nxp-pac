fieldset/MacMdioAddress:
  description: F70RM Rev. 1 section 51.7.1.22; manual text line 151481.
  bit_size: 32
  reset_value: 0
  fields:
  - name: gb
    description: 'GMII Busy. The application writes 1 to this bit to instruct the SMA to initiate a read or write
      access to the MDIO slave. The MAC writes 0 to this bit after the MDIO frame transfer is complete. Therefore,
      the application must modify the fields of the MAC_MDIO_Address and MAC_MDIO_Data registers only when the value
      in this bit is 0. - For write operation, application must follow these steps: -- Write the 16-bit data in
      the GDl field of the MAC_MDIO_Data register. -- Update the RA field of the MAC_MDIO_Data register with the
      register address of the PHY. NOTE RA field is valid only when C45E field is 1. -- Write 1 to this bit - For
      read operation, application must follow these steps: -- Update the RA field of the MAC_MDIO_Data register
      with the register address of the PHY. NOTE RA field is valid only when C45E field is 1. -- Write 1 to this
      bit -- Wait until MAC writes 0 to this bit. When MAC writes 0 to this bit, it implies that the data read from
      the PHY is available in the GD field of the MAC_MDIO_Data register and the read transfer is complete. NOTE
      Even if the addressed PHY is not present, there is no change in the functionality of this bit. Access restriction
      applies. Setting 1 sets. Self-cleared. Setting 0 has no effect. 0b - GMII Busy is disabled 1b - GMII Busy
      is enabled'
    bit_offset: 0
    bit_size: 1
  - name: c45e
    description: 'Clause 45 PHY Enable. - 1: Clause 45 capable PHY is connected to MDIO. - 0: Clause 22 capable
      PHY is connected to MDIO. 0b - Clause 45 PHY is disabled 1b - Clause 45 PHY is enabled'
    bit_offset: 1
    bit_size: 1
  - name: goc_0
    description: GMII Operation Command 0. This is the lower bit of the operation command to the PHY or RevMII.
      When in SMA mode (MDIO master) this bit along with GOC_1 determines the operation to be performed to the PHY.
      When only RevMII is selected in configuration this bit is read-only and tied to 1. 0b - GMII Operation Command
      0 is disabled 1b - GMII Operation Command 0 is enabled
    bit_offset: 2
    bit_size: 1
  - name: goc_1
    description: 'GMII Operation Command 1. This bit is higher bit of the operation command to the PHY or RevMII,
      GOC_1 and GOC_O is encoded as follows: - 00: Reserved - 01: Write - 10: Post Read Increment Address for Clause
      45 PHY - 11: Read When Clause 22 PHY or RevMII is enabled, only Write and Read commands are valid. NOTE This
      field is not testable by an automated register test. 0b - GMII Operation Command 1 is disabled 1b - GMII Operation
      Command 1 is enabled'
    bit_offset: 3
    bit_size: 1
  - name: skap
    description: 'Skip Address Packet. - 1: SMA does not send the address packets before read, write, or post-read
      increment address packets. This bit is valid only when C45E is set. 0b - Skip Address Packet is disabled 1b
      - Skip Address Packet is enabled'
    bit_offset: 4
    bit_size: 1
  - name: cr
    description: 'CSR Clock Range. The CSR Clock Range selection determines the frequency of the MDC clock according
      to the CSR clock frequency used in your design: - 0000: CSR clock = 60-100 MHz; MDC clock = CSR clock/42 -
      0001: CSR clock = 100-150 MHz; MDC clock = CSR clock/62 - 0010: CSR clock = 20-35 MHz; MDC clock = CSR clock/16
      - 0011: CSR clock = 35-60 MHz; MDC clock = CSR clock/26 - 0100: CSR clock = 150-250 MHz; MDC clock = CSR clock/102
      - 0101: CSR clock = 250-300 MHz; MDC clock = CSR clock/124 - 0110: CSR clock = 300-500 MHz; MDC clock = CSR
      clock/204 - 0111: CSR clock = 500-800 MHz; MDC clock = CSR clock/324 The suggested range of CSR clock frequency
      applicable for each value (when Bit 11 = 0) ensures that the MDC clock is approximately between 1.0 MHz to
      2.5 MHz frequency range. When Bit 11 is set, you can achieve a higher frequency of the MDC clock than the
      frequency limit of 2.5 MHz (specified in the IEEE 802.3) and program a clock divider of lower value. For example,
      when CSR clock is of 100 MHz frequency and you program these bits as 1010, the resultant MDC clock is of 12.5
      MHz which is beyond the range specified in IEEE 802.3. Program the following values only if the interfacing
      chips support faster MDC clocks: - 1000: CSR clock/4 - 1001: CSR clock/6 - 1010: CSR clock/8 - 1011: CSR clock/10
      - 1100: CSR clock/12 - 1101: CSR clock/14 - 1110: CSR clock/16 - 1111: CSR clock/18'
    bit_offset: 8
    bit_size: 4
  - name: ntc
    description: Number of Trailing Clocks. This field controls the number of trailing clock cycles generated on
      the gmii_mdc_o (MDC) signal, after the end of MDIO frame transfer. The valid values are 0 to 7. When you program
      a value of 3'h3 in this field, MAC generates three clock cycles on the MDC line after the end of MDIO frame
      transfer.
    bit_offset: 12
    bit_size: 3
  - name: rda
    description: 'Register or Device Address. For clause 22 PHY: Specifies the PHY register address of the selected
      PHY device. - For Clause 45 PHY: Specifies the selected MDIO device. NOTE The value you program in the C45E
      field determines if the PHY device is clause 45 capable or clause 22 capable.'
    bit_offset: 16
    bit_size: 5
  - name: pa
    description: Physical Layer Address. Specifies the address of the PHY device, out of the 32 possible PHY devices.
      NOTE The value you program in the C45E field determines if the PHY device is clause 45 capable or clause 22
      capable.
    bit_offset: 21
    bit_size: 5
  - name: btb
    description: 'Back-to-Back Transactions. 1: If NTC > 0, at the end of the frame transfer, MAC acknowledges the
      completion of a read or write command before transferring the trailing clocks. So, application can initiate
      the next command and MAC can execute it immediately without waiting for the transmission of the trailing clocks
      of the previous frame. - 0: MAC considers the read or write command to be complete, that is, MAC clears the
      GB field, only after generating the trailing clocks. This mode ensures that the NTC is always generated after
      each frame. NOTE Program this field with a value 1, only when NTC > 0. 0b - Back to Back transactions disabled
      1b - Back to Back transactions enabled'
    bit_offset: 26
    bit_size: 1
  - name: pse
    description: 'Preamble Suppression Enable.. - 1: The SMA suppresses the 32-bit preamble and transmits MDIO packets
      with only 1 preamble bit. - 0: The MDIO packet always has 32 bits of preamble as defined in the IEEE specifications.
      0b - Preamble Suppression disabled 1b - Preamble Suppression enabled'
    bit_offset: 27
    bit_size: 1
fieldset/MacMdioData:
  description: F70RM Rev. 1 section 51.7.1.23; manual text line 151704.
  bit_size: 32
  reset_value: 0
  fields:
  - name: gd
    description: GMII Data. This field contains the 16-bit data value read from the PHY after a Management Read
      operation or the 16-bit data value to be written to the PHY before a Management Write operation. NOTE This
      field is not testable by an automated register test.
    bit_offset: 0
    bit_size: 16
  - name: ra
    description: Register Address. This field is valid only when C45E is set. It contains the Register Address in
      the PHY to which the MDIO frame is intended for. NOTE This field is not testable by an automated register
      test.
    bit_offset: 16
    bit_size: 16
fieldset/MacCsrSwCtrl:
  description: F70RM Rev. 1 section 51.7.1.24; manual text line 151777.
  bit_size: 32
  reset_value: 0
  fields:
  - name: rcwe
    description: Register Clear on Write 1 Enable. When this bit is set, the access mode of some register fields
      changes to Clear on Write 1, the application needs to set that respective bit to 1 to clear it. When this
      bit is reset, the access mode of these register fields remain as Clear on Read. 0b - Register Clear on Write
      1 is disabled 1b - Register Clear on Write 1 is enabled
    bit_offset: 0
    bit_size: 1
fieldset/MacAddress0High:
  description: F70RM Rev. 1 section 51.7.1.25; manual text line 151857.
  bit_size: 32
  reset_value: 2147549183
  fields:
  - name: addrhi
    description: MAC Address0[47:32]. This field contains the upper 16 bits [47:32] of the 1st 6-byte MAC address.
      The MAC uses this field for filtering the received packets and inserting the MAC address in the Transmit Flow
      Control (Pause) Packets.
    bit_offset: 0
    bit_size: 16
  - name: ae
    description: 'Read-only. Address Enable. This bit is always set to 1. 0b - INVALID : This bit must be always
      set to 1 1b - This bit is always set to 1'
    bit_offset: 31
    bit_size: 1
fieldset/MacAddress0Low:
  description: F70RM Rev. 1 section 51.7.1.26; manual text line 151932.
  bit_size: 32
  reset_value: 4294967295
  fields:
  - name: addrlo
    description: MAC Address0[31:0]. This field contains the lower 32 bits of the 1st 6-byte MAC address. The MAC
      uses this field for filtering the received packets and inserting the MAC address in the Transmit Flow Control
      (Pause) Packets.
    bit_offset: 0
    bit_size: 32
fieldset/MacTimestampControl:
  description: F70RM Rev. 1 section 51.7.1.27; manual text line 151984.
  bit_size: 32
  reset_value: 8192
  fields:
  - name: tsena
    description: Enable Timestamp. When this bit is set, the timestamp is added for Transmit and Receive packets.
      When disabled, timestamp is not added for transmit and receive packets and the Timestamp Generator is also
      suspended. You need to initialize the Timestamp (system time) after enabling this mode. On the Receive side,
      the MAC processes the 1588 packets only if this bit is set. 0b - Timestamp is disabled 1b - Timestamp is enabled
    bit_offset: 0
    bit_size: 1
  - name: tscfupdt
    description: Fine or Coarse Timestamp Update. When this bit is set, the Fine method is used to update system
      timestamp. When this bit is reset, Coarse method is used to update the system timestamp. 0b - Coarse method
      is used to update system timestamp 1b - Fine method is used to update system timestamp
    bit_offset: 1
    bit_size: 1
  - name: tsinit
    description: Initialize Timestamp. When this bit is set, the system time is initialized (overwritten) with the
      value specified in the MAC_System_Time_Seconds_Update and MAC_System_Time_Nanoseconds_Update registers. This
      bit must be zero before it is updated. This bit is reset when the initialization is complete. The Timestamp
      Higher Word register (if enabled while configuration the IP) can only be initialized. When Media Clock Generation
      and Recovery is enabled MAC_Presn_Time_Updt must also be updated before setting this field. Access restriction
      applies. Setting 1 sets. Self-cleared. Setting 0 has no effect. NOTE This field is not testable by an automated
      register test. 0b - Timestamp is not initialized 1b - Timestamp is initialized
    bit_offset: 2
    bit_size: 1
  - name: tsupdt
    description: Update Timestamp. When this bit is set, the system time is updated (added or subtracted) with the
      value specified in MAC_System_Time_Seconds_Update and MAC_System_Time_Nanoseconds_Update registers. This bit
      must be zero before updating it. This bit is reset when the update is complete in hardware. The Timestamp
      Higher Word register (if enabled while configuring the IP) is not updated. When Media Clock Generation and
      Recovery is enabled MAC_Presn_Time_Updt must also be updated before setting this field. Access restriction
      applies. Setting 1 sets. Self-cleared. Setting 0 has no effect. NOTE This field is not testable by an automated
      register test. 0b - Timestamp is not updated 1b - Timestamp is updated
    bit_offset: 3
    bit_size: 1
  - name: tstrig
    description: Enable Timestamp Interrupt Trigger. When this bit is set, the timestamp interrupt is generated
      when the System Time becomes greater than the value written in the Target Time register. This bit is reset
      after the Timestamp Trigger Interrupt is generated. Access restriction applies. Setting 1 sets. Self-cleared.
      Setting 0 has no effect. NOTE This field is not testable by an automated register test. 0b - Timestamp Interrupt
      Trigger is not enabled 1b - Timestamp Interrupt Trigger is enabled
    bit_offset: 4
    bit_size: 1
  - name: tsaddreg
    description: Update Addend Register. When this bit is set, the content of the Timestamp Addend register is updated
      in the PTP block for fine correction. This bit is cleared when the update is complete. This bit must be zero
      before it is set. Access restriction applies. Setting 1 sets. Self-cleared. Setting 0 has no effect. NOTE
      This field is not testable by an automated register test. 0b - Addend Register is not updated 1b - Addend
      Register is updated
    bit_offset: 5
    bit_size: 1
  - name: tsenall
    description: Enable Timestamp for All Packets. When this bit is set, the timestamp snapshot is enabled for all
      packets received by the MAC. 0b - Timestamp for All Packets disabled 1b - Timestamp for All Packets enabled
    bit_offset: 8
    bit_size: 1
  - name: tsctrlssr
    description: Timestamp Digital or Binary Rollover Control. When this bit is set, the Timestamp Low register
      rolls over after 0x3B9A_C9FF value (that is, 1 nanosecond accuracy) and increments the timestamp (High) seconds.
      When this bit is reset, the rollover value of sub-second register is 0x7FFF_FFFF. The sub-second increment
      must be programmed correctly depending on the PTP reference clock frequency and the value of this bit. 0b
      - Timestamp Digital or Binary Rollover Control is disabled 1b - Timestamp Digital or Binary Rollover Control
      is enabled
    bit_offset: 9
    bit_size: 1
  - name: tsver2ena
    description: Enable PTP Packet Processing for Version 2 Format. When this bit is set, the IEEE 1588 version
      2 format is used to process the PTP packets. When this bit is reset, the IEEE 1588 version 1 format is used
      to process the PTP packets. The IEEE 1588 formats are described in 'PTP Processing and Control'. 0b - PTP
      Packet Processing for Version 2 Format is disabled 1b - PTP Packet Processing for Version 2 Format is enabled
    bit_offset: 10
    bit_size: 1
  - name: tsipena
    description: Enable Processing of PTP over Ethernet Packets. When this bit is set, the MAC receiver processes
      the PTP packets encapsulated directly in the Ethernet packets. When this bit is reset, the MAC ignores the
      PTP over Ethernet packets. 0b - Processing of PTP over Ethernet Packets is disabled 1b - Processing of PTP
      over Ethernet Packets is enabled
    bit_offset: 11
    bit_size: 1
  - name: tsipv6ena
    description: Enable Processing of PTP Packets Sent over IPv6-UDP. When this bit is set, the MAC receiver processes
      the PTP packets encapsulated in IPv6-UDP packets. When this bit is clear, the MAC ignores the PTP transported
      over IPv6-UDP packets. 0b - Processing of PTP Packets Sent over IPv6-UDP is disabled 1b - Processing of PTP
      Packets Sent over IPv6-UDP is enabled
    bit_offset: 12
    bit_size: 1
  - name: tsipv4ena
    description: Enable Processing of PTP Packets Sent over IPv4-UDP. When this bit is set, the MAC receiver processes
      the PTP packets encapsulated in IPv4-UDP packets. When this bit is reset, the MAC ignores the PTP transported
      over IPv4-UDP packets. This bit is set by default. 0b - Processing of PTP Packets Sent over IPv4-UDP is disabled
      1b - Processing of PTP Packets Sent over IPv4-UDP is enabled
    bit_offset: 13
    bit_size: 1
  - name: tsevntena
    description: Enable Timestamp Snapshot for Event Messages. When this bit is set, the timestamp snapshot is taken
      only for event messages (SYNC, Delay_Req, Pdelay_Req, or Pdelay_Resp). When this bit is reset, the snapshot
      is taken for all messages except Announce, Management, and Signaling. For more information about the timestamp
      snapshots, see Timestamp Snapshot Dependency on Register Bits Table. 0b - Timestamp Snapshot for Event Messages
      is disabled 1b - Timestamp Snapshot for Event Messages is enabled
    bit_offset: 14
    bit_size: 1
  - name: tsmstrena
    description: Enable Snapshot for Messages Relevant to Master. When this bit is set, the snapshot is taken only
      for the messages that are relevant to the master node. Otherwise, the snapshot is taken for the messages relevant
      to the slave node. 0b - Snapshot for Messages Relevant to Master is disabled 1b - Snapshot for Messages Relevant
      to Master is enabled
    bit_offset: 15
    bit_size: 1
  - name: snaptypsel
    description: Select PTP packets for Taking Snapshots. These bits, along with Bits 15 and 14, decide the set
      of PTP packet types for which snapshot needs to be taken. The encoding is given in Timestamp Snapshot Dependency
      on Register Bits Table.
    bit_offset: 16
    bit_size: 2
  - name: tsenmacaddr
    description: Enable MAC Address for PTP Packet Filtering. When this bit is set, the DA MAC address (that matches
      any MAC Address register) is used to filter R     the PTP packets when PTP is directly sent over Ethernet.
      When this bit is set, received PTP packets with DA containing a special multicast or unicast address that
      matches the one programmed in MAC address registers are considered for processing as indicated, when PTP is
      directly sent over Ethernet. For normal time stamping operation, MAC address registers 0 is considered for
      unicast destination address matching. 0b - MAC Address for PTP Packet Filtering is disabled 1b - MAC Address
      for PTP Packet Filtering is enabled
    bit_offset: 18
    bit_size: 1
  - name: esti
    description: 'External System Time Input. When this bit is set, the MAC uses the external 64-bit reference System
      Time input for the following: - To take the timestamp provided as status When this bit is reset, the MAC uses
      the internal reference System Time. 0b - External System Time Input is disabled 1b - External System Time
      Input is enabled'
    bit_offset: 20
    bit_size: 1
  - name: txtsstsm
    description: Transmit Timestamp Status Mode. When this bit is set, the MAC overwrites the earlier transmit timestamp
      status even if it is not read by the software. The MAC indicates this by setting the TXTSSMIS bit of the MAC_Tx_Timestamp_Status_Nanoseconds
      register. When this bit is reset, the MAC ignores the timestamp status of current packet if the timestamp
      status of previous packet is not read by the software. The MAC indicates this by setting the TXTSSMIS bit
      of the MAC_Tx_Timestamp_Status_Nanoseconds register. 0b - Transmit Timestamp Status Mode is disabled 1b -
      Transmit Timestamp Status Mode is enabled
    bit_offset: 24
    bit_size: 1
  - name: av8021asmen
    description: AV 802.1AS Mode Enable. When this bit is set, the MAC processes only untagged PTP over Ethernet
      packets for providing PTP status and capturing timestamp snapshots, that is, IEEE 802.1AS mode of operation.
      0b - AV 802.1AS Mode is disabled 1b - AV 802.1AS Mode is enabled
    bit_offset: 28
    bit_size: 1
fieldset/MacSubSecondIncrement:
  description: F70RM Rev. 1 section 51.7.1.28; manual text line 152297.
  bit_size: 32
  reset_value: 0
  fields:
  - name: ssinc
    description: Sub-second Increment Value. The value programmed in this field is accumulated every clock cycle
      (of clk_ptp_i) with the contents of the sub-second register. For example, when the PTP clock is 50 MHz (period
      is 20 ns), you must program 20 (0x14) when the System Time Nanoseconds register has an accuracy of 1 ns [Bit
      9 (TSCTRLSSR) is set in MAC_Timestamp_Control]. When TSCTRLSSR is clear, the Nanoseconds register has a resolution
      of 0.465 ns. In this case, you must program a value of 43 (0x2B) which is derived by 20 ns/0.465.
    bit_offset: 16
    bit_size: 8
fieldset/MacSystemTimeSeconds:
  description: F70RM Rev. 1 section 51.7.1.29; manual text line 152374.
  bit_size: 32
  reset_value: 0
  fields:
  - name: tss
    description: Read-only. Timestamp Second. The value in this field indicates the current value in seconds of
      the System Time maintained by the MAC. NOTE This field is not testable by an automated register test.
    bit_offset: 0
    bit_size: 32
fieldset/MacSystemTimeNanoseconds:
  description: F70RM Rev. 1 section 51.7.1.30; manual text line 152432.
  bit_size: 32
  reset_value: 0
  fields:
  - name: tsss
    description: Read-only. Timestamp Sub Seconds. The value in this field has the sub-second representation of
      time, with an accuracy of 0.46 ns. When Bit 9 is set in MAC_Timestamp_Control, each bit represents 1 ns. The
      maximum value is 0x3B9A_C9FF after which it rolls-over to zero. NOTE This field is not testable by an automated
      register test.
    bit_offset: 0
    bit_size: 31
fieldset/MacSystemTimeSecondsUpdate:
  description: F70RM Rev. 1 section 51.7.1.31; manual text line 152497.
  bit_size: 32
  reset_value: 0
  fields:
  - name: tss
    description: Timestamp Seconds. The value in this field is the seconds part of the update. When ADDSUB is reset,
      this field must be programmed with the seconds part of the update value. When ADDSUB is set, this field must
      be programmed with the complement of the seconds part of the update value. For example, to subtract 2.000000001
      seconds from the system time, the TSS field in the MAC_Timestamp_Seconds_Update register must be 0xFFFF_FFFE
      (that is, 2^32 - 2).
    bit_offset: 0
    bit_size: 32
fieldset/MacSystemTimeNanosecondsUpdate:
  description: F70RM Rev. 1 section 51.7.1.32; manual text line 152548.
  bit_size: 32
  reset_value: 0
  fields:
  - name: tsss
    description: 'Timestamp Sub Seconds. The value in this field is the sub-seconds part of the update. - ADDSUB
      is 1: This field must be programmed with the complement of the sub-seconds part of the update value as described.
      Note: When ADDSUB is 1 and sub-seconds update must be 0 the TSSS field value must be programmed to the following
      value based on TSCTRLSSR: -- TSCTRLSSR=1, TSSS=10^9=0x3B9A_CA00 -- TSCTRLSSR=0, TSSS=2^31=0x8000_0000, as
      this cannot be accommodated in the 31 bit wide TSSS field, program (2^31)-1=0x7FFF_FFFF - ADDSUB is 0: This
      field must be programmed with the sub-seconds part of the update value, with an accuracy based on the TSCTRLSSR
      bit of the MAC_Timestamp_Control register. - TSCTRLSSR field in the MAC_Timestamp_Control register is 1: --
      The programmed value must be 10^9 - sub-second value. -- Each bit represents 1 ns and the programmed value
      must not exceed 0x3B9A_C9FF. - TSCTRLSSR field in the MAC_Timestamp_Control register is 0: -- The programmed
      value must be 2^31 - sub-second_value. -- Each bit represents an accuracy of 0.46 ns. For example, to subtract
      2.000000001 seconds from the system time, then the TSSS field in the MAC_Timestamp_Nanoseconds_Update register
      must be 0x7FFF_FFFF (that is, 2^31 - 1), when TSCTRLSSR bit in MAC_Timestamp_Control is reset and 0x3B9A_C9FF
      (that is, 10^9 - 1), when TSCTRLSSR bit in MAC_Timestamp_Control is set.'
    bit_offset: 0
    bit_size: 31
  - name: addsub
    description: Add or Subtract Time. When this bit is set, the time value is subtracted with the contents of the
      update register. When this bit is reset, the time value is added with the contents of the update register.
      0b - Add time 1b - Subtract time
    bit_offset: 31
    bit_size: 1
fieldset/MacTimestampAddend:
  description: F70RM Rev. 1 section 51.7.1.33; manual text line 152629.
  bit_size: 32
  reset_value: 0
  fields:
  - name: tsar
    description: Timestamp Addend Register. This field indicates the 32-bit time value to be added to the Accumulator
      register to achieve time synchronization.
    bit_offset: 0
    bit_size: 32
fieldset/MacTimestampStatus:
  description: F70RM Rev. 1 section 51.7.1.34; manual text line 152677.
  bit_size: 32
  reset_value: 0
  fields:
  - name: tssovf
    description: Timestamp Seconds Overflow. When this bit is set, it indicates that the seconds value of the timestamp
      (when supporting version 2 format) has overflowed beyond 32'hFFFF_FFFF. Access restriction applies. Clears
      on read (or this bit is written to 1 when RCWE bit in MAC_CSR_SW_Ctrl register is set). Self-set to 1 on internal
      event. 0b - Timestamp Seconds Overflow status not detected 1b - Timestamp Seconds Overflow status detected
    bit_offset: 0
    bit_size: 1
  - name: tstargt0
    description: Timestamp Target Time Reached. When this bit is set, it indicates that the value of system time
      is greater than or equal to the value specified in the MAC_PPS0_Target_Time_Seconds and MAC_PPS0_Target_Time_Nanoseconds
      registers. Access restriction applies. Clears on read (or this bit is written to 1 when RCWE bit in MAC_CSR_SW_Ctrl
      register is set). Self-set to 1 on internal event. 0b - Timestamp Target Time Reached status not detected
      1b - Timestamp Target Time Reached status detected
    bit_offset: 1
    bit_size: 1
  - name: auxtstrig
    description: Auxiliary Timestamp Trigger Snapshot. This bit is set high when the auxiliary snapshot is written
      to the FIFO. This bit is valid only if the Add IEEE 1588 Auxiliary Snapshot option is selected. Access restriction
      applies. Clears on read (or this bit is written to 1 when RCWE bit in MAC_CSR_SW_Ctrl register is set). Self-set
      to 1 on internal event. 0b - Auxiliary Timestamp Trigger Snapshot status not detected 1b - Auxiliary Timestamp
      Trigger Snapshot status detected
    bit_offset: 2
    bit_size: 1
  - name: tstrgterr0
    description: Timestamp Target Time Error. This bit is set when the latest target time programmed in the MAC_PPS0_Target_Time_Seconds
      and MAC_PPS0_Target_Time_Nanoseconds registers elapses. This bit is cleared when the application reads this
      bit. Access restriction applies. Clears on read (or this bit is written to 1 when RCWE bit in MAC_CSR_SW_Ctrl
      register is set). Self-set to 1 on internal event. 0b - Timestamp Target Time Error status not detected 1b
      - Timestamp Target Time Error status detected
    bit_offset: 3
    bit_size: 1
  - name: txtssis
    description: Read-only. Tx Timestamp Status Interrupt Status. This bit is set when the captured transmit timestamp
      is updated in the MAC_Tx_Timestamp_Status_Nanoseconds and MAC_Tx_Timestamp_Status_Seconds registers. This
      bit is cleared when the MAC_Tx_Timestamp_Status_Seconds register is read (or write to MAC_Tx_Timestamp_Status_Seconds
      register when RCWE bit of MAC_CSR_SW_Ctrl register is set). 0b - Tx Timestamp Status Interrupt status not
      detected 1b - Tx Timestamp Status Interrupt status detected
    bit_offset: 15
    bit_size: 1
  - name: atsstn
    description: 'Read-only. Auxiliary Timestamp Snapshot Trigger Identifier. These bits identify the Auxiliary
      trigger inputs for which the timestamp available in the Auxiliary Snapshot Register is applicable. When more
      than one bit is set at the same time, it means that corresponding auxiliary triggers were sampled at the same
      clock. These bits are applicable only if the number of Auxiliary snapshots is more than one. One bit is assigned
      for each trigger as shown in the following list: - Bit 16: Auxiliary trigger 0 - Bit 17: Auxiliary trigger
      1 - Bit 18: Auxiliary trigger 2 - Bit 19: Auxiliary trigger 3 The software can read this register to find
      the triggers that are set when the timestamp is taken.'
    bit_offset: 16
    bit_size: 4
  - name: atsstm
    description: Read-only. Auxiliary Timestamp Snapshot Trigger Missed. This bit is set when the Auxiliary timestamp
      snapshot FIFO is full and external trigger was set. This indicates that the latest snapshot is not stored
      in the FIFO. This bit is valid only if the Add IEEE 1588 Auxiliary Snapshot option is selected. 0b - Auxiliary
      Timestamp Snapshot Trigger Missed status not detected 1b - Auxiliary Timestamp Snapshot Trigger Missed status
      detected
    bit_offset: 24
    bit_size: 1
  - name: atsns
    description: Read-only. Number of Auxiliary Timestamp Snapshots. This field indicates the number of Snapshots
      available in the FIFO. A value equal to the selected depth of FIFO (4, 8, or 16) indicates that the Auxiliary
      Snapshot FIFO is full. These bits are cleared (to 00000) when the Auxiliary snapshot FIFO clear bit is set.
      This bit is valid only if the Add IEEE 1588 Auxiliary Snapshot option is selected.
    bit_offset: 25
    bit_size: 5
fieldset/MacRxDomainTimeIncr:
  description: F70RM Rev. 1 section 51.7.1.35; manual text line 152856.
  bit_size: 32
  reset_value: 0
  fields:
  - name: rxns
    description: Receive Domain Time Increment Value in Nanoseconds.. This field indicates the Nanosecond part of
      the increment value of the PTP time maintained in Receive clock domain that is used for timestamping. For
      example, when operating in 2.5G speed the clock period is 3.2ns, so for Digital Rollover mode the RXNS and
      RXSNS fields must be programmed with 3 and (0.2*256)=51 respectively. In Binary Rollover mode, 3/0.466=6.44
      and 0.2+0.44=0.64, so RXNS and RXSNS fields must be programmed with 6 and (0.64*256)=164 respectively. When
      both RXSNS and RXNS fields are all-zeros, the fixed value based on operating speed is used for PTP time increment
      in Receive clock domain.
    bit_offset: 16
    bit_size: 16
fieldset/MacTxDomainTimeIncr:
  description: F70RM Rev. 1 section 51.7.1.36; manual text line 152922.
  bit_size: 32
  reset_value: 0
  fields:
  - name: txns
    description: Transmit Domain Time Increment Value in Nanoseconds.. This field indicates the Nanosecond part
      of the increment value of the PTP time maintained in Transmit clock domain that is used for timestamping.
      For example, when operating in 2.5G speed the clock period is 3.2ns, so for Digital Rollover mode the TXNS
      and RXSNS fields must be programmed with 3 and (0.2*256)=51 respectively. In Binary Rollover mode, 3/0.466=6.44
      and 0.2+0.44=0.64, so TXNS and TXSNS fields must be programmed with 6 and (0.64*256)=164 respectively. When
      both TXSNS and TXNS fields are all-zeros, the fixed value based on operating speed is used for PTP time increment
      in Transmit clock domain.
    bit_offset: 16
    bit_size: 16
fieldset/MacTxTimestampStatusNanoseconds:
  description: F70RM Rev. 1 section 51.7.1.37; manual text line 152988.
  bit_size: 32
  reset_value: 0
  fields:
  - name: txtsslo
    description: Read-only. Transmit Timestamp Status Low. This field contains the 31 bits of the Nanoseconds field
      of the Transmit packet's captured timestamp.
    bit_offset: 0
    bit_size: 31
  - name: txtssmis
    description: 'Read-only. Transmit Timestamp Status Missed. When this bit is set, it indicates one of the following:
      - The timestamp of the current packet is ignored if TXTSSTSM bit of the MAC_Timestamp_Control register is
      reset - The timestamp of the previous packet is overwritten with timestamp of the current packet if TXTSSTSM
      bit of the MAC_Timestamp_Control register is set. Access restriction applies. Clears on read. Self-set to
      1 on internal event. 0b - Transmit Timestamp Status Missed status not detected 1b - Transmit Timestamp Status
      Missed status detected'
    bit_offset: 31
    bit_size: 1
fieldset/MacTxTimestampStatusSeconds:
  description: F70RM Rev. 1 section 51.7.1.38; manual text line 153058.
  bit_size: 32
  reset_value: 0
  fields:
  - name: txtsshi
    description: Read-only. Transmit Timestamp Status High. This field contains the lower 32 bits of the Seconds
      field of Transmit packet's captured timestamp.
    bit_offset: 0
    bit_size: 32
fieldset/MacAuxiliaryControl:
  description: F70RM Rev. 1 section 51.7.1.39; manual text line 153111.
  bit_size: 32
  reset_value: 0
  fields:
  - name: atsfc
    description: Auxiliary Snapshot FIFO Clear. When set, this bit resets the pointers of the Auxiliary Snapshot
      FIFO. This bit is cleared when the pointers are reset and the FIFO is empty. When this bit is high, the auxiliary
      snapshots are stored in the FIFO. Access restriction applies. Setting 1 sets. Self-cleared. Setting 0 has
      no effect. NOTE This field is not testable by an automated register test. 0b - Auxiliary Snapshot FIFO Clear
      is disabled 1b - Auxiliary Snapshot FIFO Clear is enabled
    bit_offset: 0
    bit_size: 1
  - name: atsen0
    description: Auxiliary Snapshot 0 Enable. This bit controls the capturing of Auxiliary Snapshot Trigger 0. When
      this bit is set, the auxiliary snapshot of the event on ptp_aux_trig_i[0] input is enabled. When this bit
      is reset, the events on this input are ignored. 0b - Auxiliary Snapshot $i is disabled 1b - Auxiliary Snapshot
      $i is enabled
    bit_offset: 4
    bit_size: 1
  - name: atsen1
    description: Auxiliary Snapshot 1 Enable. This bit controls the capturing of Auxiliary Snapshot Trigger 1. When
      this bit is set, the auxiliary snapshot of the event on ptp_aux_trig_i[1] input is enabled. When this bit
      is reset, the events on this input are ignored. 0b - Auxiliary Snapshot $i is disabled 1b - Auxiliary Snapshot
      $i is enabled
    bit_offset: 5
    bit_size: 1
fieldset/MacAuxiliaryTimestampNanoseconds:
  description: F70RM Rev. 1 section 51.7.1.40; manual text line 153210.
  bit_size: 32
  reset_value: 0
  fields:
  - name: auxtslo
    description: Read-only. Auxiliary Timestamp. Contains the lower 31 bits (nanoseconds field) of the auxiliary
      timestamp.
    bit_offset: 0
    bit_size: 31
fieldset/MacAuxiliaryTimestampSeconds:
  description: F70RM Rev. 1 section 51.7.1.41; manual text line 153278.
  bit_size: 32
  reset_value: 0
  fields:
  - name: auxtshi
    description: Read-only. Auxiliary Timestamp. Contains the lower 32 bits of the Seconds field of the auxiliary
      timestamp.
    bit_offset: 0
    bit_size: 32
fieldset/MacTimestampIngressCorrNanosecond:
  description: F70RM Rev. 1 section 51.7.1.42; manual text line 153323.
  bit_size: 32
  reset_value: 0
  fields:
  - name: tsic
    description: Timestamp Ingress Correction. This field contains the ingress path correction value as defined
      by the Ingress Correction expression.
    bit_offset: 0
    bit_size: 32
fieldset/MacTimestampEgressCorrNanosecond:
  description: F70RM Rev. 1 section 51.7.1.43; manual text line 153376.
  bit_size: 32
  reset_value: 0
  fields:
  - name: tsec
    description: Timestamp Egress Correction. This field contains the nanoseconds part of the egress path correction
      value as defined by the Egress Correction expression.
    bit_offset: 0
    bit_size: 32
fieldset/MacTimestampIngressLatency:
  description: F70RM Rev. 1 section 51.7.1.44; manual text line 153429.
  bit_size: 32
  reset_value: 0
  fields:
  - name: itlsns
    description: Read-only. Ingress Timestamp Latency, in sub-nanoseconds. This register holds the average latency
      in sub-nanoseconds between the input ports (phy_rxd_i) of MAC and the actual point (GMII/MII) where the ingress
      timestamp is taken. Ingress correction value is computed as described in the section, "Ingress Correction".
      NOTE This field is not testable by an automated register test.
    bit_offset: 8
    bit_size: 8
  - name: itlns
    description: Read-only. Ingress Timestamp Latency, in nanoseconds. This register holds the average latency in
      nanoseconds between the input ports (phy_rxd_i) of MAC and the actual point (GMII/MII) where the ingress timestamp
      is taken. Ingress correction value is computed as described in the section, "Ingress Correction". NOTE This
      field is not testable by an automated register test.
    bit_offset: 16
    bit_size: 12
fieldset/MacTimestampEgressLatency:
  description: F70RM Rev. 1 section 51.7.1.45; manual text line 153511.
  bit_size: 32
  reset_value: 0
  fields:
  - name: etlsns
    description: Read-only. Egress Timestamp Latency, in sub-nanoseconds. This register holds the average latency
      in sub-nanoseconds between the actual point (GMII/MII) where the egress timestamp is taken and the output
      ports (phy_txd_o) of the MAC. Egress correction value is computed as described in the section "Egress Correction".
      NOTE This field is not testable by an automated register test.
    bit_offset: 8
    bit_size: 8
  - name: etlns
    description: Read-only. Egress Timestamp Latency, in nanoseconds. This register holds the average latency in
      nanoseconds between the actual point (GMII/MII) where the egress timestamp is taken and the output ports (phy_txd_o)
      of the MAC. Egress correction value is computed as described in the section, "Egress Correction". NOTE This
      field is not testable by an automated register test.
    bit_offset: 16
    bit_size: 12
fieldset/MacPpsControl:
  description: F70RM Rev. 1 section 51.7.1.46; manual text line 153594.
  bit_size: 32
  reset_value: 0
  fields:
  - name: ppsctrl_ppscmd
    description: 'Flexible PPS mode is not mapped: bit 4 is reserved and width/interval registers are absent. Timestamp
      Sub Seconds. PPS Output Frequency ControlThis field controls the frequency of the PPS0 output (ptp_pps_o[0])
      signal. CMD     The default value of PPSCTRL is 0000, and the PPS output is 1 pulse (of width clk_ptp_i) every
      second. For other values of PPSCTRL, the PPS output becomes a generated clock of following frequencies: -
      0001: The binary rollover is 2 Hz, and the digital rollover is 1 Hz. - 0010: The binary rollover is 4 Hz,
      and the digital rollover is 2 Hz. - 0011: The binary rollover is 8 Hz, and the digital rollover is 4 Hz. -
      0100: The binary rollover is 16 Hz, and the digital rollover is 8 Hz. - .. - 1111: The binary rollover is
      32.768 KHz and the digital rollover is 16.384 KHz. Note: In the binary rollover mode, the PPS output (ptp_pps_o)
      has a duty cycle of 50 percent with these frequencies. In the digital rollover mode, the PPS output frequency
      is an average number. The actual clock is of different frequency that gets synchronized every second. For
      example: - When PPSCTRL = 0001, the PPS (1 Hz) has a low period of 537 ms and a high period of 463 ms - When
      PPSCTRL = 0010, the PPS (2 Hz) is a sequence of One clock of 50 percent duty cycle and 537 ms period Second
      clock of 463 ms period (268 ms low and 195 ms high) - When PPSCTRL = 0011, the PPS (4 Hz) is a sequence of
      Three clocks of 50 percent duty cycle and 268 ms period Fourth clock of 195 ms period (134 ms low and 61 ms
      high) This behavior is because of the non-linear toggling of bits in the digital rollover mode in the MAC_System_Time_Nanoseconds
      register. or Flexible PPS Output (ptp_pps_o[0]) Control Programming these bits with a non-zero value instructs
      the MAC to initiate an event. When the command is transferred or synchronized to the PTP clock domain, these
      bits get cleared automatically. The software must ensure that these bits are programmed only when they are
      ''all-zero''. The following list describes the values of PPSCMD0: - 0000: No Command - 0001: START Single
      Pulse This command generates single pulse rising at the start point defined in MAC_PPS0_Target_Time_Seconds
      and MAC_PPS0_Target_Time_Nanoseconds register and of a duration defined in the PPS0 Width Register. - 0010:
      START Pulse Train This command generates the train of pulses rising at the start point defined in the Target
      Time Registers and of a duration defined in the PPS0 Width Register and repeated at interval defined in the
      PPS Interval Register. By default, the PPS pulse train is free-running unless stopped by the ''Stop Pulse
      train at time'' or ''Stop Pulse Train immediately'' commands. - 0011: Cancel START This command cancels the
      START Single Pulse and START Pulse Train commands if the system time has not crossed the programmed start
      time. - 0100: STOP Pulse train at time This command stops the train of pulses initiated by the START Pulse
      Train command (PPSCMD = 0010) after the time programmed in the Target Time registers elapses. - 0101: STOP
      Pulse Train immediately This command immediately stops the train of pulses initiated by the START Pulse Train
      command (PPSCMD = 0010). - 0110: Cancel STOP Pulse train This command cancels the STOP pulse train at time
      command if the programmed stop time has not elapsed. The PPS pulse train becomes free-running on the successful
      execution of this command. - 0111-1111: Reserved'
    bit_offset: 0
    bit_size: 4
fieldset/MacPps0TargetTimeSeconds:
  description: F70RM Rev. 1 section 51.7.1.47; manual text line 153754.
  bit_size: 32
  reset_value: 0
  fields:
  - name: tstrh0
    description: PPS Target Time Seconds Register. This field stores the time in seconds. When the timestamp value
      matches or exceeds both Target Timestamp registers, the MAC starts or stops the PPS signal output and generates
      an interrupt (if enabled) based on Target Time mode selected for the corresponding PPS output in the MAC_PPS_Control
      register. If PTGE field of MAC_Timestamp_Control Register is set with Presentation time control set in recovery
      mode, then these bits indicate the TPT being programmed by the application and in generation mode it indicates
      the CPT generated at the sampled trigger.
    bit_offset: 0
    bit_size: 32
fieldset/MacPps0TargetTimeNanoseconds:
  description: F70RM Rev. 1 section 51.7.1.48; manual text line 153813.
  bit_size: 32
  reset_value: 0
  fields:
  - name: ttsl0
    description: Target Time Low for PPS Register. This register stores the time in (signed) nanoseconds. When the
      value of the timestamp matches the value in both Target Timestamp registers, the MAC starts or stops the PPS
      signal output and generates an interrupt (if enabled) based on the TRGTMODSEL0 field (Bits [6:5]) in MAC_PPS_Control.
      When the TSCTRLSSR bit is reset in the MAC_Timestamp_Control register, this value must be (time in ns / 0.465).
      The actual start or stop time of the PPS signal output might have an error margin up to one unit of sub-second
      increment value. When the TSCTRLSSR bit is set in the MAC_Timestamp_Control register, this value must not
      exceed 0x3B9A_C9FF. The actual start or stop time of the PPS signal output might have an error margin up to
      one unit of sub-second increment value. Access restriction applies. Setting 1 sets. Self-cleared. Setting
      0 has no effect.
    bit_offset: 0
    bit_size: 31
fieldset/MtlOperationMode:
  description: F70RM Rev. 1 section 51.7.2.2; manual text line 153903.
  bit_size: 32
  reset_value: 0
  fields:
  - name: dtxsts
    description: 'Drop Transmit Status. - 1: Tx packet status received from the MAC is dropped in the MTL - 0: Tx
      packet status received from the MAC is forwarded to the application 0b - Drop Transmit Status is disabled
      1b - Drop Transmit Status is enabled'
    bit_offset: 1
    bit_size: 1
  - name: cntprst
    description: Counters Preset. When this bit is set, - MTL_TxQ[0-7]_Underflow register is initialized/preset
      to 12'h7F0. - Missed Packet and Overflow Packet counters in MTL_RxQ[0-7]_Missed_Packet_Overflow_Cnt register
      is initialized/ preset to 12'h7F0. Access restrictions apply. - MAC initiates the counters preset when application
      writes 1. - MAC writes 0 after the counters preset is complete. - MAC ignores when application writes 0. NOTE
      This field is not testable by an automated register test. 0b - Counters Preset is disabled 1b - Counters Preset
      is enabled
    bit_offset: 8
    bit_size: 1
  - name: cntclr
    description: Counters Reset. When this bit is set, all counters are reset. This bit is cleared automatically
      after 1 clock cycle. If this bit is set along with CNTPRST bit, CNTPRST has precedence. Access restrictions
      apply. - MAC initiates the counters reset when application writes 1. - MAC writes 0 after the counters reset
      is complete. - MAC ignores when application writes 0. NOTE This field is not testable by an automated register
      test. 0b - Counters are not reset 1b - All counters are reset
    bit_offset: 9
    bit_size: 1
fieldset/MtlInterruptStatus:
  description: F70RM Rev. 1 section 51.7.2.3; manual text line 154036.
  bit_size: 32
  reset_value: 0
  fields:
  - name: q0is
    description: Read-only. Queue 0 Interrupt status. This bit indicates that there is an interrupt from Queue 0.
      To reset this bit, the application must read Queue 0 Interrupt Control and Status register to get the exact
      cause of the interrupt and clear its source. 0b - Queue 0 Interrupt status not detected 1b - Queue 0 Interrupt
      status detected
    bit_offset: 0
    bit_size: 1
fieldset/MtlTxq0OperationMode:
  description: F70RM Rev. 1 section 51.7.3.2; manual text line 154195.
  bit_size: 32
  reset_value: 458760
  fields:
  - name: ftq
    description: 'Timestamp Sub Seconds. Flush Transmit QueueWhen this bit is set, the Tx queue controller logic
      is reset to its default values. Therefore, all the data in the Tx queue is lost or flushed. This bit is internally
      reset when the flushing operation is complete. Until this bit is reset, you must not write to the MTL_TxQ0_Operation_Mode
      register. The data which is already accepted by the MAC transmitter is not flushed. It is scheduled for transmission
      and results in underflow and runt packet transmission. Note: The flush operation is complete only when the
      Tx queue is empty and the application has accepted the pending Tx Status of all transmitted packets. To complete
      this flush operation, the PHY Tx clock (clk_tx_i) must be active. Access restrictions apply. - MAC initiates
      the Tx queue flush when application writes 1. - MAC writes 0 after the Tx queue flush is complete. - MAC ignores
      when application writes 0. NOTE You can gate-off the CSR clock during the power-down mode. However, when the
      CSR clock is gated-off, you cannot perform any read or write operations on this register. Therefore, the software
      cannot clear this bit. Access restriction applies. Setting 1 sets. Self-cleared. Setting 0 has no effect.
      0b - Flush Transmit Queue is disabled 1b - Flush Transmit Queue is enabled'
    bit_offset: 0
    bit_size: 1
  - name: tsf
    description: Transmit Store and Forward. When this bit is set, the transmission starts when a full packet resides
      in the MTL Tx queue. When this bit is set, the TTC values specified in Bits[6:4] of this register are ignored.
      This bit must be changed only when the transmission is stopped. 0b - Transmit Store and Forward is disabled
      1b - Transmit Store and Forward is enabled
    bit_offset: 1
    bit_size: 1
  - name: ttc
    description: Transmit Threshold Control. These bits control the threshold level of the MTL Tx Queue. The transmission
      starts when the packet size within the MTL Tx Queue is larger than the threshold. In addition, full packets
      with length less than the threshold are also transmitted. These bits are used only when the TSF bit is reset.
      000b - 32 001b - 64 010b - 96 011b - 128 100b - 192 101b - 256 110b - 384 111b - 512
    bit_offset: 4
    bit_size: 3
fieldset/MtlTxq0Underflow:
  description: F70RM Rev. 1 section 51.7.3.3; manual text line 154323.
  bit_size: 32
  reset_value: 0
  fields:
  - name: uffrmcnt
    description: Read-only. Underflow Packet Counter. This field indicates the number of packets aborted by the
      controller because of Tx Queue Underflow. This counter is incremented each time the MAC aborts outgoing packet
      because of underflow. The counter is cleared when this register is read with mci_be_i[0] at 1'b1. Access restriction
      applies. Clears on read. Self-set to 1 on internal event.
    bit_offset: 0
    bit_size: 11
  - name: ufcntovf
    description: Read-only. Overflow Bit for Underflow Packet Counter. This bit is set every time the Tx queue Underflow
      Packet Counter field overflows, that is, it has crossed the maximum count. In such a scenario, the overflow
      packet counter is reset to all-zeros and this bit indicates that the rollover happened. Access restriction
      applies. Clears on read. Self-set to 1 on internal event. 0b - Overflow not detected for Underflow Packet
      Counter 1b - Overflow detected for Underflow Packet Counter
    bit_offset: 11
    bit_size: 1
fieldset/MtlTxq0Debug:
  description: F70RM Rev. 1 section 51.7.3.4; manual text line 154400.
  bit_size: 32
  reset_value: 0
  fields:
  - name: txqpaused
    description: 'Read-only. Transmit Queue in Pause. When this bit is high and the Rx flow control is enabled,
      it indicates that the Tx Queue is in the Pause condition (in the full-duplex only mode) because of the following:
      - Reception of the PFC packet for the priorities assigned to the Tx Queue when PFC is enabled - Reception
      of 802.3x Pause packet when PFC is disabled 0b - Transmit Queue in Pause status is not detected 1b - Transmit
      Queue in Pause status is detected'
    bit_offset: 0
    bit_size: 1
  - name: trcsts
    description: 'Read-only. MTL Tx Queue Read Controller Status. This field indicates the state of the Tx Queue
      Read Controller: 00b - Idle state 01b - Read state (transferring data to the MAC transmitter) 10b - Waiting
      for pending Tx Status from the MAC transmitter 11b - Flushing the Tx queue because of the Packet Abort request
      from the MAC'
    bit_offset: 1
    bit_size: 2
  - name: twcsts
    description: Read-only. MTL Tx Queue Write Controller Status. When high, this bit indicates that the MTL Tx
      Queue Write Controller is active, and it is transferring the data to the Tx Queue. 0b - MTL Tx Queue Write
      Controller status is not detected 1b - MTL Tx Queue Write Controller status is detected
    bit_offset: 3
    bit_size: 1
  - name: txqsts
    description: Read-only. MTL Tx Queue Not Empty Status. When this bit is high, it indicates that the MTL Tx Queue
      is not empty and some data is left for transmission. 0b - MTL Tx Queue Not Empty status is not detected 1b
      - MTL Tx Queue Not Empty status is detected
    bit_offset: 4
    bit_size: 1
  - name: txstsfsts
    description: Read-only. MTL Tx Status FIFO Full Status. When high, this bit indicates that the MTL Tx Status
      FIFO is full. Therefore, the MTL cannot accept any more packets for transmission. 0b - MTL Tx Status FIFO
      Full status is not detected 1b - MTL Tx Status FIFO Full status is detected
    bit_offset: 5
    bit_size: 1
  - name: ptxq
    description: Read-only. Number of Packets in the Transmit Queue. This field indicates the current number of
      packets in the Tx Queue. When the DTXSTS bit of MTL_Operation_Mode register is set to 1, this field does not
      reflect the number of packets in the Transmit queue.
    bit_offset: 16
    bit_size: 3
  - name: stxstsf
    description: Read-only. Number of Status Words in Tx Status FIFO of Queue. This field indicates the current
      number of status in the Tx Status FIFO of this queue. When the DTXSTS bit of MTL_Operation_Mode register is
      set to 1, this field does not reflect the number of status words in Tx Status FIFO.
    bit_offset: 20
    bit_size: 3
fieldset/MtlQ0InterruptControlStatus:
  description: F70RM Rev. 1 section 51.7.3.5; manual text line 154530.
  bit_size: 32
  reset_value: 0
  fields:
  - name: txunfis
    description: Transmit Queue Underflow Interrupt Status. This bit indicates that the Transmit Queue had an underflow
      while transmitting the packet. Transmission is suspended and an Underflow Error TDES3[2] is set. This bit
      is cleared when the application writes 1 to this bit. Access restriction applies. Self-set to 1 on internal
      event. Setting 1 clears. Setting 0 has no effect. NOTE This field is not testable by an automated register
      test. 0b - Transmit Queue Underflow Interrupt Status not detected 1b - Transmit Queue Underflow Interrupt
      Status detected
    bit_offset: 0
    bit_size: 1
  - name: txuie
    description: Transmit Queue Underflow Interrupt Enable. When this bit is set, the Transmit Queue Underflow interrupt
      is enabled. When this bit is reset, the Transmit Queue Underflow interrupt is disabled. 0b - Transmit Queue
      Underflow Interrupt Status is disabled 1b - Transmit Queue Underflow Interrupt Status is enabled
    bit_offset: 8
    bit_size: 1
  - name: rxovfis
    description: Receive Queue Overflow Interrupt Status. This bit indicates that the Receive Queue had an overflow
      while receiving the packet. If a partial packet is transferred to the application, the overflow status is
      set in RDES3[21]. This bit is cleared when the application writes 1 to this bit. Access restriction applies.
      Self-set to 1 on internal event. Setting 1 clears. Setting 0 has no effect. NOTE This field is not testable
      by an automated register test. 0b - Receive Queue Overflow Interrupt Status not detected 1b - Receive Queue
      Overflow Interrupt Status detected
    bit_offset: 16
    bit_size: 1
  - name: rxoie
    description: Receive Queue Overflow Interrupt Enable. When this bit is set, the Receive Queue Overflow interrupt
      is enabled. When this bit is reset, the Receive Queue Overflow interrupt is disabled. 0b - Receive Queue Overflow
      Interrupt is disabled 1b - Receive Queue Overflow Interrupt is enabled
    bit_offset: 24
    bit_size: 1
fieldset/MtlRxq0OperationMode:
  description: F70RM Rev. 1 section 51.7.3.6; manual text line 154665.
  bit_size: 32
  reset_value: 7340032
  fields:
  - name: rtc
    description: 'Receive Queue Threshold Control. These bits control the threshold level of the MTL Rx queue (in
      bytes): The received packet is transferred to the application or DMA when the packet size within the MTL Rx
      queue is larger than the threshold. In addition, full packets with length less than the threshold are automatically
      transferred. This field is valid only when the RSF bit is zero. This field is ignored when the RSF bit is
      set to 1. 00b - 64 01b - 32 10b - 96 11b - 128'
    bit_offset: 0
    bit_size: 2
  - name: fup
    description: Forward Undersized Good Packets. When this bit is set, the Rx queue forwards the undersized good
      packets (packets with no error and length less than 64 bytes), including pad-bytes and CRC. When this bit
      is reset, the Rx queue drops all packets of less than 64 bytes, unless a packet is already transferred because
      of the lower value of Rx Threshold, for example, RTC = 01. 0b - Forward Undersized Good Packets is disabled
      1b - Forward Undersized Good Packets is enabled
    bit_offset: 3
    bit_size: 1
  - name: fep
    description: Forward Error Packets. When this bit is reset, the Rx queue drops packets with error status (CRC
      error, GMII_ER, watchdog timeout, or overflow). However, if the start byte (write) pointer of a packet is
      already transferred to the read controller side (in Threshold mode), the packet is not dropped. When this
      bit is set, all packets except the runt error packets are forwarded to the application or DMA. If the RSF
      bit is set and the Rx queue overflows when a partial packet is written, the packet is dropped irrespective
      of the setting of this bit. However, if the RSF bit is reset and the Rx queue overflows when a partial packet
      is written, a partial packet might be forwarded to the application or DMA. 0b - Forward Error Packets is disabled
      1b - Forward Error Packets is enabled
    bit_offset: 4
    bit_size: 1
  - name: rsf
    description: 'Receive Queue Store and Forward. - 1: The QoS controller reads a packet from the Rx queue only
      after the complete packet has been written to it, ignoring the RTC field of this register. - 0: The Rx queue
      operates in the Threshold (cut-through) mode, subject to the threshold specified by the RTC field of this
      register. 0b - Receive Queue Store and Forward is disabled 1b - Receive Queue Store and Forward is enabled'
    bit_offset: 5
    bit_size: 1
  - name: dis_tcp_ef
    description: Disable Dropping of TCP/IP Checksum Error Packets. When this bit is set, the MAC does not drop
      the packets which only have the errors detected by the Receive Checksum Offload engine. Such packets have
      errors only in the encapsulated payload. There are no errors (including FCS error) in the Ethernet packet
      received by the MAC. When this bit is reset, all error packets are dropped if the FEP bit is reset. 0b - Dropping
      of TCP/IP Checksum Error Packets is enabled 1b - Dropping of TCP/IP Checksum Error Packets is disabled
    bit_offset: 6
    bit_size: 1
fieldset/MtlRxq0MissedPacketOverflowCnt:
  description: F70RM Rev. 1 section 51.7.3.7; manual text line 154817.
  bit_size: 32
  reset_value: 0
  fields:
  - name: ovfpktcnt
    description: Read-only. Overflow Packet Counter. This field indicates the number of packets discarded by the
      QoS controller because of Receive queue overflow. This counter is incremented each time the QoS controller
      discards an incoming packet because of overflow. This counter is reset when this register is read with mci_be_i[0]
      at 1'b1. Access restriction applies. Clears on read. Self-set to 1 on internal event.
    bit_offset: 0
    bit_size: 11
  - name: ovfcntovf
    description: Read-only. Overflow Counter Overflow Bit. When set, this bit indicates that the Rx Queue Overflow
      Packet Counter field crossed the maximum limit. Access restriction applies. Clears on read. Self-set to 1
      on internal event. 0b - Overflow Counter overflow not detected 1b - Overflow Counter overflow detected
    bit_offset: 11
    bit_size: 1
  - name: mispktcnt
    description: Read-only. Missed Packet Counter. This field indicates the number of packets missed by the QoS
      controller because the application asserted ari_pkt_flush_i[] for this queue. This counter is reset when this
      register is read with mci_be_i[0] at 1b1. This counter is incremented by 1 when the DMA discards the packet
      because of buffer unavailability. Access restriction applies. Clears on read. Self-set to 1 on internal event.
    bit_offset: 16
    bit_size: 11
  - name: miscntovf
    description: Read-only. Missed Packet Counter Overflow Bit. When set, this bit indicates that the Rx Queue Missed
      Packet Counter crossed the maximum limit. Access restriction applies. Clears on read. Self-set to 1 on internal
      event. 0b - Missed Packet Counter overflow not detected 1b - Missed Packet Counter overflow detected
    bit_offset: 27
    bit_size: 1
fieldset/MtlRxq0Debug:
  description: F70RM Rev. 1 section 51.7.3.8; manual text line 154912.
  bit_size: 32
  reset_value: 0
  fields:
  - name: rwcsts
    description: Read-only. MTL Rx Queue Write Controller Active Status. When high, this bit indicates that the
      MTL Rx queue Write controller is active, and it is transferring a received packet to the Rx Queue. 0b - MTL
      Rx Queue Write Controller Active Status not detected 1b - MTL Rx Queue Write Controller Active Status detected
    bit_offset: 0
    bit_size: 1
  - name: rrcsts
    description: 'Read-only. MTL Rx Queue Read Controller State. This field gives the state of the Rx queue Read
      controller: 00b - Idle state 01b - Reading packet data 10b - Reading packet status (or timestamp) 11b - Flushing
      the packet data and status'
    bit_offset: 1
    bit_size: 2
  - name: rxqsts
    description: 'Read-only. MTL Rx Queue Fill-Level Status. This field gives the status of the fill-level of the
      Rx Queue: 00b - Rx Queue empty 01b - Rx Queue fill-level below flow-control deactivate threshold 10b - Rx
      Queue fill-level above flow-control activate threshold 11b - Rx Queue full'
    bit_offset: 4
    bit_size: 2
  - name: prxq
    description: Read-only. Number of Packets in Receive Queue. This field indicates the current number of packets
      in the Rx Queue, that is, Max_Queue_Size/ Min_Packet_Size.
    bit_offset: 16
    bit_size: 14
fieldset/DmaMode:
  description: F70RM Rev. 1 section 51.7.4.2; manual text line 155024.
  bit_size: 32
  reset_value: 0
  fields:
  - name: swr
    description: 'Software Reset. - 1: Indicates that the MAC and the DMA controller reset the logic and all internal
      registers of the DMA, MTL, and MAC. This bit is automatically cleared after the reset operation is complete
      in all the clock domains of the QoS controller. Before reprogramming the Qos controller register, read a value
      of zero in this bit. After writing 1 to this bit, wait for at the least 4 CSR clock cycles, before reading
      this bit. Note: The reset operation is complete only when the QoS controller has de-asserted all resets in
      all active clock domains. Therefore, it is essential that all PHY input clocks of the selected PHY interface
      are present for the completion of the software reset. The time required to complete the software reset operation
      depends on the frequency of the slowest active clock. Access restrictions apply. - Initiates the software
      reset when application writes 1. - MAC writes 0 after the software reset is complete. - MAC ignores when application
      writes 0. NOTE This field is not testable by an automated register test. 0b - Software Reset is disabled 1b
      - Software Reset is enabled'
    bit_offset: 0
    bit_size: 1
  - name: da
    description: 'DMA Tx or Rx Arbitration Scheme. This bit specifies the arbitration scheme for the Transmit and
      Receive paths of all channels: - 0: Weighted Round-Robin with Rx:Tx or Tx:Rx The priority between the paths
      is according to the priority specified in Bits[14:12] and the priority weight is specified in the TXPR bit.
      - 1: Fixed Priority The Tx path has priority over the Rx path when the TXPR bit is 1. Otherwise, the Rx path
      has priority over the Tx path. 0b - Weighted Round-Robin with Rx:Tx or Tx:Rx 1b - Fixed Priority'
    bit_offset: 1
    bit_size: 1
  - name: arbc
    description: ARBC is Synopsys Reserved, This field must be set to "0".. - This field is reserved for Synopsys
      Internal use, and must always be set to "0" unless instructed by Synopsys. - Setting this field to "1" might
      cause unexpected behavior in the HW. 0b - Synopsys reserved field disabled 1b - Synopsys reserved field enabled
      up on Synopsys request
    bit_offset: 9
    bit_size: 1
  - name: txpr
    description: 'Transmit Priority. - 1: Indicates that the Tx DMA has priority over the Rx DMA during arbitration
      for the system-side bus. 0b - Transmit Priority is disabled 1b - Transmit Priority is enabled'
    bit_offset: 11
    bit_size: 1
  - name: pr
    description: Priority Ratio. These bits control the priority ratio in weighted round-robin arbitration between
      the Rx DMA and Tx DMA. These bits are valid only when the DA bit is reset. The priority ratio is Rx:Tx or
      Tx:Rx depending on whether the TXPR bit is reset or set. 000b - The priority ratio is 1:1 001b - The priority
      ratio is 2:1 010b - The priority ratio is 3:1 011b - The priority ratio is 4:1 100b - The priority ratio is
      5:1 101b - The priority ratio is 6:1 110b - The priority ratio is 7:1 111b - The priority ratio is 8:1
    bit_offset: 12
    bit_size: 3
  - name: intm
    description: 'Interrupt Mode. This field defines the interrupt mode of the QoS controller. The behavior of the
      following outputs change depending on the following settings: - sbd_perch_tx_intr_o[] (Transmit Per Channel
      Interrupt) - sbd_perch_rx_intr_o[] (Receive Per Channel Interrupt) - sbd_intr_o (Common Interrupt) It also
      changes the behavior of the RI/TI bits in the DMA_CH(#i)_Status. - 00: sbd_perch_* are pulse signals for each
      TX/RX packet transfer completion events (irrespective of whether corresponding interrupts are enabled) for
      which IOC bits are enabled in descriptor. sbd_intr_o is also asserted when corresponding interrupts are enabled
      and cleared only when software clears the corresponding RI/TI status bits. - 01: sbd_perch_* are level signals
      asserted on TX/RX packet transfer completion event when corresponding interrupts are enabled and de-asserted
      when the software clears the corresponding RI/TI status bits. The sbd_intr_o is not asserted for these TX/RX
      packet transfer completion events. - 10: sbd_perch_* are level signals asserted on TX/RX packet transfer completion
      event when corresponding interrupts are enabled and de-asserted when the software clears the corresponding
      RI/TI status bits. However, the signal is asserted again if the same event occurred again before it was cleared.
      The sbd_intr_o is not asserted for these TX/RX packet transfer completion events. - 11: Reserved For more
      details, see Table "The QoS Controller Transfer Complete Interrupt Behavior". 00b - See above description
      01b - See above description 10b - See above description 11b - Reserved'
    bit_offset: 16
    bit_size: 2
fieldset/DmaSysbusMode:
  description: F70RM Rev. 1 section 51.7.4.3; manual text line 155217.
  bit_size: 32
  reset_value: 0
  fields:
  - name: fb
    description: 'Fixed Burst Length. - 1: AHB master initiates burst transfers of specified length (INCRx or SINGLE).
      - 0: AHB master initiates transfers of unspecified length (INCR) or SINGLE transfers. 0b - Fixed Burst Length
      is disabled 1b - Fixed Burst Length is enabled'
    bit_offset: 0
    bit_size: 1
  - name: aal
    description: 'Address-Aligned Beats. - 1: The EQOS-AHB master performs address-aligned burst transfers on Read
      and Write channels. - 0: The EQOS-AHB master performs burst transfers on Read and Write channels without aligning
      to address boundaries. 0b - Address-Aligned Beats is disabled 1b - Address-Aligned Beats is enabled'
    bit_offset: 12
    bit_size: 1
  - name: mb
    description: Mixed Burst. When this bit is high and the FB bit is low, the AHB master performs undefined bursts
      transfers (INCR) for burst length of 16 or more. For burst length of 16 or less, the AHB master performs fixed
      burst transfers (INCRx and SINGLE). 0b - Mixed Burst is disabled 1b - Mixed Burst is enabled
    bit_offset: 14
    bit_size: 1
  - name: rb
    description: Rebuild INCRx Burst. When this bit is 1 and the AHB master gets SPLIT, RETRY, or Early Burst Termination
      (EBT) response, the AHB master interface rebuilds the pending beats of any initiated burst transfer with INCRx
      and SINGLE transfers. By default, the AHB master interface rebuilds the pending beats of an EBT with an unspecified
      (INCR) burst. 0b - Rebuild INCRx Burst is disabled 1b - Rebuild INCRx Burst is enabled
    bit_offset: 15
    bit_size: 1
fieldset/DmaInterruptStatus:
  description: F70RM Rev. 1 section 51.7.4.4; manual text line 155396.
  bit_size: 32
  reset_value: 0
  fields:
  - name: dc0is
    description: Read-only. DMA Channel 0 Interrupt Status. This bit indicates an interrupt event in DMA Channel
      0. To reset this bit to 1'b0, the software must read the corresponding register in DMA Channel 0 to get the
      exact cause of the interrupt and clear its source. 0b - DMA Channel 0 Interrupt Status not detected 1b - DMA
      Channel 0 Interrupt Status detected
    bit_offset: 0
    bit_size: 1
  - name: mtlis
    description: Read-only. MTL Interrupt Status. Indicates an interrupt event in the MTL. To reset this bit to
      1'b0, application must read the corresponding register in the MTL, get the exact cause of the interrupt and
      clear the source of the interrupt. 0b - MTL Interrupt Status not detected 1b - MTL Interrupt Status detected
    bit_offset: 16
    bit_size: 1
  - name: macis
    description: Read-only. MAC Interrupt Status. Indicates an interrupt event in the MAC. To reset this bit to
      1'b0, application must read the corresponding register in the MAC, get the exact cause of the interrupt and
      clear the source of the interrupt. 0b - MAC Interrupt Status not detected 1b - MAC Interrupt Status detected
    bit_offset: 17
    bit_size: 1
fieldset/DmaDebugStatus0:
  description: F70RM Rev. 1 section 51.7.4.5; manual text line 155517.
  bit_size: 32
  reset_value: 0
  fields:
  - name: axwhsts
    description: Read-only. AHB Master Status. When high, this bit indicates that the AHB master FSMs are in the
      non-idle state. 0b - AXI Master Write Channel or AHB Master Status not detected 1b - AXI Master Write Channel
      or AHB Master Status detected
    bit_offset: 0
    bit_size: 1
  - name: rps0
    description: Read-only. DMA Channel 0 Receive Process State. This field indicates the Rx DMA FSM state for Channel
      0. The MSB of this field always returns 0. This field does not generate an interrupt. 0000b - Stopped (Reset
      or Stop Receive Command issued) 0001b - Running (Fetching Rx Transfer Descriptor) 0010b - Reserved for future
      use 0011b - Running (Waiting for Rx packet) 0100b - Suspended (Rx Descriptor Unavailable) 0101b - Running
      (Closing the Rx Descriptor) 0110b - Timestamp write state 0111b - Running (Transferring the received packet
      data from the Rx buffer to the system memory)
    bit_offset: 8
    bit_size: 4
  - name: tps0
    description: Read-only. DMA Channel 0 Transmit Process State. This field indicates the Tx DMA FSM state for
      Channel 0. The MSB of this field always returns 0. This field does not generate an interrupt. 0000b - Stopped
      (Reset or Stop Transmit Command issued) 0001b - Running (Fetching Tx Transfer Descriptor) 0010b - Running
      (Waiting for status) 0011b - Running (Reading Data from system memory buffer and queuing it to the Tx buffer
      (Tx FIFO)) 0100b - Timestamp write state 0101b - Reserved for future use 0110b - Suspended (Tx Descriptor
      Unavailable or Tx Buffer Underflow) 0111b - Running (Closing Tx Descriptor)
    bit_offset: 12
    bit_size: 4
fieldset/DmaCh0Control:
  description: F70RM Rev. 1 section 51.7.5.2; manual text line 155697.
  bit_size: 32
  reset_value: 0
  fields:
  - name: pblx8
    description: '8xPBL mode. - 1: Indicates that the PBL value programmed in Bits[21:16] in DMA_CH0_Tx_Control
      and Bits[21:16] in DMA_CH0_Rx_Control is multiplied by eight times. Therefore, the DMA transfers the data
      in 8, 16, 32, 64, 128, and 256 beats depending on the PBL value. 0b - 8xPBL mode is disabled 1b - 8xPBL mode
      is enabled'
    bit_offset: 16
    bit_size: 1
  - name: dsl
    description: Descriptor Skip Length. This bit specifies the Word (32-bit) number of locations to skip between
      two descriptors. The address skipping starts from the end of the current descriptor to the start of the next
      descriptor. When the DSL value is equal to zero, the DMA takes the descriptor table as contiguous.
    bit_offset: 18
    bit_size: 3
  - name: dro
    description: Descriptor Re-fetch when Own bit is 0. When this bit is set and OWN bit of a descriptor is 0, an
      additional attempt is made by the DMA engine to fetch the descriptor. If the OWN bit is still 0, Transmit/Receive
      Buffer Unavailable (TBU/RBU) interrupt is generated and the DMA goes into SUSPEND state until Tail pointer
      register is updated by the application. When this bit is low, DMA engine goes into SUSPEND mode as soon as
      it finds OWN bit to be 0.
    bit_offset: 26
    bit_size: 1
fieldset/DmaCh0TxControl:
  description: F70RM Rev. 1 section 51.7.5.3; manual text line 155809.
  bit_size: 32
  reset_value: 0
  fields:
  - name: st
    description: 'Start or Stop Transmission Command. - 1: Transmission is placed in the running state. The DMA
      checks the Tx list at the current position for a packet to be transmitted. The DMA tries to acquire descriptor
      from either of the following positions: - The current position in the list This is the base address of the
      Transmit list set by the DMA_CH0_TxDesc_List_Address register. - The position at which the transmission was
      previously stopped If the DMA does not own the current descriptor, the transmission enters the Suspended state
      and the TBU bit of the DMA_CH0_Status register is set. The Start Transmission command is effective only when
      the transmission is stopped. If the command is issued before setting the DMA_CH0_TxDesc_List_Address register,
      the DMA behavior is unpredictable. When this bit is reset, the transmission process is placed in the Stopped
      state after completing the transmission of the current packet. The Next Descriptor position in the Transmit
      list is saved, and it becomes the current position when the transmission is restarted. To change the list
      address, you need to program DMA_CH0_TxDesc_List_Address register with a new value when this bit is reset.
      The new value is considered when this bit is set again. The stop transmission command is effective only when
      the transmission of the current packet is complete or the transmission is in the Suspended state. NOTE This
      field is not testable by an automated register test. 0b - Stop Transmission Command 1b - Start Transmission
      Command'
    bit_offset: 0
    bit_size: 1
  - name: osf
    description: 'Operate on Second Packet. - 1: Instructs the DMA to process the second packet of the Tx data even
      before the status for the first packet is obtained. 0b - Operate on Second Packet disabled 1b - Operate on
      Second Packet enabled'
    bit_offset: 4
    bit_size: 1
  - name: txpbl
    description: 'Transmit Programmable Burst Length. These bits indicate the maximum number of beats to be transferred
      in one DMA block data transfer. The DMA always attempts max burst as specified in PBL each time it starts
      a burst transfer on the application bus. You can program PBL with any of the following values: 1, 2, 4, 8,
      16, or 32. Any other value results in undefined behavior. To transfer more than 32 beats, perform the following
      steps: 1. Set the 8xPBL mode in DMA_CH0_Control register. 2. Set the TxPBL. Note: The maximum value of TxPBL
      must be less than or equal to half the Tx Queue size (TQS field of MTL_TxQ0_Operation_Mode register) in terms
      of beats. This is required so that the Tx Queue has space to store at least another Tx PBL worth of data while
      the MTL Tx Queue Controller is transferring data to MAC. For example, in 32-bit data width configurations
      the total locations in Tx Queue of size 512 bytes is 128, TxPBL and 8xPBL needs to be programmed to less than
      or equal to 64.'
    bit_offset: 16
    bit_size: 6
  - name: etic
    description: 'Early Transmit Interrupt Control. - 1: Early Transmit Interrupt (ETI) status = 1 after completion
      of transfer of data from buffers of a transmit descriptor in which IOC bit (TDES2[31]) = 1. - 0: Early Transmit
      Interrupt (ETI) status = 1 only after a complete packet is transferred to the MTL Tx FIFO memory. 0b - Early
      Transmit Interrupt is disabled 1b - Early Transmit Interrupt is enabled'
    bit_offset: 22
    bit_size: 1
fieldset/DmaCh0RxControl:
  description: F70RM Rev. 1 section 51.7.5.4; manual text line 155960.
  bit_size: 32
  reset_value: 0
  fields:
  - name: sr
    description: 'Start or Stop Receive. - 1: DMA attempts to acquire the descriptor from the Receive list and processes
      the incoming packets. The DMA tries to acquire descriptor from either of the following positions: -- The current
      position in the list This is the address set by the DMA_CH0_RxDesc_List_Address register. -- The position
      at which the Rx process was previously stopped If the DMA does not own the current descriptor, the reception
      is suspended and the RBU bit of the DMA_CH0_Status register is set. The Start Receive command is effective
      only when the reception is stopped. If the command is issued before setting the DMA_CH0_RxDesc_List_Address
      register, the DMA behavior is unpredictable. - 0: Rx DMA operation stops after the transfer of the current
      packet. The next descriptor position in the Receive list is saved, and it becomes the current position after
      the Rx process is restarted. The Stop Receive command is effective only when the Rx process is in the Running
      (waiting for Rx packet) or Suspended state. NOTE This field is not testable by an automated register test.
      0b - Stop Receive 1b - Start Receive'
    bit_offset: 0
    bit_size: 1
  - name: rbsz_x_0
    description: Read-only. Receive Buffer size Low. RBSZ[13:0] is split into two fields RBSZ_13_y and RBSZ_x_0.
      The RBSZ_x_0 is the lower field. This field is of width 2 bits. This field is read-only (RO).
    bit_offset: 1
    bit_size: 2
  - name: rbsz_13_y
    description: 'Receive Buffer size High. RBSZ[13:0] is split into two fields higher RBSZ_13_y and lower RBSZ_x_0.
      The RBSZ[13:0] field indicates the size of the Rx buffers specified in bytes. The maximum buffer size is limited
      to 16K bytes. The buffer size is applicable to payload buffers when split headers are enabled. Note: The buffer
      size must be a multiple of 4. This is required even if the value of buffer address pointer is not aligned
      to data bus width. Hence the lower RBSZ_x_0 bits are read-only and the value is considered as all-zero. Thus
      the RBSZ_13_y indicates the buffer size in terms of locations.'
    bit_offset: 3
    bit_size: 12
  - name: rxpbl
    description: 'Receive Programmable Burst Length. These bits indicate the maximum number of beats to be transferred
      in one DMA block data transfer. The DMA always attempts max burst as specified in PBL each time it starts
      a burst transfer on the application bus. You can program PBL with any of the following values: 1, 2, 4, 8,
      16, or 32. Any other value results in undefined behavior. To transfer more than 32 beats, perform the following
      steps: 1. Set the 8xPBL mode in the DMA_CH0_Control register. 2. Set the RxPBL. Note: The maximum value of
      RxPBL must be less than or equal to half the Rx Queue size (RQS field of MTL_RxQ0_Operation_Mode register)
      in terms of beats. This is required so that the Rx Queue has space to store at least another Rx PBL worth
      of data while the Rx DMA is transferring a block of data. For example, in 32-bit data width configurations
      the total locations in Rx Queue of size 512 bytes is 128, so RxPBL and 8xPBL needs to be programmed to less
      than or equal to 64.'
    bit_offset: 16
    bit_size: 6
  - name: eric
    description: 'Early Receive Interrupt Control. - 1: Early Receive Interrupt (ERI) status is set after the completion
      of every burst transfer of data from the Rx DMA to the buffer. - 0: Early Receive Interrupt (ERI) status is
      set only after a complete buffer is filled up by the RxDMA. 0b - Early Receive Interrupt is disabled 1b -
      Early Receive Interrupt is enabled'
    bit_offset: 22
    bit_size: 1
  - name: rpf
    description: 'Rx Packet Flush.. - 1: The QoS controller automatically flushes the packet from the Rx Queues
      destined to this DMA Rx Channel, when it is stopped. When this bit remains set and the DMA is re-started by
      the software driver, the packets residing in the Rx Queues that were received when this RxDMA was stopped,
      still get flushed out. The packets received by the MAC only after the DMA is re-started is routed to the Rx
      DMA. The flushing is done on the Read side of the Rx Queue. When the packet is duplicated to multiple Rx DMA,
      it is flushed by the Rx DMA to which it is routed only when it is stopped to prevent head-of-line blocking.
      The packet duplicated to multiple Rx DMA is not flushed when the Rx DMA is re-started, irrespective of whether
      the packet was received during one or more Rx DMAs were stopped. - 0: The QoS controller does not flush the
      packet in the Rx Queue destined to this RxDMA Channel when it is in STOP state. This might cause head-of-line
      blocking in the corresponding RxQueue. Note: The stopping of packet flow from a Rx DMA Channel to the application
      by setting RPF works only when there is one-to-one mapping of Rx Queue to Rx DMA channels. In Dynamic mapping
      mode, setting RPF bit in any DMA_CH0_Rx_Control register might flush packets from unintended Rx Queues which
      are destined to the stopped Rx DMA Channel. 0b - Rx Packet Flush is disabled 1b - Rx Packet Flush is enabled'
    bit_offset: 31
    bit_size: 1
fieldset/DmaCh0TxdescListAddress:
  description: F70RM Rev. 1 section 51.7.5.5; manual text line 156127.
  bit_size: 32
  reset_value: 0
  fields:
  - name: tdesla
    description: 'Start of Transmit List. This field contains the base address of the first descriptor in the Transmit
      descriptor list. The DMA ignores the LSB bits (1:0) and internally takes these bits as all-zero. Therefore,
      these LSB bits are read-only (RO). The width of this field depends on the configuration: - 31:2 for 32-bit
      configuration NOTE This field is not testable by an automated register test.'
    bit_offset: 2
    bit_size: 30
fieldset/DmaCh0RxdescListAddress:
  description: F70RM Rev. 1 section 51.7.5.6; manual text line 156204.
  bit_size: 32
  reset_value: 0
  fields:
  - name: rdesla
    description: 'Start of Receive List. This field contains the base address of the first descriptor in the Rx
      Descriptor list. The DMA ignores the LSB bits (1:0) and internally takes these bits as all-zero. Therefore,
      these LSB bits are read-only (RO). The width of this field depends on the configuration: - 31:2 for 32-bit
      configuration NOTE This field is not testable by an automated register test.'
    bit_offset: 2
    bit_size: 30
fieldset/DmaCh0TxdescTailPointer:
  description: F70RM Rev. 1 section 51.7.5.7; manual text line 156272.
  bit_size: 32
  reset_value: 0
  fields:
  - name: tdtp
    description: 'Transmit Descriptor Tail Pointer. This field contains the tail pointer for the Tx descriptor ring.
      The software writes the tail pointer to add more descriptors to the Tx channel. The hardware tries to transmit
      all packets referenced by the descriptors between the head and the tail pointer registers. The width of this
      field depends on the configuration: - 31:2 for 32-bit configuration'
    bit_offset: 2
    bit_size: 30
fieldset/DmaCh0RxdescTailPointer:
  description: F70RM Rev. 1 section 51.7.5.8; manual text line 156339.
  bit_size: 32
  reset_value: 0
  fields:
  - name: rdtp
    description: 'Receive Descriptor Tail Pointer. This field contains the tail pointer for the Rx descriptor ring.
      The software writes the tail pointer to add more descriptors to the Rx channel. The hardware tries to write
      all received packets to the descriptors referenced between the head and the tail pointer registers. The width
      of this field depends on the configuration: - 31:2 for 32-bit configuration'
    bit_offset: 2
    bit_size: 30
fieldset/DmaCh0TxdescRingLength:
  description: F70RM Rev. 1 section 51.7.5.9; manual text line 156399.
  bit_size: 32
  reset_value: 0
  fields:
  - name: tdrl
    description: Transmit Descriptor Ring Length. This field sets the maximum number of Tx descriptors in the circular
      descriptor ring. The maximum number of descriptors is limited to 1K descriptors. It is recommended that a
      minimum ring descriptor length of 4. For example, You can program any value up to 0x3FF in this field. This
      field is 10 bits wide, if you program 0x3FF, you can have 1024 descriptors. If you want to have 10 descriptors,
      program it to a value of 0x9.
    bit_offset: 0
    bit_size: 10
fieldset/DmaCh0RxControl2:
  description: F70RM Rev. 1 section 51.7.5.10; manual text line 156452.
  bit_size: 32
  reset_value: 0
  fields:
  - name: rdrl
    description: Receive Descriptor Ring Length. This register sets the maximum number of Rx descriptors in the
      circular descriptor ring. The maximum number of descriptors is limited to 1K descriptors. For example, You
      can program any value up to 0x3FF in this field. This field is 10 bits wide, if you program 0x3FF, you can
      have 1024 descriptors. If you want to have 10 descriptors, program it to a value of 0x9.
    bit_offset: 0
    bit_size: 10
  - name: arbs
    description: Alternate Receive Buffer Size. Indicates size in bytes for Buffer 1 when ARBS is programmed to
      a non-zero value (when split header feature is not enabled). When split header feature is enabled, ARBS indicates
      the buffer size for header data. The maximum alternate buffer is limited to 1020 bytes. When ARBS=0, Rx Buffer1
      and Rx Buffer2 sizes are based on RBSZ field of DMA_CH0_Rx_Control. Width of ARBS field is 8 bits.
    bit_offset: 16
    bit_size: 8
fieldset/DmaCh0InterruptEnable:
  description: F70RM Rev. 1 section 51.7.5.11; manual text line 156521.
  bit_size: 32
  reset_value: 0
  fields:
  - name: tie
    description: Transmit Interrupt Enable. When this bit is set along with the NIE bit, the Transmit Interrupt
      is enabled. When this bit is reset, the Transmit Interrupt is disabled. 0b - Transmit Interrupt is disabled
      1b - Transmit Interrupt is enabled
    bit_offset: 0
    bit_size: 1
  - name: txse
    description: Transmit Stopped Enable. When this bit is set along with the AIE bit, the Transmission Stopped
      interrupt is enabled. When this bit is reset, the Transmission Stopped interrupt is disabled. 0b - Transmit
      Stopped is disabled 1b - Transmit Stopped is enabled
    bit_offset: 1
    bit_size: 1
  - name: tbue
    description: Transmit Buffer Unavailable Enable. When this bit is set along with the NIE bit, the Transmit Buffer
      Unavailable interrupt is enabled. When this bit is reset, the Transmit Buffer Unavailable interrupt is disabled.
      0b - Transmit Buffer Unavailable is disabled 1b - Transmit Buffer Unavailable is enabled
    bit_offset: 2
    bit_size: 1
  - name: rie
    description: Receive Interrupt Enable. When this bit is set along with the NIE bit, the Receive Interrupt is
      enabled. When this bit is reset, the Receive Interrupt is disabled. 0b - Receive Interrupt is disabled 1b
      - Receive Interrupt is enabled
    bit_offset: 6
    bit_size: 1
  - name: rbue
    description: Receive Buffer Unavailable Enable. When this bit is set along with the AIE bit, the Receive Buffer
      Unavailable interrupt is enabled. When this bit is reset, the Receive Buffer Unavailable interrupt is disabled.
      0b - Receive Buffer Unavailable is disabled 1b - Receive Buffer Unavailable is enabled
    bit_offset: 7
    bit_size: 1
  - name: rse
    description: Receive Stopped Enable. When this bit is set along with the AIE bit, the Receive Stopped Interrupt
      is enabled. When this bit is reset, the Receive Stopped interrupt is disabled. 0b - Receive Stopped is disabled
      1b - Receive Stopped is enabled
    bit_offset: 8
    bit_size: 1
  - name: rwte
    description: Receive Watchdog Timeout Enable. When this bit is set along with the AIE bit, the Receive Watchdog
      Timeout interrupt is enabled. When this bit is reset, the Receive Watchdog Timeout interrupt is disabled.
      0b - Receive Watchdog Timeout is disabled 1b - Receive Watchdog Timeout is enabled
    bit_offset: 9
    bit_size: 1
  - name: etie
    description: Early Transmit Interrupt Enable. When this bit is set along with the AIE bit, the Early Transmit
      interrupt is enabled. When this bit is reset, the Early Transmit interrupt is disabled. 0b - Early Transmit
      Interrupt is disabled 1b - Early Transmit Interrupt is enabled
    bit_offset: 10
    bit_size: 1
  - name: erie
    description: Early Receive Interrupt Enable. When this bit is set along with the NIE bit, the Early Receive
      interrupt is enabled. When this bit is reset, the Early Receive interrupt is disabled. 0b - Early Receive
      Interrupt is disabled 1b - Early Receive Interrupt is enabled
    bit_offset: 11
    bit_size: 1
  - name: fbee
    description: Fatal Bus Error Enable. When this bit is set along with the AIE bit, the Fatal Bus error interrupt
      is enabled. When this bit is reset, the Fatal Bus Error error interrupt is disabled. 0b - Fatal Bus Error
      is disabled 1b - Fatal Bus Error is enabled
    bit_offset: 12
    bit_size: 1
  - name: cdee
    description: Context Descriptor Error Enable. When this bit is set along with the AIE bit, the Descriptor error
      interrupt is enabled. When this bit is reset, the Descriptor error interrupt is disabled. 0b - Context Descriptor
      Error is disabled 1b - Context Descriptor Error is enabled
    bit_offset: 13
    bit_size: 1
  - name: aie
    description: 'Abnormal Interrupt Summary Enable. When this bit is set, the abnormal interrupt summary is enabled.
      This bit enables the following interrupts in the DMA_CH0_Status register: - Bit 1: Transmit Process Stopped
      - Bit 7: Rx Buffer Unavailable - Bit 8: Receive Process Stopped - Bit 9: Receive Watchdog Timeout - Bit 10:
      Early Transmit Interrupt - Bit 12: Fatal Bus Error - Bit 13: Context Descriptor Error When this bit is reset,
      the abnormal interrupt summary is disabled. 0b - Abnormal Interrupt Summary is disabled 1b - Abnormal Interrupt
      Summary is enabled'
    bit_offset: 14
    bit_size: 1
  - name: nie
    description: 'Normal Interrupt Summary Enable. When this bit is set, the normal interrupt summary is enabled.
      This bit enables the following interrupts in the DMA_CH0_Status register: - Bit 0: Transmit Interrupt - Bit
      2: Transmit Buffer Unavailable - Bit 6: Receive Interrupt - Bit 11: Early Receive Interrupt When this bit
      is reset, the normal interrupt summary is disabled. 0b - Normal Interrupt Summary is disabled 1b - Normal
      Interrupt Summary is enabled'
    bit_offset: 15
    bit_size: 1
fieldset/DmaCh0RxInterruptWatchdogTimer:
  description: F70RM Rev. 1 section 51.7.5.12; manual text line 156689.
  bit_size: 32
  reset_value: 0
  fields:
  - name: rwt
    description: Receive Interrupt Watchdog Timer Count. This field indicates the number of system clock cycles,
      multiplied by factor indicated in RWTU field, for which the watchdog timer is set. The watchdog timer is triggered
      with the programmed value after the Rx DMA completes the transfer of a packet for which the RI bit is not
      set in the DMA_CH0_Status register, because of the setting of Interrupt Enable bit in the corresponding descriptor
      RDES3[30]. When the watchdog timer runs out, the RI bit is set and the timer is stopped. The watchdog timer
      is reset when the RI bit is set high because of automatic setting of RI as per the Interrupt Enable bit RDES3[30]
      of any received packet. NOTE This field is not testable by an automated register test.
    bit_offset: 0
    bit_size: 8
  - name: itw
    description: Rx Idle Timer Window. This field when programmed with a non-zero value, enables operation of the
      Rx Idle Timer. The timer window is determined in number of system clock cycles when this field is multiplied
      by the ITCU unit.
    bit_offset: 8
    bit_size: 5
  - name: rwtu
    description: 'Receive Interrupt Watchdog Timer Count Units. This fields indicates the number of system clock
      cycles corresponding to one unit in RWT field. - 2''b00: 256 - 2''b01: 512 - 2''b10: 1024 - 2''b11: 2048 For
      example, when RWT=2 and RWTU=1, the watchdog timer is set for 2*512=1024 system clock cycles. NOTE This field
      is not testable by an automated register test.'
    bit_offset: 16
    bit_size: 2
  - name: itcu
    description: 'Rx Idle Timer Count Units. This fields indicates the number of system clock cycles corresponding
      to one unit in ITW field. - 2''b00: 256 - 2''b01: 512 - 2''b10: 1024 - 2''b11: 2048 For example, when ITW=01010
      and ITCU=1, Rx Idle timer is set for 10*512=5120 system clock cycles. Vendor arithmetic error: the example
      at manual lines 156761-156762 prints 1024 cycles; 5120 cycles follows the ITW multiplication rule at lines
      156790-156792.'
    bit_offset: 18
    bit_size: 2
  - name: rbct
    description: Receive Byte Count Threshold.. This field sets the limit in number of bytes or number of RX packets
      (based on PSEL) transferred without the assertion of Receive Interrupt. Once this limit is crossed, Receive
      interrupt is asserted, and the watchdog timer (corresponding to RWT) is also reset. This function is valid
      only when set to a non-zero value. When RBCT = 0, RX Packet/Byte counter is inactive. When PSEL = 0, this
      field is multiplied by 1024, to get the actual number of byte threshold. When PSEL =1, RBCT value is directly
      used. Thus the maximum limit is 511 packets or 511 x 1024 bytes respectively.
    bit_offset: 20
    bit_size: 10
  - name: psel
    description: 'Packet Count Interrupt Select.. When this bit is set, RBCT indicates the number of packet threshold
      at which the Receive Interrupt (RI) is activated and the watchdog timer reset. When this bit is low, RBCT
      indicates the number of data byte threshold at which the Receive Interrupt (RI) is activated and the watchdog
      timer reset. - 1: RBCT field is used to generate interrupt based on number of packets received. - 0: RBCT
      field is used to generate interrupt based on number of bytes received.'
    bit_offset: 31
    bit_size: 1
fieldset/DmaCh0CurrentAppTxdesc:
  description: F70RM Rev. 1 section 51.7.5.13; manual text line 156808.
  bit_size: 32
  reset_value: 0
  fields:
  - name: curtdesaptr
    description: Read-only. Application Transmit Descriptor Address Pointer. The DMA updates this pointer during
      Tx operation. This pointer is cleared on reset.
    bit_offset: 0
