fieldset/MacConfiguration:
  description: F70RM Rev. 1 section 51.7.1.2; manual text line 148297.
  bit_size: 32
  reset_value: 32768
  fields:
  - name: re
    description: Receiver Enable. When this bit is set, the Rx state machine of the MAC is enabled for receiving
      packets from the GMII or MII interface. When this bit is reset, the MAC Rx state machine is disabled after
      it completes the reception of the current packet. The Rx state machine does not receive any more packets from
      the GMII or MII interface. 0b - Receiver is disabled 1b - Receiver is enabled
    bit_offset: 0
    bit_size: 1
  - name: te
    description: Transmitter Enable. When this bit is set, the Tx state machine of the MAC is enabled for transmission
      on the GMII or MII interface. When this bit is reset, the MAC Tx state machine is disabled after it completes
      the transmission of the current packet. The Tx state machine does not transmit any more packets. 0b - Transmitter
      is disabled 1b - Transmitter is enabled
    bit_offset: 1
    bit_size: 1
  - name: prelen
    description: Preamble Length for Transmit packets. These bits control the number of preamble bytes that are
      added to the beginning of every Tx packet. The preamble reduction occurs only when the MAC is operating in
      the full-duplex mode. 00b - 7 bytes of preamble 01b - 5 bytes of preamble 10b - 3 bytes of preamble 11b -
      Reserved
    bit_offset: 2
    bit_size: 2
  - name: dc
    description: Deferral Check. When this bit is set, the deferral check function is enabled in the MAC. The MAC
      issues a Packet Abort status, along with the excessive deferral error bit set in the Tx packet status, when
      the Tx state machine is deferred for more than 24,288 bit times in 10 or 100 Mbps mode. If the MAC is configured
      for 1000/2500 Mbps operation, the threshold for deferral is 155,680 bits times. Deferral begins when the transmitter
      is ready to transmit, but it is prevented because of an active carrier sense signal (CRS) on GMII or MII.
      The defer time is not cumulative. For example, if the transmitter defers for 10,000 bit times because the
      CRS signal is active and the CRS signal becomes inactive, the transmitter transmits and collision happens.
      Because of collision, the transmitter needs to back off and then defer again after back off completion. In
      such a scenario, the deferral timer is reset to 0, and it is restarted. When this bit is reset, the deferral
      check function is disabled and the MAC defers until the CRS signal goes inactive. This bit is applicable only
      in the half-duplex mode. 0b - Deferral check function is disabled 1b - Deferral check function is enabled
    bit_offset: 4
    bit_size: 1
  - name: bl
    description: Back-Off Limit. The back-off limit determines the random integer number (r) of slot time delays
      (4,096 bit times for 1000/2500 Mbps; 512 bit times for 10/100 Mbps) for which the MAC waits before rescheduling
      a transmission attempt during retries after a collision. n = retransmission attempt. The random integer r
      takes the value in the range 0 <= r < 2^k This bit is applicable only in the half-duplex mode. 00b - k = min(n,10)
      01b - k = min(n,8) 10b - k = min(n,4) 11b - k = min(n,1)
    bit_offset: 5
    bit_size: 2
  - name: dr
    description: Disable Retry. When this bit is set, the MAC attempts only one transmission. When a collision occurs
      on the GMII or MII interface, the MAC ignores the current packet transmission and reports a Packet Abort with
      excessive collision error in the Tx packet status. When this bit is reset, the MAC retries based on the settings
      of the BL field. This bit is applicable only in the half-duplex mode. 0b - Enable Retry 1b - Disable Retry
    bit_offset: 8
    bit_size: 1
  - name: dcrs
    description: Disable Carrier Sense During Transmission. When this bit is set, the MAC transmitter ignores the
      (G)MII CRS signal during packet transmission in the half-duplex mode. As a result, no errors are generated
      because of Loss of Carrier or No Carrier during transmission. When this bit is reset, the MAC transmitter
      generates errors because of Carrier Sense. The MAC can even abort the transmission. 0b - Enable Carrier Sense
      During Transmission 1b - Disable Carrier Sense During Transmission
    bit_offset: 9
    bit_size: 1
  - name: do_
    description: 'DO: Disable Receive Own. When this bit is set, the MAC disables the reception of packets when
      the gmii_txen_o is asserted in the half-duplex mode. When this bit is reset, the MAC receives all packets
      given by the PHY. This bit is not applicable in the full-duplex mode. 0b - Enable Receive Own 1b - Disable
      Receive Own'
    bit_offset: 10
    bit_size: 1
  - name: ecrsfd
    description: Enable Carrier Sense Before Transmission in Full-Duplex Mode. When this bit is set, the MAC transmitter
      checks the CRS signal before packet transmission in the full-duplex mode. The MAC starts the transmission
      only when the CRS signal is low. When this bit is reset, the MAC transmitter ignores the status of the CRS
      signal. 0b - ECRSFD is disabled 1b - ECRSFD is enabled
    bit_offset: 11
    bit_size: 1
  - name: lm
    description: Loopback Mode. When this bit is set, the MAC operates in the loopback mode at GMII or MII. The
      (G)MII Rx clock input (clk_rx_i) is required for the loopback to work properly. This is because the Tx clock
      is not internally looped back. 0b - Loopback is disabled 1b - Loopback is enabled
    bit_offset: 12
    bit_size: 1
  - name: dm
    description: Duplex Mode. When this bit is set, the MAC operates in the full-duplex mode in which it can transmit
      and receive simultaneously. This bit is RO with default value of 1'b1 in the full-duplex-only configurations.
      0b - Half-duplex mode 1b - Full-duplex mode
    bit_offset: 13
    bit_size: 1
  - name: fes
    description: Speed. This bit selects the speed mode. The mac_speed_o[0] signal reflects the value of this bit.
      0b - 10 Mbps when PS bit is 1 and 1 Gbps when PS bit is 0 1b - 100 Mbps when PS bit is 1 and 2.5 Gbps when
      PS bit is 0
    bit_offset: 14
    bit_size: 1
  - name: ps
    description: Read-only. Port Select. This bit selects the Ethernet line speed. This bit, along with Bit 14,
      selects the exact line speed. In the 10/100 Mbps-only (always 1) or 1000 Mbps-only (always 0) configurations,
      this bit is read-only (RO) with appropriate value. In default 10/100/1000 Mbps configurations, this bit is
      read-write (R/W). The mac_speed_o[1] signal reflects the value of this bit. 0b - For 1000 or 2500 Mbps operations
      1b - For 10 or 100 Mbps operations
    bit_offset: 15
    bit_size: 1
  - name: je
    description: Jumbo Packet Enable. When this bit is set, the MAC allows jumbo packets of 9,018 bytes (9,022 bytes
      for VLAN tagged packets) without reporting a giant packet error in the Rx packet status. 0b - Jumbo packet
      is disabled 1b - Jumbo packet is enabled
    bit_offset: 16
    bit_size: 1
  - name: jd
    description: Jabber Disable. When this bit is set, the MAC disables the jabber timer on the transmitter. The
      MAC can transfer packets of up to 16,383 bytes. When this bit is reset, if the application sends more than
      2,048 bytes of data (10,240 if JE is set high) during transmission, the MAC does not send rest of the bytes
      in that packet. 0b - Jabber is enabled 1b - Jabber is disabled
    bit_offset: 17
    bit_size: 1
  - name: wd
    description: Watchdog Disable. When this bit is set, the MAC disables the watchdog timer on the receiver. The
      MAC can receive packets of up to 16,383 bytes. When this bit is reset, the MAC does not allow more than 2,048
      bytes (10,240 if JE is set high) of the packet being received. The MAC cuts off any bytes received after 2,048
      bytes. 0b - Watchdog is enabled 1b - Watchdog is disabled
    bit_offset: 19
    bit_size: 1
  - name: acs
    description: 'Automatic Pad or CRC Stripping. 1: MAC strips the pad or the FCS field of the incoming Ethernet
      Length packets. For the Ethernet Type packets, MAC transfers the packets to the application without stripping
      the Pad or FCS field. 0: MAC passes all incoming packets to the application, without any modification. NOTE
      For more details about impact of CST and ACS bit settings on the packet length, see "Packet Length based on
      the CST and ACS Bits" table in the Architecture chapter. 0b - Automatic Pad or CRC Stripping is disabled 1b
      - Automatic Pad or CRC Stripping is enabled'
    bit_offset: 20
    bit_size: 1
  - name: cst
    description: 'CRC stripping for Type packets. 1: MAC strips and drops the last four bytes (FCS) of all Ether
      type packets, as indicated by the Length/ Type field of the packet, before forwarding the packet to the application.
      NOTE For more details about impact of CST and ACS bit settings on the packet length, see "Packet Length based
      on the CST and ACS Bits" table in the Architecture chapter. 0b - CRC stripping for Type packets is disabled
      1b - CRC stripping for Type packets is enabled'
    bit_offset: 21
    bit_size: 1
  - name: s2kp
    description: Support for 2K Packets. When this bit is set, the MAC considers all packets with up to 2,000 bytes
      length as normal packets. When the JE bit is not set, the MAC considers all received packets of size more
      than 2K bytes as Giant packets. When this bit is reset and the JE bit is not set, the MAC considers all received
      packets of size more than 1,518 bytes (1,522 bytes for tagged) as giant packets. For more information about
      how the setting of this bit and the JE bit impact the Giant packet status, see the Table, Giant Packet Status
      based on S2KP and JE Bits. NOTE When the JE bit is set, setting this bit has no effect on the giant packet
      status. 0b - Support upto 2K packet is disabled 1b - Support upto 2K packet is Enabled
    bit_offset: 22
    bit_size: 1
  - name: gpslce
    description: Giant Packet Size Limit Control Enable. When this bit is set, the MAC considers the value in GPSL
      field in MAC_Ext_Configuration register to declare a received packet as Giant packet. This field must be programmed
      to more than 1,518 bytes. Otherwise, the MAC considers 1,518 bytes as giant packet limit. When this bit is
      reset, the MAC considers a received packet as Giant packet when its size is greater than 1,518 bytes (1522
      bytes for tagged packet). The watchdog timeout limit, Jumbo Packet Enable and 2K Packet Enable have higher
      precedence over this bit, that is the MAC considers a received packet as Giant packet when its size is greater
      than 9,018 bytes (9,022 bytes for tagged packet) with Jumbo Packet Enabled and greater than 2,000 bytes with
      2K Packet Enabled. The watchdog timeout, if enabled, terminates the received packet when watchdog limit is
      reached. Therefore, the programmed giant packet limit must be less than the watchdog limit to get the giant
      packet status. 0b - Giant Packet Size Limit Control is disabled 1b - Giant Packet Size Limit Control is enabled
    bit_offset: 23
    bit_size: 1
  - name: ipg
    description: Inter-Packet Gap. These bits control the minimum IPG between packets during transmission. This
      range of minimum IPG is valid in full-duplex mode. In the half-duplex mode, the minimum IPG can be configured
      only for 64-bit times (IPG = 100). Lower values are not considered. When a JAM pattern is being transmitted
      because of backpressure activation, the MAC does not consider the minimum IPG. This function (IPG less than
      96 bit times) is valid only when EIPGEN bit in MAC_Ext_Configuration register is reset. When EIPGEN is set,
      then the minimum IPG (greater than 96 bit times) is controlled as per the description given in EIPG field
      in MAC_Ext_Configuration register. 000b - 96 bit times IPG 001b - 88 bit times IPG 010b - 80 bit times IPG
      011b - 72 bit times IPG 100b - 64 bit times IPG 101b - 56 bit times IPG 110b - 48 bit times IPG 111b - 40
      bit times IPG
    bit_offset: 24
    bit_size: 3
  - name: ipc
    description: Checksum Offload. When set, this bit enables the IPv4 header checksum checking and IPv4 or IPv6
      TCP, UDP, or ICMP payload checksum checking. When this bit is reset, the COE function in the receiver is disabled.
      The Layer 3 and Layer 4 Packet Filter and Enable Split Header features automatically selects the IPC Full
      Checksum Offload Engine on the Receive side. When any of these features are enabled, you must set the IPC
      bit. 0b - IP header/payload checksum checking is disabled 1b - IP header/payload checksum checking is enabled
    bit_offset: 27
    bit_size: 1
  - name: sarc
    description: 'Only MAC address 0 is mapped; address-1 encodings in generic prose do not establish another address
      register. Source Address Insertion or Replacement Control. Controls the source address insertion or replacement
      for all transmitted packets. Bit 30 specifies which MAC Address register (0 or 1) is used for source address
      insertion or replacement based on the values of Bits[29:28]: 2''b0x: - The mti_sa_ctrl_i and ati_sa_ctrl_i
      input signals control the SA field generation. 2''b10: - If Bit 30 is set to 0, the MAC inserts the content
      of the MAC Address 0 registers in the SA field of all transmitted packets. - If Bit 30 is set to 1 and the
      Enable MAC Address Register 1 option is selected while configuring the IP, the MAC inserts the content of
      the MAC Address 1 registers in the SA field of all transmitted packets. 2''b11: - If Bit 30 is set to 0, the
      MAC replaces the content of the MAC Address 0 registers in the SA field of all transmitted packets. - If Bit
      30 is set to 1 and the MAC Address Register 1 is enabled, the MAC replaces the content of the MAC Address
      1 registers in the SA field of all transmitted packets. NOTE Changes to this field take effect only on the
      start of a packet. If you write to this register field when a packet is being transmitted, only the subsequent
      packet can use the updated value, that is, the current packet does not use the updated value. 000b - mti_sa_ctrl_i
      and ati_sa_ctrl_i input signals control the SA field generation 010b - Contents of MAC Addr-0 inserted in
      SA field 011b - Contents of MAC Addr-0 replaces SA field 110b - Contents of MAC Addr-1 inserted in SA field
      111b - Contents of MAC Addr-1 replaces SA field'
    bit_offset: 28
    bit_size: 3
fieldset/MacExtConfiguration:
  description: F70RM Rev. 1 section 51.7.1.3; manual text line 148664.
  bit_size: 32
  reset_value: 0
  fields:
  - name: gpsl
    description: Giant Packet Size Limit. If the received packet size is greater than the value programmed in this
      field in units of bytes, the MAC declares the received packet as Giant packet. The value programmed in this
      field must be greater than or equal to 1,518 bytes. Any other programmed value is considered as 1,518 bytes.
      For VLAN tagged packets, the MAC adds 4 bytes to the programmed value. The MAC adds 8 bytes to the programmed
      value for double VLAN tagged packets. The value in this field is applicable when the GPSLCE bit is set in
      MAC_Configuration register.
    bit_offset: 0
    bit_size: 14
  - name: dcrcc
    description: Disable CRC Checking for Received Packets. When this bit is set, the MAC receiver does not check
      the CRC field in the received packets. When this bit is reset, the MAC receiver always checks the CRC field
      in the received packets. 0b - CRC Checking is enabled 1b - CRC Checking is disabled
    bit_offset: 16
    bit_size: 1
  - name: spen
    description: 'Slow Protocol Detection Enable. - 1: MAC processes the Slow Protocol packets (Ether Type = 0x8809)
      and provides the Slow Protocol Sub-Type and Code fields in the Rx status. - 0: MAC forwards all the error-free
      Slow Protocol packets to the application. The MAC considers such packets as normal Type packets. 0b - Slow
      Protocol Detection is disabled 1b - Slow Protocol Detection is enabled'
    bit_offset: 17
    bit_size: 1
  - name: usp
    description: Unicast Slow Protocol Packet Detect. When this bit is set, the MAC detects the Slow Protocol packets
      with unicast address of the station specified in the MAC_Address0_High and MAC_Address0_Low registers. The
      MAC also detects the Slow Protocol packets with the Slow Protocols multicast address (01-80-C2-00-00-02).
      When this bit is reset, the MAC detects only Slow Protocol packets with the Slow Protocol multicast address
      specified in the IEEE 802.3-2015, Section 5. 0b - Unicast Slow Protocol Packet Detection is disabled 1b -
      Unicast Slow Protocol Packet Detection is enabled
    bit_offset: 18
    bit_size: 1
  - name: eipgen
    description: 'Extended Inter-Packet Gap Enable. 1: MAC uses the EIPG field for the extended inter-packet gap.
      For more details of how the MAC uses the EIPG field, see the description of the EIPG field. 0: MAC ignores
      EIPG field. MAC uses the IPG field of the MAC_Configuration register as the minimum IPG less than or equal
      to 96-bit times, in steps of 8-bit times. NOTE Use this feature only when operating in full-duplex mode. If
      you enable this feature in half-duplex mode, you might see undesirable effects on back-pressure function and
      frame transmission. 0b - Extended Inter-Packet Gap is disabled 1b - Extended Inter-Packet Gap is enabled'
    bit_offset: 24
    bit_size: 1
  - name: eipg
    description: Extended Inter-Packet Gap. The value in this field is applicable when the EIPGEN bit of this register
      is 1. The 5 bits of this field are the most significant bits; IPG field of the MAC_Configuration register
      are the least significant 3 bits. Together, these 8 bits represent the value of the minimum IPG greater than
      96-bit times, in steps of 8-bit times. {EIPG, IPG} 8'h00 - 104 bit times 8'h01 - 112 bit times 8'h02 - 120
      bit times ... 8'hFF - 2144 bit times
    bit_offset: 25
    bit_size: 5
fieldset/MacPacketFilter:
  description: F70RM Rev. 1 section 51.7.1.4; manual text line 148812.
  bit_size: 32
  reset_value: 0
  fields:
  - name: pr
    description: 'Promiscuous Mode. - 1: MAC transfers all incoming packets to the application regardless of the
      destination or source address filtering status. MAC clears the SA or DA Filter Fail status bits of the MAC
      Rx status word. For more details about MAC Rx status word, see "Receive Status Word at the MAC Interface"
      table in the Architecture chapter. - 0: MAC transfers to the application only the packets that pass destination
      or source address filtering. 0b - Promiscuous Mode is disabled 1b - Promiscuous Mode is enabled'
    bit_offset: 0
    bit_size: 1
  - name: daif
    description: DA Inverse Filtering. When this bit is set, the Address Check block operates in inverse filtering
      mode for the DA address comparison for both unicast and multicast packets. When this bit is reset, normal
      filtering of packets is performed. 0b - DA Inverse Filtering is disabled 1b - DA Inverse Filtering is enabled
    bit_offset: 3
    bit_size: 1
  - name: pm
    description: Pass All Multicast. When this bit is set, it indicates that all the received packets with a multicast
      destination address (first bit in the destination address field is '1') are passed. When this bit is reset,
      filtering of multicast packet depends on HMC bit. 0b - Pass All Multicast is disabled 1b - Pass All Multicast
      is enabled
    bit_offset: 4
    bit_size: 1
  - name: dbf
    description: Disable Broadcast Packets. When this bit is set, the AFM module blocks all the incoming broadcast
      packets. In addition, it overrides all other filter settings. When this bit is reset, the AFM module passes
      all received broadcast packets. 0b - Enable Broadcast Packets 1b - Disable Broadcast Packets
    bit_offset: 5
    bit_size: 1
  - name: pcf
    description: Pass Control Packets. These bits control the forwarding of all control packets (including unicast
      and multicast Pause packets). 00b - MAC filters all control packets from reaching the application 01b - MAC
      forwards all control packets except Pause packets to the application even if they fail the Address filter
      10b - MAC forwards all control packets to the application even if they fail the Address filter 11b - MAC forwards
      the control packets that pass the Address filter
    bit_offset: 6
    bit_size: 2
  - name: vtfe
    description: VLAN Tag Filter Enable. When this bit is set, the MAC drops the VLAN tagged packets that do not
      match the VLAN Tag. When this bit is reset, the MAC forwards all packets irrespective of the match status
      of the VLAN Tag. 0b - VLAN Tag Filter is disabled 1b - VLAN Tag Filter is enabled
    bit_offset: 16
    bit_size: 1
  - name: ra
    description: 'Receive All. - 1: The MAC receiver transfers all the received packets to the application regardless
      of the address filter status. MAC updates the SA or DA filtering status in the corresponding bit of the MAC
      filter status word. For more details, see the "MAC Filter Status Word Format" table in the Architecture chapter.
      - 0: The MAC receiver transfers only the packets that pass the SA or DA address filter, to the application.
      0b - Receive All is disabled 1b - Receive All is enabled'
    bit_offset: 31
    bit_size: 1
fieldset/MacWdJbTimeout:
  description: F70RM Rev. 1 section 51.7.1.5; manual text line 148979.
  bit_size: 32
  reset_value: 0
  fields:
  - name: wto
    description: Watchdog Timeout. When the PWE bit is set and the WD bit of the MAC_Configuration register is reset,
      this field is used as watchdog timeout limit for a received packet. If the length of a received packet exceeds
      the value of this field, such packet is terminated and declared as an error packet. NOTE When the PWE bit
      is set, the value in this field must be more than 1,522 (0x05F2). Otherwise, the IEEE 802.3-specified valid
      tagged packets are declared as error packets and then dropped. 0000b - 2 KB 0001b - 3 KB 0010b - 4 KB 0011b
      - 5 KB 0100b - 6 KB 0101b - 7 KB 0110b - 8 KB 0111b - 9 KB 1000b - 10 KB 1001b - 11 KB 1010b - 12 KB 1011b
      - 13 KB 1100b - 14 KB 1101b - 15 KB 1110b - 16383 Bytes 1111b - Reserved
    bit_offset: 0
    bit_size: 4
  - name: pwe
    description: Programmable Watchdog Enable. When this bit is set and the WD bit of the MAC_Configuration register
      is reset, the WTO field is used as watchdog timeout limit for a received packet. When this bit is cleared,
      the watchdog timeout for a received packet is controlled by setting of WD and JE bits in MAC_Configuration
      register. 0b - Programmable Watchdog is disabled 1b - Programmable Watchdog is enabled
    bit_offset: 8
    bit_size: 1
  - name: jto
    description: Jabber Timeout. When the PJE bit is set and the JD bit of the MAC_Configuration register is reset,
      this field is used as jabber timeout limit for a transmitted packet. If the length of a transmitted packet
      exceeds the value of this field, such packet is terminated and declared as an error packet. NOTE When the
      PJE bit is set, the value in this field must be more than 1,522 (0x05F2). Otherwise, the IEEE 802.3-specified
      valid tagged packets are declared as error packets and terminated. 0000b - 2 KB 0001b - 3 KB 0010b - 4 KB
      0011b - 5 KB 0100b - 6 KB 0101b - 7 KB 0110b - 8 KB 0111b - 9 KB 1000b - 10 KB 1001b - 11 KB 1010b - 12 KB
      1011b - 13 KB 1100b - 14 KB 1101b - 15 KB 1110b - 16383 Bytes 1111b - Reserved
    bit_offset: 16
    bit_size: 4
  - name: pje
    description: Programmable Jabber Enable. When this bit is set and the JD bit of the MAC_Configuration register
      is reset, the JTO field is used as jabber timeout limit for a transmitted packet. When this bit is cleared,
      the jabber timeout for a received packet is controlled by setting of JD and JE bits in MAC_Configuration register.
      0b - Programmable Jabber is disabled 1b - Programmable Jabber is enabled
    bit_offset: 24
    bit_size: 1
fieldset/MacVlanTag:
  description: F70RM Rev. 1 section 51.7.1.6; manual text line 149146.
  bit_size: 32
  reset_value: 0
  fields:
  - name: vl
    description: 'VLAN Tag Identifier for Receive Packets. This field contains the 802.1Q VLAN tag to identify the
      VLAN packets. This VLAN tag identifier is compared to the 15th and 16th bytes of the packets being received
      for VLAN packets. The following list describes the bits of this field: - Bits[15:13]: User Priority - Bit
      12: Canonical Format Indicator (CFI) or Drop Eligible Indicator (DEI) - Bits[11:0]: VLAN Identifier (VID)
      field of VLAN tag When the ETV bit is set, only the VID is used for comparison. If this field ([11:0] if ETV
      is set) is all zeros, the MAC does not check the 15th and 16th bytes for VLAN tag comparison and declares
      all packets with Type field value of 0x8100 or 0x88a8 as VLAN packets.'
    bit_offset: 0
    bit_size: 16
  - name: etv
    description: 'Enable 12-Bit VLAN Tag Comparison. - 1: A 12-bit VLAN identifier is used for comparing and filtering
      instead of the complete 16-bit VLAN tag. Bits[11:0] of the VLAN tag are compared with the corresponding field
      in the received VLAN-tagged packet. Similarly, when enabled, only 12 bits of the VLAN tag in the received
      packet are used for hash-based VLAN filtering. - 0: All 16 bits of the 15th and 16th bytes of the received
      VLAN packet are used for comparison and VLAN hash filtering. 0b - 12-Bit VLAN Tag Comparison is disabled 1b
      - 12-Bit VLAN Tag Comparison is enabled'
    bit_offset: 16
    bit_size: 1
  - name: vtim
    description: 'VLAN Tag Inverse Match Enable. - 1: Enables the VLAN Tag inverse matching. The packets without
      matching VLAN Tag are marked as matched. - 0: Enables the VLAN Tag perfect matching. The packets with matched
      VLAN Tag are marked as matched. 0b - VLAN Tag Inverse Match is disabled 1b - VLAN Tag Inverse Match is enabled'
    bit_offset: 17
    bit_size: 1
  - name: esvl
    description: 'Enable S-VLAN. - 1: MAC transmitter and receiver consider the S-VLAN packets (Type = 0x88A8) as
      valid VLAN tagged packets. 0b - S-VLAN is disabled 1b - S-VLAN is enabled'
    bit_offset: 18
    bit_size: 1
  - name: ersvlm
    description: 'Enable Receive S-VLAN Match. - 1: MAC receiver enables filtering or matching for S-VLAN (Type
      = 0x88A8) packets. - 0: MAC receiver enables filtering or matching for C-VLAN (Type = 0x8100) packets. The
      ERIVLT bit determines the VLAN tag position considered for filtering or matching. 0b - Receive S-VLAN Match
      is disabled 1b - Receive S-VLAN Match is enabled'
    bit_offset: 19
    bit_size: 1
  - name: dovltc
    description: 'Disable VLAN Type Check. - 1: MAC does not check whether the VLAN Tag specified by the ERIVLT
      bit is of type S-VLAN or C-VLAN. - 0: MAC filters or matches the VLAN Tag specified by the ERIVLT bit only
      when VLAN Tag type is similar to the one specified by the ERSVLM bit. The VLAN filter is bypassed when VLAN
      Type of received packet do not match the programmed VLAN Type in the VLAN filter. 0b - VLAN Type Check is
      enabled 1b - VLAN Type Check is disabled'
    bit_offset: 20
    bit_size: 1
  - name: evls
    description: Enable VLAN Tag Stripping on Receive. This field indicates the stripping operation on the outer
      VLAN Tag in the received packet. 00b - Do not strip 01b - Strip if VLAN filter passes 10b - Strip if VLAN
      filter fails 11b - Always strip
    bit_offset: 21
    bit_size: 2
  - name: evlrxs
    description: 'Enable VLAN Tag in Rx status. - 1: MAC provides the outer VLAN Tag in the Rx status. - 0: MAC
      does not provide the outer VLAN Tag in Rx status. 0b - VLAN Tag in Rx status is disabled 1b - VLAN Tag in
      Rx status is enabled'
    bit_offset: 24
    bit_size: 1
  - name: edvlp
    description: 'Enable Double VLAN Processing. - 1: MAC enables processing of up to two VLAN Tags on Tx and Rx
      (if present). - 0: MAC enables processing of up to one VLAN Tag on Tx and Rx (if present). 0b - Double VLAN
      Processing is disabled 1b - Double VLAN Processing is enabled'
    bit_offset: 26
    bit_size: 1
  - name: erivlt
    description: Enable Inner VLAN Tag. When this bit and the EDVLP field are set, the MAC receiver enables operation
      on the inner VLAN Tag (if present). When this bit is reset, the MAC receiver enables operation on the outer
      VLAN Tag (if present). The ERSVLM bit determines which VLAN type is enabled for filtering or matching. 0b
      - Inner VLAN tag is disabled 1b - Inner VLAN tag is enabled
    bit_offset: 27
    bit_size: 1
  - name: eivls
    description: Enable Inner VLAN Tag Stripping on Receive. This field indicates the stripping operation on inner
      VLAN Tag in the received packet. 00b - Do not strip 01b - Strip if VLAN filter passes 10b - Strip if VLAN
      filter fails 11b - Always strip
    bit_offset: 28
    bit_size: 2
  - name: eivlrxs
    description: 'Enable Inner VLAN Tag in Rx Status. - 1: MAC provides the inner VLAN Tag in the Rx status. - 0:
      MAC does not provide the inner VLAN Tag in the Rx status. 0b - Inner VLAN Tag in Rx status is disabled 1b
      - Inner VLAN Tag in Rx status is enabled'
    bit_offset: 31
    bit_size: 1
fieldset/MacVlanIncl:
  description: F70RM Rev. 1 section 51.7.1.7; manual text line 149322.
  bit_size: 32
  reset_value: 0
  fields:
  - name: vlt
    description: 'VLAN Tag for Transmit Packets. This field contains the value of the VLAN tag to be inserted or
      replaced. The value must only be changed when the transmit lines are inactive or during the initialization
      phase. The following list describes the bits of this field: - Bits[15:13]: User Priority - Bit 12: Canonical
      Format Indicator (CFI) or Drop Eligible Indicator (DEI) - Bits[11:0]: VLAN Identifier (VID) field of VLAN
      tag'
    bit_offset: 0
    bit_size: 16
  - name: vlc
    description: 'VLAN Tag Control in Transmit Packets. - 2''b00: No VLAN tag deletion, insertion, or replacement
      - 2''b01: VLAN tag deletion The MAC removes the VLAN type (bytes 13 and 14) and VLAN tag (bytes 15 and 16)
      of all transmitted packets with VLAN tags. - 2''b10: VLAN tag insertion The MAC inserts VLT in bytes 15 and
      16 of the packet after inserting the Type value (0x8100 or 0x88a8) in bytes 13 and 14. This operation is performed
      on all transmitted packets, irrespective of whether they already have a VLAN tag. - 2''b11: VLAN tag replacement
      The MAC replaces VLT in bytes 15 and 16 of all VLAN-type transmitted packets (Bytes 13 and 14 are 0x8100 or
      0x88a8). NOTE Changes to this field take effect only on the start of a packet. If you write this register
      field when a packet is being transmitted, only the subsequent packet can use the updated value, that is, the
      current packet does not use the updated value. 00b - No VLAN tag deletion, insertion, or replacement 01b -
      VLAN tag deletion 10b - VLAN tag insertion 11b - VLAN tag replacement'
    bit_offset: 16
    bit_size: 2
  - name: vlp
    description: VLAN Priority Control. When this bit is set, the control bits[17:16] are used for VLAN deletion,
      insertion, or replacement. When this bit is reset, the mti_vlan_ctrl_i control input is used and bits[17:16]
      are ignored. 0b - VLAN Priority Control is disabled 1b - VLAN Priority Control is enabled
    bit_offset: 18
    bit_size: 1
  - name: csvl
    description: C-VLAN or S-VLAN. When this bit is set, S-VLAN type (0x88A8) is inserted or replaced in the 13th
      and 14th bytes of transmitted packets. When this bit is reset, C-VLAN type (0x8100) is inserted or replaced
      in the 13th and 14th bytes of transmitted packets. 0b - C-VLAN type (0x8100) is inserted or replaced 1b -
      S-VLAN type (0x88A8) is inserted or replaced
    bit_offset: 19
    bit_size: 1
  - name: vlti
    description: 'VLAN Tag Input. When this bit is set, it indicates that the VLAN tag to be inserted or replaced
      in Tx packet must be taken from: - The Tx descriptor 0b - VLAN Tag Input is disabled 1b - VLAN Tag Input is
      enabled'
    bit_offset: 20
    bit_size: 1
fieldset/MacInnerVlanIncl:
  description: F70RM Rev. 1 section 51.7.1.8; manual text line 149461.
  bit_size: 32
  reset_value: 0
  fields:
  - name: vlt
    description: 'VLAN Tag for Transmit Packets. This field contains the value of the VLAN tag to be inserted or
      replaced. The value must only be changed when the transmit lines are inactive or during the initialization
      phase. The following list describes the bits of this field: - Bits[15:13]: User Priority - Bit 12: Canonical
      Format Indicator (CFI) or Drop Eligible Indicator (DEI) - Bits[11:0]: VLAN Identifier (VID) field of VLAN
      tag'
    bit_offset: 0
    bit_size: 16
  - name: vlc
    description: 'VLAN Tag Control in Transmit Packets. - 2''b00: No VLAN tag deletion, insertion, or replacement
      - 2''b01: VLAN tag deletion The MAC removes the VLAN type (bytes 17 and 18) and VLAN tag (bytes 19 and 20)
      of all transmitted packets with VLAN tags. - 2''b10: VLAN tag insertion The MAC inserts VLT in bytes 19 and
      20 of the packet after inserting the Type value (0x8100 or 0x88a8) in bytes 17 and 18. This operation is performed
      on all transmitted packets, irrespective of whether they already have a VLAN tag. - 2''b11: VLAN tag replacement
      The MAC replaces VLT in bytes 19 and 20 of all VLAN-type transmitted packets (Bytes 17 and 18 are 0x8100 or
      0x88a8). NOTE Changes to this field take effect only on the start of a packet. If you write this register
      field when a packet is being transmitted, only the subsequent packet can use the updated value, that is, the
      current packet does not use the updated value. 00b - No VLAN tag deletion, insertion, or replacement 01b -
      VLAN tag deletion 10b - VLAN tag insertion 11b - VLAN tag replacement'
    bit_offset: 16
    bit_size: 2
  - name: vlp
    description: 'VLAN Priority Control. - 1: MAC uses the VLC field for VLAN deletion, insertion, or replacement.
      - 0: MAC uses the mti_vlan_ctrl_i signal for VLAN deletion, insertion, or replacement. MAC ignores the VLC
      field. 0b - VLAN Priority Control is disabled 1b - VLAN Priority Control is enabled'
    bit_offset: 18
    bit_size: 1
  - name: csvl
    description: 'C-VLAN or S-VLAN. - 1: S-VLAN type (0x88A8) is inserted or replaced in the 17th and 18th bytes
      of transmitted packets. - 0: C-VLAN type (0x8100) is inserted or replaced in the 17th and 18th bytes of transmitted
      packets. 0b - C-VLAN type (0x8100) is inserted 1b - S-VLAN type (0x88A8) is inserted'
    bit_offset: 19
    bit_size: 1
  - name: vlti
    description: 'VLAN Tag Input. When this bit is set, it indicates that the VLAN tag to be inserted or replaced
      in Tx packet must be taken from: - The Tx descriptor 0b - VLAN Tag Input is disabled 1b - VLAN Tag Input is
      enabled'
    bit_offset: 20
    bit_size: 1
fieldset/MacQ0TxFlowCtrl:
  description: F70RM Rev. 1 section 51.7.1.9; manual text line 149573.
  bit_size: 32
  reset_value: 0
  fields:
  - name: fcb_bpa
    description: 'Flow Control Busy or Backpressure Activate. This bit initiates a Pause packet in the full-duplex
      mode and activates the backpressure function in the half-duplex mode if the TFE bit is set. Full-Duplex Mode:
      In the full-duplex mode, this bit must be read as 1''b0 before writing to this register. To initiate a Pause
      packet, the application must set this bit to 1''b1. During Control packet transfer, this bit continues to
      be set to indicate that a packet transmission is in progress. When Pause packet transmission is complete,
      the MAC resets this bit to 1''b0. You must not write to this register until this bit is cleared. Half-Duplex
      Mode: When this bit is set (and TFE bit is set) in the half-duplex mode, the MAC asserts the backpressure.
      During backpressure, when the MAC receives a new packet, the transmitter starts sending a JAM pattern resulting
      in a collision. This control register bit is logically ORed with the mti_flowctrl_i input signal for the backpressure
      function. When the MAC is configured for the full-duplex mode, the BPA is automatically disabled. Access restrictions
      apply. - MAC initiates the pause packet or activates the backpressure, when application writes 1. - MAC writes
      0 after the operation is complete. - MAC ignores when application writes 0. NOTE This field is not testable
      by an automated register test. 0b - Flow Control Busy or Backpressure Activate is disabled 1b - Flow Control
      Busy or Backpressure Activate is enabled'
    bit_offset: 0
    bit_size: 1
  - name: tfe
    description: 'Transmit Flow Control Enable. Full-Duplex Mode: In the full-duplex mode, when this bit is set,
      the MAC enables the flow control operation to Tx Pause packets. When this bit is reset, the flow control operation
      in the MAC is disabled, and the MAC does not transmit any Pause packets. Half-Duplex Mode: In the half-duplex
      mode, when this bit is set, the MAC enables the backpressure operation. When this bit is reset, the backpressure
      feature is disabled. 0b - Transmit Flow Control is disabled 1b - Transmit Flow Control is enabled'
    bit_offset: 1
    bit_size: 1
  - name: plt
    description: Pause Low Threshold. This field configures the threshold of the Pause timer at which the input
      flow control signal mti_flowctrl_i (or sbd_flowctrl_i) is checked for automatic retransmission of the Pause
      packet. The threshold values must be always less than the Pause Time configured in Bits[31:16]. For example,
      if PT = 100H (256 slot times), and PLT = 001, a second Pause packet is automatically transmitted if the mti_flowctrl_i
      signal is asserted at 228 (256-28) slot times after the first Pause packet is transmitted. The following list
      provides the threshold values for different values. The slot time is defined as the time taken to transmit
      512 bits (64 bytes) on the GMII or MII interface. This (approximate) computation is based on the packet size
      (64, 1518, 2000, 9018, 16384, or 32768) + 2 Pause Packet Size + IPG in Slot Times. 000b - Pause Time minus
      4 Slot Times (PT -4 slot times) 001b - Pause Time minus 28 Slot Times (PT -28 slot times) 010b - Pause Time
      minus 36 Slot Times (PT -36 slot times) 011b - Pause Time minus 144 Slot Times (PT -144 slot times) 100b -
      Pause Time minus 256 Slot Times (PT -256 slot times) 101b - Pause Time minus 512 Slot Times (PT -512 slot
      times) 110b - Reserved
    bit_offset: 4
    bit_size: 3
  - name: dzpq
    description: Disable Zero-Quanta Pause. When this bit is set, it disables the automatic generation of the zero-quanta
      Pause packets on de- assertion of the flow-control signal from the FIFO layer (MTL or external sideband flow
      control signal sbd_flowctrl_i or mti_flowctrl_i). When this bit is reset, normal operation with automatic
      zero-quanta Pause packet generation is enabled. 0b - Zero-Quanta Pause packet generation is enabled 1b - Zero-Quanta
      Pause packet generation is disabled
    bit_offset: 7
    bit_size: 1
  - name: pt
    description: Pause Time. This field holds the value to be used in the Pause Time field in the Tx control packet.
      If the Pause Time bits are configured to be double-synchronized to the (G)MII clock domain, consecutive writes
      to this register must be performed only after at least four clock cycles in the destination clock domain.
    bit_offset: 16
    bit_size: 16
fieldset/MacRxFlowCtrl:
  description: F70RM Rev. 1 section 51.7.1.10; manual text line 149719.
  bit_size: 32
  reset_value: 0
  fields:
  - name: rfe
    description: Receive Flow Control Enable. When this bit is set and the MAC is operating in full-duplex mode,
      the MAC decodes the received Pause packet and disables its transmitter for a specified (Pause) time. When
      this bit is reset or the MAC is operating in half-duplex mode, the decode function of the Pause packet is
      disabled. 0b - Receive Flow Control is disabled 1b - Receive Flow Control is enabled
    bit_offset: 0
    bit_size: 1
  - name: up
    description: Unicast Pause Packet Detect. A pause packet is processed when it has the unique multicast address
      specified in the IEEE 802.3. When this bit is set, the MAC can also detect Pause packets with unicast address
      of the station. This unicast address must be as specified in MAC_Address0_High and MAC_Address0_Low. When
      this bit is reset, the MAC only detects Pause packets with unique multicast address. NOTE The MAC does not
      process a Pause packet if the multicast address is different from the unique multicast address. The unique
      multicast address (0x01_80_C2_00_00_01) is as specified in IEEE 802.1 Qbb-2011. 0b - Unicast Pause Packet
      Detect disabled 1b - Unicast Pause Packet Detect enabled
    bit_offset: 1
    bit_size: 1
fieldset/MacInterruptStatus:
  description: F70RM Rev. 1 section 51.7.1.11; manual text line 149801.
  bit_size: 32
  reset_value: 0
  fields:
  - name: phyis
    description: PHY Interrupt. This bit is set when rising edge is detected on the phy_intr_i input. This bit is
      cleared when this register is read (or this bit is written to 1 when RCWE bit of MAC_CSR_SW_Ctrl register
      is set). 0b - PHY Interrupt not detected 1b - PHY Interrupt detected
    bit_offset: 3
    bit_size: 1
  - name: pmtis
    description: Read-only. PMT Interrupt Status. This bit is set when a Magic packet or Wake-on-LAN packet is received
      in the power-down mode (RWKPRCVD and MGKPRCVD bits in MAC_PMT_Control_Status register). This bit is cleared
      when corresponding interrupt source bit are cleared because of a Read operation to the MAC_PMT_Control_Status
      register (or corresponding interrupt source bit of MAC_PMT_Control_Status register is written to 1 when RCWE
      bit of MAC_CSR_SW_Ctrl register is set). This bit is valid only when you select the Enable Power Management
      option. 0b - PMT Interrupt status not active 1b - PMT Interrupt status active
    bit_offset: 4
    bit_size: 1
  - name: tsis
    description: 'Read-only. Timestamp Interrupt Status. this bit is 1, when any of the following conditions is
      true: - The system time value is equal to or exceeds the value you programmed in the MAC_PPS(#i)_Target_Time_Seconds
      and MAC_PPS(#i)_Target_Time_Nanoseconds. - An overflow in the MAC_System_Time_Seconds register. - Timestamp
      Target Time Error occurred. That is, the time you programmed in the MAC_PPS(#i)_Target_Time_Seconds and MAC_PPS(#i)_Target_Time_Nanoseconds
      has elapsed. - When the auxiliary snapshot trigger is asserted. - when the MAC updates the captured transmit
      timestamp in the MAC_Tx_Timestamp_Status_Nanoseconds and Mac_TxTimestamp_Status_Seconds registers. - MAC writes
      0 to this bit when - Application reads the corresponding interrupt source bit in the MAC_Timestamp_Status
      register. - Application writes 1 to the corresponding interrupt source bit in the MAC_Timestamp_Status register,
      when RCWE = 1 in the MAC_CSR_SW_Ctrl register. 0b - Timestamp Interrupt status not active 1b - Timestamp Interrupt
      status active'
    bit_offset: 12
    bit_size: 1
  - name: txstsis
    description: 'Read-only. Transmit Status Interrupt. This bit indicates the status of transmitted packets. This
      bit is set when any of the following bits is set in the MAC_Rx_Tx_Status register: - Excessive Collision (EXCOL)
      - Late Collision (LCOL) - Excessive Deferral (EXDEF) - Loss of Carrier (LCARR) - No Carrier (NCARR) - Jabber
      Timeout (TJT) This bit is cleared when the corresponding interrupt source bit is read (or corresponding interrupt
      source bit is written to 1 when RCWE bit of MAC_CSR_SW_Ctrl register is set) in the MAC_Rx_Tx_Status register.
      0b - Transmit Interrupt status not active 1b - Transmit Interrupt status active'
    bit_offset: 13
    bit_size: 1
  - name: rxstsis
    description: Read-only. Receive Status Interrupt. This bit indicates the status of received packets. This bit
      is set when the RWT bit is set in the MAC_Rx_Tx_Status register. This bit is cleared when the corresponding
      interrupt source bit is read (or corresponding interrupt source bit is written to 1 when RCWE bit of MAC_CSR_SW_Ctrl
      register is set) in the MAC_Rx_Tx_Status register. 0b - Receive Interrupt status not active 1b - Receive Interrupt
      status active
    bit_offset: 14
    bit_size: 1
  - name: mdiois
    description: 'MDIO Interrupt Status. - 1: Indicates to the application that MDIO operation is complete. - MAC
      writes 0 to this bit when the application reads this bit. Application can write 1 to clear this bit when RCWE
      = 1, in the MAC_CSR_SW_Ctrl register. Following access restrictions apply. - Clears on read - Clears on write
      1, when RCWE = 1 in the MAC_CSR_SW_Ctrl register. - Self-set to 1 on internal event. 0b - MDIO Interrupt status
      not active 1b - MDIO Interrupt status active'
    bit_offset: 18
    bit_size: 1
fieldset/MacInterruptEnable:
  description: F70RM Rev. 1 section 51.7.1.12; manual text line 150018.
  bit_size: 32
  reset_value: 0
  fields:
  - name: phyie
    description: PHY Interrupt Enable. When this bit is set, it enables the assertion of the interrupt signal because
      of the setting of PHYIS bit in MAC_Interrupt_Status register. 0b - PHY Interrupt is disabled 1b - PHY Interrupt
      is enabled
    bit_offset: 3
    bit_size: 1
  - name: pmtie
    description: PMT Interrupt Enable. When this bit is set, it enables the assertion of the interrupt signal because
      of the setting of PMTIS bit in MAC_Interrupt_Status register. 0b - PMT Interrupt is disabled 1b - PMT Interrupt
      is enabled
    bit_offset: 4
    bit_size: 1
  - name: tsie
    description: Timestamp Interrupt Enable. When this bit is set, it enables the assertion of the interrupt signal
      because of the setting of TSIS bit in MAC_Interrupt_Status register. 0b - Timestamp Interrupt is disabled
      1b - Timestamp Interrupt is enabled
    bit_offset: 12
    bit_size: 1
  - name: txstsie
    description: Transmit Status Interrupt Enable. When this bit is set, it enables the assertion of the interrupt
      signal because of the setting of TXSTSIS bit in the MAC_Interrupt_Status register. 0b - Transmit Status Interrupt
      is disabled 1b - Transmit Status Interrupt is enabled
    bit_offset: 13
    bit_size: 1
  - name: rxstsie
    description: Receive Status Interrupt Enable. When this bit is set, it enables the assertion of the interrupt
      signal because of the setting of RXSTSIS bit in the MAC_Interrupt_Status register. 0b - Receive Status Interrupt
      is disabled 1b - Receive Status Interrupt is enabled
    bit_offset: 14
    bit_size: 1
  - name: mdioie
    description: MDIO Interrupt Enable. When this bit is set, it enables the assertion of the interrupt when MDIOIS
      field is set in the MAC_Interrupt_Status register. 0b - MDIO Interrupt is disabled 1b - MDIO Interrupt is
      enabled
    bit_offset: 18
    bit_size: 1
fieldset/MacRxTxStatus:
  description: F70RM Rev. 1 section 51.7.1.13; manual text line 150168.
  bit_size: 32
  reset_value: 0
  fields:
  - name: tjt
    description: Transmit Jabber Timeout. This bit indicates that the Transmit Jabber Timer expired which happens
      when the packet size exceeds 2,048 bytes (10,240 bytes when the Jumbo packet is enabled) and JD bit is reset
      in the MAC_Configuration register. This bit is set when the packet size exceeds 16,383 bytes and the JD bit
      is set in the MAC_Configuration register. Access restriction applies. Clears on read (or write of 1 when RCWE
      bit in MAC_CSR_SW_Ctrl register is set). Self-set to 1 on internal event. 0b - No Transmit Jabber Timeout
      1b - Transmit Jabber Timeout occurred
    bit_offset: 0
    bit_size: 1
  - name: ncarr
    description: No Carrier. When the DTXSTS bit is set in the MTL_Operation_Mode register, this bit indicates that
      the carrier signal from the PHY is not present at the end of preamble transmission. Access restriction applies.
      Clears on read (or write of 1 when RCWE bit in MAC_CSR_SW_Ctrl register is set). Self-set to 1 on internal
      event. 0b - Carrier is present 1b - No carrier
    bit_offset: 1
    bit_size: 1
  - name: lcarr
    description: Loss of Carrier. When the DTXSTS bit is set in the MTL_Operation_Mode register, this bit indicates
      that the loss of carrier occurred during packet transmission, that is, the phy_crs_i signal was inactive for
      one or more transmission clock periods during packet transmission. This bit is valid only for packets transmitted
      without collision. Access restriction applies. Clears on read (or write of 1 when RCWE bit in MAC_CSR_SW_Ctrl
      register is set). Self-set to 1 on internal event. 0b - Carrier is present 1b - Loss of carrier
    bit_offset: 2
    bit_size: 1
  - name: exdef
    description: Excessive Deferral. When the DTXSTS bit is set in the MTL_Operation_Mode register and the DC bit
      is set in the MAC_Configuration register, this bit indicates that the transmission ended because of excessive
      deferral of over 24,288 bit times (155,680 in 1000/2500 Mbps mode or when Jumbo packet is enabled). Access
      restriction applies. Clears on read (or write of 1 when RCWE bit in MAC_CSR_SW_Ctrl register is set). Self-set
      to 1 on internal event. 0b - No Excessive deferral 1b - Excessive deferral
    bit_offset: 3
    bit_size: 1
  - name: lcol
    description: Late Collision. When the DTXSTS bit is set in the MTL_Operation_Mode register, this bit indicates
      that the packet transmission aborted because a collision occurred after the collision window (64 bytes including
      Preamble in MII mode; 512 bytes including Preamble and Carrier Extension in GMII mode). This bit is not valid
      if the Underflow error occurs. Access restriction applies. Clears on read (or write of 1 when RCWE bit in
      MAC_CSR_SW_Ctrl register is set). Self-set to 1 on internal event. 0b - No collision 1b - Late collision is
      sensed
    bit_offset: 4
    bit_size: 1
  - name: excol
    description: Excessive Collisions. When the DTXSTS bit is set in the MTL_Operation_Mode register, this bit indicates
      that the transmission aborted after 16 successive collisions while attempting to transmit the current packet.
      If the DR bit is set in the MAC_Configuration register, this bit is set after the first collision and the
      packet transmission is aborted. Access restriction applies. Clears on read (or write of 1 when RCWE bit in
      MAC_CSR_SW_Ctrl register is set). Self-set to 1 on internal event. 0b - No collision 1b - Excessive collision
      is sensed
    bit_offset: 5
    bit_size: 1
  - name: rwt
    description: Receive Watchdog Timeout. This bit is set when a packet with length greater than 2,048 bytes is
      received (10, 240 bytes when Jumbo Packet mode is enabled) and the WD bit is reset in the MAC_Configuration
      register. This bit is set when a packet with length greater than 16,383 bytes is received and the WD bit is
      set in the MAC_Configuration register. Access restriction applies. Clears on read (or write of 1 when RCWE
      bit in MAC_CSR_SW_Ctrl register is set). Self-set to 1 on internal event. 0b - No receive watchdog timeout
      1b - Receive watchdog timed out
    bit_offset: 8
    bit_size: 1
fieldset/MacPmtControlStatus:
  description: F70RM Rev. 1 section 51.7.1.14; manual text line 150312.
  bit_size: 32
  reset_value: 0
  fields:
  - name: pwrdwn
    description: Power Down. When this bit is set, the MAC receiver drops all received packets until it receives
      the expected magic packet. This bit is then self-cleared and the power-down mode is disabled. The software
      can clear this bit before the expected magic packet is received. The packets received by the MAC after this
      bit is cleared are forwarded to the application. This bit must only be set when the Magic Packet Enable or
      Global Unicast Enable bit is set high. NOTE You can gate-off the CSR clock during the power-down mode. However,
      when the CSR clock is gated-off, you cannot perform any read or write operations on this register. Therefore,
      the software cannot clear this bit. Access restriction applies. Setting 1 sets. Self-cleared. Setting 0 has
      no effect. 0b - Power down is disabled 1b - Power down is enabled
    bit_offset: 0
    bit_size: 1
  - name: mgkpkten
    description: Magic Packet Enable. When this bit is set, a power management event is generated when the MAC receives
      a magic packet. 0b - Magic Packet is disabled 1b - Magic Packet is enabled
    bit_offset: 1
    bit_size: 1
  - name: mgkprcvd
    description: Read-only. Magic Packet Received. When this bit is set, it indicates that the power management
      event is generated because of the reception of a magic packet. This bit is cleared when this register is read.
      Access restriction applies. Clears on read (or write of 1 when RCWE bit in MAC_CSR_SW_Ctrl register is set).
      Self-set to 1 on internal event. 0b - No Magic packet is received 1b - Magic packet is received
    bit_offset: 5
    bit_size: 1
fieldset/MacVersion:
  description: F70RM Rev. 1 section 51.7.1.15; manual text line 150450.
  bit_size: 32
  reset_value: 4180
  fields:
  - name: snpsver
    description: Read-only. Synopsys-defined Version. Synopsys-defined Version
    bit_offset: 0
    bit_size: 8
  - name: userver
    description: Read-only. User-defined Version (configured with coreConsultant). User-defined Version (configured
      with coreConsultant)
    bit_offset: 8
    bit_size: 8
fieldset/MacDebug:
  description: F70RM Rev. 1 section 51.7.1.16; manual text line 150510.
  bit_size: 32
  reset_value: 0
  fields:
  - name: rpests
    description: Read-only. MAC GMII or MII Receive Protocol Engine Status. When this bit is set, it indicates that
      the MAC GMII or MII receive protocol engine is actively receiving data, and it is not in the Idle state. 0b
      - MAC GMII or MII Receive Protocol Engine Status not detected 1b - MAC GMII or MII Receive Protocol Engine
      Status detected
    bit_offset: 0
    bit_size: 1
  - name: rfcfcsts
    description: Read-only. MAC Receive Packet Controller FIFO Status. When this bit is set, this field indicates
      the active state of the small FIFO Read and Write controllers of the MAC Receive Packet Controller module.
    bit_offset: 1
    bit_size: 2
  - name: tpests
    description: Read-only. MAC GMII or MII Transmit Protocol Engine Status. When this bit is set, it indicates
      that the MAC GMII or MII transmit protocol engine is actively transmitting data, and it is not in the Idle
      state. 0b - MAC GMII or MII Transmit Protocol Engine Status not detected 1b - MAC GMII or MII Transmit Protocol
      Engine Status detected
    bit_offset: 16
    bit_size: 1
  - name: tfcsts
    description: 'Read-only. MAC Transmit Packet Controller Status. This field indicates the state of the MAC Transmit
      Packet Controller module. 00b - Idle state 01b - Waiting for one of the following: Status of the previous
      packet OR IPG or back off period to be over 10b - Generating and transmitting a Pause control packet (in full-duplex
      mode) 11b - Transferring input packet for transmission'
    bit_offset: 17
    bit_size: 2
fieldset/MacHwFeature0:
  description: F70RM Rev. 1 section 51.7.1.17; manual text line 150611.
  bit_size: 32
  reset_value: 234967205
  fields:
  - name: miisel
    description: Read-only. 10 or 100 Mbps Support. This bit is set to 1 when 10/100 Mbps is selected as the Mode
      of Operation 0b - No 10 or 100 Mbps support 1b - 10 or 100 Mbps support
    bit_offset: 0
    bit_size: 1
  - name: gmiisel
    description: Read-only. 1000 Mbps Support. This bit is set to 1 when 1000 Mbps is selected as the Mode of Operation
      0b - No 1000 Mbps support 1b - 1000 Mbps support
    bit_offset: 1
    bit_size: 1
  - name: hdsel
    description: Read-only. Half-duplex Support. This bit is set to 1 when the half-duplex mode is selected 0b -
      No Half-duplex support 1b - Half-duplex support
    bit_offset: 2
    bit_size: 1
  - name: pcssel
    description: Read-only. PCS Registers (TBI, SGMII, or RTBI PHY interface). This bit is set to 1 when the TBI,
      SGMII, or RTBI PHY interface option is selected 0b - No PCS Registers (TBI, SGMII, or RTBI PHY interface)
      1b - PCS Registers (TBI, SGMII, or RTBI PHY interface)
    bit_offset: 3
    bit_size: 1
  - name: vlhash
    description: Read-only. VLAN Hash Filter Selected. This bit is set to 1 when the Enable VLAN Hash Table Based
      Filtering option is selected 0b - VLAN Hash Filter not selected 1b - VLAN Hash Filter selected
    bit_offset: 4
    bit_size: 1
  - name: smasel
    description: Read-only. SMA (MDIO) Interface. This bit is set to 1 when the Enable Station Management (MDIO
      Interface) option is selected 0b - SMA (MDIO) Interface not selected 1b - SMA (MDIO) Interface selected
    bit_offset: 5
    bit_size: 1
  - name: rwksel
    description: Read-only. PMT Remote Wake-up Packet Enable. This bit is set to 1 when the Enable Remote Wake-Up
      Packet Detection option is selected 0b - PMT Remote Wake-up Packet Enable option is not selected 1b - PMT
      Remote Wake-up Packet Enable option is selected
    bit_offset: 6
    bit_size: 1
  - name: mgksel
    description: Read-only. PMT Magic Packet Enable. This bit is set to 1 when the Enable Magic Packet Detection
      option is selected 0b - PMT Magic Packet Enable option is not selected 1b - PMT Magic Packet Enable option
      is selected
    bit_offset: 7
    bit_size: 1
  - name: mmcsel
    description: Read-only. RMON Module Enable. This bit is set to 1 when the Enable MAC Management Counters (MMC)
      option is selected 0b - RMON Module Enable option is not selected 1b - RMON Module Enable option is selected
    bit_offset: 8
    bit_size: 1
  - name: arpoffsel
    description: Read-only. ARP Offload Enabled. This bit is set to 1 when the Enable IPv4 ARP Offload option is
      selected 0b - ARP Offload Enable option is not selected 1b - ARP Offload Enable option is selected
    bit_offset: 9
    bit_size: 1
  - name: tssel
    description: Read-only. IEEE 1588-2008 Timestamp Enabled. This bit is set to 1 when the Enable IEEE 1588 Timestamp
      Support option is selected 0b - IEEE 1588-2008 Timestamp Enable option is not selected 1b - IEEE 1588-2008
      Timestamp Enable option is selected
    bit_offset: 12
    bit_size: 1
  - name: txcoesel
    description: Read-only. Transmit Checksum Offload Enabled. This bit is set to 1 when the Enable Transmit TCP/IP
      Checksum Insertion option is selected 0b - Transmit Checksum Offload Enable option is not selected 1b - Transmit
      Checksum Offload Enable option is selected
    bit_offset: 14
    bit_size: 1
  - name: rxcoesel
    description: Read-only. Receive Checksum Offload Enabled. This bit is set to 1 when the Enable Receive TCP/IP
      Checksum Check option is selected 0b - Receive Checksum Offload Enable option is not selected 1b - Receive
      Checksum Offload Enable option is selected
    bit_offset: 16
    bit_size: 1
  - name: addmacadrsel
    description: Read-only. MAC Addresses 1-31 Selected. This bit is set to 1 when the non-zero value is selected
      for Enable Additional 1-31 MAC Address EL     Registers option
    bit_offset: 18
    bit_size: 5
  - name: macadr32sel
    description: Read-only. MAC Addresses 32-63 Selected. This bit is set to 1 when the Enable Additional 32 MAC
      Address Registers (32-63) option is selected 0b - MAC Addresses 32-63 Select option is not selected 1b - MAC
      Addresses 32-63 Select option is selected
    bit_offset: 23
    bit_size: 1
  - name: macadr64sel
    description: Read-only. MAC Addresses 64-127 Selected. This bit is set to 1 when the Enable Additional 64 MAC
      Address Registers (64-127) option is selected 0b - MAC Addresses 64-127 Select option is not selected 1b -
      MAC Addresses 64-127 Select option is selected
    bit_offset: 24
    bit_size: 1
  - name: tsstssel
    description: 'Read-only. Timestamp System Time Source. This bit indicates the source of the Timestamp System
      Time. This bit is set to 1 when the Enable IEEE 1588 Timestamp Support option is selected using the following
      values: 00b - Reserved 01b - Internal 10b - External 11b - Both'
    bit_offset: 25
    bit_size: 2
  - name: savlanins
    description: Read-only. Source Address or VLAN Insertion Enable. This bit is set to 1 when the Enable SA and
      VLAN Insertion on Tx option is selected 0b - Source Address or VLAN Insertion Enable option is not selected
      1b - Source Address or VLAN Insertion Enable option is selected
    bit_offset: 27
    bit_size: 1
  - name: actphysel
    description: Read-only. Active PHY Selected. When you have multiple PHY interfaces in your configuration, this
      field indicates the sampled value of phy_intf_sel_i during reset de-assertion. 0000b - GMII or MII 0001b -
      Reserved 0010b - Reserved 0011b - Reserved 0100b - Reserved 0101b - Reserved 0110b - Reserved 0111b - Reserved
      1000b - B10T1S
    bit_offset: 28
    bit_size: 4
fieldset/MacHwFeature1:
  description: F70RM Rev. 1 section 51.7.1.18; manual text line 150830.
  bit_size: 32
  reset_value: 260
  fields:
  - name: rxfifosize
    description: 'Read-only. MTL Receive FIFO Size. This field contains the configured value of MTL Rx FIFO in bytes
      expressed as Log to base 2 minus 7, that is, Log2(RXFIFO_SIZE) -7: 0_0000b - 128 bytes 0_0001b - 256 bytes
      0_0010b - 512 bytes 0_0011b - 1024 bytes 0_0100b - 2048 bytes 0_0101b - 4096 bytes 0_0110b - 8192 bytes 0_0111b
      - 16384 bytes 0_1000b - 32 KB 0_1001b - 64 KB 0_1010b - 128 KB 0_1011b - 256 KB 0_1100b - Reserved'
    bit_offset: 0
    bit_size: 5
  - name: spram
    description: Read-only. Single Port RAM Enable. This bit is set to 1 when the Use single port RAM Feature is
      selected. 0b - Single Port RAM feature is not selected 1b - Single Port RAM feature is selected
    bit_offset: 5
    bit_size: 1
  - name: txfifosize
    description: 'Read-only. MTL Transmit FIFO Size. This field contains the configured value of MTL Tx FIFO in
      bytes expressed as Log to base 2 minus 7, that is, Log2(TXFIFO_SIZE) -7: 0_0000b - 128 bytes 0_0001b - 256
      bytes 0_0010b - 512 bytes 0_0011b - 1024 bytes 0_0100b - 2048 bytes 0_0101b - 4096 bytes 0_0110b - 8192 bytes
      0_0111b - 16384 bytes 0_1000b - 32 KB 0_1001b - 64 KB 0_1010b - 128 KB 0_1011b - Reserved'
    bit_offset: 6
    bit_size: 5
  - name: osten
    description: Read-only. One-Step Timestamping Enable. This bit is set to 1 when the Enable One-Step Timestamp
      Feature is selected. 0b - One-Step Timestamping feature is not selected 1b - One-Step Timestamping feature
