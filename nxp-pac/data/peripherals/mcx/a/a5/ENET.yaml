    bit_offset: 12
    bit_size: 1
  - name: advthword
    description: Read-only. IEEE 1588 High Word Register Enable. This bit is set to 1 when the Add IEEE 1588 Higher
      Word Register option is selected 0b - IEEE 1588 High Word Register option is not selected 1b - IEEE 1588 High
      Word Register option is selected
    bit_offset: 13
    bit_size: 1
  - name: addr64
    description: 'Read-only. Address Width.. This field indicates the configured address width: 00b - 32 01b - 40
      10b - 48 11b - Reserved'
    bit_offset: 14
    bit_size: 2
  - name: dcben
    description: Read-only. DCB Feature Enable. This bit is set to 1 when the Enable Data Center Bridging option
      is selected 0b - DCB Feature is not selected 1b - DCB Feature is selected
    bit_offset: 16
    bit_size: 1
  - name: sphen
    description: Read-only. Split Header Feature Enable. This bit is set to 1 when the Enable Split Header Structure
      option is selected 0b - Split Header Feature is not selected 1b - Split Header Feature is selected
    bit_offset: 17
    bit_size: 1
  - name: tsoen
    description: Read-only. TCP Segmentation Offload Enable. This bit is set to 1 when the Enable TCP Segmentation
      Offloading for TCP/IP Packets option is selected 0b - TCP Segmentation Offload Feature is not selected 1b
      - TCP Segmentation Offload Feature is selected
    bit_offset: 18
    bit_size: 1
  - name: dbgmema
    description: Read-only. DMA Debug Registers Enable. This bit is set to 1 when the Debug Mode Enable option is
      selected 0b - DMA Debug Registers option is not selected 1b - DMA Debug Registers option is selected
    bit_offset: 19
    bit_size: 1
  - name: pouost
    description: Read-only. One Step for PTP over UDP/IP Feature Enable. This bit is set to 1 when the Enable One
      step timestamp for PTP over UDP/IP feature is selected. 0b - One Step for PTP over UDP/IP Feature is not selected
      1b - One Step for PTP over UDP/IP Feature is selected
    bit_offset: 23
    bit_size: 1
  - name: hashtblsz
    description: 'Read-only. Hash Table Size. This field indicates the size of the hash table: 00b - No hash table
      01b - 64 10b - 128 11b - 256'
    bit_offset: 24
    bit_size: 2
  - name: l3l4fnum
    description: 'Read-only. Total number of L3 or L4 Filters. This field indicates the total number of L3 or L4
      filters: 0000b - No L3 or L4 Filter 0001b - 1 L3 or L4 Filter 0010b - 2 L3 or L4 Filters 0011b - 3 L3 or L4
      Filters 0100b - 4 L3 or L4 Filters 0101b - 5 L3 or L4 Filters 0110b - 6 L3 or L4 Filters 0111b - 7 L3 or L4
      Filters 1000b - 8 L3 or L4 Filters'
    bit_offset: 27
    bit_size: 4
