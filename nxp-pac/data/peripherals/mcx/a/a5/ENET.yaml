  - name: frpes
    description: Read-only. Flexible Receive Parser Table Entries size. This field indicates the Max Number of Parser
      Entries supported by Flexible Receive Parser. 00b - Reserved 01b - Reserved 10b - 256 Entries 11b - Reserved
    bit_offset: 13
    bit_size: 2
  - name: estsel
    description: Read-only. Enhancements to Scheduled Traffic Enable. This bit is set to 1 when the Enable Enhancements
      to Scheduling Traffic feature is selected. 0b - Enable Enhancements to Scheduling Traffic feature is not selected
      1b - Enable Enhancements to Scheduling Traffic feature is selected
    bit_offset: 16
    bit_size: 1
  - name: estdep
    description: Read-only. Depth of the Gate Control List. Indicates the depth of Gate Control list, in bytes.
      000b - No Depth configured 001b - Reserved 010b - Reserved 011b - 256 100b - Reserved 101b - Reserved 110b
      - Reserved
    bit_offset: 17
    bit_size: 3
  - name: estwid
    description: Read-only. Width of the Time Interval field in the Gate Control List. This field indicates the
      width of the Configured Time Interval Field 00b - Width not configured 01b - Reserved 10b - Reserved 11b -
      24
    bit_offset: 20
    bit_size: 2
  - name: fpesel
    description: Read-only. Frame Preemption Enable. This bit is set to 1 when the Enable Frame preemption feature
      is selected. 0b - Frame Preemption Enable feature is not selected 1b - Frame Preemption Enable feature is
      selected
    bit_offset: 26
    bit_size: 1
  - name: tbssel
    description: Read-only. Time Based Scheduling Enable. This bit is set to 1 when the Time Based Scheduling feature
      is selected. 0b - Time Based Scheduling Enable feature is not selected 1b - Time Based Scheduling Enable feature
      is selected
    bit_offset: 27
