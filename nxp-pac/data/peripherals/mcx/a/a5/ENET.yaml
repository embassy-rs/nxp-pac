fieldset/DmaCh0Status:
  description: F70RM Rev. 1 section 51.7.5.17; manual text line 157015.
  bit_size: 32
  reset_value: 0
  fields:
  - name: ti
    description: Transmit Interrupt. This bit indicates that the packet transmission is complete. When transmission
      is complete, Bit 31 of TDES3 is reset in the last descriptor, and the specific packet status information is
      updated in the descriptor. Access restriction applies. Self-set to 1 on internal event. Setting 1 clears.
      Setting 0 has no effect. NOTE This field is not testable by an automated register test. 0b - Transmit Interrupt
      status not detected 1b - Transmit Interrupt status detected
    bit_offset: 0
    bit_size: 1
  - name: tps
    description: Transmit Process Stopped. This bit is set when the transmission is stopped. Access restriction
      applies. Self-set to 1 on internal event. Setting 1 clears. Setting 0 has no effect. NOTE This field is not
      testable by an automated register test. 0b - Transmit Process Stopped status not detected 1b - Transmit Process
      Stopped status detected
    bit_offset: 1
    bit_size: 1
  - name: tbu
    description: 'Transmit Buffer Unavailable. This bit indicates that the application owns the next descriptor
      in the Transmit list, and the DMA cannot acquire it. Transmission is suspended. The TPS0 field of the DMA_Debug_Status0-DMA_Debug_Status2
      register explains the Transmit Process state transitions. To resume processing the Transmit descriptors, the
      application must do the following: - Change the ownership of the descriptor by setting Bit 31 of TDES3. -
      Issue a Transmit Poll Demand command. For ring mode, the application must advance the Transmit Descriptor
      Tail Pointer register of a channel. Access restriction applies. Self-set to 1 on internal event. Setting 1
      clears. Setting 0 has no effect. NOTE This field is not testable by an automated register test. 0b - Transmit
      Buffer Unavailable status not detected 1b - Transmit Buffer Unavailable status detected'
    bit_offset: 2
    bit_size: 1
  - name: ri
    description: Receive Interrupt. This bit indicates that the packet reception is complete. When packet reception
      is complete, Bit 31 of RDES3 is reset in the last descriptor, and the specific packet status information is
      updated in the descriptor. The reception remains in the Running state. Access restriction applies. Self-set
      to 1 on internal event. Setting 1 clears. Setting 0 has no effect. NOTE This field is not testable by an automated
      register test. 0b - Receive Interrupt status not detected 1b - Receive Interrupt status detected
    bit_offset: 6
    bit_size: 1
  - name: rbu
    description: Receive Buffer Unavailable. This bit indicates that the application owns the next descriptor in
      the Receive list, and the DMA cannot acquire it. The Rx process is suspended. To resume processing Rx descriptors,
      the application must change the ownership of the descriptor and issue a Receive Poll Demand command. If this
      command is not issued, the Rx process resumes when the next recognized incoming packet is received. In ring
      mode, the application must advance the Receive Descriptor Tail Pointer register of a channel. This bit is
      set only when the DMA owns the previous Rx descriptor. Access restriction applies. Self-set to 1 on internal
      event. Setting 1 clears. Setting 0 has no effect. NOTE This field is not testable by an automated register
      test. 0b - Receive Buffer Unavailable status not detected 1b - Receive Buffer Unavailable status detected
    bit_offset: 7
    bit_size: 1
  - name: rps
    description: Receive Process Stopped. This bit is asserted when the Rx process enters the Stopped state. Access
      restriction applies. Self-set to 1 on internal event. Setting 1 clears. Setting 0 has no effect. NOTE This
      field is not testable by an automated register test. 0b - Receive Process Stopped status not detected 1b -
      Receive Process Stopped status detected
    bit_offset: 8
    bit_size: 1
  - name: rwt
    description: Receive Watchdog Timeout. This bit is asserted when a packet with length greater than 2,048 bytes
      (10,240 bytes when Jumbo Packet mode is enabled) is received. NOTE This field is not testable by an automated
      register test. 0b - Receive Watchdog Timeout status not detected 1b - Receive Watchdog Timeout status detected
    bit_offset: 9
    bit_size: 1
  - name: eti
    description: 'Early Transmit Interrupt. This bit when set indicates that the TxDMA has completed the transfer
      of packet data to the MTL TXFIFO memory. In configurations supporting ERIC: - ETIC = 0: This bit is set only
      after the Tx DMA has transferred a complete packet to MTL. - ETIC = 1: This bit is set after completion of
      (partial) packet data transfer from buffers in the Transmit descriptor in which IOC = 1. Access restriction
      applies. Self-set to 1 on internal event. Setting 1 clears. Setting 0 has no effect. NOTE This field is not
      testable by an automated register test. 0b - Early Transmit Interrupt status not detected 1b - Early Transmit
      Interrupt status detected'
    bit_offset: 10
    bit_size: 1
  - name: eri
    description: 'Early Receive Interrupt. This bit when set indicates that the RxDMA has completed the transfer
      of packet data to the memory. In configurations supporting ERIC, - ERIC = 0: This bit is set only after the
      Rx DMA has completely filled up a receive buffer with packet data. - ERIC = 1: This bit is set after every
      burst transfer of data from the Rx DMA to the buffer. The setting of RI bit automatically clears this bit.
      Access restriction applies. Self-set to 1 on internal event. Setting 1 clears. Setting 0 has no effect. NOTE
      This field is not testable by an automated register test. 0b - Early Receive Interrupt status not detected
      1b - Early Receive Interrupt status detected'
    bit_offset: 11
    bit_size: 1
  - name: fbe
    description: Fatal Bus Error. This bit indicates that a bus error occurred (as described in the EB field). When
      this bit is set, the corresponding DMA channel engine disables all bus accesses. Access restriction applies.
      Self-set to 1 on internal event. Setting 1 clears. Setting 0 has no effect. NOTE This field is not testable
      by an automated register test. 0b - Fatal Bus Error status not detected 1b - Fatal Bus Error status detected
    bit_offset: 12
    bit_size: 1
  - name: cde
    description: Context Descriptor Error. This bit indicates that the DMA Tx/Rx engine received a descriptor error,
      which indicates invalid context in the middle of packet flow ( intermediate descriptor) or all one's descriptor
      in Tx case and on Rx side it indicates DMA has read a descriptor with either of the buffer address as ones
      which is considered to be invalid. Access restriction applies. Self-set to 1 on internal event. Setting 1
      clears. Setting 0 has no effect. NOTE This field is not testable by an automated register test. 0b - Context
      Descriptor Error status not detected 1b - Context Descriptor Error status detected
    bit_offset: 13
    bit_size: 1
  - name: ais
    description: 'Abnormal Interrupt Summary. Abnormal Interrupt Summary bit value is the logical OR of the following
      when the corresponding interrupt bits are enabled in the DMA_CH0_Interrupt_Enable register: - Bit 1: Transmit
      Process Stopped - Bit 7: Receive Buffer Unavailable - Bit 8: Receive Process Stopped - Bit 10: Early Transmit
      Interrupt - Bit 12: Fatal Bus Error - Bit 13: Context Descriptor Error Only unmasked bits affect the Abnormal
      Interrupt Summary bit. This is a sticky bit. You must clear this bit (by writing 1 to this bit) each time
      a corresponding bit, which causes AIS to be set, is cleared. Access restriction applies. Self-set to 1 on
      internal event. Setting 1 clears. Setting 0 has no effect. NOTE This field is not testable by an automated
      register test. 0b - Abnormal Interrupt Summary status not detected 1b - Abnormal Interrupt Summary status
      detected'
    bit_offset: 14
    bit_size: 1
  - name: nis
    description: 'Normal Interrupt Summary. Normal Interrupt Summary bit value is the logical OR of the following
      bits when the corresponding interrupt bits are enabled in the DMA_CH0_Interrupt_Enable register: - Bit 0:
      Transmit Interrupt - Bit 2: Transmit Buffer Unavailable - Bit 6: Receive Interrupt - Bit 11: Early Receive
      Interrupt Only unmasked bits (interrupts for which interrupt enable is set in DMA_CH0_Interrupt_Enable register)
      affect the Normal Interrupt Summary bit. This is a sticky bit. You must clear this bit (by writing 1 to this
      bit) each time a corresponding bit which causes NIS to be set is cleared. Access restriction applies. Self-set
      to 1 on internal event. Setting 1 clears. Setting 0 has no effect. NOTE This field is not testable by an automated
      register test. 0b - Normal Interrupt Summary status not detected 1b - Normal Interrupt Summary status detected'
    bit_offset: 15
    bit_size: 1
  - name: teb
    description: 'Read-only. Tx DMA Error Bits. This field indicates the type of error that caused a Bus Error.
      For example, error response on the AHB interface. - Bit 18 -- 1''b1: Error during data transfer by Tx DMA
      -- 1''b0: No Error during data transfer by Tx DMA - Bit 17 -- 1''b1: Error during descriptor access -- 1''b0:
      Error during data buffer access - Bit 16 -- 1''b1: Error during read transfer -- 1''b0: Error during write
      transfer This field is valid only when the FBE bit is set. This field does not generate an interrupt. NOTE
      This field is not testable by an automated register test.'
    bit_offset: 16
    bit_size: 3
  - name: reb
    description: 'Read-only. Rx DMA Error Bits. This field indicates the type of error that caused a Bus Error.
      For example, error response on the AHB interface. - Bit 21 -- 1''b1: Error during data transfer by Rx DMA
      -- 1''b0: No Error during data transfer by Rx DMA - Bit 20 -- 1''b1: Error during descriptor access -- 1''b0:
      Error during data buffer access - Bit 19 -- 1''b1: Error during read transfer -- 1''b0: Error during write
      transfer This field is valid only when the FBE bit is set. This field does not generate an interrupt. NOTE
      This field is not testable by an automated register test.'
    bit_offset: 19
    bit_size: 3
fieldset/DmaCh0MissFrameCnt:
  description: F70RM Rev. 1 section 51.7.5.18; manual text line 157324.
  bit_size: 32
  reset_value: 0
  fields:
  - name: mfc
    description: Read-only. Dropped Packet Counters. This counter indicates the number of packet counters that are
      dropped by the DMA either because of bus error or because of programing RPF field in DMA_CH0_Rx_Control register.
      The counter gets cleared when this register is read. Access restriction applies. Clears on read. Self-set
      to 1 on internal event.
    bit_offset: 0
    bit_size: 11
  - name: mfco
    description: Read-only. Overflow status of the MFC Counter. When this bit is set then the MFC counter does not
      get incremented further. The bit gets cleared when this register is read. Access restriction applies. Clears
      on read. Self-set to 1 on internal event. 0b - Miss Frame Counter overflow not occurred 1b - Miss Frame Counter
      overflow occurred
    bit_offset: 15
    bit_size: 1
fieldset/DmaCh0RxEriCnt:
  description: F70RM Rev. 1 section 51.7.5.19; manual text line 157394.
  bit_size: 32
  reset_value: 0
  fields:
  - name: ecnt
    description: Read-only. ERI Counter. When ERIC bit of DMA_CH0_RX_Control register is set, this counter increments
      for burst transfer completed by the Rx DMA from the start of packet transfer. This counter is reset at the
      start of new packet.
    bit_offset: 0
    bit_size: 12
