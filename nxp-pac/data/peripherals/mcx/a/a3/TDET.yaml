    description: "Update Mode.\n\nRaw bit values: false (0) = NoEffect: No effect.; true (1) = ClearInts: Allows the clearing of interrupts."
    bit_offset: 3
    bit_size: 1
  - name: distam
    description: "Disable Prescaler On Tamper.\n\nRaw bit values: false (0) = NoEffect: No effect.; true (1) = AutoDis: Automatically disables the prescaler after tamper detection."
    bit_offset: 8
    bit_size: 1
