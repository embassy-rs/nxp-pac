    bit_offset: 2
    bit_size: 2
    enum: RemapCpu0Sbus
  - name: smart_dma_i
    description: RAMX0 address remap for SmartDMA I-BUS.
    bit_offset: 4
    bit_size: 2
    enum: SmartDmaI
