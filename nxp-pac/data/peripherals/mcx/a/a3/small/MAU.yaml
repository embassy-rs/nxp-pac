  - name: res2_ovwr
    description: "RES2 Overwrite Flag.\n\nRaw bit values: false (0) = Res2OvwrNo: The value of RES2 has been read.; true (1) = Res2OvwrYes: The value of RES2 has not been read yet and is overwritten by a new MAUWRAP result."
    bit_offset: 22
