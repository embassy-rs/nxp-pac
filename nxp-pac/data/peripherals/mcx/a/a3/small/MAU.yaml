fieldset/ResStatus:
  description: Result Status.
  fields:
  - name: res0_nx
    description: "RES0 IEEE Inexact Flag.\n\nRaw bit values: false (0) = Res0NxNo: The result is not rounded.; true (1) = Res0NxYes: The result is rounded, and as a result some digits lost."
    bit_offset: 0
    bit_size: 1
  - name: res0_uf
    description: "RES0 IEEE Underflow Flag.\n\nRaw bit values: false (0) = Res0UfNo: No tiny non-zero result is detected.; true (1) = Res0UfYes: A tiny non-zero result is detected."
    bit_offset: 1
    bit_size: 1
  - name: res0_of
    description: "RES0 IEEE Overflow Flag.\n\nRaw bit values: false (0) = Res0OfNo: The result format's largest finite number is not exceeded.; true (1) = Res0OfYes: The result format's largest finite number is exceeded."
    bit_offset: 2
    bit_size: 1
  - name: res0_dz
    description: "RES0 IEEE Divide by Zero Flag.\n\nRaw bit values: false (0) = Res0DzNo: No exact infinite result is defined for an operation on finite operands.; true (1) = Res0DzYes: An exact infinite result is defined for an operation on finite operands."
    bit_offset: 3
    bit_size: 1
  - name: res0_nv
    description: "RES0 IEEE Invalid Flag.\n\nRaw bit values: false (0) = Res0NvNo: There is usefully definable result.; true (1) = Res0NvYes: There is no usefully definable result."
    bit_offset: 4
    bit_size: 1
  - name: res0_err
    description: "RES0 Indirect Operation Error Flag.\n\nRaw bit values: false (0) = Res0ErrNo: No invalid indirect operation is detected.; true (1) = Res0ErrYes: An invalid indirect operation error is detected."
    bit_offset: 5
    bit_size: 1
  - name: res0_ovwr
    description: "RES0 Overwrite Flag.\n\nRaw bit values: false (0) = Res0OvwrNo: The value of RES0 has been read.; true (1) = Res0OvwrYes: The value of RES0 has not been read yet and is overwritten by a new MAUWRAP result."
    bit_offset: 6
    bit_size: 1
  - name: res0_full
    description: "RES0 Full Flag.\n\nRaw bit values: false (0) = Res0FullNo: RES0 has not updated and cannot be read.; true (1) = Res0FullYes: RES0 has updated and can be read."
    bit_offset: 7
    bit_size: 1
  - name: res1_nx
    description: "RES1 IEEE Inexact Flag.\n\nRaw bit values: false (0) = Res1NxNo: The result is not rounded.; true (1) = Res1NxYes: The result is rounded, and as a result some digits lost."
    bit_offset: 8
    bit_size: 1
  - name: res1_uf
    description: "RES1 IEEE Underflow Flag.\n\nRaw bit values: false (0) = Res1UfNo: No tiny non-zero result is detected.; true (1) = Res1UfYes: A tiny non-zero result is detected."
