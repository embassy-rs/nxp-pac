    bit_size: 1
  - name: res1_of
    description: "RES1 IEEE Overflow Flag.\n\nRaw bit values: false (0) = Res1OfNo: The result format's largest finite number is not exceeded.; true (1) = Res1OfYes: The result format's largest finite number is exceeded."
    bit_offset: 10
    bit_size: 1
  - name: res1_dz
    description: "RES1 IEEE Divide by Zero Flag.\n\nRaw bit values: false (0) = Res1DzNo: No exact infinite result is defined for an operation on finite operands.; true (1) = Res1DzYes: An exact infinite result is defined for an operation on finite operands."
    bit_offset: 11
    bit_size: 1
  - name: res1_nv
    description: "RES1 IEEE Invalid Flag.\n\nRaw bit values: false (0) = Res1NvNo: There is usefully definable result.; true (1) = Res1NvYes: There is no usefully definable result."
    bit_offset: 12
    bit_size: 1
  - name: res1_err
    description: "RES1 Indirect Operation Error Flag.\n\nRaw bit values: false (0) = Res1ErrNo: No invalid indirect operation is detected.; true (1) = Res1ErrYes: An invalid indirect operation error is detected."
    bit_offset: 13
    bit_size: 1
  - name: res1_ovwr
    description: "RES1 Overwrite Flag.\n\nRaw bit values: false (0) = Res1OvwrNo: The value of RES1 has been read.; true (1) = Res1OvwrYes: The value of RES1 has not been read yet and is overwritten by a new MAUWRAP result."
    bit_offset: 14
    bit_size: 1
  - name: res1_full
    description: "RES1 Full Flag.\n\nRaw bit values: false (0) = Res1FullNo: RES1 has not updated and cannot be read.; true (1) = Res1FullYes: RES1 has updated and can be read."
    bit_offset: 15
