  - name: res3_dz
    description: "RES3 IEEE Divide by Zero Flag.\n\nRaw bit values: false (0) = Res3DzNo: No exact infinite result is defined for an operation on finite operands.; true (1) = Res3DzYes: An exact infinite result is defined for an operation on finite operands."
