  - name: res3_ovwr
    description: "RES3 Overwrite Flag.\n\nRaw bit values: false (0) = Res3OvwrNo: The value of RES3 has been read.; true (1) = Res3OvwrYes: The value of RES3 has not been read yet and is overwritten by a new MAUWRAP result."
    bit_offset: 30
