  - name: res3_of
    description: "RES3 IEEE Overflow Flag.\n\nRaw bit values: false (0) = Res3OfNo: The result format's largest finite number is not exceeded.; true (1) = Res3OfYes: The result format's largest finite number is exceeded."
    bit_offset: 26
