    description: Transmit Data SCL Stall.
    bit_offset: 2
    bit_size: 1
  - name: ackstall
    description: ACK SCL Stall.
    bit_offset: 3
    bit_size: 1
  - name: rxnack
    description: "Receive NACK.\n\nRaw bit values: false (0) = SetByTxnack: ACK or NACK always determined by STAR[TXNACK].; true (1) = AlwaysGeneratedOnAddressOrReceiveDataOverrun: NACK always generated on address overrun or receive data overrun, otherwise ACK or NACK is determined by STAR[TXNACK]."
    bit_offset: 4
    bit_size: 1
  - name: gcen
    description: General Call Enable.
    bit_offset: 8
    bit_size: 1
  - name: saen
    description: SMBus Alert Enable.
    bit_offset: 9
    bit_size: 1
  - name: txcfg
    description: "Transmit Flag Configuration.\n\nRaw bit values: false (0) = AssertsDuringSlaveTransmitTransferWhenTxDataEmpty: SSR[TDF] is set only during a target-transmit transfer when STDR is empty.; true (1) = AssertsWhenTxDataEmpty: SSR[TDF] is set whenever STDR is empty."
    bit_offset: 10
    bit_size: 1
  - name: rxcfg
    description: "Receive Data Configuration.\n\nRaw bit values: false (0) = ReturnsReceivedDataAndClearsRxDataFlag: Return received data, clear SSR[RDF].; true (1) = WhenAddressValidFlagSetReturnsAddressStatusAndClearsAddressValidFlag: Return SASR and clear SSR[AVF] when SSR[AVF] is set, return received data and clear SSR[RDF] when SSR[AFV] is not set."
    bit_offset: 11
    bit_size: 1
  - name: ignack
    description: "Ignore NACK.\n\nRaw bit values: false (0) = EndsTransferOnNack: End transfer on NACK.; true (1) = DoesNotEndTransferOnNack: Do not end transfer on NACK."
    bit_offset: 12
    bit_size: 1
