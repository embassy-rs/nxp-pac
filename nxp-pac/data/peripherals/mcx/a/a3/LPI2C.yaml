    description: "End Packet Flag.\n\nRaw bit values: false (0) = IntNo: No Stop or repeated Start generated.; true (1) = IntYes: Stop or repeated Start generated."
    bit_offset: 8
    bit_size: 1
  - name: sdf
    description: "Stop Detect Flag.\n\nRaw bit values: false (0) = IntNo: No Stop condition generated.; true (1) = IntYes: Stop condition generated."
    bit_offset: 9
    bit_size: 1
  - name: ndf
    description: "NACK Detect Flag.\n\nRaw bit values: false (0) = IntNo: No unexpected NACK detected.; true (1) = IntYes: Unexpected NACK detected."
    bit_offset: 10
    bit_size: 1
  - name: alf
    description: "Arbitration Lost Flag.\n\nRaw bit values: false (0) = IntNo: Controller did not lose arbitration.; true (1) = IntYes: Controller lost arbitration."
    bit_offset: 11
    bit_size: 1
  - name: fef
    description: "FIFO Error Flag.\n\nRaw bit values: false (0) = IntNo: No FIFO error.; true (1) = IntYes: FIFO error."
    bit_offset: 12
    bit_size: 1
