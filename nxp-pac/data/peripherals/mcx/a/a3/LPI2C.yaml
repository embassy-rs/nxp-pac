    description: Match Configuration.
    bit_offset: 16
    bit_size: 3
    enum: Matcfg
  - name: pincfg
    description: Pin Configuration.
    bit_offset: 24
    bit_size: 3
    enum: Pincfg
  bit_size: 32
  reset_value: 0
