fieldset/Mcfgr0:
  description: Controller Configuration 0.
  fields:
  - name: hren
    description: Host Request Enable.
    bit_offset: 0
    bit_size: 1
  - name: hrpol
    description: "Host Request Polarity.\n\nRaw bit values: false (0) = ActiveLow: Active low.; true (1) = ActiveHigh: Active high."
    bit_offset: 1
    bit_size: 1
  - name: hrsel
    description: Host Request Select.
    bit_offset: 2
    bit_size: 1
  - name: hrdir
    description: "Host Request Direction.\n\nRaw bit values: false (0) = Input: HREQ pin is input (for LPI2C controller).; true (1) = Output: HREQ pin is output (for LPI2C target)."
    bit_offset: 3
    bit_size: 1
  - name: cirfifo
    description: Circular FIFO Enable.
    bit_offset: 8
    bit_size: 1
  - name: rdmo
    description: Receive Data Match Only.
    bit_offset: 9
    bit_size: 1
  - name: relax
    description: "Relaxed Mode.\n\nRaw bit values: false (0) = NormalTransfer: Normal transfer.; true (1) = RelaxedTransfer: Relaxed transfer."
    bit_offset: 16
    bit_size: 1
  - name: abort
    description: Abort Transfer.
    bit_offset: 17
    bit_size: 1
  bit_size: 32
  reset_value: 0
fieldset/Mcfgr1:
  description: Controller Configuration 1.
  fields:
