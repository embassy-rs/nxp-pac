    description: Automatic Stop Generation.
    bit_offset: 8
    bit_size: 1
  - name: ignack
    description: Ignore NACK.
    bit_offset: 9
    bit_size: 1
  - name: timecfg
    description: "Timeout Configuration.\n\nRaw bit values: false (0) = IfSclLow: SCL.; true (1) = IfSclOrSdaLow: SCL or SDA."
    bit_offset: 10
    bit_size: 1
  - name: stopcfg
    description: "Stop Configuration.\n\nRaw bit values: false (0) = AnyStop: Any Stop condition.; true (1) = LastStop: Last Stop condition."
    bit_offset: 11
    bit_size: 1
  - name: startcfg
    description: "Start Configuration.\n\nRaw bit values: false (0) = BothI2cAndLpi2cIdle: Sets when both I2C bus and LPI2C controller are idle.; true (1) = I2cIdle: Sets when I2C bus is idle."
    bit_offset: 12
    bit_size: 1
