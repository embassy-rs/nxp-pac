    bit_offset: 0
    bit_size: 6
  - name: clkhi
    description: Clock High Period.
    bit_offset: 8
    bit_size: 6
  - name: sethold
    description: Setup Hold Delay.
    bit_offset: 16
    bit_size: 6
  - name: datavd
    description: Data Valid Delay.
    bit_offset: 24
    bit_size: 6
  bit_size: 32
