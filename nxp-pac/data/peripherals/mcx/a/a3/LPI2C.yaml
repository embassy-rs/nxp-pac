    description: "Controller Busy Flag.\n\nRaw bit values: false (0) = Idle: Idle.; true (1) = Busy: Busy."
    bit_offset: 24
    bit_size: 1
  - name: bbf
    description: "Bus Busy Flag.\n\nRaw bit values: false (0) = Idle: Idle.; true (1) = Busy: Busy."
