# MCXA3: explicit pinned XML onboarding; backing widths and resets retained.
block/Utick:
  description: Micro-Tick Timer.
  items:
  - name: ctrl
    description: Control.
    byte_offset: 0
    fieldset: Ctrl
  - name: stat
    description: Status.
    byte_offset: 4
    fieldset: Stat
  - name: cfg
    description: Capture Configuration.
    byte_offset: 8
    fieldset: Cfg
  - name: capclr
    description: Capture Clear.
    byte_offset: 12
    access: Write
    fieldset: Capclr
  - name: cap
    description: Capture.
    array:
      len: 4
      stride: 4
    byte_offset: 16
    access: Read
    fieldset: Cap
fieldset/Cap:
  description: Capture.
  fields:
  - name: cap_value
    description: Captured Value for the Related Capture Event.
    bit_offset: 0
    bit_size: 31
  - name: valid
    description: Captured Value Valid Flag.
    bit_offset: 31
    bit_size: 1
  bit_size: 32
  reset_value: 0
fieldset/Capclr:
  description: Capture Clear.
  fields:
  - name: capclr0
    description: "Clear Capture 0.\n\nRaw bit values: false (0) = Capclr0nothing: Does nothing.; true (1) = Capclr0cleared: Clears the CAP0 register value."
    bit_offset: 0
    bit_size: 1
  - name: capclr1
    description: "Clear Capture 1.\n\nRaw bit values: false (0) = Capclr1nothing: Does nothing.; true (1) = Capclr1cleared: Clears the CAP1 register value."
    bit_offset: 1
    bit_size: 1
  - name: capclr2
    description: "Clear Capture 2.\n\nRaw bit values: false (0) = Capclr2nothing: Does nothing.; true (1) = Capclr2cleared: Clears the CAP2 register value."
    bit_offset: 2
    bit_size: 1
  - name: capclr3
    description: "Clear Capture 3.\n\nRaw bit values: false (0) = Capclr3nothing: Does nothing.; true (1) = Capclr3cleared: Clears the CAP3 register value."
    bit_offset: 3
    bit_size: 1
  bit_size: 32
  reset_value: 0
fieldset/Cfg:
  description: Capture Configuration.
  fields:
  - name: capen0
    description: "Enable Capture 0.\n\nRaw bit values: false (0) = Capen0isdisabled: Disable.; true (1) = Capen0isenabled: Enable."
    bit_offset: 0
    bit_size: 1
  - name: capen1
    description: "Enable Capture 1.\n\nRaw bit values: false (0) = Capen1isdisabled: Disable.; true (1) = Capen1isenabled: Enable."
    bit_offset: 1
    bit_size: 1
  - name: capen2
    description: "Enable Capture 2.\n\nRaw bit values: false (0) = Capen2isdisabled: Disable.; true (1) = Capen2isenabled: Enable."
    bit_offset: 2
    bit_size: 1
  - name: capen3
    description: "Enable Capture 3.\n\nRaw bit values: false (0) = Capen3isdisabled: Disable.; true (1) = Capen3isenabled: Enable."
    bit_offset: 3
    bit_size: 1
  - name: cappol0
    description: "Capture Polarity 0.\n\nRaw bit values: false (0) = Cappol0posedgecapture: Positive.; true (1) = Cappol0negedgecapture: Negative."
    bit_offset: 8
    bit_size: 1
  - name: cappol1
    description: "Capture-Polarity 1.\n\nRaw bit values: false (0) = Cappol1posedgecapture: Positive.; true (1) = Cappol1negedgecapture: Negative."
    bit_offset: 9
    bit_size: 1
  - name: cappol2
    description: "Capture Polarity 2.\n\nRaw bit values: false (0) = Cappol2posedgecapture: Positive.; true (1) = Cappol2negedgecapture: Negative."
    bit_offset: 10
    bit_size: 1
  - name: cappol3
    description: "Capture Polarity 3.\n\nRaw bit values: false (0) = Cappol3posedgecapture: Positive.; true (1) = Cappol3negedgecapture: Negative."
    bit_offset: 11
    bit_size: 1
  bit_size: 32
  reset_value: 0
fieldset/Ctrl:
  description: Control.
  fields:
  - name: delayval
    description: Tick Interval.
    bit_offset: 0
    bit_size: 31
  - name: repeat
    description: "Repeat Delay.\n\nRaw bit values: false (0) = Delayonce: One-time delay.; true (1) = Delayrepeats: Delay repeats continuously."
    bit_offset: 31
    bit_size: 1
  bit_size: 32
  reset_value: 0
fieldset/Stat:
  description: Status.
  fields:
  - name: intr
    description: Interrupt Flag.
    bit_offset: 0
    bit_size: 1
  - name: active
    description: "Timer Active Flag.\n\nRaw bit values: false (0) = Timerisnotactive: Inactive (stopped).; true (1) = Timerisactive: Active."
    bit_offset: 1
    bit_size: 1
  bit_size: 32
  reset_value: 0
