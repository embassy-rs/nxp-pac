# MCXA3: explicit pinned XML onboarding; backing widths and resets retained.
block/Fmc:
  description: FMC.
  items:
  - name: remap
    description: Data Remap.
    byte_offset: 32
    fieldset: Remap
  - name: fccr
    description: Flash Cache Control Register.
    byte_offset: 1024
    fieldset: Fccr
  - name: fcar
    description: Flash Cache Access Register.
    byte_offset: 1028
    fieldset: Fcar
  - name: fctg
    description: Flash Cache Tag.
    byte_offset: 1036
    fieldset: Fctg
  - name: fcln0
    description: Flash Cache Line Num0.
    byte_offset: 1056
    fieldset: Fcln0
  - name: fcln1
    description: Flash Cache Line Num1.
    byte_offset: 1060
    fieldset: Fcln1
  - name: fcln2
    description: Flash Cache Line Num2.
    byte_offset: 1064
    fieldset: Fcln2
  - name: fcln3
    description: Flash Cache Line Num3.
    byte_offset: 1068
    fieldset: Fcln3
fieldset/Fcar:
  description: Flash Cache Access Register.
  fields:
  - name: caches_way_num
    description: Flash Cache Way Number.
    bit_offset: 0
    bit_size: 2
    enum: CachesWayNum
  - name: caches_set_num
    description: Flash Cache Set Number.
    bit_offset: 4
    bit_size: 1
  - name: type_
    description: Operation of cache type.
    bit_offset: 30
    bit_size: 2
    enum: Type
  bit_size: 32
  reset_value: 0
fieldset/Fccr:
  description: Flash Cache Control Register.
  fields:
  - name: way_lock
    description: Cache Way Lock.
    bit_offset: 0
    bit_size: 4
  - name: lock
    description: Lock Flash Cache Control.
    bit_offset: 31
    bit_size: 1
  bit_size: 32
  reset_value: 0
fieldset/Fcln0:
  description: Flash Cache Line Num0.
  fields:
  - name: data_wx_sy_lm
    description: Cache Line Data[31:0].
    bit_offset: 0
    bit_size: 32
  bit_size: 32
  reset_value: 0
fieldset/Fcln1:
  description: Flash Cache Line Num1.
  fields:
  - name: data_wx_sy_ml
    description: Cache Line Data[63:32].
    bit_offset: 0
    bit_size: 32
  bit_size: 32
  reset_value: 0
fieldset/Fcln2:
  description: Flash Cache Line Num2.
  fields:
  - name: data_wx_sy_mu
    description: Cache Line Data[95:64].
    bit_offset: 0
    bit_size: 32
  bit_size: 32
  reset_value: 0
fieldset/Fcln3:
  description: Flash Cache Line Num3.
  fields:
  - name: data_wx_sy_um
    description: Cache Line Data[127:96].
    bit_offset: 0
    bit_size: 32
  bit_size: 32
  reset_value: 0
fieldset/Fctg:
  description: Flash Cache Tag.
  fields:
  - name: valid
    description: Cache line Valid.
    bit_offset: 0
    bit_size: 1
  - name: address
    description: Cache line Tag, which corresponds to flash address[23:6].
    bit_offset: 6
    bit_size: 18
  bit_size: 32
  reset_value: 0
fieldset/Remap:
  description: Data Remap.
  fields:
  - name: remaplk
    description: Remap Lock Enable.
    bit_offset: 0
    bit_size: 1
    enum: Remaplk
  - name: lim
    description: LIM Remapping Address.
    bit_offset: 16
    bit_size: 7
  - name: limdp
    description: LIMDP Remapping Address.
    bit_offset: 24
    bit_size: 7
  bit_size: 32
  reset_value: 0
enum/CachesWayNum:
  bit_size: 2
  variants:
  - name: One
    description: way0.
    value: 0
  - name: Two
    description: way1.
    value: 1
  - name: Three
    description: way2.
    value: 2
  - name: Four
    description: way3.
    value: 3
enum/Remaplk:
  bit_size: 1
  variants:
  - name: LockDisabled
    description: 'Lock disabled: can write to REMAP.'
    value: 0
  - name: LockEnabled
    description: 'Lock enabled: cannot write to REMAP.'
    value: 1
enum/Type:
  bit_size: 2
  variants:
  - name: NoAccess
    description: No access.
    value: 0
  - name: Read
    description: Read flash cache - the associated tag, valid and the content of the cache line specified by CACHES_SET_NUM
      and CACHES_WAY_NUM of FCAR are copied to FCTG and FCLN0-3.
    value: 1
  - name: Write
    description: Write flash cache - the associated tag, valid and the content of the flash cache line specified
      by CACHES_SET_NUM and CACHES_WAY_NUM of FCAR are modified based on FCTG and FCLN0-3.
    value: 2
