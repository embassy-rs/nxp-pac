fieldset/ClkRecoverCtrl:
  description: USB Clock Recovery Control.
  bit_size: 8
  fields:
  - name: trim_init_val_sel
    description: "Selects the source for the initial FIRC trim fine value used after a reset.\n\nRaw bit values: false (0) = InitTrimFineMid: Mid-scale.; true (1) = InitTrimFineIfr: IFR."
    bit_offset: 3
    bit_size: 1
  - name: restart_ifrtrim_en
    description: "Restart from IFR Trim Value.\n\nRaw bit values: false (0) = LoadTrimFineMid: Trim fine adjustment always works based on the previous updated trim fine value.; true (1) = LoadTrimFineIfr: Trim fine restarts from the IFR trim value whenever you detect bus_reset or bus_resume or deassert module enable."
    bit_offset: 5
    bit_size: 1
  - name: reset_resume_rough_en
    description: "Reset or Resume to Rough Phase Enable.\n\nRaw bit values: false (0) = KeepTrimFineOnReset: Always works in tracking phase after the first time rough phase, to track transition.; true (1) = UseIfrTrimFineOnReset: Go back to rough stage whenever a bus reset or bus resume occurs."
    bit_offset: 6
    bit_size: 1
  - name: clock_recover_en
    description: "Crystal-Less USB Enable.\n\nRaw bit values: false (0) = DisClkRecover: Disable.; true (1) = EnClkRecover: Enable."
    bit_offset: 7
    bit_size: 1
  reset_value: 0
fieldset/ClkRecoverIntEn:
  description: Clock Recovery Combined Interrupt Enable.
  bit_size: 8
  fields:
  - name: ovf_error_en
    description: "Overflow error interrupt enable.\n\nRaw bit values: false (0) = MaskOvfErrInt: The interrupt is masked.; true (1) = EnOvfErrInt: The interrupt is enabled."
    bit_offset: 4
    bit_size: 1
  reset_value: 16
fieldset/ClkRecoverIntStatus:
  description: Clock Recovery Separated Interrupt Status.
  bit_size: 8
  fields:
  - name: ovf_error
    description: "Overflow Error Interrupt Status Flag.\n\nRaw bit values: false (0) = IntNo: Interrupt did not occur.; true (1) = IntYes: Unmasked interrupt occurred."
    bit_offset: 4
    bit_size: 1
  reset_value: 0
fieldset/ClkRecoverIrcEn:
  description: FIRC Oscillator Enable.
  bit_size: 8
  fields:
  - name: irc_en
    description: "Fast IRC enable.\n\nRaw bit values: false (0) = DisIrc: Disable.; true (1) = EnIrc: Enable."
    bit_offset: 1
    bit_size: 1
  reset_value: 1
fieldset/Control:
  description: USB OTG Control.
  bit_size: 8
  fields:
  - name: vbus_source_sel
    description: VBUS Monitoring Source Select.
    bit_offset: 0
    bit_size: 1
  - name: sess_vld
    description: "VBUS Session Valid status.\n\nRaw bit values: false (0) = SessVldLow: Below.; true (1) = SessVldHigh: Above."
    bit_offset: 1
    bit_size: 1
  - name: dppullupnonotg
    description: "DP Pullup in Non-OTG Device Mode.\n\nRaw bit values: false (0) = DisDeviceDpPu: Disable.; true (1) = EnDeviceDpPu: Enabled."
    bit_offset: 4
    bit_size: 1
  reset_value: 0
fieldset/Ctl:
  description: Control.
  bit_size: 8
  fields:
  - name: usbensofen
    description: "USB Enable.\n\nRaw bit values: false (0) = DisUsbSof: Disable.; true (1) = EnUsbSof: Enable."
    bit_offset: 0
    bit_size: 1
  - name: oddrst
    description: Odd Reset.
    bit_offset: 1
    bit_size: 1
  - name: resume
    description: Resume.
    bit_offset: 2
    bit_size: 1
  - name: hostmodeen
    description: "Host Mode Enable.\n\nRaw bit values: false (0) = EnDeviceMode: USBFS operates in Device mode.; true (1) = EnHostMode: USBFS operates in Host mode. In Host mode, USBFS performs USB transactions under the programmed control of the host processor."
    bit_offset: 3
    bit_size: 1
  - name: reset
    description: Reset Signaling Enable.
    bit_offset: 4
    bit_size: 1
  - name: txsuspendtokenbusy
    description: TXD Suspend And Token Busy.
    bit_offset: 5
    bit_size: 1
  - name: se0
    description: Live USB Single-Ended Zero signal.
    bit_offset: 6
    bit_size: 1
  - name: jstate
    description: Live USB Differential Receiver JSTATE Signal.
    bit_offset: 7
    bit_size: 1
  reset_value: 0
fieldset/Endpt:
  description: Endpoint Control.
  bit_size: 8
  fields:
  - name: ephshk
    description: Endpoint Handshaking Enable.
    bit_offset: 0
    bit_size: 1
  - name: epstall
    description: Endpoint Stalled.
    bit_offset: 1
    bit_size: 1
  - name: eptxen
    description: Endpoint for TX transfers enable.
    bit_offset: 2
    bit_size: 1
  - name: eprxen
    description: Endpoint for RX transfers enable.
    bit_offset: 3
    bit_size: 1
  - name: epctldis
    description: "Control Transfer Disable.\n\nRaw bit values: false (0) = Enable: Enable.; true (1) = Disable: Disable."
    bit_offset: 4
    bit_size: 1
  - name: retrydis
    description: "Retry Disable.\n\nRaw bit values: false (0) = Retried: Retried NAK'ed transactions in hardware.; true (1) = DoNotRetried: Do not retry NAK'ed transactions. When a transaction is NAK'ed, the BDT PID field is updated with the NAK PID, and the TOKEN_DNE interrupt becomes 1."
    bit_offset: 6
    bit_size: 1
  - name: hostwohub
    description: "Host Without A Hub.\n\nRaw bit values: false (0) = LsThruHub: Connected using a hub (USBFS generates PRE_PID as required).; true (1) = LsDirectConnect: Connected directly to host without a hub, or was used to attach."
    bit_offset: 7
    bit_size: 1
  reset_value: 0
fieldset/Erren:
  description: Error Interrupt Enable.
  bit_size: 8
  fields:
  - name: piderren
    description: "PIDERR Interrupt Enable.\n\nRaw bit values: false (0) = DisPiderrInt: Disable.; true (1) = EnPiderrInt: Enable."
    bit_offset: 0
    bit_size: 1
  - name: crc5eofen
    description: "CRC5/EOF Interrupt Enable.\n\nRaw bit values: false (0) = DisCrc5Int: Disable.; true (1) = EnCrc5Int: Enable."
    bit_offset: 1
    bit_size: 1
  - name: crc16en
    description: "CRC16 Interrupt Enable.\n\nRaw bit values: false (0) = DisCrc16Int: Disable.; true (1) = EnCrc16Int: Enable."
    bit_offset: 2
    bit_size: 1
  - name: dfn8en
    description: "DFN8 (Data Field Not Integer Number of Bytes) Interrupt Enable.\n\nRaw bit values: false (0) = DisDfn8Int: Disable.; true (1) = EnDfn8Int: Enable."
    bit_offset: 3
    bit_size: 1
  - name: btoerren
    description: "BTOERR (Bus Timeout Error) Interrupt Enable.\n\nRaw bit values: false (0) = DisBtoerrInt: Disable.; true (1) = EnBtoerrInt: Enable."
    bit_offset: 4
    bit_size: 1
  - name: dmaerren
    description: "DMAERR Interrupt Enable.\n\nRaw bit values: false (0) = DisDmaerrInt: Disable.; true (1) = EnDmaerrInt: Enable."
    bit_offset: 5
    bit_size: 1
  - name: ownerren
    description: "OWNERR Interrupt Enable.\n\nRaw bit values: false (0) = DisOwnerrInt: Disable.; true (1) = EnOwnerrInt: Enable."
    bit_offset: 6
    bit_size: 1
  - name: btserren
    description: "BTSERR (Bit Stuff Error) Interrupt Enable.\n\nRaw bit values: false (0) = DisBtserrenInt: Disable.; true (1) = EnBtserrenInt: Enable."
    bit_offset: 7
    bit_size: 1
  reset_value: 0
fieldset/Errstat:
  description: Error Interrupt Status.
  bit_size: 8
  fields:
  - name: piderr
    description: "PID Error Flag.\n\nRaw bit values: false (0) = IntNo: Did not fail.; true (1) = IntYes: Failed."
    bit_offset: 0
    bit_size: 1
  - name: crc5eof
    description: "CRC5 Error or End of Frame Error Flag.\n\nRaw bit values: false (0) = IntNo: Interrupt did not occur.; true (1) = IntYes: Interrupt occurred."
    bit_offset: 1
    bit_size: 1
  - name: crc16
    description: "CRC16 Error Flag.\n\nRaw bit values: false (0) = IntNo: Not rejected.; true (1) = IntYes: Rejected."
    bit_offset: 2
    bit_size: 1
  - name: dfn8
    description: "Data Field Not 8 Bits Flag.\n\nRaw bit values: false (0) = IntNo: Integer number of bytes.; true (1) = IntYes: Not an integer number of bytes."
    bit_offset: 3
    bit_size: 1
  - name: btoerr
    description: "Bus Turnaround Timeout Error Flag.\n\nRaw bit values: false (0) = IntNo: Not timed out.; true (1) = IntYes: Timed out."
    bit_offset: 4
    bit_size: 1
  - name: dmaerr
    description: "DMA Access Error Flag.\n\nRaw bit values: false (0) = IntNo: Interrupt did not occur.; true (1) = IntYes: Interrupt occurred."
    bit_offset: 5
    bit_size: 1
  - name: ownerr
    description: "BD Unavailable Error Flag.\n\nRaw bit values: false (0) = IntNo: Interrupt did not occur.; true (1) = IntYes: Interrupt occurred."
    bit_offset: 6
    bit_size: 1
  - name: btserr
    description: "Bit Stuff Error Flag.\n\nRaw bit values: false (0) = IntNo: Packet not rejected due to the error.; true (1) = IntYes: Packet rejected due to the error."
    bit_offset: 7
    bit_size: 1
  reset_value: 0
fieldset/Frmnumh:
  description: Frame Number Register High.
  bit_size: 8
  fields:
  - name: frm
    description: Frame Number, Bits 8-10.
    bit_offset: 0
    bit_size: 3
  reset_value: 0
fieldset/Frmnuml:
  description: Frame Number Register Low.
  bit_size: 8
  fields:
  - name: frm
    description: Frame Number, Bits 0-7.
    bit_offset: 0
    bit_size: 8
  reset_value: 0
fieldset/Idcomp:
  description: Peripheral ID Complement.
  bit_size: 8
  fields:
  - name: nid
    description: Negative Peripheral ID.
    bit_offset: 0
    bit_size: 6
  reset_value: 251
fieldset/Inten:
  description: Interrupt Enable.
  bit_size: 8
  fields:
  - name: usbrsten
    description: "USBRST Interrupt Enable.\n\nRaw bit values: false (0) = DisUsbrstInt: Disable.; true (1) = EnUsbrstInt: Enable."
    bit_offset: 0
    bit_size: 1
  - name: erroren
    description: "ERROR Interrupt Enable.\n\nRaw bit values: false (0) = DisErrorInt: Disable.; true (1) = EnErrorInt: Enable."
    bit_offset: 1
    bit_size: 1
  - name: softoken
    description: "SOFTOK Interrupt Enable.\n\nRaw bit values: false (0) = DisSoftokInt: Disable.; true (1) = EnSoftokInt: Enable."
    bit_offset: 2
    bit_size: 1
  - name: tokdneen
    description: "TOKDNE Interrupt Enable.\n\nRaw bit values: false (0) = DisTokdneInt: Disable.; true (1) = EnTokdneInt: Enable."
    bit_offset: 3
    bit_size: 1
  - name: sleepen
    description: "SLEEP Interrupt Enable.\n\nRaw bit values: false (0) = DisSleepInt: Disable.; true (1) = EnSleepInt: Enable."
    bit_offset: 4
    bit_size: 1
  - name: resumeen
    description: "RESUME Interrupt Enable.\n\nRaw bit values: false (0) = DisResumeInt: Disable.; true (1) = EnResumeInt: Enable."
    bit_offset: 5
    bit_size: 1
  - name: attachen
    description: "ATTACH Interrupt Enable.\n\nRaw bit values: false (0) = DisAttachInt: Disable.; true (1) = EnAttachInt: Enable."
    bit_offset: 6
    bit_size: 1
  - name: stallen
    description: "STALL Interrupt Enable.\n\nRaw bit values: false (0) = DisStallInt: Disable.; true (1) = EnStallInt: Enable."
    bit_offset: 7
    bit_size: 1
  reset_value: 0
fieldset/Istat:
  description: Interrupt Status.
  bit_size: 8
  fields:
  - name: usbrst
    description: "USB Reset Flag.\n\nRaw bit values: false (0) = IntNo: Not detected.; true (1) = IntYes: Detected."
    bit_offset: 0
    bit_size: 1
  - name: error
    description: "Error Flag.\n\nRaw bit values: false (0) = IntNo: Error did not occur.; true (1) = IntYes: Error occurred."
    bit_offset: 1
    bit_size: 1
  - name: softok
    description: "Start Of Frame (SOF) Token Flag.\n\nRaw bit values: false (0) = IntNo: Did not receive.; true (1) = IntYes: Received."
    bit_offset: 2
    bit_size: 1
  - name: tokdne
    description: "Current Token Processing Flag.\n\nRaw bit values: false (0) = IntNo: Not processed.; true (1) = IntYes: Processed."
    bit_offset: 3
    bit_size: 1
  - name: sleep
    description: "Sleep Flag.\n\nRaw bit values: false (0) = IntNo: Interrupt did not occur.; true (1) = IntYes: Interrupt occurred."
    bit_offset: 4
    bit_size: 1
  - name: resume
    description: "Resume Flag.\n\nRaw bit values: false (0) = IntNo: Interrupt did not occur.; true (1) = IntYes: Interrupt occurred."
    bit_offset: 5
    bit_size: 1
  - name: attach
    description: "Attach Interrupt Flag.\n\nRaw bit values: false (0) = IntNo: Not detected.; true (1) = IntYes: Detected."
    bit_offset: 6
    bit_size: 1
  - name: stall
    description: "Stall Interrupt Flag.\n\nRaw bit values: false (0) = IntNo: Interrupt did not occur.; true (1) = IntYes: Interrupt occurred."
    bit_offset: 7
    bit_size: 1
  reset_value: 0
fieldset/Miscctrl:
  description: Miscellaneous Control.
  bit_size: 8
  fields:
  - name: sofdynthld
    description: "Dynamic SOF Threshold Compare mode.\n\nRaw bit values: false (0) = UseDynSofThreshold: When the byte-times SOF threshold is reached.; true (1) = UseFixedSofThreshold: When 8 byte-times SOF threshold is reached or overstepped."
    bit_offset: 0
    bit_size: 1
  - name: sofbusset
    description: "SOF_TOK Interrupt Generation Mode Select.\n\nRaw bit values: false (0) = SofTokIntFromThreshold: According to the SOF threshold value.; true (1) = SofTokIntCounter0: When the SOF counter reaches 0."
    bit_offset: 1
    bit_size: 1
  - name: ownerrisodis
    description: "OWN Error Detect for ISO IN and ISO OUT Disable.\n\nRaw bit values: false (0) = DisOwnErrorDetectIso: Enable.; true (1) = EnOwnErrorDetectIso: Disable."
    bit_offset: 2
    bit_size: 1
  - name: vredg_en
    description: "VREGIN Rising Edge Interrupt Enable.\n\nRaw bit values: false (0) = DisVreginReInt: Disable.; true (1) = EnVreginReInt: Enable."
    bit_offset: 3
    bit_size: 1
  - name: vfedg_en
    description: "VREGIN Falling Edge Interrupt Enable.\n\nRaw bit values: false (0) = DisVreginFeInt: Disable.; true (1) = EnVreginFeInt: Enable."
    bit_offset: 4
    bit_size: 1
  - name: stl_adj_en
    description: "USB Peripheral Mode Stall Adjust Enable.\n\nRaw bit values: false (0) = StallBothInOut: If ENDPTn[END_STALL] = 1, both IN and OUT directions for the associated endpoint stalls.; true (1) = StallSingleDirection: If ENDPTn[END_STALL] = 1, the STALL_xx_DIS registers control which directions for the associated endpoint stalls."
    bit_offset: 7
    bit_size: 1
  reset_value: 0
fieldset/Observe:
  description: USB OTG Observe.
  bit_size: 8
  fields:
  - name: dmpd
    description: "D- Pulldown.\n\nRaw bit values: false (0) = DmPdDisStat: Disabled.; true (1) = DmPdEnStat: Enabled."
    bit_offset: 4
    bit_size: 1
  - name: dppd
    description: "D+ Pulldown.\n\nRaw bit values: false (0) = DpPdDisStat: Disabled.; true (1) = DpPdEnStat: Enabled."
    bit_offset: 6
    bit_size: 1
  - name: dppu
    description: "D+ Pullup.\n\nRaw bit values: false (0) = DpPuDisStat: Disabled.; true (1) = DpPuEnStat: Enabled."
    bit_offset: 7
    bit_size: 1
  reset_value: 80
fieldset/Otgctl:
  description: OTG Control.
  bit_size: 8
  fields:
  - name: otgen
    description: "On-The-Go Pullup and Pulldown Resistor Enable.\n\nRaw bit values: false (0) = ConfigResistorsCtl: If USBENSOFEN is 1 and HOSTMODEEN is 0 in the Control Register (CTL), then the D+ Data line pullup resistors are enabled. If HOSTMODEEN is 1, then the D+ and D- Data line pulldown resistors are engaged.; true (1) = ConfigResistorsHere: Uses the pullup and pulldown controls in this register."
    bit_offset: 2
    bit_size: 1
  - name: dmlow
    description: "D- Data Line Pulldown Resistor Enable.\n\nRaw bit values: false (0) = DisDmPulldown: Disable.; true (1) = EnDmPulldown: Enable."
    bit_offset: 4
    bit_size: 1
  - name: dplow
    description: "D+ Data Line pulldown Resistor Enable.\n\nRaw bit values: false (0) = DisDpPulldown: Disable.; true (1) = EnDpPulldown: Enable."
    bit_offset: 5
    bit_size: 1
  - name: dphigh
    description: "D+ Data Line Pullup Resistor Enable.\n\nRaw bit values: false (0) = DisDpPullup: Disable.; true (1) = EnDpPullup: Enable."
    bit_offset: 7
    bit_size: 1
  reset_value: 0
fieldset/Otgicr:
  description: OTG Interrupt Control.
  bit_size: 8
  fields:
  - name: linestateen
    description: "Line State Change Interrupt Enable.\n\nRaw bit values: false (0) = DisLinestInt: Disable.; true (1) = EnLinestInt: Enable."
    bit_offset: 5
    bit_size: 1
  - name: onemsecen
    description: "1-Millisecond Interrupt Enable.\n\nRaw bit values: false (0) = DisTimerInt: Disable.; true (1) = EnTimerInt: Enable."
    bit_offset: 6
    bit_size: 1
  reset_value: 0
fieldset/Otgistat:
  description: OTG Interrupt Status.
  bit_size: 8
  fields:
  - name: line_state_chg
