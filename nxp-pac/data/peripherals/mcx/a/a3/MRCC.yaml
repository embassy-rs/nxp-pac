fieldset/MrccAdcClkdiv:
  description: ADCx clock divider control.
  fields:
  - name: div
    description: Functional Clock Divider.
    bit_offset: 0
    bit_size: 4
  - name: reset
    description: "Reset divider counter.\n\nRaw bit values: false (0) = On: Divider isn't reset.; true (1) = Off: Divider is reset."
    bit_offset: 29
    bit_size: 1
  - name: halt
    description: "Halt divider counter.\n\nRaw bit values: false (0) = On: Divider clock is running.; true (1) = Off: Divider clock is stopped."
    bit_offset: 30
    bit_size: 1
  - name: unstab
    description: "Divider status flag.\n\nRaw bit values: false (0) = On: Divider clock is stable.; true (1) = Off: Clock frequency isn't stable."
    bit_offset: 31
    bit_size: 1
  bit_size: 32
  reset_value: 1073741824
