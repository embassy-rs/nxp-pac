# MCXA3: explicit pinned XML onboarding; backing widths and resets retained.
block/Lpuart:
  description: LPUART.
  items:
  - name: verid
    description: Version ID.
    byte_offset: 0
    access: Read
    fieldset: Verid
  - name: param
    description: Parameter.
    byte_offset: 4
    access: Read
    fieldset: Param
  - name: global
    description: Global.
    byte_offset: 8
    fieldset: Global
  - name: pincfg
    description: Pin Configuration.
    byte_offset: 12
    fieldset: Pincfg
  - name: baud
    description: Baud Rate.
    byte_offset: 16
    fieldset: Baud
  - name: stat
    description: Status.
    byte_offset: 20
    fieldset: Stat
  - name: ctrl
    description: Control.
    byte_offset: 24
    fieldset: Ctrl
  - name: data
    description: Data.
    byte_offset: 28
    fieldset: Data
  - name: match_
    description: Match Address.
    byte_offset: 32
    fieldset: Match
  - name: modir
    description: MODEM IrDA.
    byte_offset: 36
    fieldset: Modir
  - name: fifo
    description: FIFO.
    byte_offset: 40
    fieldset: Fifo
  - name: water
    description: Watermark.
    byte_offset: 44
    fieldset: Water
  - name: dataro
    description: Data Read-Only.
    byte_offset: 48
    access: Read
    fieldset: Dataro
fieldset/Baud:
  description: Baud Rate.
  fields:
  - name: sbr
    description: Baud Rate Modulo Divisor.
    bit_offset: 0
    bit_size: 13
  - name: sbns
    description: "Stop Bit Number Select.\n\nRaw bit values: false (0) = One: One stop bit.; true (1) = Two: Two stop bits."
    bit_offset: 13
    bit_size: 1
  - name: rxedgie
    description: RX Input Active Edge Interrupt Enable.
    bit_offset: 14
    bit_size: 1
  - name: lbkdie
    description: LIN Break Detect Interrupt Enable.
    bit_offset: 15
    bit_size: 1
  - name: resyncdis
    description: "Resynchronization Disable.\n\nRaw bit values: false (0) = Resync: Enable.; true (1) = NoResync: Disable."
    bit_offset: 16
    bit_size: 1
  - name: bothedge
    description: Both Edge Sampling.
    bit_offset: 17
    bit_size: 1
  - name: matcfg
    description: Match Configuration.
    bit_offset: 18
    bit_size: 2
    enum: Matcfg
  - name: ridmae
    description: Receiver Idle DMA Enable.
    bit_offset: 20
    bit_size: 1
  - name: rdmae
    description: Receiver Full DMA Enable.
    bit_offset: 21
    bit_size: 1
  - name: tdmae
    description: Transmitter DMA Enable.
    bit_offset: 23
    bit_size: 1
  - name: osr
    description: Oversampling Ratio.
    bit_offset: 24
    bit_size: 5
  - name: m10
    description: 10-Bit Mode Select.
    bit_offset: 29
    bit_size: 1
  - name: maen2
    description: Match Address Mode Enable 2.
    bit_offset: 30
    bit_size: 1
  - name: maen1
    description: Match Address Mode Enable 1.
    bit_offset: 31
    bit_size: 1
  bit_size: 32
  reset_value: 251658244
fieldset/Ctrl:
  description: Control.
  fields:
  - name: pt
    description: "Parity Type.\n\nRaw bit values: false (0) = Even: Even parity.; true (1) = Odd: Odd parity."
    bit_offset: 0
    bit_size: 1
  - name: pe
    description: Parity Enable.
    bit_offset: 1
    bit_size: 1
  - name: ilt
    description: "Idle Line Type Select.\n\nRaw bit values: false (0) = FromStart: After the start bit.; true (1) = FromStop: After the stop bit."
    bit_offset: 2
    bit_size: 1
  - name: wake
    description: "Receiver Wake-Up Method Select.\n\nRaw bit values: false (0) = Idle: Idle.; true (1) = Mark: Mark."
    bit_offset: 3
    bit_size: 1
  - name: m
    description: "9-Bit Or 8-Bit Mode Select.\n\nRaw bit values: false (0) = Data8: 8-bit.; true (1) = Data9: 9-bit."
    bit_offset: 4
    bit_size: 1
  - name: rsrc
    description: "Receiver Source Select.\n\nRaw bit values: false (0) = NoEffect: Internal Loopback mode.; true (1) = Onewire: Single-wire mode."
    bit_offset: 5
    bit_size: 1
  - name: dozeen
    description: "Doze Mode.\n\nRaw bit values: false (0) = Enabled: Enable.; true (1) = Disabled: Disable."
    bit_offset: 6
    bit_size: 1
  - name: loops
    description: "Loop Mode Select.\n\nRaw bit values: false (0) = Noffect: Normal operation: RXD and TXD use separate pins.; true (1) = Loopback: Loop mode or Single-Wire mode."
    bit_offset: 7
    bit_size: 1
  - name: idlecfg
    description: Idle Configuration.
    bit_offset: 8
    bit_size: 3
    enum: Idlecfg
  - name: m7
    description: "7-Bit Mode Select.\n\nRaw bit values: false (0) = NoEffect: 8-bit to 10-bit.; true (1) = Data7: 7-bit."
    bit_offset: 11
    bit_size: 1
  - name: swap
    description: "TXD and RXD Pin Swap.\n\nRaw bit values: false (0) = Standard: Use the standard way.; true (1) = Swap: Swap."
    bit_offset: 12
    bit_size: 1
  - name: ma2ie
    description: Match 2 (MA2F) Interrupt Enable.
    bit_offset: 14
    bit_size: 1
  - name: ma1ie
    description: Match 1 (MA1F) Interrupt Enable.
    bit_offset: 15
    bit_size: 1
  - name: sbk
    description: "Send Break.\n\nRaw bit values: false (0) = NoEffect: Normal transmitter operation.; true (1) = TxBreak: Queue break character(s) to be sent."
    bit_offset: 16
    bit_size: 1
  - name: rwu
    description: "Receiver Wake-Up Control.\n\nRaw bit values: false (0) = NoEffect: Normal receiver operation.; true (1) = RxWakeup: LPUART receiver in standby, waiting for a wake-up condition."
    bit_offset: 17
    bit_size: 1
  - name: re
    description: Receiver Enable.
    bit_offset: 18
    bit_size: 1
  - name: te
    description: Transmitter Enable.
    bit_offset: 19
    bit_size: 1
  - name: ilie
    description: Idle Line Interrupt Enable.
    bit_offset: 20
    bit_size: 1
  - name: rie
    description: Receiver Interrupt Enable.
    bit_offset: 21
    bit_size: 1
  - name: tcie
    description: Transmission Complete Interrupt Enable.
    bit_offset: 22
    bit_size: 1
  - name: tie
    description: Transmit Interrupt Enable.
    bit_offset: 23
    bit_size: 1
  - name: peie
    description: Parity Error Interrupt Enable.
    bit_offset: 24
    bit_size: 1
  - name: feie
    description: Framing Error Interrupt Enable.
    bit_offset: 25
    bit_size: 1
  - name: neie
    description: Noise Error Interrupt Enable.
    bit_offset: 26
    bit_size: 1
  - name: orie
    description: Overrun Interrupt Enable.
    bit_offset: 27
    bit_size: 1
  - name: txinv
    description: Transmit Data Inversion.
    bit_offset: 28
    bit_size: 1
  - name: txdir
    description: "TXD Pin Direction in Single-Wire Mode.\n\nRaw bit values: false (0) = TxInput: Input.; true (1) = TxOutput: Output."
    bit_offset: 29
    bit_size: 1
  - name: r9t8
    description: Receive Bit 9 Transmit Bit 8.
    bit_offset: 30
    bit_size: 1
  - name: r8t9
    description: Receive Bit 8 Transmit Bit 9.
    bit_offset: 31
    bit_size: 1
  bit_size: 32
  reset_value: 0
fieldset/Data:
  description: Data.
  fields:
  - name: r0t0
    description: Read receive FIFO bit 0 or write transmit FIFO bit 0.
    bit_offset: 0
    bit_size: 1
  - name: r1t1
    description: Read receive FIFO bit 1 or write transmit FIFO bit 1.
    bit_offset: 1
    bit_size: 1
  - name: r2t2
    description: Read receive FIFO bit 2 or write transmit FIFO bit 2.
    bit_offset: 2
    bit_size: 1
  - name: r3t3
    description: Read receive FIFO bit 3 or write transmit FIFO bit 3.
    bit_offset: 3
    bit_size: 1
  - name: r4t4
    description: Read receive FIFO bit 4 or write transmit FIFO bit 4.
    bit_offset: 4
    bit_size: 1
  - name: r5t5
    description: Read receive FIFO bit 5 or write transmit FIFO bit 5.
    bit_offset: 5
    bit_size: 1
  - name: r6t6
    description: Read receive FIFO bit 6 or write transmit FIFO bit 6.
    bit_offset: 6
    bit_size: 1
  - name: r7t7
    description: Read receive FIFO bit 7 or write transmit FIFO bit 7.
    bit_offset: 7
    bit_size: 1
  - name: r8t8
    description: Read receive FIFO bit 8 or write transmit FIFO bit 8.
    bit_offset: 8
    bit_size: 1
  - name: r9t9
    description: Read receive FIFO bit 9 or write transmit FIFO bit 9.
    bit_offset: 9
    bit_size: 1
  - name: linbrk
    description: LIN Break.
    bit_offset: 10
    bit_size: 1
  - name: idline
    description: Idle Line.
    bit_offset: 11
    bit_size: 1
  - name: rxempt
    description: Receive Buffer Empty.
    bit_offset: 12
    bit_size: 1
  - name: fretsc
    description: Frame Error Transmit Special Character.
    bit_offset: 13
    bit_size: 1
  - name: paritye
    description: Parity Error.
    bit_offset: 14
    bit_size: 1
  - name: noisy
    description: Noisy Data Received.
    bit_offset: 15
    bit_size: 1
  bit_size: 32
  reset_value: 4096
fieldset/Dataro:
  description: Data Read-Only.
  fields:
  - name: data
    description: Receive Data.
    bit_offset: 0
    bit_size: 16
  bit_size: 32
  reset_value: 4096
fieldset/Fifo:
  description: FIFO.
  fields:
  - name: rxfifosize
    description: Receive FIFO Buffer Depth.
    bit_offset: 0
    bit_size: 3
    enum: Rxfifosize
  - name: rxfe
    description: Receive FIFO Enable.
    bit_offset: 3
    bit_size: 1
  - name: txfifosize
    description: Transmit FIFO Buffer Depth.
    bit_offset: 4
    bit_size: 3
    enum: Rxfifosize
  - name: txfe
    description: Transmit FIFO Enable.
    bit_offset: 7
    bit_size: 1
  - name: rxufe
    description: Receive FIFO Underflow Interrupt Enable.
    bit_offset: 8
    bit_size: 1
  - name: txofe
    description: Transmit FIFO Overflow Interrupt Enable.
    bit_offset: 9
    bit_size: 1
  - name: rxiden
    description: Receiver Idle Empty Enable.
    bit_offset: 10
    bit_size: 3
    enum: Rxiden
  - name: rxflush
    description: "Receive FIFO Flush.\n\nRaw bit values: false (0) = NoEffect: No effect.; true (1) = RxfifoRst: All data flushed out."
    bit_offset: 14
    bit_size: 1
  - name: txflush
    description: "Transmit FIFO Flush.\n\nRaw bit values: false (0) = NoEffect: No effect.; true (1) = TxfifoRst: All data flushed out."
    bit_offset: 15
    bit_size: 1
  - name: rxuf
    description: Receiver FIFO Underflow Flag.
    bit_offset: 16
    bit_size: 1
  - name: txof
    description: Transmitter FIFO Overflow Flag.
    bit_offset: 17
    bit_size: 1
  - name: rxempt
    description: Receive FIFO Or Buffer Empty.
    bit_offset: 22
    bit_size: 1
  - name: txempt
    description: Transmit FIFO Or Buffer Empty.
    bit_offset: 23
    bit_size: 1
  bit_size: 32
  reset_value: 12582929
fieldset/Global:
  description: Global.
  fields:
  - name: rst
    description: "Software Reset.\n\nRaw bit values: false (0) = NoEffect: Not reset.; true (1) = Reset: Reset."
    bit_offset: 1
    bit_size: 1
  bit_size: 32
  reset_value: 0
fieldset/Match:
  description: Match Address.
  fields:
  - name: ma1
    description: Match Address 1.
    bit_offset: 0
    bit_size: 10
  - name: ma2
    description: Match Address 2.
    bit_offset: 16
    bit_size: 10
  bit_size: 32
  reset_value: 0
fieldset/Modir:
  description: MODEM IrDA.
  fields:
  - name: txctse
    description: Transmitter CTS Enable.
    bit_offset: 0
    bit_size: 1
  - name: txrtse
    description: Transmitter RTS Enable.
    bit_offset: 1
    bit_size: 1
  - name: txrtspol
    description: "Transmitter RTS Polarity.\n\nRaw bit values: false (0) = Low: Active low.; true (1) = High: Active high."
    bit_offset: 2
    bit_size: 1
  - name: rxrtse
    description: Receiver RTS Enable.
    bit_offset: 3
    bit_size: 1
  - name: txctsc
    description: "Transmit CTS Configuration.\n\nRaw bit values: false (0) = Start: Sampled at the start of each character.; true (1) = Idle: Sampled when the transmitter is idle."
    bit_offset: 4
    bit_size: 1
  - name: txctssrc
    description: "Transmit CTS Source.\n\nRaw bit values: false (0) = Cts: The CTS_B pin.; true (1) = Match: An internal connection to the receiver address match result."
    bit_offset: 5
    bit_size: 1
  - name: rtswater
    description: Receive RTS Configuration.
    bit_offset: 8
    bit_size: 2
  - name: tnp
    description: Transmitter Narrow Pulse.
    bit_offset: 16
    bit_size: 2
    enum: Tnp
  - name: iren
    description: IR Enable.
    bit_offset: 18
    bit_size: 1
  bit_size: 32
  reset_value: 0
fieldset/Param:
  description: Parameter.
  fields:
  - name: txfifo
    description: Transmit FIFO Size.
    bit_offset: 0
    bit_size: 8
  - name: rxfifo
    description: Receive FIFO Size.
    bit_offset: 8
    bit_size: 8
  bit_size: 32
  reset_value: 514
fieldset/Pincfg:
  description: Pin Configuration.
  fields:
  - name: trgsel
    description: Trigger Select.
    bit_offset: 0
    bit_size: 2
    enum: Trgsel
  bit_size: 32
  reset_value: 0
fieldset/Stat:
  description: Status.
  fields:
  - name: lbkfe
    description: LIN Break Flag Enable.
    bit_offset: 0
    bit_size: 1
  - name: ame
    description: Address Mark Enable.
    bit_offset: 1
    bit_size: 1
  - name: ma2f
    description: Match 2 Flag.
    bit_offset: 14
    bit_size: 1
  - name: ma1f
    description: Match 1 Flag.
    bit_offset: 15
    bit_size: 1
  - name: pf
    description: Parity Error Flag.
    bit_offset: 16
    bit_size: 1
  - name: fe
    description: Framing Error Flag.
    bit_offset: 17
    bit_size: 1
  - name: nf
    description: Noise Flag.
    bit_offset: 18
    bit_size: 1
  - name: or
    description: Receiver Overrun Flag.
    bit_offset: 19
    bit_size: 1
  - name: idle
    description: Idle Line Flag.
    bit_offset: 20
    bit_size: 1
  - name: rdrf
    description: Receive Data Register Full Flag.
    bit_offset: 21
    bit_size: 1
  - name: tc
    description: "Transmission Complete Flag.\n\nRaw bit values: false (0) = Active: Transmitter active.; true (1) = Complete: Transmitter idle."
    bit_offset: 22
    bit_size: 1
  - name: tdre
    description: "Transmit Data Register Empty Flag.\n\nRaw bit values: false (0) = Txdata: Greater than watermark.; true (1) = NoTxdata: Equal to or less than watermark."
    bit_offset: 23
    bit_size: 1
  - name: raf
    description: "Receiver Active Flag.\n\nRaw bit values: false (0) = Idle: Idle, waiting for a start bit.; true (1) = Active: Receiver active (RXD pin input not idle)."
    bit_offset: 24
    bit_size: 1
  - name: lbkde
    description: LIN Break Detection Enable.
    bit_offset: 25
    bit_size: 1
  - name: brk13
    description: "Break Character Generation Length.\n\nRaw bit values: false (0) = Short: 9 to 13 bit times.; true (1) = Long: 12 to 15 bit times."
    bit_offset: 26
    bit_size: 1
  - name: rwuid
    description: "Receive Wake Up Idle Detect.\n\nRaw bit values: false (0) = IdleNotset: STAT[IDLE] does not become 1.; true (1) = IdleSet: STAT[IDLE] becomes 1."
    bit_offset: 27
    bit_size: 1
  - name: rxinv
    description: Receive Data Inversion.
    bit_offset: 28
    bit_size: 1
  - name: msbf
    description: "MSB First.\n\nRaw bit values: false (0) = LsbFirst: LSB.; true (1) = MsbFirst: MSB."
    bit_offset: 29
    bit_size: 1
  - name: rxedgif
    description: RXD Pin Active Edge Interrupt Flag.
    bit_offset: 30
    bit_size: 1
  - name: lbkdif
    description: LIN Break Detect Interrupt Flag.
    bit_offset: 31
    bit_size: 1
  bit_size: 32
  reset_value: 12582912
fieldset/Verid:
  description: Version ID.
  fields:
  - name: feature
    description: Feature Identification Number.
    bit_offset: 0
    bit_size: 16
    enum: Feature
  - name: minor
    description: Minor Version Number.
    bit_offset: 16
    bit_size: 8
  - name: major
    description: Major Version Number.
    bit_offset: 24
    bit_size: 8
  bit_size: 32
  reset_value: 67436547
fieldset/Water:
  description: Watermark.
  fields:
  - name: txwater
    description: Transmit Watermark.
    bit_offset: 0
    bit_size: 2
  - name: txcount
    description: Transmit Counter.
    bit_offset: 8
    bit_size: 3
  - name: rxwater
    description: Receive Watermark.
    bit_offset: 16
    bit_size: 2
  - name: rxcount
    description: Receive Counter.
    bit_offset: 24
    bit_size: 3
  bit_size: 32
  reset_value: 0
enum/Feature:
  bit_size: 16
  variants:
  - name: Standard
    description: Standard feature set.
    value: 1
  - name: Modem
    description: Standard feature set with MODEM and IrDA support.
    value: 3
enum/Idlecfg:
  bit_size: 3
  variants:
  - name: Idle1
    description: '1.'
    value: 0
  - name: Idle2
    description: '2.'
    value: 1
  - name: Idle4
    description: '4.'
    value: 2
  - name: Idle8
    description: '8.'
    value: 3
  - name: Idle16
    description: '16.'
    value: 4
  - name: Idle32
    description: '32.'
    value: 5
  - name: Idle64
    description: '64.'
    value: 6
  - name: Idle128
    description: '128.'
    value: 7
enum/Matcfg:
  bit_size: 2
  variants:
  - name: AddrMatch
    description: Address match wake-up.
    value: 0
  - name: IdleMatch
    description: Idle match wake-up.
    value: 1
  - name: OnoffMatch
    description: Match on and match off.
    value: 2
  - name: RwuMatch
    description: Enables RWU on data match and match on or off for the transmitter CTS input.
    value: 3
enum/Rxfifosize:
  bit_size: 3
  variants:
  - name: Fifo1
    description: '1.'
    value: 0
  - name: Fifo4
    description: '4.'
    value: 1
  - name: Fifo8
    description: '8.'
    value: 2
  - name: Fifo16
    description: '16.'
    value: 3
  - name: Fifo32
    description: '32.'
    value: 4
  - name: Fifo64
    description: '64.'
    value: 5
  - name: Fifo128
    description: '128.'
    value: 6
  - name: Fifo256
    description: '256.'
    value: 7
enum/Rxiden:
  bit_size: 3
  variants:
  - name: Disabled
    description: Disable STAT[RDRF] to become 1 because of partially filled FIFO when the receiver is idle.
    value: 0
  - name: Idle1
    description: Enable STAT[RDRF] to become 1 because of partially filled FIFO when the receiver is idle for one
      character.
    value: 1
  - name: Idle2
    description: Enable STAT[RDRF] to become 1 because of partially filled FIFO when the receiver is idle for two
      characters.
    value: 2
  - name: Idle4
    description: Enable STAT[RDRF] to become 1 because of partially filled FIFO when the receiver is idle for four
      characters.
    value: 3
  - name: Idle8
    description: Enable STAT[RDRF] to become 1 because of partially filled FIFO when the receiver is idle for eight
      characters.
    value: 4
  - name: Idle16
    description: Enable STAT[RDRF] to become 1 because of partially filled FIFO when the receiver is idle for 16
      characters.
    value: 5
  - name: Idle32
    description: Enable STAT[RDRF] to become 1 because of partially filled FIFO when the receiver is idle for 32
      characters.
    value: 6
  - name: Idle64
    description: Enable STAT[RDRF] to become 1 because of partially filled FIFO when the receiver is idle for 64
      characters.
    value: 7
enum/Tnp:
  bit_size: 2
  variants:
  - name: OneSample
    description: 1 / OSR.
    value: 0
  - name: TwoSample
    description: 2 / OSR.
    value: 1
  - name: ThreeSample
    description: 3 / OSR.
    value: 2
  - name: FourSample
    description: 4 / OSR.
    value: 3
enum/Trgsel:
  bit_size: 2
  variants:
  - name: Disabled
    description: Input trigger disabled.
    value: 0
  - name: TrgRxd
    description: Input trigger used instead of the RXD pin input.
    value: 1
  - name: TrgCts
    description: Input trigger used instead of the CTS_B pin input.
    value: 2
  - name: TrgTxd
    description: Input trigger used to modulate the TXD pin output, which (after TXINV configuration) is internally
      ANDed with the input trigger.
    value: 3
