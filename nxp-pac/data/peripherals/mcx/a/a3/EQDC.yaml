fieldset/Ctrl:
  description: Control Register.
  bit_size: 16
  fields:
  - name: ldok
    description: "Load Okay.\n\nRaw bit values: false (0) = Ldok0: No loading action taken. Users can write new values to buffered registers (writing into outer-set of these buffered registers).; true (1) = Ldok1: Outer-set values are ready to be loaded into inner-set and take effect. The loading time point depends on CTRL2[LDMOD]."
    bit_offset: 0
    bit_size: 1
  - name: dmaen
    description: "DMA Enable.\n\nRaw bit values: false (0) = Dmaen0: DMA is disabled.; true (1) = Dmaen1: DMA is enabled. DMA request asserts automatically when the values in the outer-set of buffered compare registers (UCOMP0/LCOMP0;UCOMP1/LCOMP1;UCOMP2/LCOMP2;UCOMP3/LCOMP3), initial registers(UINIT/LINIT) and modulus registers (UMOD/LMOD) are loaded into the inner-set of buffer and then LDOK is cleared automatically. After the completion of this DMA transfer, LDOK is set automatically, it ensures outer-set values can be loaded into inner-set which in turn triggers DMA again."
    bit_offset: 1
    bit_size: 1
  - name: wde
    description: "Watchdog Enable.\n\nRaw bit values: false (0) = Wde0: Disabled.; true (1) = Wde1: Enabled."
    bit_offset: 2
    bit_size: 1
  - name: wdie
    description: "Watchdog Timeout Interrupt Enable.\n\nRaw bit values: false (0) = Wdie0: Disabled.; true (1) = Wdie1: Enabled."
    bit_offset: 3
    bit_size: 1
  - name: wdirq
    description: "Watchdog Timeout Interrupt Request.\n\nRaw bit values: false (0) = Wdirq0: No Watchdog timeout interrupt has occurred.; true (1) = Wdirq1: Watchdog timeout interrupt has occurred."
    bit_offset: 4
    bit_size: 1
  - name: xne
    description: "Select Positive/Negative Edge of INDEX/PRESET Pulse.\n\nRaw bit values: false (0) = Xne0: Use positive edge of INDEX/PRESET pulse.; true (1) = Xne1: Use negative edge of INDEX/PRESET pulse."
    bit_offset: 5
    bit_size: 1
  - name: xip
    description: "INDEX Triggered Initialization of Position Counters UPOS and LPOS.\n\nRaw bit values: false (0) = Xip0: INDEX pulse does not initialize the position counter.; true (1) = Xip1: INDEX pulse initializes the position counter."
    bit_offset: 6
    bit_size: 1
  - name: xie
    description: "INDEX/PRESET Pulse Interrupt Enable.\n\nRaw bit values: false (0) = Xie0: Disabled.; true (1) = Xie1: Enabled."
    bit_offset: 7
    bit_size: 1
  - name: xirq
    description: "INDEX/PRESET Pulse Interrupt Request.\n\nRaw bit values: false (0) = Xirq0: INDEX/PRESET pulse has not occurred.; true (1) = Xirq1: INDEX/PRESET pulse has occurred."
    bit_offset: 8
    bit_size: 1
  - name: ph1
    description: "Enable Single Phase Mode.\n\nRaw bit values: false (0) = Ph10: Standard quadrature decoder, where PHASEA and PHASEB represent a two-phase quadrature signal.; true (1) = Ph11: Single phase mode, bypass the quadrature decoder, refer to CTRL2[CMODE] description."
    bit_offset: 9
    bit_size: 1
  - name: rev
    description: "Enable Reverse Direction Counting.\n\nRaw bit values: false (0) = Rev0: Count normally and the position counter initialization uses upper/lower initialization register UINIT/LINIT.; true (1) = Rev1: Count in the reverse direction and the position counter initialization uses upper/lower modulus register UMOD/LMOD."
    bit_offset: 10
    bit_size: 1
  - name: swip
    description: "Software-Triggered Initialization of Position Counters UPOS and LPOS.\n\nRaw bit values: false (0) = Swip0: No action.; true (1) = Swip1: Initialize position counter."
    bit_offset: 11
    bit_size: 1
  - name: hne
    description: "Use Negative Edge of HOME/ENABLE Input.\n\nRaw bit values: false (0) = Hne0: When CTRL[OPMODE] = 0,use HOME positive edge to trigger initialization of position counters. When CTRL[OPMODE] = 1,use ENABLE high level to enable POS/POSD/WDG/REV counters.; true (1) = Hne1: When CTRL[OPMODE] = 0,use HOME negative edge to trigger initialization of position counters. When CTRL[OPMODE] = 1,use ENABLE low level to enable POS/POSD/WDG/REV counters."
    bit_offset: 12
    bit_size: 1
  - name: hip
    description: "Enable HOME to Initialize Position Counter UPOS/LPOS.\n\nRaw bit values: false (0) = Hip0: No action.; true (1) = Hip1: HOME signal initializes the position counter."
    bit_offset: 13
    bit_size: 1
  - name: hie
    description: "HOME/ENABLE Interrupt Enable.\n\nRaw bit values: false (0) = Hie0: Disabled.; true (1) = Hie1: Enabled."
    bit_offset: 14
    bit_size: 1
  - name: hirq
    description: "HOME/ENABLE Signal Transition Interrupt Request.\n\nRaw bit values: false (0) = Hirq0: No transition on the HOME/ENABLE signal has occurred.; true (1) = Hirq1: A transition on the HOME/ENABLE signal has occurred."
    bit_offset: 15
    bit_size: 1
  reset_value: 0
fieldset/Ctrl2:
  description: Control 2 Register.
  bit_size: 16
  fields:
  - name: updhld
    description: Update Hold Registers.
    bit_offset: 0
    bit_size: 1
  - name: updpos
    description: Update Position Registers.
    bit_offset: 1
    bit_size: 1
  - name: opmode
    description: "Operation Mode Select.\n\nRaw bit values: false (0) = Opmode0: Decode Mode: Input nodes INDEX/PRESET and HOME/ENABLE are assigned to function of INDEX and HOME.; true (1) = Opmode1: Count Mode: Input nodes INDEX/PRESET and HOME/ENABLE are assigned to functions of PRESET and ENABLE. In this mode: (1)only when ENABLE=1, all counters (position/position difference/revolution/watchdog) can run, when ENABLE=0, all counters (position/position difference/revolution/watchdog) can't run. (2) the rising edge of PRESET input can initialize position/revolution/watchdog counters (position counter initialization also need referring to bit CTRL[REV])."
    bit_offset: 2
    bit_size: 1
  - name: ldmod
    description: "Buffered Register Load (Update) Mode Select.\n\nRaw bit values: false (0) = Ldmod0: Buffered registers are loaded and take effect immediately upon CTRL[LDOK] is set.; true (1) = Ldmod1: Buffered registers are loaded and take effect at the next roll-over or roll-under if CTRL[LDOK] is set."
    bit_offset: 3
    bit_size: 1
  - name: revmod
    description: "Revolution Counter Modulus Enable.\n\nRaw bit values: false (0) = Revmod0: Use INDEX pulse to increment/decrement revolution counter (REV).; true (1) = Revmod1: Use modulus counting roll-over/under to increment/decrement revolution counter (REV)."
    bit_offset: 8
    bit_size: 1
  - name: outctl
    description: "Output Control.\n\nRaw bit values: false (0) = Outctl0: POS_MATCH[x](x range is 0-3) is asserted when the Position Counter is equal to according compare value (UCOMPx/LCOMPx)(x range is 0-3), and de-asserted when the Position Counter not equal to the compare value (UCOMPx/LCOMPx)(x range is 0-3).; true (1) = Outctl1: All POS_MATCH[x](x range is 0-3) are asserted a pulse, when the UPOS, LPOS, REV, or POSD registers are read."
    bit_offset: 9
    bit_size: 1
  - name: pmen
    description: "Period measurement function enable.\n\nRaw bit values: false (0) = Pmen0: Period measurement functions are not used. POSD is loaded to POSDH and then cleared whenever POSD, UPOS, LPOS or REV is read.; true (1) = Pmen1: Period measurement functions are used. POSD is loaded into POSDH and then cleared only when POSD is read."
    bit_offset: 10
    bit_size: 1
  - name: emip
    description: "Enables/disables the position counter to be initialized by Index Event Edge Mark.\n\nRaw bit values: false (0) = Emip0: disables the position counter to be initialized by Index Event Edge Mark.; true (1) = Emip1: enables the position counter to be initialized by Index Event Edge Mark."
    bit_offset: 11
    bit_size: 1
  - name: initpos
    description: "Initial Position Register.\n\nRaw bit values: false (0) = Initpos0: Don't initialize position counter on rising edge of TRIGGER.; true (1) = Initpos1: Initialize position counter on rising edge of TRIGGER."
    bit_offset: 12
    bit_size: 1
  - name: once
    description: "Count Once.\n\nRaw bit values: false (0) = Once0: Position counter counts repeatedly.; true (1) = Once1: Position counter counts until roll-over or roll-under, then stop."
    bit_offset: 13
    bit_size: 1
  - name: cmode
    description: Counting Mode.
    bit_offset: 14
    bit_size: 2
  reset_value: 0
fieldset/Filt:
  description: Input Filter Register.
  bit_size: 16
  fields:
  - name: filt_per
    description: Input Filter Sample Period.
    bit_offset: 0
    bit_size: 8
  - name: filt_cnt
    description: Input Filter Sample Count.
    bit_offset: 8
    bit_size: 3
  - name: filt_cs
    description: "Filter Clock Source selection.\n\nRaw bit values: false (0) = FiltCs0: Peripheral Clock.; true (1) = FiltCs1: Prescaled peripheral clock by PRSC."
    bit_offset: 11
    bit_size: 1
  - name: prsc
    description: Prescaler.
    bit_offset: 12
    bit_size: 4
  reset_value: 0
fieldset/Imr:
  description: Input Monitor Register.
  bit_size: 16
  fields:
  - name: home_enable
    description: HOME_ENABLE.
    bit_offset: 0
    bit_size: 1
  - name: index_preset
    description: INDEX_PRESET.
    bit_offset: 1
    bit_size: 1
  - name: phb
    description: PHB.
    bit_offset: 2
    bit_size: 1
  - name: pha
    description: PHA.
    bit_offset: 3
    bit_size: 1
  - name: fhom_ena
    description: filter operation on HOME/ENABLE input.
    bit_offset: 4
    bit_size: 1
  - name: find_pre
    description: filter operation on INDEX/PRESET input.
    bit_offset: 5
    bit_size: 1
  - name: fphb
    description: filter operation on PHASEB input.
    bit_offset: 6
    bit_size: 1
  - name: fpha
    description: filter operation on PHASEA input.
    bit_offset: 7
    bit_size: 1
  - name: cmpf0
    description: "Position Compare 0 Flag Output.\n\nRaw bit values: false (0) = Cmpf00: When the position counter is less than value of COMP0 register.; true (1) = Cmpf01: When the position counter is greater or equal than value of COMP0 register."
    bit_offset: 8
    bit_size: 1
  - name: cmp1f
    description: "Position Compare1 Flag Output.\n\nRaw bit values: false (0) = Cmp1f0: When the position counter is less than value of COMP1 register.; true (1) = Cmp1f1: When the position counter is greater or equal than value of COMP1 register."
    bit_offset: 9
    bit_size: 1
  - name: cmp2f
    description: "Position Compare2 Flag Output.\n\nRaw bit values: false (0) = Cmp2f0: When the position counter is less than value of COMP2 register.; true (1) = Cmp2f1: When the position counter is greater or equal than value of COMP2 register."
    bit_offset: 10
    bit_size: 1
  - name: cmp3f
    description: "Position Compare3 Flag Output.\n\nRaw bit values: false (0) = Cmp3f0: When the position counter value is less than value of COMP3 register.; true (1) = Cmp3f1: When the position counter is greater or equal than value of COMP3 register."
    bit_offset: 11
    bit_size: 1
  - name: dirh
    description: Count Direction Flag Hold.
    bit_offset: 14
    bit_size: 1
  - name: dir
    description: "Count Direction Flag Output.\n\nRaw bit values: false (0) = Dir0: Current count was in the down direction.; true (1) = Dir1: Current count was in the up direction."
    bit_offset: 15
    bit_size: 1
  reset_value: 0
fieldset/Intctrl:
  description: Interrupt Control Register.
  bit_size: 16
  fields:
  - name: sabie
    description: "Simultaneous PHASEA and PHASEB Change Interrupt Enable.\n\nRaw bit values: false (0) = Sabie0: Disabled.; true (1) = Sabie1: Enabled."
    bit_offset: 0
    bit_size: 1
  - name: sabirq
    description: "Simultaneous PHASEA and PHASEB Change Interrupt Request.\n\nRaw bit values: false (0) = Sabirq0: No simultaneous change of PHASEA and PHASEB has occurred.; true (1) = Sabirq1: A simultaneous change of PHASEA and PHASEB has occurred."
    bit_offset: 1
    bit_size: 1
  - name: dirie
    description: "Count direction change interrupt enable.\n\nRaw bit values: false (0) = Dirie0: Disabled.; true (1) = Dirie1: Enabled."
    bit_offset: 2
    bit_size: 1
  - name: dirirq
    description: "Count direction change interrupt.\n\nRaw bit values: false (0) = Dirirq0: Count direction unchanged.; true (1) = Dirirq1: Count direction changed."
    bit_offset: 3
    bit_size: 1
  - name: ruie
    description: "Roll-under Interrupt Enable.\n\nRaw bit values: false (0) = Ruie0: Disabled.; true (1) = Ruie1: Enabled."
    bit_offset: 4
    bit_size: 1
  - name: ruirq
    description: "Roll-under Interrupt Request.\n\nRaw bit values: false (0) = Ruirq0: No roll-under has occurred.; true (1) = Ruirq1: Roll-under has occurred."
    bit_offset: 5
    bit_size: 1
  - name: roie
    description: "Roll-over Interrupt Enable.\n\nRaw bit values: false (0) = Roie: Disabled.; true (1) = Roie1: Enabled."
    bit_offset: 6
    bit_size: 1
  - name: roirq
    description: "Roll-over Interrupt Request.\n\nRaw bit values: false (0) = Roirq0: No roll-over has occurred.; true (1) = Roirq1: Roll-over has occurred."
    bit_offset: 7
    bit_size: 1
  - name: cmp0ie
    description: "Compare 0 Interrupt Enable.\n\nRaw bit values: false (0) = Cmp0ie0: Disabled.; true (1) = Cmp0ie1: Enabled."
    bit_offset: 8
    bit_size: 1
  - name: cmp0irq
    description: "Compare 0 Interrupt Request.\n\nRaw bit values: false (0) = Cmp0irq0: No match has occurred (the position counter does not match the COMP0 value).; true (1) = Cmp0irq1: COMP match has occurred (the position counter matches the COMP0 value)."
    bit_offset: 9
    bit_size: 1
  - name: cmp1ie
    description: "Compare1 Interrupt Enable.\n\nRaw bit values: false (0) = Cmp1ie0: Disabled.; true (1) = Cmp1ie1: Enabled."
    bit_offset: 10
    bit_size: 1
  - name: cmp1irq
    description: "Compare1 Interrupt Request.\n\nRaw bit values: false (0) = Cmp1irq0: No match has occurred (the position counter does not match the COMP1 value).; true (1) = Cmp1irq1: COMP1 match has occurred (the position counter matches the COMP1 value)."
    bit_offset: 11
    bit_size: 1
  - name: cmp2ie
    description: "Compare2 Interrupt Enable.\n\nRaw bit values: false (0) = Cmp2ie0: Disabled.; true (1) = Cmp2ie1: Enabled."
    bit_offset: 12
    bit_size: 1
  - name: cmp2irq
    description: "Compare2 Interrupt Request.\n\nRaw bit values: false (0) = Cmp2irq0: No match has occurred (the position counter does not match the COMP2 value).; true (1) = Cmp2irq1: COMP2 match has occurred (the position counter matches the COMP2 value)."
    bit_offset: 13
    bit_size: 1
  - name: cmp3ie
    description: "Compare3 Interrupt Enable.\n\nRaw bit values: false (0) = Cmp3ie0: Disabled.; true (1) = Cmp3ie1: Enabled."
    bit_offset: 14
    bit_size: 1
  - name: cmp3irq
    description: "Compare3 Interrupt Request.\n\nRaw bit values: false (0) = Cmp3irq0: No match has occurred (the position counter does not match the COMP3 value).; true (1) = Cmp3irq1: COMP3 match has occurred (the position counter matches the COMP3 value)."
    bit_offset: 15
    bit_size: 1
  reset_value: 0
