    description: Looping not enabled. Command executes 1 time.
    value: 0
  - name: CmdExec2x
    description: Loop 1 time. Command executes 2 times.
    value: 1
  - name: CmdExec3x
    description: Loop 2 times. Command executes 3 times.
    value: 2
  - name: CmdExecutesCorrespondingTimes3
    description: Loop corresponding number of times. Command executes LOOP+1 times.
    value: 3
  - name: CmdExecutesCorrespondingTimes4
    description: Loop corresponding number of times. Command executes LOOP+1 times.
    value: 4
  - name: CmdExecutesCorrespondingTimes5
    description: Loop corresponding number of times. Command executes LOOP+1 times.
    value: 5
  - name: CmdExecutesCorrespondingTimes6
    description: Loop corresponding number of times. Command executes LOOP+1 times.
    value: 6
  - name: CmdExecutesCorrespondingTimes7
    description: Loop corresponding number of times. Command executes LOOP+1 times.
    value: 7
  - name: CmdExecutesCorrespondingTimes8
    description: Loop corresponding number of times. Command executes LOOP+1 times.
    value: 8
  - name: CmdExecutesCorrespondingTimes9
    description: Loop corresponding number of times. Command executes LOOP+1 times.
    value: 9
  - name: CmdExecutesCorrespondingTimes10
    description: Loop corresponding number of times. Command executes LOOP+1 times.
    value: 10
  - name: CmdExecutesCorrespondingTimes11
    description: Loop corresponding number of times. Command executes LOOP+1 times.
    value: 11
  - name: CmdExecutesCorrespondingTimes12
    description: Loop corresponding number of times. Command executes LOOP+1 times.
    value: 12
  - name: CmdExecutesCorrespondingTimes13
    description: Loop corresponding number of times. Command executes LOOP+1 times.
    value: 13
  - name: CmdExecutesCorrespondingTimes14
    description: Loop corresponding number of times. Command executes LOOP+1 times.
    value: 14
  - name: CmdExec15x
    description: Loop 15 times. Command executes 16 times.
    value: 15
enum/Loopcnt:
  bit_size: 4
  variants:
  - name: Result1
    description: Result is from initial conversion in command.
    value: 0
  - name: Result2
    description: Result is from second conversion in command.
    value: 1
  - name: CorrespondingResult2
    description: Result is from LOOPCNT+1 conversion in command.
    value: 2
  - name: CorrespondingResult3
