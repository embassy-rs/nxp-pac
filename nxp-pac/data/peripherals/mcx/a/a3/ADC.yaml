# MCXA3: explicit pinned XML onboarding; backing widths and resets retained.
block/Adc:
  description: ADC.
  items:
  - name: verid
    description: Version ID Register.
    byte_offset: 0
    access: Read
    fieldset: Verid
  - name: param
    description: Parameter Register.
    byte_offset: 4
    access: Read
    fieldset: Param
  - name: ctrl
    description: Control Register.
    byte_offset: 16
    fieldset: Ctrl
  - name: stat
    description: Status Register.
    byte_offset: 20
    fieldset: Stat
  - name: ie
    description: Interrupt Enable Register.
    byte_offset: 24
    fieldset: Ie
  - name: de
    description: DMA Enable Register.
    byte_offset: 28
    fieldset: De
  - name: cfg
    description: Configuration Register.
    byte_offset: 32
    fieldset: Cfg
  - name: pause
    description: Pause Register.
    byte_offset: 36
    fieldset: Pause
  - name: swtrig
    description: Software Trigger Register.
    byte_offset: 52
    fieldset: Swtrig
  - name: tstat
    description: Trigger Status Register.
    byte_offset: 56
    fieldset: Tstat
  - name: ofstrim
    description: Offset Trim Register.
    byte_offset: 64
    fieldset: Ofstrim
  - name: hstrim
    description: High Speed Trim Register.
    byte_offset: 72
    fieldset: Hstrim
  - name: tctrl
    description: Trigger Control Register.
    array:
      len: 4
      stride: 4
    byte_offset: 160
    fieldset: Tctrl
  - name: fctrl0
    description: FIFO Control Register.
    byte_offset: 224
    fieldset: Fctrl0
  - name: gcc0
    description: Gain Calibration Control.
    byte_offset: 240
    access: Read
    fieldset: Gcc0
  - name: gcr0
    description: Gain Calculation Result.
    byte_offset: 248
    fieldset: Gcr0
  - name: cmdl
    description: Command Low Buffer Register.
    array:
      len: 7
      stride: 8
    byte_offset: 256
    fieldset: Cmdl
  - name: cmdh
    description: Command High Buffer Register.
    array:
      len: 7
      stride: 8
    byte_offset: 260
    fieldset: Cmdh
  - name: cv
    description: Compare Value Register.
    array:
      len: 7
      stride: 4
    byte_offset: 512
    fieldset: Cv
  - name: resfifo0
    description: Data Result FIFO Register.
    byte_offset: 768
    access: Read
    fieldset: Resfifo0
  - name: cal_gar
    description: Calibration General A-Side Registers.
    array:
      len: 34
      stride: 4
    byte_offset: 1024
    fieldset: CalGar
  - name: cfg2
    description: Configuration 2 Register.
    byte_offset: 4088
    fieldset: Cfg2
fieldset/CalGar:
  description: Calibration General A-Side Registers.
  fields:
  - name: cal_gar_val
    description: Calibration General A Side Register Element.
    bit_offset: 0
    bit_size: 16
  bit_size: 32
  reset_value: 0
fieldset/Cfg:
  description: Configuration Register.
  fields:
  - name: tprictrl
    description: ADC Trigger Priority Control.
    bit_offset: 0
    bit_size: 2
    enum: Tprictrl
  - name: pwrsel
    description: "Power Configuration Select.\n\nRaw bit values: false (0) = Lowest: Low power.; true (1) = Highest: High power."
    bit_offset: 5
    bit_size: 1
  - name: refsel
    description: Voltage Reference Selection.
    bit_offset: 6
    bit_size: 2
    enum: Refsel
  - name: tres
    description: Trigger Resume Enable.
    bit_offset: 8
    bit_size: 1
  - name: tcmdres
    description: Trigger Command Resume.
    bit_offset: 9
    bit_size: 1
  - name: hpt_exdi
    description: "High Priority Trigger Exception Disable.\n\nRaw bit values: false (0) = Enabled: High priority trigger exceptions are enabled.; true (1) = Disabled: High priority trigger exceptions are disabled."
    bit_offset: 10
    bit_size: 1
  - name: pudly
    description: Power Up Delay.
    bit_offset: 16
    bit_size: 8
  - name: pwren
    description: ADC Analog Pre-Enable.
    bit_offset: 28
    bit_size: 1
  bit_size: 32
  reset_value: 8388608
fieldset/Cfg2:
  description: Configuration 2 Register.
  fields:
  - name: jleft
    description: Justified Left Enable register.
    bit_offset: 8
    bit_size: 1
  - name: hs
    description: High Speed Enable register.
    bit_offset: 9
    bit_size: 1
  - name: hsextra
    description: "High Speed Extra register.\n\nRaw bit values: false (0) = Hsextra0: No extra cycle added.; true (1) = Hsextra1: Extra cycle added."
    bit_offset: 10
    bit_size: 1
  - name: tune
    description: Tune Mode register.
    bit_offset: 12
    bit_size: 2
  bit_size: 32
  reset_value: 4096
fieldset/Cmdh:
  description: Command High Buffer Register.
  fields:
  - name: cmpen
    description: Compare Function Enable.
    bit_offset: 0
    bit_size: 2
    enum: Cmpen
  - name: wait_trig
    description: Wait for Trigger Assertion before Execution.
    bit_offset: 2
    bit_size: 1
  - name: lwi
    description: Loop with Increment.
    bit_offset: 7
    bit_size: 1
  - name: sts
    description: Sample Time Select.
    bit_offset: 8
    bit_size: 3
    enum: Sts
  - name: avgs
    description: Hardware Average Select.
    bit_offset: 12
    bit_size: 4
    enum: Avgs
  - name: loop_
    description: Loop Count Select.
    bit_offset: 16
    bit_size: 4
    enum: Loop
  - name: next
    description: Next Command Select.
    bit_offset: 24
    bit_size: 3
    enum: Next
  bit_size: 32
  reset_value: 0
fieldset/Cmdl:
  description: Command Low Buffer Register.
  fields:
  - name: adch
    description: Input Channel Select.
    bit_offset: 0
    bit_size: 5
  - name: ctype
    description: Conversion Type.
    bit_offset: 5
    bit_size: 2
    enum: Ctype
  - name: mode
    description: "Select Resolution of Conversions.\n\nRaw bit values: false (0) = Data12Bits: Standard resolution. Single-ended 12-bit conversion.; true (1) = Data16Bits: High resolution. Single-ended 16-bit conversion."
    bit_offset: 7
    bit_size: 1
  bit_size: 32
  reset_value: 0
fieldset/Ctrl:
  description: Control Register.
  fields:
  - name: adcen
    description: ADC Enable.
    bit_offset: 0
    bit_size: 1
  - name: rst
    description: "Software Reset.\n\nRaw bit values: false (0) = ReleasedFromReset: ADC logic is not reset.; true (1) = HeldInReset: ADC logic is reset."
    bit_offset: 1
    bit_size: 1
  - name: dozen
    description: "Doze Enable.\n\nRaw bit values: false (0) = Enabled: ADC is enabled in low power mode.; true (1) = Disabled: ADC is disabled in low power mode."
    bit_offset: 2
    bit_size: 1
  - name: cal_req
    description: "Auto-Calibration Request.\n\nRaw bit values: false (0) = NoCalibrationRequest: No request for hardware calibration has been made.; true (1) = CalibrationRequestPending: A request for hardware calibration has been made."
    bit_offset: 3
    bit_size: 1
  - name: calofs
    description: "Offset Calibration Request.\n\nRaw bit values: false (0) = NoActiveOffsetCalibrationRequest: No request for offset calibration has been made.; true (1) = OffsetCalibrationRequestPending: Request for offset calibration function."
    bit_offset: 4
    bit_size: 1
  - name: calhs
    description: "High Speed Mode Trim Request.\n\nRaw bit values: false (0) = NoActiveHsTrimRequest: No request for high speed mode trim has been made.; true (1) = HsTrimRequestPending: Request for high speed mode trim has been made."
    bit_offset: 6
    bit_size: 1
  - name: rstfifo0
    description: "Reset FIFO 0.\n\nRaw bit values: false (0) = NoAction: No effect.; true (1) = TriggerReset: FIFO 0 is reset."
    bit_offset: 8
    bit_size: 1
  - name: cal_avgs
    description: Auto-Calibration Averages.
    bit_offset: 16
    bit_size: 4
    enum: Avgs
  bit_size: 32
  reset_value: 0
fieldset/Cv:
  description: Compare Value Register.
  fields:
  - name: cvl
    description: Compare Value Low.
    bit_offset: 0
    bit_size: 16
  - name: cvh
    description: Compare Value High.
    bit_offset: 16
    bit_size: 16
  bit_size: 32
  reset_value: 0
fieldset/De:
  description: DMA Enable Register.
  fields:
  - name: fwmde0
    description: FIFO 0 Watermark DMA Enable.
    bit_offset: 0
    bit_size: 1
  bit_size: 32
  reset_value: 0
fieldset/Fctrl0:
  description: FIFO Control Register.
  fields:
  - name: fcount
    description: Result FIFO Counter.
    bit_offset: 0
    bit_size: 4
  - name: fwmark
    description: Watermark Level Selection.
    bit_offset: 16
    bit_size: 3
  bit_size: 32
  reset_value: 0
fieldset/Gcc0:
  description: Gain Calibration Control.
  fields:
  - name: gain_cal
    description: Gain Calibration Value.
    bit_offset: 0
    bit_size: 16
  - name: rdy
    description: "Gain Calibration Value Valid.\n\nRaw bit values: false (0) = GainCalNotValid: The GAIN_CAL value is invalid. Run the hardware calibration routine for this value to be set.; true (1) = HardwareCalRoutineCompleted: The GAIN_CAL value is valid. GAIN_CAL should be used by software to derive GCRa[GCALR]."
    bit_offset: 24
    bit_size: 1
  bit_size: 32
  reset_value: 0
fieldset/Gcr0:
  description: Gain Calculation Result.
  fields:
  - name: gcalr
    description: Gain Calculation Result.
    bit_offset: 0
    bit_size: 17
  - name: rdy
    description: Gain Calculation Ready.
    bit_offset: 24
    bit_size: 1
  bit_size: 32
  reset_value: 65536
fieldset/Hstrim:
  description: High Speed Trim Register.
  fields:
  - name: hstrim
    description: Trim for High Speed Conversions.
    bit_offset: 0
    bit_size: 5
  bit_size: 32
  reset_value: 0
fieldset/Ie:
  description: Interrupt Enable Register.
  fields:
  - name: fwmie0
    description: FIFO 0 Watermark Interrupt Enable.
    bit_offset: 0
    bit_size: 1
  - name: fofie0
    description: Result FIFO 0 Overflow Interrupt Enable.
    bit_offset: 1
    bit_size: 1
  - name: texc_ie
    description: Trigger Exception Interrupt Enable.
    bit_offset: 8
    bit_size: 1
  - name: tcomp_ie
    description: Trigger Completion Interrupt Enable.
    bit_offset: 16
    bit_size: 4
    enum: TcompIe
  bit_size: 32
  reset_value: 0
fieldset/Ofstrim:
  description: Offset Trim Register.
  fields:
  - name: ofstrim
    description: Trim for Offset.
    bit_offset: 0
    bit_size: 10
  bit_size: 32
  reset_value: 0
fieldset/Param:
  description: Parameter Register.
  fields:
  - name: trig_num
    description: Trigger Number.
    bit_offset: 0
    bit_size: 8
  - name: fifosize
    description: Result FIFO Depth.
    bit_offset: 8
    bit_size: 8
    enum: Fifosize
  - name: cv_num
    description: Compare Value Number.
    bit_offset: 16
    bit_size: 8
  - name: cmd_num
    description: Command Buffer Number.
    bit_offset: 24
    bit_size: 8
  bit_size: 32
  reset_value: 117901316
fieldset/Pause:
  description: Pause Register.
  fields:
  - name: pausedly
    description: Pause Delay.
    bit_offset: 0
    bit_size: 9
  - name: pauseen
    description: PAUSE Option Enable.
    bit_offset: 31
    bit_size: 1
  bit_size: 32
  reset_value: 0
fieldset/Resfifo0:
  description: Data Result FIFO Register.
  fields:
  - name: d
    description: Data Result.
    bit_offset: 0
    bit_size: 16
  - name: tsrc
    description: Trigger Source.
    bit_offset: 16
    bit_size: 2
    enum: Tsrc
  - name: loopcnt
    description: Loop Count Value.
    bit_offset: 20
    bit_size: 4
    enum: Loopcnt
  - name: cmdsrc
    description: Command Buffer Source.
    bit_offset: 24
    bit_size: 3
    enum: Cmdsrc
  - name: valid
    description: FIFO Entry is Valid.
    bit_offset: 31
    bit_size: 1
  bit_size: 32
  reset_value: 0
fieldset/Stat:
  description: Status Register.
  fields:
  - name: rdy0
    description: "Result FIFO 0 Ready Flag.\n\nRaw bit values: false (0) = BelowThreshold: Result FIFO 0 data level not above watermark level.; true (1) = AboveThreshold: Result FIFO 0 holding data above watermark level."
    bit_offset: 0
    bit_size: 1
  - name: fof0
    description: "Result FIFO 0 Overflow Flag.\n\nRaw bit values: false (0) = NoOverflow: No result FIFO 0 overflow has occurred since the last time the flag was cleared.; true (1) = OverflowDetected: At least one result FIFO 0 overflow has occurred since the last time the flag was cleared."
    bit_offset: 1
    bit_size: 1
  - name: texc_int
    description: "Interrupt Flag For High Priority Trigger Exception.\n\nRaw bit values: false (0) = NoException: No trigger exceptions have occurred.; true (1) = ExceptionDetected: A trigger exception has occurred and is pending acknowledgement."
    bit_offset: 8
    bit_size: 1
  - name: tcomp_int
    description: "Interrupt Flag For Trigger Completion.\n\nRaw bit values: false (0) = FlagClear: Either IE[TCOMP_IE] is set to 0, or no trigger sequences have run to completion.; true (1) = CompletionDetected: Trigger sequence has been completed and all data is stored in the associated FIFO."
    bit_offset: 9
    bit_size: 1
  - name: cal_rdy
    description: "Calibration Ready.\n\nRaw bit values: false (0) = NotSet: Calibration is incomplete or hasn't been ran.; true (1) = HardwareCalStepCompleted: The ADC is calibrated."
    bit_offset: 10
    bit_size: 1
  - name: adc_active
    description: "ADC Active.\n\nRaw bit values: false (0) = NotActive: The ADC is IDLE. There are no pending triggers to service and no active commands are being processed.; true (1) = Busy: The ADC is processing a conversion, running through the power up delay, or servicing a trigger."
    bit_offset: 11
    bit_size: 1
  - name: trgact
    description: Trigger Active.
    bit_offset: 16
    bit_size: 2
    enum: Trgact
  - name: cmdact
    description: Command Active.
    bit_offset: 24
    bit_size: 3
    enum: Cmdact
  bit_size: 32
  reset_value: 0
fieldset/Swtrig:
  description: Software Trigger Register.
  fields:
  - name: swt
    description: Software Trigger 0 Event.
    bit_offset: 0
    bit_size: 1
    array:
      len: 4
      stride: 1
  bit_size: 32
  reset_value: 0
fieldset/Tctrl:
  description: Trigger Control Register.
  fields:
  - name: hten
    description: Trigger Enable.
    bit_offset: 0
    bit_size: 1
  - name: tpri
    description: Trigger Priority Setting.
    bit_offset: 8
    bit_size: 2
    enum: Tpri
  - name: rsync
    description: Trigger Resync.
    bit_offset: 15
    bit_size: 1
  - name: tdly
    description: Trigger Delay Select.
    bit_offset: 16
    bit_size: 4
  - name: tsync
    description: Trigger Synchronous Select.
    bit_offset: 23
    bit_size: 1
  - name: tcmd
    description: Trigger Command Select.
    bit_offset: 24
    bit_size: 3
    enum: Tcmd
  bit_size: 32
  reset_value: 0
fieldset/Tstat:
  description: Trigger Status Register.
  fields:
  - name: texc_num
    description: Trigger Exception Number.
    bit_offset: 0
    bit_size: 4
    enum: TexcNum
  - name: tcomp_flag
    description: Trigger Completion Flag.
    bit_offset: 16
    bit_size: 4
    enum: TcompFlag
  bit_size: 32
  reset_value: 0
fieldset/Verid:
  description: Version ID Register.
  fields:
  - name: res
    description: "Resolution.\n\nRaw bit values: false (0) = Max13Bit: Up to 12-bit single ended resolution supported (and 13-bit differential resolution if VERID[DIFFEN] = 1b).; true (1) = Max16Bit: Up to 16-bit single ended resolution supported (and 16-bit differential resolution if VERID[DIFFEN] = 1b)."
    bit_offset: 0
    bit_size: 1
  - name: diffen
    description: "Differential Supported.\n\nRaw bit values: false (0) = DifferentialNotSupported: Differential operation not supported.; true (1) = DifferentialSupported: Differential operation supported."
    bit_offset: 1
    bit_size: 1
  - name: mvi
    description: "Multi Vref Implemented.\n\nRaw bit values: false (0) = MultipleRefNotSupported: Single voltage reference high (VREFH) input supported.; true (1) = MultipleRefSupported: Multiple voltage reference high (VREFH) inputs supported."
    bit_offset: 3
    bit_size: 1
  - name: csw
    description: Channel Scale Width.
    bit_offset: 4
    bit_size: 3
    enum: Csw
  - name: vr1rngi
    description: "Voltage Reference 1 Range Control Bit Implemented.\n\nRaw bit values: false (0) = Ref1FixedVoltageRange: Range control not required. CFG[VREF1RNG] is not implemented.; true (1) = Ref1SelectableVoltageRange: Range control required. CFG[VREF1RNG] is implemented."
    bit_offset: 8
    bit_size: 1
  - name: iadcki
    description: "Internal ADC Clock Implemented.\n\nRaw bit values: false (0) = InternalClkNotAvailable: Internal clock source not implemented.; true (1) = InternalClkAvailable: Internal clock source (and CFG[ADCKEN]) implemented."
    bit_offset: 9
    bit_size: 1
  - name: calofsi
    description: "Calibration Function Implemented.\n\nRaw bit values: false (0) = CalFunctionNotAvailable: Calibration Not Implemented.; true (1) = CalFunctionAvailable: Calibration Implemented."
    bit_offset: 10
    bit_size: 1
  - name: num_sec
    description: "Number of Single Ended Outputs Supported.\n\nRaw bit values: false (0) = SingleConvertor: This design supports one single ended conversion at a time.; true (1) = DualConvertor: This design supports two simultaneous single ended conversions."
    bit_offset: 11
    bit_size: 1
  - name: num_fifo
    description: Number of FIFOs.
    bit_offset: 12
    bit_size: 3
    enum: NumFifo
  - name: minor
    description: Minor Version Number.
    bit_offset: 16
    bit_size: 8
  - name: major
    description: Major Version Number.
    bit_offset: 24
    bit_size: 8
  bit_size: 32
  reset_value: 33559561
enum/Avgs:
  bit_size: 4
  variants:
  - name: NoAverage
    description: Single conversion.
    value: 0
  - name: Average2
    description: 2 conversions averaged.
    value: 1
  - name: Average4
    description: 4 conversions averaged.
    value: 2
  - name: Average8
    description: 8 conversions averaged.
    value: 3
  - name: Average16
    description: 16 conversions averaged.
    value: 4
  - name: Average32
    description: 32 conversions averaged.
    value: 5
  - name: Average64
    description: 64 conversions averaged.
    value: 6
  - name: Average128
    description: 128 conversions averaged.
    value: 7
  - name: Average256
    description: 256 conversions averaged.
    value: 8
  - name: Average512
    description: 512 conversions averaged.
    value: 9
  - name: Average1024
    description: 1024 conversions averaged.
    value: 10
enum/Cmdact:
  bit_size: 3
  variants:
  - name: NoCommandActive
    description: No command is currently in progress.
    value: 0
  - name: Command1
    description: Command 1 currently being executed.
    value: 1
  - name: Command2
    description: Command 2 currently being executed.
    value: 2
  - name: CommandX3
    description: Associated command number is currently being executed.
    value: 3
  - name: CommandX4
    description: Associated command number is currently being executed.
    value: 4
  - name: CommandX5
    description: Associated command number is currently being executed.
    value: 5
  - name: CommandX6
    description: Associated command number is currently being executed.
    value: 6
  - name: CommandX7
    description: Associated command number is currently being executed.
    value: 7
enum/Cmdsrc:
  bit_size: 3
  variants:
  - name: NotValid
    description: Not a valid value CMDSRC value for a dataword in RESFIFO. 0x0 is only found in initial FIFO state
      prior to an ADC conversion result dataword being stored to a RESFIFO buffer.
    value: 0
  - name: Cmd1
    description: CMD1 buffer used as control settings for this conversion.
    value: 1
  - name: CorrespondingCmd2
    description: Corresponding command buffer used as control settings for this conversion.
    value: 2
  - name: CorrespondingCmd3
    description: Corresponding command buffer used as control settings for this conversion.
    value: 3
  - name: CorrespondingCmd4
    description: Corresponding command buffer used as control settings for this conversion.
    value: 4
  - name: CorrespondingCmd5
    description: Corresponding command buffer used as control settings for this conversion.
    value: 5
  - name: CorrespondingCmd6
    description: Corresponding command buffer used as control settings for this conversion.
    value: 6
  - name: Cmd7
    description: CMD7 buffer used as control settings for this conversion.
    value: 7
enum/Cmpen:
  bit_size: 2
  variants:
  - name: DisabledAlwaysStoreResult
    description: Compare disabled.
    value: 0
  - name: CompareResultStoreIfTrue
    description: Compare enabled. Store on true.
    value: 2
  - name: CompareResultKeepConvertingUntilTrueStoreIfTrue
    description: Compare enabled. Repeat channel acquisition (sample/convert/compare) until true.
    value: 3
enum/Csw:
  bit_size: 3
  variants:
  - name: CscaleNotSupported
    description: Channel scaling not supported.
    value: 0
  - name: BitWidth1
    description: Channel scaling supported. 1-bit CSCALE control field.
    value: 1
  - name: BitWidth6
    description: Channel scaling supported. 6-bit CSCALE control field.
    value: 6
enum/Ctype:
  bit_size: 2
  variants:
  - name: SingleEndedASideChannel
    description: Single-Ended Mode. Only A side channel is converted.
    value: 0
enum/Fifosize:
  bit_size: 8
  variants:
  - name: Entries2
    description: Result FIFO depth = 2 dataword.
    value: 1
  - name: Entries4
    description: Result FIFO depth = 4 datawords.
    value: 4
  - name: Entries8
    description: Result FIFO depth = 8 datawords.
    value: 8
  - name: Entries16
    description: Result FIFO depth = 16 datawords.
    value: 16
  - name: Entries32
    description: Result FIFO depth = 32 datawords.
    value: 32
  - name: Entries64
    description: Result FIFO depth = 64 datawords.
    value: 64
enum/Loop:
