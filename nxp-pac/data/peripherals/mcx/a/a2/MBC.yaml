# MCXAP144M240F61RM Rev. 2, sections51.1/51.5.1. Only four MEM2 blocks exist.
includes:
  - ../../common/MBC.yaml
block/Mbc:
  description: Memory block checker. Word writes only. GLIKEY index15 protects MBC registers. Choosing a locked global policy locks the corresponding block selector until reset. Chip-specific flash accesses are SecureUser; the manual advises not setting NSE.
  items:
  - name: mbc0_mem0_glbcfg
    description: MBC Global Configuration Register.
    byte_offset: 0
    access: Read
    fieldset: Mem0Glbcfg
  - name: mbc0_mem1_glbcfg
    description: MBC Global Configuration Register.
    byte_offset: 4
    access: Read
    fieldset: Mem1Glbcfg
  - name: mbc0_mem2_glbcfg
    description: MBC Global Configuration Register.
    byte_offset: 8
    access: Read
    fieldset: Mem2Glbcfg
  - name: mbc0_mem3_glbcfg
    description: MBC Global Configuration Register.
    byte_offset: 12
    fieldset: Mem3Glbcfg
  - name: mbc0_memn_glbac0
    description: MBC Global Access Control.
    byte_offset: 32
    fieldset: MemnGlbac0
  - name: mbc0_memn_glbac1
    description: 'Effectively read-only: detailed manual says this policy is not writable despite generic map RW.'
    byte_offset: 36
    fieldset: MemnGlbac1
    access: Read
  - name: mbc0_memn_glbac2
    description: 'Effectively read-only: detailed manual says this policy is not writable despite generic map RW.'
    byte_offset: 40
    fieldset: MemnGlbac2
    access: Read
  - name: mbc0_memn_glbac3
    description: 'Effectively read-only: detailed manual says this policy is not writable despite generic map RW.'
    byte_offset: 44
    fieldset: MemnGlbac3
    access: Read
  - name: mbc0_memn_glbac4
    description: MBC Global Access Control.
    byte_offset: 48
    fieldset: MemnGlbac4
  - name: mbc0_memn_glbac5
    description: MBC Global Access Control.
    byte_offset: 52
    fieldset: MemnGlbac5
  - name: mbc0_memn_glbac6
    description: 'Effectively read-only: detailed manual says this policy is not writable despite generic map RW.'
    byte_offset: 56
    fieldset: MemnGlbac6
    access: Read
  - name: mbc0_memn_glbac7
    description: 'Effectively read-only: detailed manual says this policy is not writable despite generic map RW.'
    byte_offset: 60
    fieldset: MemnGlbac7
    access: Read
  - name: mbc0_dom0_mem0_blk_cfg_wn
    description: MBC Memory Block Configuration Word.
    array:
      len: 16
      stride: 4
    byte_offset: 64
    fieldset: MemnBlkCfgW
  - name: mbc0_dom0_mem1_blk_cfg_w0
    description: MBC Memory Block Configuration Word.
    byte_offset: 384
    fieldset: MemnBlkCfgW
  - name: mbc0_dom0_mem1_blk_cfg_w1
    description: MBC Memory Block Configuration Word.
    byte_offset: 388
    fieldset: MemnBlkCfgW
  - name: mbc0_dom0_mem2_blk_cfg_w0
    description: MBC Memory Block Configuration Word.
    byte_offset: 424
    fieldset: Mem2Block
