# MCXAP144M240F61SRM Rev. 2, chapter13. Detailed internal-source routing is gated to its covered devices; remaining A2 pin/map reuse is corroborated by XML and the product data sheet.
block/Tdet0:
  items:
  - name: cr
    byte_offset: 16
    fieldset: Cr
  - name: sr
    byte_offset: 20
    fieldset: Sr
    description: Conditional W1C flags. Clear pin flags only after expected pin/filter state returns; internal flags only after source negates. Clear enabled tamper-input flags before DTF; DTF also requires TAF set. TAF clears by software only with DTF clear. Table reset conflicts with VBAT/software-reset prose.
  - name: lr
    byte_offset: 24
    fieldset: Lr
    description: Clearing lock bits blocks writes until VBAT POR or TDET software reset. Locked writes are ignored without bus error. Locking CR disables software reset; locking LR prevents future lock updates.
  - name: ier
    byte_offset: 28
    fieldset: Ier
  - name: tsr
    byte_offset: 32
    fieldset: Tsr
    description: Reads the captured timestamp (zero when DTF is clear). Any write is tampering and sets DTF; not an ordinary writable clock value.
  - name: ter
    byte_offset: 36
    fieldset: Ter
  - name: ppr
    byte_offset: 44
    fieldset: Ppr
  - name: pgfr
    byte_offset: 64
    fieldset: Pgfr
    array:
      len: 6
      stride: 4
  description: Digital tamper. Word writes only. TSR writes create tamper events. SR table defaults contradict the reset-condition prose and are not confirmed post-reset observations. No device operations are performed by this model.
enum/CrSwr:
  bit_size: 1
  variants:
  - name: NoEffect
    description: No effect
    value: 0
  - name: SwReset
    description: Perform a software reset
    value: 1
enum/CrDen:
  bit_size: 1
  variants:
  - name: Disable
    description: Disables TDET clock and prescaler
    value: 0
  - name: Enable
    description: Enables TDET clock and prescaler
    value: 1
enum/CrTfsr:
  bit_size: 1
  variants:
  - name: NoReset
    description: Do not force chip reset
    value: 0
  - name: Reset
    description: Force chip reset
    value: 1
enum/CrUm:
  bit_size: 1
  variants:
  - name: NoEffect
    description: No effect
    value: 0
  - name: ClearInts
    description: Allows the clearing of interrupts
    value: 1
enum/CrDistam:
  bit_size: 1
  variants:
  - name: NoEffect
    description: No effect
    value: 0
  - name: AutoDis
    description: Automatically disables the prescaler after tamper detection
    value: 1
fieldset/Cr:
  description: Control
  bit_size: 32
  reset_value: 0
  fields:
  - name: swr
    description: 'Software reset is not self-clearing: it must be released by writing zero. Locking CR disables software reset. No reset operation is performed by this model.'
    bit_offset: 0
    bit_size: 1
    enum: CrSwr
  - name: den
    description: Enable before enabling any glitch filter; disable only after disabling all filters.
    bit_offset: 1
    bit_size: 1
    enum: CrDen
  - name: tfsr
    description: Tamper Force System Reset
    bit_offset: 2
    bit_size: 1
    enum: CrTfsr
  - name: um
    description: Permits clearing locked SR tamper flags only while DTF=0 and only for sources enabled for interrupt (IER=1) with corresponding tamper enable clear (TER=0).
    bit_offset: 3
    bit_size: 1
    enum: CrUm
  - name: distam
    description: Disable Prescaler On Tamper
    bit_offset: 8
    bit_size: 1
    enum: CrDistam
  - name: dpr
    description: Prescaler initial/current value. Writes require DEN=0.
    bit_offset: 17
    bit_size: 15
