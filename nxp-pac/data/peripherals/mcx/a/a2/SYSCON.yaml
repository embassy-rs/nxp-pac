enum/UdfHidden:
  bit_size: 4
  variants:
  - name: UdfHidden
    description: Enable the access of UDF register from APB bus. All other value, disable the read/write of UDF register from UDF APB bus.
    value: 10
enum/UidHidden:
  bit_size: 4
  variants:
  - name: UidHidden
    description: Enable the access of UID[127:0] register. All other value, disable the read/write of UID[127:0] register.
    value: 10
fieldset/ElsUdf:
  description: UDF Control.
  fields:
  - name: key_sel
    description: UDF KEY Select.
    bit_offset: 0
    bit_size: 2
    enum: KeySel
  - name: uid_hidden
    description: UID register hidden control. Write values other than 1010b, locked the write of UID_HIDDEN until a system reset.
    bit_offset: 24
    bit_size: 4
    enum: UidHidden
  - name: udf_hidden
    description: UDF register hidden control. Write values other than 1010b, locked the write of UDF_HIDDEN until a system reset.
    bit_offset: 28
    bit_size: 4
    enum: UdfHidden
