# MCXAP144M240F61SRM Rev. 2, chapter13. Detailed internal-source routing is gated to its covered devices; remaining A2 pin/map reuse is corroborated by XML and the product data sheet.
block/Tdet:
  items:
  - name: cr
    byte_offset: 16
    fieldset: Cr
  - name: sr
    byte_offset: 20
    fieldset: Sr
    description: Conditional W1C flags. Clear pin flags only after expected pin/filter state returns; internal flags only after source negates. Clear enabled tamper-input flags before DTF; DTF also requires TAF set. TAF clears by software only with DTF clear. Table reset conflicts with VBAT/software-reset prose.
  - name: lr
    byte_offset: 24
    fieldset: Lr
    description: Clearing lock bits blocks writes until VBAT POR or TDET software reset. Locked writes are ignored without bus error. Locking CR disables software reset; locking LR prevents future lock updates.
  - name: ier
    byte_offset: 28
    fieldset: Ier
  - name: tsr
    byte_offset: 32
    fieldset: Tsr
    description: Reads the captured timestamp (zero when DTF is clear). Any write is tampering and sets DTF; not an ordinary writable clock value.
  - name: ter
    byte_offset: 36
    fieldset: Ter
  - name: ppr
    byte_offset: 44
    fieldset: Ppr
  - name: pgfr
    byte_offset: 64
    fieldset: Pgfr
    array:
      len: 6
      stride: 4
  description: Digital tamper. Word writes only. TSR writes create tamper events. SR table defaults contradict the reset-condition prose and are not confirmed post-reset observations. No device operations are performed by this model.
fieldset/Cr:
  description: Control
  bit_size: 32
  reset_value: 0
  fields:
  - name: swr
    description: "Software reset is not self-clearing: it must be released by writing zero. Locking CR disables software reset. No reset operation is performed by this model.\n\nRaw bit values: false (0) = NoEffect: No effect; true (1) = SwReset: Perform a software reset"
    bit_offset: 0
    bit_size: 1
  - name: den
    description: "Enable before enabling any glitch filter; disable only after disabling all filters.\n\nRaw bit values: false (0) = Disable: Disables TDET clock and prescaler; true (1) = Enable: Enables TDET clock and prescaler"
    bit_offset: 1
    bit_size: 1
  - name: tfsr
    description: "Tamper Force System Reset\n\nRaw bit values: false (0) = NoReset: Do not force chip reset; true (1) = Reset: Force chip reset"
    bit_offset: 2
    bit_size: 1
  - name: um
    description: "Permits clearing locked SR tamper flags only while DTF=0 and only for sources enabled for interrupt (IER=1) with corresponding tamper enable clear (TER=0).\n\nRaw bit values: false (0) = NoEffect: No effect; true (1) = ClearInts: Allows the clearing of interrupts"
    bit_offset: 3
    bit_size: 1
  - name: distam
    description: "Disable Prescaler On Tamper\n\nRaw bit values: false (0) = NoEffect: No effect; true (1) = AutoDis: Automatically disables the prescaler after tamper detection"
    bit_offset: 8
    bit_size: 1
  - name: dpr
    description: Prescaler initial/current value. Writes require DEN=0.
    bit_offset: 17
    bit_size: 15
fieldset/Sr:
  description: Status
  bit_size: 32
  reset_value: 0
  fields:
  - name: dtf
    description: "Tamper flag. Conditional W1C only when TAF=1. Reset-condition prose says set on VBAT/software reset, conflicting with table defaults.\n\nRaw bit values: false (0) = NoDet: TDET tampering not detected; true (1) = Det: TDET tampering detected"
    bit_offset: 0
    bit_size: 1
  - name: taf
    description: "Tamper acknowledged by chip reset. Software may W1C only while DTF=0. Table and prose both describe TAF clear on reset; the A2 reset conflict concerns DTF instead.\n\nRaw bit values: false (0) = NotOccur: Digital Tamper Flag (SR[DTF]) is clear or chip reset has not occurred after Digital Tamper Flag (SR[DTF]) was set.; true (1) = Occur: Chip reset has occurred after Digital Tamper Flag (SR[DTF]) was set."
    bit_offset: 1
    bit_size: 1
  - name: tif4
    description: "Tamper Input n Flag W1C only after the originating source negates.\n\nRaw bit values: false (0) = NoDet: On-chip tamper not detected; true (1) = Det: On-chip tamper detected"
    bit_offset: 6
    bit_size: 1
    only_in: ^MCXA(255|256|265|266)$
  - name: tif5
    description: "Tamper Input n Flag W1C only after the originating source negates.\n\nRaw bit values: false (0) = NoDet: On-chip tamper not detected; true (1) = Det: On-chip tamper detected"
    bit_offset: 7
    bit_size: 1
    only_in: ^MCXA(255|256|265|266)$
  - name: tif6
    description: "Tamper Input n Flag W1C only after the originating source negates.\n\nRaw bit values: false (0) = NoDet: On-chip tamper not detected; true (1) = Det: On-chip tamper detected"
    bit_offset: 8
    bit_size: 1
    only_in: ^MCXA(255|256|265|266)$
  - name: tif7
    description: "Tamper Input n Flag W1C only after the originating source negates.\n\nRaw bit values: false (0) = NoDet: On-chip tamper not detected; true (1) = Det: On-chip tamper detected"
    bit_offset: 9
    bit_size: 1
    only_in: ^MCXA(255|256|265|266)$
  - name: tif9
    description: "Tamper Input n Flag W1C only after the originating source negates.\n\nRaw bit values: false (0) = NoDet: On-chip tamper not detected; true (1) = Det: On-chip tamper detected"
    bit_offset: 11
    bit_size: 1
    only_in: ^MCXA(255|256|265|266)$
  - name: tif10
    description: "Tamper Input n Flag W1C only after the originating source negates.\n\nRaw bit values: false (0) = NoDet: On-chip tamper not detected; true (1) = Det: On-chip tamper detected"
    bit_offset: 12
    bit_size: 1
    only_in: ^MCXA(255|256|265|266)$
  - name: tpf0
    description: "Tamper Pin n Flag W1C only after pin equals expected level and filter output updates.\n\nRaw bit values: false (0) = NoDet: Pin tamper not detected; true (1) = Det: Pin tamper detected"
    bit_offset: 16
    bit_size: 1
  - name: tpf1
    description: "Tamper Pin n Flag W1C only after pin equals expected level and filter output updates.\n\nRaw bit values: false (0) = NoDet: Pin tamper not detected; true (1) = Det: Pin tamper detected"
    bit_offset: 17
    bit_size: 1
  - name: tpf2
    description: "Tamper Pin n Flag W1C only after pin equals expected level and filter output updates.\n\nRaw bit values: false (0) = NoDet: Pin tamper not detected; true (1) = Det: Pin tamper detected"
    bit_offset: 18
    bit_size: 1
  - name: tpf3
    description: "Tamper Pin n Flag W1C only after pin equals expected level and filter output updates.\n\nRaw bit values: false (0) = NoDet: Pin tamper not detected; true (1) = Det: Pin tamper detected"
    bit_offset: 19
    bit_size: 1
  - name: tpf4
    description: "Tamper Pin n Flag W1C only after pin equals expected level and filter output updates.\n\nRaw bit values: false (0) = NoDet: Pin tamper not detected; true (1) = Det: Pin tamper detected"
    bit_offset: 20
    bit_size: 1
  - name: tpf5
    description: "Tamper Pin n Flag W1C only after pin equals expected level and filter output updates.\n\nRaw bit values: false (0) = NoDet: Pin tamper not detected; true (1) = Det: Pin tamper detected"
    bit_offset: 21
    bit_size: 1
