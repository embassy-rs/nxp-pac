  - name: tpe
    description: "Tamper Pull Enable\n\nRaw bit values: false (0) = Disable: Disables; true (1) = Enable: Enables"
    bit_offset: 24
    bit_size: 1
  - name: tps
    description: "Pull state relative to PPR polarity: zero asserts and one negates; not a universal pull-up/down selection.\n\nRaw bit values: false (0) = Assert: Asserts; true (1) = Negate: Negates"
    bit_offset: 25
