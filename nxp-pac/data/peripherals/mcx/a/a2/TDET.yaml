enum/PgfrTpsw:
  bit_size: 2
  variants:
  - name: Disable
    description: Continuous monitoring, pin sampling disabled
    value: 0
  - name: Cycles2
    description: 2 cycles for pull enable and 1 cycle for input buffer enable
    value: 1
  - name: Cycles4
    description: 4 cycles for pull enable and 2 cycles for input buffer enable
    value: 2
  - name: Cycles8
    description: 8 cycles for pull enable and 4 cycles for input buffer enable
    value: 3
enum/PgfrTpsf:
  bit_size: 2
  variants:
  - name: Cycles8
    description: Every 8 cycles
    value: 0
  - name: Cycles32
    description: Every 32 cycles
    value: 1
  - name: Cycles128
    description: Every 128 cycles
    value: 2
  - name: Cycles512
    description: Every 512 cycles
    value: 3
fieldset/Pgfr:
  description: Pin Glitch Filter
  bit_size: 32
  reset_value: 0
  fields:
  - name: gfw
    description: 'Filter width: 2*(GFW+1) clock edges,2..128. Do not change while filter enabled.'
    bit_offset: 0
    bit_size: 6
  - name: gfp
    description: "Filter clock. Do not change while filter enabled. S61-covered A255/256/265/266 use256Hz prescaler or16.384kHz source; detailed applicability to A175/176/185/186 is not established by that SRM.\n\nRaw bit values: false (0) = Prescaler; true (1) = Clock"
    bit_offset: 6
    bit_size: 1
  - name: gfe
    description: "Filter enable. Do not change while the corresponding tamper pin is enabled.\n\nRaw bit values: false (0) = Bypass: Bypasses; true (1) = Enable: Enables"
    bit_offset: 7
    bit_size: 1
