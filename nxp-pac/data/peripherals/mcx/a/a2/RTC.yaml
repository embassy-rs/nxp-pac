block/Rtc:
  description: RTC.
  items:
  - name: tsr
    description: RTC Time Seconds.
    byte_offset: 0
    fieldset: Tsr
  - name: tpr
    description: RTC Time Prescaler.
    byte_offset: 4
    fieldset: Tpr
  - name: tar
    description: RTC Time Alarm.
    byte_offset: 8
    fieldset: Tar
  - name: tcr
    description: RTC Time Compensation.
    byte_offset: 12
    fieldset: Tcr
  - name: cr
    description: RTC Control.
    byte_offset: 16
    fieldset: Cr
  - name: sr
    description: RTC Status.
    byte_offset: 20
    fieldset: Sr
  - name: lr
    description: RTC Lock.
    byte_offset: 24
    fieldset: Lr
  - name: ier
    description: RTC Interrupt Enable.
    byte_offset: 28
    fieldset: Ier
fieldset/Cr:
  description: RTC Control.
  fields:
  - name: swr
    description: "Software Reset.\n\nRaw bit values: false (0) = Swr0: No effect.; true (1) = Swr1: Resets all RTC registers except for the SWR bit . The SWR bit is cleared by POR and by software explicitly clearing it."
    bit_offset: 0
    bit_size: 1
  - name: um
    description: "Update Mode.\n\nRaw bit values: false (0) = Um0: Registers cannot be written when locked.; true (1) = Um1: Registers can be written when locked under limited conditions."
    bit_offset: 3
    bit_size: 1
  - name: lpos
    description: "LPO Select.\n\nRaw bit values: false (0) = Lpos0: RTC prescaler increments using 32.768 kHz clock.; true (1) = Lpos1: RTC prescaler increments using 1 kHz LPO, bits [4:0] of the prescaler are ignored."
    bit_offset: 7
    bit_size: 1
fieldset/Ier:
  description: RTC Interrupt Enable.
  fields:
  - name: tiie
    description: Time Invalid Interrupt Enable.
    bit_offset: 0
    bit_size: 1
  - name: toie
    description: Time Overflow Interrupt Enable.
    bit_offset: 1
    bit_size: 1
  - name: taie
    description: Time Alarm Interrupt Enable.
    bit_offset: 2
    bit_size: 1
  - name: tsie
    description: Time Seconds Interrupt Enable.
    bit_offset: 4
    bit_size: 1
  - name: tsic
    description: Timer Seconds Interrupt Configuration.
    bit_offset: 16
    bit_size: 3
    enum: Tsic
fieldset/Lr:
  description: RTC Lock.
  fields:
  - name: tcl
    description: "Time Compensation Lock.\n\nRaw bit values: false (0) = Tcl0: Time Compensation Register is locked and writes are ignored.; true (1) = Tcl1: Time Compensation Register is not locked and writes complete as normal."
    bit_offset: 3
    bit_size: 1
  - name: crl
    description: "Control Register Lock.\n\nRaw bit values: false (0) = Crl0: Control Register is locked and writes are ignored.; true (1) = Crl1: Control Register is not locked and writes complete as normal."
    bit_offset: 4
    bit_size: 1
  - name: srl
    description: "Status Register Lock.\n\nRaw bit values: false (0) = Srl0: Status Register is locked and writes are ignored.; true (1) = Srl1: Status Register is not locked and writes complete as normal."
    bit_offset: 5
    bit_size: 1
  - name: lrl
    description: "Lock Register Lock.\n\nRaw bit values: false (0) = Lrl0: Lock Register is locked and writes are ignored.; true (1) = Lrl1: Lock Register is not locked and writes complete as normal."
    bit_offset: 6
    bit_size: 1
fieldset/Sr:
  description: RTC Status.
  fields:
  - name: tif
    description: Time Invalid Flag.
    bit_offset: 0
    bit_size: 1
  - name: tof
    description: Time Overflow Flag.
    bit_offset: 1
    bit_size: 1
  - name: taf
    description: Time Alarm Flag.
    bit_offset: 2
    bit_size: 1
  - name: tce
    description: Time Counter Enable.
    bit_offset: 4
    bit_size: 1
fieldset/Tar:
  description: RTC Time Alarm.
  fields:
  - name: tar
    description: Time Alarm Register.
    bit_offset: 0
    bit_size: 32
fieldset/Tcr:
  description: RTC Time Compensation.
  fields:
  - name: tcr
    description: Time Compensation Register.
    bit_offset: 0
    bit_size: 8
  - name: cir
    description: Compensation Interval Register.
    bit_offset: 8
    bit_size: 8
  - name: tcv
    description: Time Compensation Value.
    bit_offset: 16
    bit_size: 8
  - name: cic
    description: Compensation Interval Counter.
    bit_offset: 24
    bit_size: 8
fieldset/Tpr:
  description: RTC Time Prescaler.
  fields:
  - name: tpr
    description: Time Prescaler Register.
    bit_offset: 0
    bit_size: 16
fieldset/Tsr:
  description: RTC Time Seconds.
  fields:
  - name: tsr
    description: Time Seconds Register.
    bit_offset: 0
    bit_size: 32
enum/Tsic:
  bit_size: 3
  variants:
  - name: Tsic0
    description: 1 Hz.
    value: 0
  - name: Tsic1
    description: 2 Hz.
    value: 1
  - name: Tsic2
    description: 4 Hz.
    value: 2
  - name: Tsic3
    description: 8 Hz.
    value: 3
  - name: Tsic4
    description: 16 Hz.
    value: 4
  - name: Tsic5
    description: 32 Hz.
    value: 5
  - name: Tsic6
    description: 64 Hz.
    value: 6
  - name: Tsic7
    description: 128 Hz.
    value: 7
