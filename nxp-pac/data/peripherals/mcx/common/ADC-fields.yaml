# Exact enum definitions and field layouts shared by MCXA and MCXN.
# Shared from mcx/a/common/ADC.yaml; source comments and software defaults are retained.
# MCXN source revisions and hashes remain on the register-block entries.
fieldset/Cv:
  only_in: '^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$'
  description: Compare Value Register.
  fields:
  - name: cvl
    description: Compare Value Low.
    bit_offset: 0
    bit_size: 16
  - name: cvh
    description: Compare Value High.
    bit_offset: 16
    bit_size: 16
enum/CalAvgs:
  only_in: '^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$'
  bit_size: 4
  variants:
  - name: NoAverage
    description: Single conversion.
    value: 0
  - name: Average2
    description: 2 conversions averaged.
    value: 1
  - name: Average4
    description: 4 conversions averaged.
    value: 2
  - name: Average8
    description: 8 conversions averaged.
    value: 3
  - name: Average16
    description: 16 conversions averaged.
    value: 4
  - name: Average32
    description: 32 conversions averaged.
    value: 5
  - name: Average64
    description: 64 conversions averaged.
    value: 6
  - name: Average128
    description: 128 conversions averaged.
    value: 7
  - name: Average256
    description: 256 conversions averaged.
    value: 8
  - name: Average512
    description: 512 conversions averaged.
    value: 9
  - name: Average1024
    description: 1024 conversions averaged.
    value: 10
enum/Trgact:
  only_in: '^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$'
  bit_size: 2
  variants:
  - name: Trig0
    description: Command (sequence) associated with Trigger 0 currently being executed.
    value: 0
  - name: Trig1
    description: Command (sequence) associated with Trigger 1 currently being executed.
    value: 1
  - name: Trig2
    description: Command (sequence) associated with Trigger 2 currently being executed.
    value: 2
  - name: Trig3
    description: Command (sequence) associated with Trigger 3 currently being executed.
    value: 3
