# MCXN23XRM Rev. 4, 39.6.1; MCXNP184M150F70RM Rev. 7, 53.6.1.
# N OSEVENT_CTRL[3] is reserved; A retains DEBUG_EN and reset 8.
block/Ostimer:
  description: OS Event Timer.
  items:
  - name: evtimerl
    only_in: '^MCXA.*$'
    description: EVTIMER Low.
    byte_offset: 0
    access: Read
    fieldset: Evtimerl
  - name: evtimerl
    only_in: '^MCXN(235|236|247|526|527|536|537|546|547|946|947)$'
    description: 'EVTIMER Low. The central 42-bit counter is Gray encoded and asynchronous to the bus. Split reads may straddle rollover; the documented adjacent-value guarantee requires a bus clock at least twice the timer clock, or the same LP oscillator clock. The shared EVTimer resets only on POR or software reset. Software reset means a complete module reset, not CPU SYSRESETREQ.'
    byte_offset: 0
    access: Read
    fieldset: Evtimerl
  - name: evtimerh
    description: EVTIMER High.
    byte_offset: 4
    access: Read
    fieldset: Evtimerh
  - name: capture_l
    only_in: '^MCXA.*$'
    description: Local Capture Low for CPU.
    byte_offset: 8
    access: Read
    fieldset: CaptureL
  - name: capture_l
    only_in: '^MCXN(235|236|247|526|527|536|537|546|547|946|947)$'
    description: 'Local Capture Low for CPU. Gray encoded. Do not issue a new capture between reading CAPTURE_L and CAPTURE_H. Each CPU reads its own local capture at the same addresses. The capture pair resets on system reset, not module software reset.'
    byte_offset: 8
    access: Read
    fieldset: CaptureL
  - name: capture_h
    only_in: '^MCXA.*$'
    description: Local Capture High for CPU.
    byte_offset: 12
    access: Read
    fieldset: CaptureH
  - name: capture_h
    only_in: '^MCXN(235|236|247|526|527|536|537|546|547|946|947)$'
    description: 'Local Capture High for CPU. Gray encoded. Do not issue a new capture between reading CAPTURE_L and CAPTURE_H.'
    byte_offset: 12
    access: Read
    fieldset: CaptureH
  - name: match_l
    only_in: '^MCXA.*$'
    description: Local Match Low for CPU.
    byte_offset: 16
    fieldset: MatchL
  - name: match_l
    only_in: '^MCXN(235|236|247|526|527|536|537|546|547|946|947)$'
    description: 'Local Match Low for CPU. Write Gray-encoded MATCH_L before MATCH_H. Do not start another pair until MATCH_WR_RDY is low (transfer complete). Each CPU accesses its own match pair at the same addresses. The match pair resets on system reset, not module software reset.'
    byte_offset: 16
    fieldset: MatchLN
  - name: match_h
    description: Local Match High for CPU.
    byte_offset: 20
    fieldset: MatchH
  - name: osevent_ctrl
    only_in: '^MCXA.*$'
    description: OSTIMER Control for CPU.
    byte_offset: 28
    fieldset: OseventCtrl
  - name: osevent_ctrl
    only_in: '^MCXN(235|236|247|526|527|536|537|546|547|946|947)$'
    description: 'OSTIMER Control for CPU. Each CPU reads its own local state at the same address. Clear OSTIMER_INTRFLAG by writing 1 before programming a new match pair. System reset includes RESETn, CPU SYSRESETREQ, POR and internal low-voltage resets. OSEVENT_CTRL resets on system or module software reset, except MATCH_WR_RDY, which resets only on system reset.'
    byte_offset: 28
    fieldset: OseventCtrlN
fieldset/CaptureH:
  description: Local Capture High for CPU.
  fields:
  - name: capture_value
    description: EVTimer Capture Value.
    bit_offset: 0
    bit_size: 10
fieldset/CaptureL:
  description: Local Capture Low for CPU.
  fields:
  - name: capture_value
    description: EVTimer Capture Value.
    bit_offset: 0
    bit_size: 32
fieldset/Evtimerh:
  description: EVTIMER High.
  fields:
  - name: evtimer_count_value
    description: EVTimer Count Value.
    bit_offset: 0
    bit_size: 10
fieldset/Evtimerl:
  description: EVTIMER Low.
  fields:
  - name: evtimer_count_value
    description: EVTimer Count Value.
    bit_offset: 0
    bit_size: 32
fieldset/MatchH:
  description: Local Match High for CPU.
  # The N diagram resets all 32 bits to 1, including reserved bits 31:10.
  reset_value: 0xffffffff
  fields:
  - name: match_value
    description: EVTimer Match Value.
    bit_offset: 0
    bit_size: 10
# Preserve A's implicit MatchL constructor default rather than filling its gap.
fieldset/MatchL:
  only_in: '^MCXA.*$'
  description: Local Match Low for CPU.
  fields:
  - name: match_value
    description: EVTimer Match Value.
    bit_offset: 0
    bit_size: 32
fieldset/MatchLN:
  only_in: '^MCXN(235|236|247|526|527|536|537|546|547|946|947)$'
  description: Local Match Low for CPU.
  reset_value: 0xffffffff
  fields:
  - name: match_value
    description: EVTimer Match Value.
    bit_offset: 0
    bit_size: 32
fieldset/OseventCtrl:
  only_in: '^MCXA.*$'
  description: OSTIMER Control for CPU.
  reset_value: 0x8
  fields:
  - name: ostimer_intrflag
    description: Interrupt Flag.
    bit_offset: 0
    bit_size: 1
  - name: ostimer_intena
    description: Interrupt or Wake-Up Request.
    bit_offset: 1
    bit_size: 1
  - name: match_wr_rdy
    description: EVTimer Match Write Ready.
    bit_offset: 2
    bit_size: 1
  - name: debug_en
    description: Enables OSTIMER in Debug mode.
    bit_offset: 3
    bit_size: 1
fieldset/OseventCtrlN:
  only_in: '^MCXN(235|236|247|526|527|536|537|546|547|946|947)$'
  description: OSTIMER Control for CPU.
  reset_value: 0
  fields:
  - name: ostimer_intrflag
    description: Interrupt Flag. Write 1 to clear before writing a new match value.
    bit_offset: 0
    bit_size: 1
  - name: ostimer_intena
    description: Interrupt or Wake-Up Request. Set to enable requests.
    bit_offset: 1
    bit_size: 1
  - name: match_wr_rdy
    description: EVTimer Match Write Ready. Low means safe to reload the match registers after the previous transfer completes. Resets only on system reset, not module software reset.
    bit_offset: 2
    bit_size: 1
