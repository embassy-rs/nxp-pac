# Exact enum definitions and field layouts shared by MCXA and MCXN.
# Availability retains family-specific types, encodings and software defaults.
# Shared from mcx/a/common/CAN.yaml and the native MCXN imports.
# Native MCXN source revisions and hashes remain on the register-block entry.
fieldset/Crcr:
  description: Cyclic Redundancy Check.
  fields:
  - name: txcrc
    description: Transmitted CRC value.
    bit_offset: 0
    bit_size: 15
  - name: mbcrc
    description: CRC Message Buffer.
    bit_offset: 16
    bit_size: 7
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/Ctrl1:
  description: Control 1.
  fields:
  - name: propseg
    description: Propagation Segment.
    bit_offset: 0
    bit_size: 3
  - name: lom
    description: Listen-Only Mode.
    bit_offset: 3
    bit_size: 1
    enum: Lom
  - name: lbuf
    description: Lowest Buffer Transmitted First.
    bit_offset: 4
    bit_size: 1
    enum: Lbuf
  - name: tsyn
    description: Timer Sync.
    bit_offset: 5
    bit_size: 1
    enum: Tsyn
  - name: boffrec
    description: Bus Off Recovery.
    bit_offset: 6
    bit_size: 1
    enum: Boffrec
  - name: smp
    description: CAN Bit Sampling.
    bit_offset: 7
    bit_size: 1
    enum: Smp
  - name: rwrnmsk
    description: RX Warning Interrupt Mask.
    bit_offset: 10
    bit_size: 1
    enum: Rwrnmsk
  - name: twrnmsk
    description: TX Warning Interrupt Mask.
    bit_offset: 11
    bit_size: 1
    enum: Twrnmsk
  - name: lpb
    description: Loopback Mode.
    bit_offset: 12
    bit_size: 1
    enum: Lpb
  - name: errmsk
    description: Error Interrupt Mask.
    bit_offset: 14
    bit_size: 1
    enum: Errmsk
  - name: boffmsk
    description: Bus Off Interrupt Mask.
    bit_offset: 15
    bit_size: 1
    enum: Boffmsk
  - name: pseg2
    description: Phase Segment 2.
    bit_offset: 16
    bit_size: 3
  - name: pseg1
    description: Phase Segment 1.
    bit_offset: 19
    bit_size: 3
  - name: rjw
    description: Resync Jump Width.
    bit_offset: 22
    bit_size: 2
  - name: presdiv
    description: Prescaler Division Factor.
    bit_offset: 24
    bit_size: 8
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/Ctrl2Pn:
  description: Pretended Networking Control 2.
  fields:
  - name: matchto
    description: Timeout for No Message Matching the Filtering Criteria.
    bit_offset: 0
    bit_size: 16
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/Ecr:
  description: Error Counter.
  fields:
  - name: txerrcnt
    description: Transmit Error Counter.
    bit_offset: 0
    bit_size: 8
  - name: rxerrcnt
    description: Receive Error Counter.
    bit_offset: 8
    bit_size: 8
  - name: txerrcnt_fast
    description: Transmit Error Counter for Fast Bits.
    bit_offset: 16
    bit_size: 8
  - name: rxerrcnt_fast
    description: Receive Error Counter for Fast Bits.
    bit_offset: 24
    bit_size: 8
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/Edcbt:
  description: Enhanced Data Phase CAN Bit Timing.
  fields:
