# Exact enum definitions and field layouts shared by MCXA and MCXN.
# Availability retains family-specific types, encodings and software defaults.
# Shared from mcx/a/common/CAN.yaml and the native MCXN imports.
# Native MCXN source revisions and hashes remain on the register-block entry.
fieldset/Crcr:
  description: Cyclic Redundancy Check.
  fields:
  - name: txcrc
    description: Transmitted CRC value.
    bit_offset: 0
    bit_size: 15
  - name: mbcrc
    description: CRC Message Buffer.
    bit_offset: 16
    bit_size: 7
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/Ctrl1:
  description: Control 1.
  fields:
  - name: propseg
    description: Propagation Segment.
    bit_offset: 0
    bit_size: 3
  - name: lom
    description: "Listen-Only Mode.\n\nRaw bit values: false (0) = ListenOnlyModeDisabled: Listen-Only mode is deactivated.; true (1) = ListenOnlyModeEnabled: FlexCAN module operates in Listen-Only mode."
    bit_offset: 3
    bit_size: 1
  - name: lbuf
    description: "Lowest Buffer Transmitted First.\n\nRaw bit values: false (0) = HighestBufferFirst: Buffer with highest priority is transmitted first.; true (1) = LowestBufferFirst: Lowest number buffer is transmitted first."
    bit_offset: 4
    bit_size: 1
  - name: tsyn
    description: "Timer Sync.\n\nRaw bit values: false (0) = TimerSyncDisabled: Disable.; true (1) = TimerSyncEnabled: Enable."
    bit_offset: 5
    bit_size: 1
  - name: boffrec
    description: "Bus Off Recovery.\n\nRaw bit values: false (0) = AutoRecoverEnabled: Enabled.; true (1) = AutoRecoverDisabled: Disabled."
    bit_offset: 6
    bit_size: 1
  - name: smp
    description: "CAN Bit Sampling.\n\nRaw bit values: false (0) = OneSample: One sample is used to determine the bit value.; true (1) = ThreeSample: Three samples are used to determine the value of the received bit: the regular one (sample point) and two preceding samples. A majority rule is used."
    bit_offset: 7
    bit_size: 1
  - name: rwrnmsk
    description: "RX Warning Interrupt Mask.\n\nRaw bit values: false (0) = RxWarningIntDisabled: Disabled.; true (1) = RxWarningIntEnabled: Enabled."
    bit_offset: 10
    bit_size: 1
  - name: twrnmsk
    description: "TX Warning Interrupt Mask.\n\nRaw bit values: false (0) = TxWarningIntDisabled: Disabled.; true (1) = TxWarningIntEnabled: Enabled."
    bit_offset: 11
    bit_size: 1
  - name: lpb
    description: "Loopback Mode.\n\nRaw bit values: false (0) = LoopbackDisabled: Disabled.; true (1) = LoopbackEnabled: Enabled."
    bit_offset: 12
    bit_size: 1
  - name: errmsk
    description: "Error Interrupt Mask.\n\nRaw bit values: false (0) = ErrorIntDisabled: Interrupt disabled.; true (1) = ErrorIntEnabled: Interrupt enabled."
    bit_offset: 14
    bit_size: 1
  - name: boffmsk
    description: "Bus Off Interrupt Mask.\n\nRaw bit values: false (0) = BusOffIntDisabled: Interrupt disabled.; true (1) = BusOffIntEnabled: Interrupt enabled."
    bit_offset: 15
    bit_size: 1
  - name: pseg2
    description: Phase Segment 2.
    bit_offset: 16
    bit_size: 3
  - name: pseg1
    description: Phase Segment 1.
    bit_offset: 19
    bit_size: 3
  - name: rjw
    description: Resync Jump Width.
    bit_offset: 22
    bit_size: 2
  - name: presdiv
    description: Prescaler Division Factor.
    bit_offset: 24
    bit_size: 8
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/Ctrl2Pn:
  description: Pretended Networking Control 2.
  fields:
  - name: matchto
    description: Timeout for No Message Matching the Filtering Criteria.
    bit_offset: 0
    bit_size: 16
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/Ecr:
  description: Error Counter.
  fields:
  - name: txerrcnt
    description: Transmit Error Counter.
    bit_offset: 0
    bit_size: 8
  - name: rxerrcnt
    description: Receive Error Counter.
    bit_offset: 8
    bit_size: 8
  - name: txerrcnt_fast
    description: Transmit Error Counter for Fast Bits.
    bit_offset: 16
    bit_size: 8
  - name: rxerrcnt_fast
    description: Receive Error Counter for Fast Bits.
    bit_offset: 24
    bit_size: 8
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/Edcbt:
  description: Enhanced Data Phase CAN Bit Timing.
  fields:
  - name: dtseg1
    description: Data Phase Segment 1.
    bit_offset: 0
    bit_size: 5
  - name: dtseg2
    description: Data Phase Time Segment 2.
    bit_offset: 12
    bit_size: 4
  - name: drjw
    description: Data Phase Resynchronization Jump Width.
    bit_offset: 22
    bit_size: 4
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/Encbt:
  description: Enhanced Nominal CAN Bit Timing.
  fields:
  - name: ntseg1
    description: Nominal Time Segment 1.
    bit_offset: 0
    bit_size: 8
  - name: ntseg2
    description: Nominal Time Segment 2.
    bit_offset: 12
    bit_size: 7
  - name: nrjw
    description: Nominal Resynchronization Jump Width.
    bit_offset: 22
    bit_size: 7
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/Eprs:
  description: Enhanced CAN Bit Timing Prescalers.
  fields:
  - name: enpresdiv
    description: Extended Nominal Prescaler Division Factor.
    bit_offset: 0
    bit_size: 10
  - name: edpresdiv
    description: Extended Data Phase Prescaler Division Factor.
    bit_offset: 16
    bit_size: 10
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/Erffel:
  description: Enhanced RX FIFO Filter Element.
  fields:
  - name: fel
    description: Filter Element Bits.
    bit_offset: 0
    bit_size: 32
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/Fdcbt:
  description: CAN FD Bit Timing.
  fields:
  - name: fpseg2
    description: Fast Phase Segment 2.
    bit_offset: 0
    bit_size: 3
  - name: fpseg1
    description: Fast Phase Segment 1.
    bit_offset: 5
    bit_size: 3
  - name: fpropseg
    description: Fast Propagation Segment.
    bit_offset: 10
    bit_size: 5
  - name: frjw
    description: Fast Resync Jump Width.
    bit_offset: 16
    bit_size: 3
  - name: fpresdiv
    description: Fast Prescaler Division Factor.
    bit_offset: 20
    bit_size: 10
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/Fdcrc:
  description: CAN FD CRC.
  fields:
  - name: fd_txcrc
    description: Extended Transmitted CRC value.
    bit_offset: 0
    bit_size: 21
  - name: fd_mbcrc
    description: CRC Message Buffer Number for FD_TXCRC.
    bit_offset: 24
    bit_size: 7
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/FltDlc:
  description: Pretended Networking Data Length Code (DLC) Filter.
  fields:
  - name: flt_dlc_hi
    description: Upper Limit for Length of Data Bytes Filter.
    bit_offset: 0
    bit_size: 4
  - name: flt_dlc_lo
    description: Lower Limit for Length of Data Bytes Filter.
    bit_offset: 16
    bit_size: 4
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/FltId2Idmask:
  description: Pretended Networking ID Filter 2 or ID Mask.
  fields:
  - name: flt_id2_idmask
    description: ID Filter 2 for Pretended Networking Filtering or ID Mask Bits for Pretended Networking ID Filtering.
    bit_offset: 0
    bit_size: 29
  - name: rtr_msk
    description: "Remote Transmission Request Mask.\n\nRaw bit values: false (0) = FrameTypeNo: The corresponding bit in the filter is \"don't care.\".; true (1) = FrameTypeYes: The corresponding bit in the filter is checked."
    bit_offset: 29
    bit_size: 1
  - name: ide_msk
    description: "ID Extended Mask.\n\nRaw bit values: false (0) = FrameFormatNo: The corresponding bit in the filter is \"don't care.\".; true (1) = FrameFormatYes: The corresponding bit in the filter is checked."
    bit_offset: 30
    bit_size: 1
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/Iflag1:
  description: Interrupt Flags 1.
  fields:
  - name: buf0i
    description: "Buffer MB0 Interrupt or Clear Legacy FIFO bit.\n\nRaw bit values: false (0) = BufferTxRxNotComplete: MB0 has no occurrence of successfully completed transmission or reception.; true (1) = BufferTxRxComplete: MB0 has successfully completed transmission or reception."
    bit_offset: 0
    bit_size: 1
  - name: buf4to1i
    description: Buffer MBi Interrupt or Reserved.
    bit_offset: 1
    bit_size: 4
  - name: buf5i
    description: "Buffer MB5 Interrupt or Frames available in Legacy RX FIFO.\n\nRaw bit values: false (0) = Id1: No occurrence of completed transmission or reception, or no frames available.; true (1) = Id2: MB5 completed transmission or reception, or frames available."
    bit_offset: 5
    bit_size: 1
  - name: buf6i
    description: "Buffer MB6 Interrupt or Legacy RX FIFO Warning.\n\nRaw bit values: false (0) = Id1: No occurrence of MB6 completing transmission or reception, or FIFO not almost full.; true (1) = Id2: MB6 completed transmission or reception, or FIFO almost full."
    bit_offset: 6
    bit_size: 1
  - name: buf7i
    description: "Buffer MB7 Interrupt or Legacy RX FIFO Overflow.\n\nRaw bit values: false (0) = Id1: No occurrence of MB7 completing transmission or reception, or no FIFO overflow.; true (1) = Id2: MB7 completed transmission or reception, or FIFO overflow."
    bit_offset: 7
    bit_size: 1
  - name: buf31to8i
    description: Buffer MBi Interrupt.
    bit_offset: 8
    bit_size: 24
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/Imask1:
  description: Interrupt Masks 1.
  fields:
  - name: buf31to0m
    description: Buffer MBi Mask.
    bit_offset: 0
    bit_size: 32
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/MbbCs:
  description: Message Buffer 0 CS Register.
  fields:
  - name: time_stamp
    description: Free-Running Counter Time stamp. This 16-bit field is a copy of the Free-Running Timer, captured for Tx and Rx frames at the time when the beginning of the Identifier field appears on the CAN bus.
    bit_offset: 0
    bit_size: 16
  - name: dlc
    description: Length of the data to be stored/transmitted.
    bit_offset: 16
    bit_size: 4
  - name: rtr
    description: Remote Transmission Request. One/zero for remote/data frame.
    bit_offset: 20
    bit_size: 1
  - name: ide
    description: ID Extended. One/zero for extended/standard format frame.
    bit_offset: 21
    bit_size: 1
  - name: srr
    description: Substitute Remote Request. Contains a fixed recessive bit.
    bit_offset: 22
    bit_size: 1
  - name: code
    description: Message Buffer Code. This 4-bit field can be accessed (read or write) by the CPU and by the FlexCAN module itself, as part of the message buffer matching and arbitration process.
    bit_offset: 24
    bit_size: 4
  - name: esi
    description: Error State Indicator. This bit indicates if the transmitting node is error active or error passive.
    bit_offset: 29
    bit_size: 1
  - name: brs
    description: Bit Rate Switch. This bit defines whether the bit rate is switched inside a CAN FD format frame.
    bit_offset: 30
    bit_size: 1
  - name: edl
    description: Extended Data Length. This bit distinguishes between CAN format and CAN FD format frames. The EDL bit must not be set for Message Buffers configured to RANSWER with code field 0b1010.
    bit_offset: 31
    bit_size: 1
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/MbbId:
  description: Message Buffer 0 ID Register.
  fields:
  - name: ext
    description: Contains extended (LOW word) identifier of message buffer.
    bit_offset: 0
    bit_size: 18
  - name: std
    description: Contains standard/extended (HIGH word) identifier of message buffer.
    bit_offset: 18
    bit_size: 11
  - name: prio
    description: Local priority. This 3-bit fieldis only used when LPRIO_EN bit is set in MCR and it only makes sense for Tx buffers. These bits are not transmitted. They are appended to the regular ID to define the transmission priority.
    bit_offset: 29
    bit_size: 3
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/Pl1Hi:
  description: Pretended Networking Payload High Filter 1.
  fields:
  - name: data_byte_7
    description: Data byte 7.
    bit_offset: 0
    bit_size: 8
  - name: data_byte_6
    description: Data byte 6.
    bit_offset: 8
    bit_size: 8
  - name: data_byte_5
    description: Data byte 5.
    bit_offset: 16
    bit_size: 8
  - name: data_byte_4
    description: Data byte 4.
    bit_offset: 24
    bit_size: 8
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/Pl1Lo:
  description: Pretended Networking Payload Low Filter 1.
  fields:
  - name: data_byte_3
    description: Data byte 3.
    bit_offset: 0
    bit_size: 8
  - name: data_byte_2
    description: Data byte 2.
    bit_offset: 8
    bit_size: 8
  - name: data_byte_1
    description: Data byte 1.
    bit_offset: 16
    bit_size: 8
  - name: data_byte_0
    description: Data byte 0.
    bit_offset: 24
    bit_size: 8
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/Rx14mask:
  description: Receive 14 Mask.
  fields:
  - name: rx14m
    description: RX Buffer 14 Mask Bits.
    bit_offset: 0
    bit_size: 32
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/Rx15mask:
  description: Receive 15 Mask.
  fields:
  - name: rx15m
    description: RX Buffer 15 Mask Bits.
    bit_offset: 0
    bit_size: 32
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/Rxfgmask:
  description: Legacy RX FIFO Global Mask.
  fields:
  - name: fgm
    description: Legacy RX FIFO Global Mask Bits.
    bit_offset: 0
    bit_size: 32
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/Rxfir:
  description: Legacy RX FIFO Information.
  fields:
  - name: idhit
    description: Identifier Acceptance Filter Hit Indicator.
    bit_offset: 0
    bit_size: 9
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/Rximr:
  description: Receive Individual Mask.
  fields:
  - name: mi
    description: Individual Mask Bits.
    bit_offset: 0
    bit_size: 32
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/Rxmgmask:
  description: RX Message Buffers Global Mask.
  fields:
  - name: mg
    description: Global Mask for RX Message Buffers.
    bit_offset: 0
    bit_size: 32
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/Timer:
  description: Free-Running Timer.
  fields:
  - name: timer
    description: Timer Value.
    bit_offset: 0
    bit_size: 16
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/WmbD03:
  description: Wake-Up Message Buffer for Data 0-3.
  fields:
  - name: data_byte_3
    description: Data Byte 3.
    bit_offset: 0
    bit_size: 8
  - name: data_byte_2
    description: Data Byte 2.
    bit_offset: 8
    bit_size: 8
  - name: data_byte_1
    description: Data Byte 1.
    bit_offset: 16
    bit_size: 8
  - name: data_byte_0
    description: Data Byte 0.
    bit_offset: 24
    bit_size: 8
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/WmbD47:
  description: Wake-Up Message Buffer Register Data 4-7.
  fields:
  - name: data_byte_7
    description: Data Byte 7.
    bit_offset: 0
    bit_size: 8
  - name: data_byte_6
    description: Data Byte 6.
    bit_offset: 8
    bit_size: 8
  - name: data_byte_5
    description: Data Byte 5.
    bit_offset: 16
    bit_size: 8
  - name: data_byte_4
    description: Data Byte 4.
    bit_offset: 24
    bit_size: 8
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
fieldset/WmbId:
  description: Wake-Up Message Buffer for ID.
  fields:
  - name: id
    description: Received ID in Pretended Networking Mode.
    bit_offset: 0
    bit_size: 29
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
enum/Fcs:
  bit_size: 2
  variants:
  - name: IdFiltering
    description: Message ID filtering only.
    value: 0
  - name: IdPayloadFiltering
    description: Message ID filtering and payload filtering.
    value: 1
  - name: IdFilteringNumber
    description: Message ID filtering occurring a specified number of times.
    value: 2
  - name: IdPayloadFilteringNumber
    description: Message ID filtering and payload filtering a specified number of times.
    value: 3
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
enum/Fltconf:
  bit_size: 2
  variants:
  - name: ErrorActive
    description: Error Active.
    value: 0
  - name: ErrorPassive
    description: Error Passive.
    value: 1
  - name: BusOff
    description: Bus Off.
    value: 2
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
enum/Idam:
  bit_size: 2
  variants:
  - name: OneFullId
    description: 'Format A: One full ID (standard and extended) per ID filter table element.'
    value: 0
  - name: TwoFullId
    description: 'Format B: Two full standard IDs or two partial 14-bit (standard and extended) IDs per ID filter table element.'
    value: 1
  - name: FourPartialId
    description: 'Format C: Four partial 8-bit standard IDs per ID filter table element.'
    value: 2
  - name: AllFramesRejected
    description: 'Format D: All frames rejected.'
    value: 3
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
enum/Idfs:
  bit_size: 2
  variants:
  - name: MatchExact
    description: Match ID contents to an exact target value.
    value: 0
  - name: MatchGte
    description: Match an ID value greater than or equal to a specified target value.
    value: 1
  - name: MatchLte
    description: Match an ID value smaller than or equal to a specified target value.
    value: 2
  - name: MatchRange
    description: Match an ID value within a range of values, inclusive.
    value: 3
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
enum/Mbdsr0:
  bit_size: 2
  variants:
  - name: R08Bytes
    description: 8 bytes.
    value: 0
  - name: R016Bytes
    description: 16 bytes.
    value: 1
  - name: R032Bytes
    description: 32 bytes.
    value: 2
  - name: R064Bytes
    description: 64 bytes.
    value: 3
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
enum/Nmatch:
  bit_size: 8
  variants:
  - name: Match1
    description: Once.
    value: 1
  - name: Match2
    description: Twice.
    value: 2
  - name: Match255
    description: 255 times.
    value: 255
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
enum/Plfs:
  bit_size: 2
  variants:
  - name: MatchExact
    description: Match payload contents to an exact target value.
    value: 0
  - name: MatchGte
    description: Match a payload value greater than or equal to a specified target value.
    value: 1
  - name: MatchLte
    description: Match a payload value smaller than or equal to a specified target value.
    value: 2
  - name: MatchRange
    description: Match upon a payload value within a range of values, inclusive.
    value: 3
  only_in: ^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$
