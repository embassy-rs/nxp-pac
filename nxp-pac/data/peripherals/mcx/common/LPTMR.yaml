# N: MCXN23xRM Rev. 4, section 45.7.1; MCXNP184M150F70RM Rev. 7,
# section 59.7.1. Clock/input enums are IP ordinals, not chip connections.
block/Lptmr:
  description: LPTMR.
  items:
  - name: csr
    only_in: '^MCXA.*$'
    description: Control Status.
    byte_offset: 0
    fieldset: Csr
  - name: csr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Control Status. TCF is write-one-to-clear; clear it before enabling interrupt or DMA requests. Change CSR[5:1] only while disabled, and do not alter them when enabling TEN. Disabling TEN resets the counter and TCF.
    byte_offset: 0
    fieldset: Csr
  - name: psr
    only_in: '^MCXA.*$'
    description: Prescaler and Glitch Filter.
    byte_offset: 4
    fieldset: Psr
  - name: psr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Prescaler and Glitch Filter. Modify these fields only while LPTMR is disabled. Clock selections are ordinal inputs; chip-specific clock connections are not defined here.
    byte_offset: 4
    fieldset: Psr
  - name: cmr
    only_in: '^MCXA.*$'
    description: Compare.
    byte_offset: 8
    fieldset: Cmr
  - name: cmr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Compare. While LPTMR is enabled, modify CMR only when CSR[TCF] is set.
    byte_offset: 8
    fieldset: Cmr
  - name: cnr
    only_in: '^MCXA.*$'
    description: Counter.
    byte_offset: 12
    fieldset: Cnr
  - name: cnr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Counter snapshot. Write this register before reading; the read returns the counter value captured by the preceding write, not a live free-running count.
    byte_offset: 12
    access: ReadWrite
    fieldset: Cnr
fieldset/Cmr:
  description: Compare.
  fields:
  - name: compare
    description: Compare Value.
    bit_offset: 0
    bit_size: 32
fieldset/Cnr:
  description: Counter.
  fields:
  - name: counter
    description: Counter Value.
    bit_offset: 0
    bit_size: 32
fieldset/Csr:
  description: Control Status.
  fields:
  - name: ten
    description: "Timer Enable.\n\nRaw bit values: false (0) = Ten0: Disable.; true (1) = Ten1: Enable."
    bit_offset: 0
    bit_size: 1
  - name: tms
    description: "Timer Mode Select.\n\nRaw bit values: false (0) = Tms0: Time Counter.; true (1) = Tms1: Pulse Counter."
    bit_offset: 1
    bit_size: 1
  - name: tfc
    description: "Timer Free-Running Counter.\n\nRaw bit values: false (0) = Tfc0: Reset when TCF asserts.; true (1) = Tfc1: Reset on overflow."
    bit_offset: 2
    bit_size: 1
  - name: tpp
    description: "Timer Pin Polarity.\n\nRaw bit values: false (0) = Tpp0: Active-high.; true (1) = Tpp1: Active-low."
    bit_offset: 3
    bit_size: 1
  - name: tps
    description: Timer Pin Select.
    bit_offset: 4
    bit_size: 2
    enum: Tps
  - name: tie
    description: "Timer Interrupt Enable.\n\nRaw bit values: false (0) = Tie0: Disable.; true (1) = Tie1: Enable."
    bit_offset: 6
    bit_size: 1
  - name: tcf
    description: "Timer Compare Flag.\n\nRaw bit values: false (0) = NoMatch: CNR != (CMR + 1).; true (1) = Match: CNR = (CMR + 1)."
    bit_offset: 7
    bit_size: 1
  - name: tdre
    description: "Timer DMA Request Enable.\n\nRaw bit values: false (0) = Trde0: Disable.; true (1) = Trde1: Enable."
    bit_offset: 8
    bit_size: 1
fieldset/Psr:
  description: Prescaler and Glitch Filter.
  fields:
  - name: pcs
    description: Prescaler and Glitch Filter Clock Select.
    bit_offset: 0
    bit_size: 2
    enum: Pcs
  - name: pbyp
    description: "Prescaler and Glitch Filter Bypass.\n\nRaw bit values: false (0) = Pbyp0: Prescaler and glitch filter enable.; true (1) = Pbyp1: Prescaler and glitch filter bypass."
    bit_offset: 2
    bit_size: 1
  - name: prescale
    description: Prescaler and Glitch Filter Value.
    bit_offset: 3
    bit_size: 4
    enum: Prescale
enum/Pcs:
  bit_size: 2
  variants:
  - name: Pcs00
    description: Clock 0.
    value: 0
  - name: Pcs01
    description: Clock 1.
    value: 1
  - name: Pcs10
    description: Clock 2.
    value: 2
  - name: Pcs11
    description: Clock 3.
    value: 3
enum/Prescale:
  bit_size: 4
  variants:
  - name: Prescale0000
    description: Prescaler divides the prescaler clock by 2; glitch filter does not support this configuration.
    value: 0
  - name: Prescale0001
    description: Prescaler divides the prescaler clock by 4; glitch filter recognizes change on input pin after two rising clock edges.
    value: 1
  - name: Prescale0010
    description: Prescaler divides the prescaler clock by 8; glitch filter recognizes change on input pin after four rising clock edges.
    value: 2
  - name: Prescale0011
    description: Prescaler divides the prescaler clock by 16; glitch filter recognizes change on input pin after eight rising clock edges.
    value: 3
  - name: Prescale0100
    description: Prescaler divides the prescaler clock by 32; glitch filter recognizes change on input pin after 16 rising clock edges.
    value: 4
  - name: Prescale0101
    description: Prescaler divides the prescaler clock by 64; glitch filter recognizes change on input pin after 32 rising clock edges.
    value: 5
  - name: Prescale0110
    description: Prescaler divides the prescaler clock by 128; glitch filter recognizes change on input pin after 64 rising clock edges.
    value: 6
  - name: Prescale0111
    description: Prescaler divides the prescaler clock by 256; glitch filter recognizes change on input pin after 128 rising clock edges.
    value: 7
  - name: Prescale1000
    description: Prescaler divides the prescaler clock by 512; glitch filter recognizes change on input pin after 256 rising clock edges.
    value: 8
  - name: Prescale1001
    description: Prescaler divides the prescaler clock by 1024; glitch filter recognizes change on input pin after 512 rising clock edges.
    value: 9
  - name: Prescale1010
    description: Prescaler divides the prescaler clock by 2048; glitch filter recognizes change on input pin after 1024 rising clock edges.
    value: 10
  - name: Prescale1011
    description: Prescaler divides the prescaler clock by 4096; glitch filter recognizes change on input pin after 2048 rising clock edges.
    value: 11
  - name: Prescale1100
    description: Prescaler divides the prescaler clock by 8192; glitch filter recognizes change on input pin after 4096 rising clock edges.
    value: 12
  - name: Prescale1101
    description: Prescaler divides the prescaler clock by 16,384; glitch filter recognizes change on input pin after 8192 rising clock edges.
    value: 13
  - name: Prescale1110
    description: Prescaler divides the prescaler clock by 32,768; glitch filter recognizes change on input pin after 16,384 rising clock edges.
    value: 14
  - name: Prescale1111
    description: Prescaler divides the prescaler clock by 65,536; glitch filter recognizes change on input pin after 32,768 rising clock edges.
    value: 15
enum/Tps:
  bit_size: 2
  variants:
  - name: Tps00
    description: Input 0.
    value: 0
  - name: Tps01
    description: Input 1.
    value: 1
  - name: Tps10
    description: Input 2.
    value: 2
  - name: Tps11
    description: Input 3.
    value: 3
