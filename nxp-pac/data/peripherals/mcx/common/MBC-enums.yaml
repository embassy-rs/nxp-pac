    description: select MBC_MEMN_GLBAC2 access control policy for block B.
    value: 2
  - name: Glbac3
    description: select MBC_MEMN_GLBAC3 access control policy for block B.
    value: 3
  - name: Glbac4
    description: select MBC_MEMN_GLBAC4 access control policy for block B.
    value: 4
  - name: Glbac5
    description: select MBC_MEMN_GLBAC5 access control policy for block B.
    value: 5
  - name: Glbac6
    description: select MBC_MEMN_GLBAC6 access control policy for block B.
    value: 6
  - name: Glbac7
    description: select MBC_MEMN_GLBAC7 access control policy for block B.
    value: 7
