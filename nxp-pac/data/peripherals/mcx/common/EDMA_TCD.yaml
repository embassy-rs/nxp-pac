    - name: ch_csr
      description: Channel Control and Status.
      byte_offset: 0
      fieldset: ChCsr
    - name: ch_es
      description: Channel Error Status.
      byte_offset: 4
      fieldset: ChEs
    - name: ch_int
      description: Channel Interrupt Status.
      byte_offset: 8
      fieldset: ChInt
    - name: ch_sbr
