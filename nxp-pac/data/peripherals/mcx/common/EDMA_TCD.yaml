      byte_offset: 54
      bit_size: 16
      fieldset: TcdCiterElinkyes
    - name: tcd_dlast_sga
      description: TCD Last Destination Address Adjustment / Scatter Gather Address.
      byte_offset: 56
      fieldset: TcdDlastSga
    - name: tcd_csr
      description: TCD Control and Status.
      byte_offset: 60
      bit_size: 16
      fieldset: TcdCsr
