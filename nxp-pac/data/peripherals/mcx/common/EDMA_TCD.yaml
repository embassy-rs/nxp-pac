    - name: tcd_saddr
      description: TCD Source Address.
      byte_offset: 32
      fieldset: TcdSaddr
    - name: tcd_soff
      description: TCD Signed Source Address Offset.
      byte_offset: 36
      bit_size: 16
      fieldset: TcdSoff
    - name: tcd_attr
