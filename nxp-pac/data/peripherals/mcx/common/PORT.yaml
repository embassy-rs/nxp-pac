# Shared MCXA2/A5 register block and compatible MCXA/MCXN field definitions.
block/Port:
  only_in: '^MCXA'
  description: Port Control.
  items:
  - name: verid
    description: Version ID.
    byte_offset: 0
    access: Read
    fieldset: Verid
  - name: gpclr
    description: Global Pin Control Low.
    byte_offset: 16
    fieldset: Gpchr
  - name: gpchr
    description: Global Pin Control High.
    byte_offset: 20
    fieldset: Gpchr
  - name: config
    description: Configuration.
    byte_offset: 32
    fieldset: Config
  - name: pcr
    description: Pin Control 0.
    array:
      len: 32
      stride: 4
    byte_offset: 128
    fieldset: Pcr
fieldset/Config:
  description: Configuration.
  fields:
  - name: range
    description: "Port Voltage Range.\n\nRaw bit values: false (0) = Range0: 1.71 V-3.6 V.; true (1) = Range1: 2.70 V-3.6 V."
    bit_offset: 0
    bit_size: 1
fieldset/Gpchr:
  description: Global Pin Control High.
  fields:
  - name: gpwd
    description: Global Pin Write Data.
    bit_offset: 0
    bit_size: 16
  - name: gpwe
    description: "Global Pin Write Enable.\n\nRaw bit values: false (0) = Gpwe0: Not updated.; true (1) = Gpwe1: Updated."
    bit_offset: 16
    bit_size: 1
    array:
      len: 16
      stride: 1
fieldset/Pcr:
  description: Pin Control 2.
  fields:
  - name: ps
    description: "Pull Select.\n\nRaw bit values: false (0) = Ps0: Enables internal pulldown resistor.; true (1) = Ps1: Enables internal pullup resistor."
    bit_offset: 0
    bit_size: 1
  - name: pe
    description: "Pull Enable.\n\nRaw bit values: false (0) = Pe0: Disables.; true (1) = Pe1: Enables."
    bit_offset: 1
    bit_size: 1
  - name: sre
    description: "Slew Rate Enable.\n\nRaw bit values: false (0) = Sre0: Fast.; true (1) = Sre1: Slow."
    bit_offset: 3
    bit_size: 1
  - name: ode
    description: "Open Drain Enable.\n\nRaw bit values: false (0) = Ode0: Disables.; true (1) = Ode1: Enables."
    bit_offset: 5
    bit_size: 1
  - name: dse
    description: "Drive Strength Enable.\n\nRaw bit values: false (0) = Dse0: Low.; true (1) = Dse1: High."
    bit_offset: 6
    bit_size: 1
  - name: mux
    description: Pin Multiplex Control.
    bit_offset: 8
    bit_size: 4
    enum: Mux
  - name: ibe
    description: "Input Buffer Enable.\n\nRaw bit values: false (0) = Ibe0: Disables.; true (1) = Ibe1: Enables."
    bit_offset: 12
    bit_size: 1
  - name: inv
    description: "Invert Input.\n\nRaw bit values: false (0) = Inv0: Does not invert.; true (1) = Inv1: Inverts."
    bit_offset: 13
    bit_size: 1
  - name: lk
    description: "Lock Register.\n\nRaw bit values: false (0) = Lk0: Does not lock.; true (1) = Lk1: Locks."
    bit_offset: 15
    bit_size: 1
fieldset/Verid:
  description: Version ID.
  fields:
  - name: feature
    description: Feature Specification Number.
    bit_offset: 0
    bit_size: 16
    enum: Feature
  - name: minor
    description: Minor Version Number.
    bit_offset: 16
    bit_size: 8
  - name: major
    description: Major Version Number.
    bit_offset: 24
    bit_size: 8
enum/Feature:
  bit_size: 16
  variants:
  - name: Feature0
    description: Basic implementation.
    value: 0
enum/Mux:
  bit_size: 4
  variants:
  - name: Mux0
    value: 0
  - name: Mux1
    value: 1
  - name: Mux2
    value: 2
  - name: Mux3
    value: 3
  - name: Mux4
    value: 4
  - name: Mux5
    value: 5
  - name: Mux6
    value: 6
  - name: Mux7
    value: 7
  - name: Mux8
    value: 8
  - name: Mux9
    value: 9
  - name: Mux10
    value: 10
  - name: Mux11
    value: 11
  - name: Mux12
    value: 12
  - name: Mux13
    value: 13
