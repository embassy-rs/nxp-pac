fieldset/MpEs4:
  description: Management Page Error Status.
  fields:
  - name: dbe
    description: "Destination Bus Error.\n\nRaw bit values: false (0) = NoError: No destination bus error.; true (1) = BusError: Last recorded error was a bus error on a destination write."
    bit_offset: 0
    bit_size: 1
  - name: sbe
    description: "Source Bus Error.\n\nRaw bit values: false (0) = NoError: No source bus error.; true (1) = BusError: Last recorded error was a bus error on a source read."
    bit_offset: 1
    bit_size: 1
  - name: sge
    description: "Scatter/Gather Configuration Error.\n\nRaw bit values: false (0) = NoError: No scatter/gather configuration error.; true (1) = ConfigurationError: Last recorded error was a configuration error detected in the TCDn_DLAST_SGA field."
    bit_offset: 2
    bit_size: 1
  - name: nce
    description: "NBYTES/CITER Configuration Error.\n\nRaw bit values: false (0) = NoError: No NBYTES/CITER configuration error.; true (1) = ConfigurationError: The last recorded error was NBYTES equal to zero or a CITER not equal to BITER error."
    bit_offset: 3
    bit_size: 1
  - name: doe
    description: "Destination Offset Error.\n\nRaw bit values: false (0) = NoError: No destination offset configuration error.; true (1) = ConfigurationError: Last recorded error was a configuration error detected in the TCDn_DOFF field."
    bit_offset: 4
    bit_size: 1
  - name: dae
    description: "Destination Address Error.\n\nRaw bit values: false (0) = NoError: No destination address configuration error.; true (1) = ConfigurationError: Last recorded error was a configuration error detected in the TCDn_DADDR field."
    bit_offset: 5
    bit_size: 1
  - name: soe
    description: "Source Offset Error.\n\nRaw bit values: false (0) = NoError: No source offset configuration error.; true (1) = ConfigurationError: Last recorded error was a configuration error detected in the TCDn_SOFF field."
    bit_offset: 6
    bit_size: 1
  - name: sae
    description: "Source Address Error.\n\nRaw bit values: false (0) = NoError: No source address configuration error.; true (1) = ConfigurationError: Last recorded error was a configuration error detected in the TCDn_SADDR field."
    bit_offset: 7
    bit_size: 1
  - name: ecx
    description: "Transfer Canceled.\n\nRaw bit values: false (0) = NO_CANCELED_TRANSFERS: No canceled transfers.; true (1) = CANCELED_TRANSFER: Last recorded entry was a canceled transfer by the error cancel transfer input."
    bit_offset: 8
    bit_size: 1
  - name: errchn
    description: Error Channel Number or Canceled Channel Number.
    bit_offset: 24
    bit_size: 2
  - name: vld
    description: "Valid.\n\nRaw bit values: false (0) = NoFieldSetOne: No CHn_ES[ERR] fields are set to 1.; true (1) = AtleastOneField: At least one CHn_ES[ERR] field is set to 1, indicating a valid error exists that software has not cleared."
    bit_offset: 31
    bit_size: 1
