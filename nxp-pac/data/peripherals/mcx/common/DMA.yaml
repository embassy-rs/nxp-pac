    description: Arbitration Group For Channel n.
    bit_offset: 0
    bit_size: 5
fieldset/MpCsr4:
  description: Management Page Control.
  fields:
  - name: edbg
    description: Enable Debug.
    bit_offset: 1
    bit_size: 1
  - name: erca
    description: Enable Round Robin Channel Arbitration.
    bit_offset: 2
    bit_size: 1
  - name: hae
    description: "Halt After Error.\n\nRaw bit values: false (0) = NormalOperation: Normal operation.; true (1) = Halt: Any error causes the HALT field to be set to 1."
    bit_offset: 4
    bit_size: 1
  - name: halt
    description: "Halt DMA Operations.\n\nRaw bit values: false (0) = NormalOperation: Normal operation.; true (1) = Stall: Stall the start of any new channels."
    bit_offset: 5
    bit_size: 1
  - name: gclc
    description: Global Channel Linking Control.
    bit_offset: 6
    bit_size: 1
  - name: gmrc
    description: Global Master ID Replication Control.
    bit_offset: 7
    bit_size: 1
  - name: ecx
    description: "Cancel Transfer With Error.\n\nRaw bit values: false (0) = NORMAL_OPERATION: Normal operation.; true (1) = CANCEL: Cancel the remaining data transfer."
    bit_offset: 8
    bit_size: 1
  - name: cx
    description: "Cancel Transfer.\n\nRaw bit values: false (0) = NormalOperation: Normal operation.; true (1) = DataTransferCancel: Cancel the remaining data transfer."
    bit_offset: 9
    bit_size: 1
  - name: active_id
    description: Active Channel ID.
    bit_offset: 24
    bit_size: 2
  - name: active
    description: "DMA Active Status.\n\nRaw bit values: false (0) = Idle: eDMA is idle.; true (1) = Execution: eDMA is executing a channel."
    bit_offset: 31
    bit_size: 1
