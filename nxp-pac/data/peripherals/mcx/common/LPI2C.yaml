# Shared curated A/N LPI2C definitions. Preserve A-specific status wording;
# N views describe the documented FIFO aliases and reset values separately.
block/Lpi2c:
  description: Low-Power Inter-Integrated Circuit.
  items:
  - name: verid
    only_in: '^MCXA'
    description: Version ID.
    byte_offset: 0
    access: Read
    fieldset: Verid
  - name: param
    only_in: '^MCXA'
    description: Parameter.
    byte_offset: 4
    access: Read
    fieldset: Param
  - name: mcr
    only_in: '^MCXA'
    description: Controller Control.
    byte_offset: 16
    fieldset: Mcr
  - name: msr
    only_in: '^MCXA'
    description: Controller Status.
    byte_offset: 20
    fieldset: Msr
  - name: mier
    description: Controller Interrupt Enable.
    byte_offset: 24
    fieldset: Mier
  - name: mder
    description: Controller DMA Enable.
    byte_offset: 28
    fieldset: Mder
  - name: mcfgr0
    only_in: '^MCXA'
    description: Controller Configuration 0.
    byte_offset: 32
