    description: Controller Configuration 2.
    byte_offset: 40
    fieldset: Mcfgr2
  - name: mcfgr3
    only_in: '^MCXA'
    description: Controller Configuration 3.
    byte_offset: 44
    fieldset: Mcfgr3
  - name: mdmr
    only_in: '^MCXA'
    description: Controller Data Match.
    byte_offset: 64
    fieldset: Mdmr
  - name: mccr0
    only_in: '^MCXA'
    description: Controller Clock Configuration 0.
    byte_offset: 72
    fieldset: Mccr0
  - name: mccr1
    only_in: '^MCXA'
    description: Controller Clock Configuration 1.
    byte_offset: 80
    fieldset: Mccr1
  - name: mfcr
    only_in: '^MCXA'
    description: Controller FIFO Control.
    byte_offset: 88
    fieldset: Mfcr
  - name: mfsr
    only_in: '^MCXA'
    description: Controller FIFO Status.
    byte_offset: 92
    access: Read
    fieldset: Mfsr
  - name: mtdr
    only_in: '^MCXA'
    description: Controller Transmit Data.
    byte_offset: 96
    access: Write
    fieldset: Mtdr
  - name: mrdr
    only_in: '^MCXA'
    description: Controller Receive Data.
    byte_offset: 112
    access: Read
    fieldset: Mrdr
  - name: mrdror
    only_in: '^MCXA'
    description: Controller Receive Data Read Only.
    byte_offset: 120
    access: Read
    fieldset: Mrdror
  - name: scr
    only_in: '^MCXA'
    description: Target Control.
    byte_offset: 272
    fieldset: Scr
  - name: ssr
    only_in: '^MCXA'
    description: Target Status.
    byte_offset: 276
    fieldset: Ssr
  - name: sier
    only_in: '^MCXA'
    description: Target Interrupt Enable.
    byte_offset: 280
    fieldset: Sier
  - name: sder
    description: Target DMA Enable.
    byte_offset: 284
    fieldset: Sder
  - name: scfgr0
    only_in: '^MCXA'
    description: Target Configuration 0.
    byte_offset: 288
    fieldset: Scfgr0
  - name: scfgr1
    only_in: '^MCXA'
    description: Target Configuration 1.
    byte_offset: 292
    fieldset: Scfgr1
  - name: scfgr2
    only_in: '^MCXA'
    description: Target Configuration 2.
    byte_offset: 296
    fieldset: Scfgr2
  - name: samr
    only_in: '^MCXA'
    description: Target Address Match.
    byte_offset: 320
    fieldset: Samr
  - name: sasr
    only_in: '^MCXA'
    description: Target Address Status.
    byte_offset: 336
    access: Read
    fieldset: Sasr
  - name: star
    only_in: '^MCXA'
    description: Target Transmit ACK.
    byte_offset: 340
    fieldset: Star
  - name: stdr
    only_in: '^MCXA'
    description: Target Transmit Data.
    byte_offset: 352
    access: Write
    fieldset: Stdr
  - name: srdr
    only_in: '^MCXA'
    description: Target Receive Data.
    byte_offset: 368
    access: Read
    fieldset: Srdr
  - name: srdror
    only_in: '^MCXA'
    description: Target Receive Data Read Only.
    byte_offset: 376
    access: Read
    fieldset: Srdror
  - name: verid
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Version ID.
    byte_offset: 0
    access: Read
    fieldset: NVerid
  - name: param
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Parameter. Controller transmit and receive FIFOs each contain eight entries; burst windows do not describe FIFO depth.
    byte_offset: 4
    access: Read
    fieldset: NParam
  - name: msr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Controller Status. TDF/RDF/MBF/BBF are read-only; EPF/SDF/NDF/ALF/FEF/PLTF/DMF/STF are write-one-to-clear. Do not read-modify-write.
    byte_offset: 20
    fieldset: NMsr
  - name: mfcr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Controller FIFO Control.
    byte_offset: 88
    fieldset: NMfcr
  - name: mfsr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Controller FIFO Status.
    byte_offset: 92
    access: Read
    fieldset: NMfsr
  - name: mtdr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Controller Transmit Data. Writes push command/data into the FIFO. Byte writes to CMD are ignored; byte writes to DATA zero-extend CMD. Command encodings do not establish chip-level HS controller support; the feature list documents HS target support only.
    byte_offset: 96
    access: Write
    fieldset: Mtdr
  - name: mrdr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Controller Receive Data. Reads pull the first entry from the receive FIFO.
    byte_offset: 112
    access: Read
    fieldset: NMrdr
  - name: mrdror
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Controller Receive Data Read Only. Returns the first entry without pulling it from the FIFO.
    byte_offset: 120
    access: Read
    fieldset: NMrdror
  - name: ssr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Target Status. Only RSF/SDF/BEF/FEF are write-one-to-clear; all other fields are read-only. SASR reads clear AVF/AM0F/AM1F/GCF/SARF, STAR writes clear TAF, STDR writes clear TDF, and SRDR reads clear RDF or AVF according to RXCFG. Do not read-modify-write. On masks covered by ERR053287, target mode can incorrectly count SCL and unexpectedly NAK valid data or addresses; target mode is not recommended for production and there is no workaround.
    byte_offset: 276
    fieldset: NSsr
  - name: sier
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Target Interrupt Enable.
    byte_offset: 280
    fieldset: NSier
  - name: sasr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Target Address Status. Read only when SSR.AVF is set. Reading acknowledges the address and clears SSR.AVF/AM0F/AM1F/GCF/SARF; SRDR can return this view when RXCFG selects it.
    byte_offset: 336
    access: Read
    fieldset: NSasr
  - name: srdr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Target Receive Data. Read only when SSR.RDF is set, or when SSR.AVF is set and RXCFG is one. Read clears SSR.RDF or returns SASR and acknowledges the address according to SCFGR1.RXCFG. Not ordinary storage.
    byte_offset: 368
    access: Read
    fieldset: NSrdr
  - name: srdror
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Target Receive Data Read Only. Returns received data without pulling it from the receive register.
    byte_offset: 376
    access: Read
    fieldset: NSrdror
  - name: mtcbr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Controller Transmit Command Burst aliases of MTDR, not independent storage. A word or low-halfword write pushes one command/data entry. Unlike MTDR byte accesses, a low-byte write stages DATA without pushing; a high-byte write pushes CMD with the previously staged DATA. Upper-halfword byte/halfword writes are ignored. Access width remains 32 bits despite the 11-bit payload.
    array:
      len: 128
      stride: 4
    byte_offset: 512
    access: Write
    fieldset: Mtdr
  - name: mtdbr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Transmit Data Burst aliases of MTDR, not independent storage. The documented map ends at MTDBR252 (0x7F0), despite generic 1024-byte wording. Word/halfword writes push four/two bytes DATA0 first with zero CMD; ensure four/two empty FIFO slots because overflow prevention does not signal an error. This view is at the LPI2C mode base, 0x800 above its wrapper base.
    array:
      len: 253
      stride: 4
    byte_offset: 1024
    access: Write
    fieldset: Mtdbr
  - name: mcr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Controller Control. RTF/RRF are write-only FIFO reset commands and read zero. RST holds controller logic/registers except MCR in reset until software clears it. These controls do not select wrapper mode or enable the peripheral clock.
    byte_offset: 16
    fieldset: Mcr
  - name: mcfgr0
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Controller Configuration 0. Do not change HRSEL or HRPOL while host request is enabled.
    byte_offset: 32
    fieldset: Mcfgr0
  - name: mcfgr1
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Controller Configuration 1. Write only with controller disabled. MATCFG encoding 1 is reserved. PINCFG names describe generic routing, not chip pin availability or HS controller support.
    byte_offset: 36
    fieldset: Mcfgr1
  - name: mcfgr2
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Controller Configuration 2. Write only with controller disabled; filter timing uses functional clock cycles, not the prescaled clock.
    byte_offset: 40
    fieldset: Mcfgr2
  - name: mcfgr3
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Controller Configuration 3. Write only with controller disabled.
    byte_offset: 44
    fieldset: Mcfgr3
  - name: mdmr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Controller Data Match. Write only with controller disabled or idle.
    byte_offset: 64
    fieldset: Mdmr
  - name: mccr0
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Controller Clock Configuration 0. Change only with controller disabled. Raw clock counts, not a bus frequency or electrical timing guarantee.
    byte_offset: 72
    fieldset: Mccr0
  - name: mccr1
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Controller Clock Configuration 1. Change only with controller disabled. The generic HS timing register does not establish chip-level HS controller support.
    byte_offset: 80
    fieldset: Mccr1
  - name: scr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Target Control. RTF/RRF are write-only reset commands and read zero. RST holds target logic/registers except SCR in reset until software clears it. Update FILTEN/FILTDZ only with target disabled.
    byte_offset: 272
    fieldset: Scr
  - name: scfgr0
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Target Configuration 0. RDACK is read-only. RDREQ issues a target read request only while the bus is idle; writes while busy may be ignored, so confirm acknowledgement before initiating controller transfer.
    byte_offset: 288
    fieldset: Scfgr0
  - name: scfgr1
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Target Configuration 1. Write only with target disabled. RXCFG/TXCFG refer to target SSR flags; MSR references in the generic encoding prose are inconsistent with the detailed SSR behavior.
    byte_offset: 292
    fieldset: Scfgr1
  - name: scfgr2
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Target Configuration 2. Write only with target disabled. Filter/delay counts are not affected by MCFGR1.PRESCALE and are disabled in HS mode.
    byte_offset: 296
    fieldset: Scfgr2
  - name: samr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Target Address Match. Write only with target disabled.
    byte_offset: 320
    fieldset: Samr
  - name: star
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Target Transmit ACK. Function prose restricts writes to ACKSTALL=1; the field table also permits default ACK/NACK configuration while target is disabled or idle. During ACKSTALL transfers, write once per matching address/received word; this releases the ACK clock stall and clears SSR.TAF. The raw view does not resolve the differing write restrictions.
    byte_offset: 340
    fieldset: Star
  - name: stdr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Target Transmit Data. Write only when SSR.TDF is set. Writes clear TDF and release a TXDSTALL clock stall. Without TXDSTALL, data must be ready before the target-transmit transfer starts or SSR.FEF is set.
    byte_offset: 352
    access: Write
    fieldset: Stdr
