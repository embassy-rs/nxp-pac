# Exact enum definitions and field layouts shared by MCXA and MCXN.
# Shared from mcx/a/common/WUU.yaml; source comments and software defaults are retained.
# MCXN source revisions and hashes remain on the register-block entries.
fieldset/Param:
  only_in: '^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$'
  description: Parameter.
  fields:
  - name: filters
    description: Filter Number.
    bit_offset: 0
    bit_size: 8
  - name: dmas
    description: DMA Number.
    bit_offset: 8
    bit_size: 8
  - name: modules
    description: Module Number.
    bit_offset: 16
    bit_size: 8
  - name: pins
    description: Pin Number.
    bit_offset: 24
    bit_size: 8
fieldset/Verid:
  only_in: '^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$'
  description: Version ID.
  fields:
  - name: feature
    description: Feature Specification Number.
    bit_offset: 0
    bit_size: 16
    enum: Feature
  - name: minor
    description: Minor Version Number.
    bit_offset: 16
    bit_size: 8
  - name: major
    description: Major Version Number.
    bit_offset: 24
    bit_size: 8
enum/Feature:
  only_in: '^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$'
  bit_size: 16
  variants:
  - name: Standard
    description: Standard features implemented.
    value: 0
  - name: FiltAllPwr
    description: Support for DMA/Trigger generation from wake-up pins and filters enabled. Support for external pin/filter detection during all power modes enabled.
    value: 1
enum/Filtc2:
  only_in: '^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$'
  bit_size: 2
  variants:
  - name: Interrupt
    description: Interrupt.
    value: 0
  - name: DmaReq
    description: DMA request.
    value: 1
  - name: Trigger
    description: Trigger event.
    value: 2
enum/Filte2:
  only_in: '^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$'
  bit_size: 2
  variants:
  - name: Disable
    description: Disable.
    value: 0
  - name: EnRiseHi
    description: Enable (Detect on rising edge or high level).
    value: 1
  - name: EnFallLo
    description: Enable (Detect on falling edge or low level).
    value: 2
  - name: EnAny
    description: Enable (Detect on any edge).
    value: 3
enum/Wupe:
  only_in: '^(MCXN2[0-9]{2}|MCXN5[0-9]{2}|MCXN9[0-9]{2}|MCXA[0-9]+)$'
  bit_size: 2
  variants:
  - name: Disable
    description: Disable.
    value: 0
  - name: EnRiseHi
    description: Enable (detect on rising edge or high level).
    value: 1
  - name: EnFallLo
    description: Enable (detect on falling edge or low level).
    value: 2
  - name: EnAny
    description: Enable (detect on any edge).
    value: 3
