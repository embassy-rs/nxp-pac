# Register-compatible across MCXA1/2/3/5. Reference manuals:
# MCXAP64M96FS3RM Rev. 7, MCXAP100M96FS6RM Rev. 7, and
# MCXAP100M180F41RM Rev. 2, section 30.5.1;
# MCXAP100M180F40RM Rev. 2 and MCXAP144M240F60RM Rev. 4, section 31.5.1;
# MCXAP144M240F61RM Rev. 2, section 30.5.1;
# MCXAP172M240F70RM Rev. 1, section 37.5.1.
# MCXN: MCXN23XRM Rev. 4, section 42.6; MCXNP184M150F70RM Rev. 7,
# section 56.6. RTC_SUBSYSTEM wake words at 0xc00/0xc0c are rebased by
# 0xc00 here; subsecond registers at 0x800/0x804 are a separate view.
block/Waketimer:
  description: Wake timer. A nonzero counter write starts a one-shot countdown.
  items:
  - name: wake_timer_ctrl
    description: >-
      Wake Timer Control. WAKE_FLAG is write-one-to-clear. When modifying other
      fields, write WAKE_FLAG as zero to avoid acknowledging a pending event.
    byte_offset: 0
    fieldset: WakeTimerCtrl
  - name: wake_timer_cnt
    description: >-
      Wake Timer Counter. Do not write while counting is in progress. Read twice
      in succession and repeat until the two values match because of clock domain
      crossing. A nonzero write starts a countdown; expiry sets WAKE_FLAG and
      stops the counter until it is reloaded.
    byte_offset: 12
    fieldset: WakeTimerCnt
fieldset/WakeTimerCnt:
  description: Wake Timer Counter.
  bit_size: 32
  reset_value: 0
  fields:
  - name: wake_cnt
    description: >-
      Current count on reads; starting count on writes. Do not write while
      counting. Read twice in succession until both values match.
    bit_offset: 0
    bit_size: 32
fieldset/WakeTimerCtrl:
  description: Wake Timer Control. WAKE_FLAG is write-one-to-clear.
  bit_size: 32
  reset_value: 0
  fields:
  - name: wake_flag
    description: >-
      Wake Timer Status Flag. Set when the counter times out. Writing one clears
      the flag; writing zero has no effect.
    bit_offset: 1
    bit_size: 1
  - name: clr_wake_timer
    description: >-
      Clear Wake Timer. Writing one clears the counter and halts counting until
      a new count is loaded. Writing zero has no effect. Always reads as zero.
    bit_offset: 2
    bit_size: 1
  - name: osc_div_ena
    only_in: '^MCXA[0-9]+$'
    description: >-
      Enables the divide-by-16 stage for the low-frequency oscillator input.
      Must be set for the wake timer to run. The source oscillator and its
      output clock must also be enabled.
    bit_offset: 4
    bit_size: 1
  - name: osc_div_ena
    only_in: '^MCXN(235|236|247|526|527|536|537|546|547|946|947)$'
    description: >-
      Enables the lp_osc clock divider; write one for the wake timer to run.
      MCXN23XRM Rev. 4 section 42.6.4 and MCXNP184M150F70RM Rev. 7 section
      56.6.4 describe a 5-bit ripple-counter output at either 1 kHz or 0.5 kHz.
      These descriptions do not establish the rate selection or an exact time
      per raw counter count.
    bit_offset: 4
    bit_size: 1
  - name: intr_en
    only_in: '^MCXA[0-9]+$'
    description: Enables the interrupt when WAKE_FLAG is set.
    bit_offset: 5
    bit_size: 1
  - name: intr_en
    only_in: '^MCXN(235|236|247|526|527|536|537|546|547|946|947)$'
    description: >-
      Raw interrupt enable bit (zero disables, one enables). MCXN23XRM Rev. 4
      section 42.6.4 and MCXNP184M150F70RM Rev. 7 section 56.6.4 say an interrupt
      is enabled when one is written to WAKE_FLAG, but their diagrams mark
      WAKE_FLAG write-one-to-clear. This wording/diagram inconsistency is
      unresolved; no write-triggered interrupt semantics are assumed here.
    bit_offset: 5
    bit_size: 1
