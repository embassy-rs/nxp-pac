# Shared curated A/N LPUART definitions. N-specific reset and capability views
# are disjoint from the existing A selections.
block/Lpuart:
  description: LPUART.
  items:
  - name: verid
    only_in: '^MCXA'
    description: Version ID.
    byte_offset: 0
    access: Read
    fieldset: Verid
  - name: param
    only_in: '^MCXA'
    description: Parameter.
    byte_offset: 4
    access: Read
    fieldset: Param
  - name: global
    only_in: '^MCXA'
    description: Global.
    byte_offset: 8
    fieldset: Global
  - name: pincfg
    only_in: '^MCXA'
    description: Pin Configuration.
    byte_offset: 12
    fieldset: Pincfg
  - name: baud
    only_in: '^MCXA'
    description: Baud Rate.
    byte_offset: 16
    fieldset: Baud
  - name: stat
    only_in: '^MCXA'
    description: Status.
    byte_offset: 20
    fieldset: Stat
  - name: ctrl
    only_in: '^MCXA'
    description: Control.
    byte_offset: 24
    fieldset: Ctrl
  - name: data
    only_in: '^MCXA'
    description: Data.
    byte_offset: 28
    fieldset: Data
  - name: match_
    only_in: '^MCXA'
    description: Match Address.
    byte_offset: 32
    fieldset: Match
  - name: modir
    only_in: '^MCXA'
    description: MODEM IrDA.
    byte_offset: 36
    fieldset: Modir
  - name: fifo
    only_in: '^MCXA'
    description: FIFO.
    byte_offset: 40
    fieldset: Fifo
  - name: water
    only_in: '^MCXA'
    description: Watermark.
    byte_offset: 44
    fieldset: Water
  - name: dataro
    only_in: '^MCXA'
    description: Data Read-Only.
    byte_offset: 48
    access: Read
    fieldset: Dataro
  - name: verid
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Version ID. Documented reset, not a live capability probe.
    byte_offset: 0
    access: Read
    fieldset: NVerid
  - name: param
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Parameter. The transmit and receive FIFOs each contain eight entries; burst address windows are aliases, not FIFO depth.
    byte_offset: 4
    access: Read
    fieldset: NParam
  - name: baud
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Baud Rate. Change configuration only with transmitter and receiver disabled. OSR encodings 1 and 2 are reserved; OSR 3..6 requires BOTHEDGE.
    byte_offset: 16
    fieldset: NBaud
  - name: stat
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Status. MSF/TSF and RDRF/TC/TDRE/RAF are read-only. MA2F/MA1F/PF/FE/NF/OR/IDLE/RXEDGIF/LBKDIF are write-one-to-clear; avoid read-modify-write. Some flags also participate in DATA access clearing sequences. Change MSBF/AME/LBKFE only with both directions disabled, RXINV/RWUID with receiver disabled, and BRK13 with transmitter disabled. On affected masks ERR051629 can prevent TC from asserting after flushing TX FIFO with CTS negated and TXCTSE set; no workaround is implemented here.
    byte_offset: 20
    fieldset: NStat
  - name: data
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Data. Reads pop the receive FIFO and participate in automatic status-flag clearing; writes push the transmit FIFO. These are distinct read/write views, not ordinary storage; do not read-modify-write. Receive-only status bits must not be interpreted as transmit commands. FRETSC writes select a special character with T9 and require T8..T0 zero.
    byte_offset: 28
    fieldset: NData
  - name: modir
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: MODEM IrDA. Change RTSWATER/RXRTSE with receiver disabled, TXRTSE/TXRTSPOL with transmitter disabled, and TNP/IREN with both disabled. Do not enable RXRTSE and TXRTSE together.
    byte_offset: 36
    fieldset: NModir
  - name: fifo
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: FIFO. RXFIFOSIZE/TXFIFOSIZE/RXEMPT/TXEMPT are read-only; RXUF/TXOF are write-one-to-clear; RXFLUSH/TXFLUSH are flush commands. Avoid read-modify-write. The register description requires writes with CTRL.RE/TE zero and FIFO empty; FIFO operations also have specific command/flag semantics.
    byte_offset: 40
    fieldset: NFifo
  - name: water
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Watermark. TXCOUNT and RXCOUNT are read-only. Write only with CTRL.TE zero.
    byte_offset: 44
    fieldset: NWater
  - name: dataro
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Data Read-Only. Returns DATA without removing the receive FIFO entry.
    byte_offset: 48
    access: Read
    fieldset: NDataro
  - name: ctrl
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Control. Bit6 is reserved in both detailed N manuals, despite N23 XML exposing DOZEEN. Change M/M7/PE/ILT/RSRC/LOOPS configuration only with transmitter and receiver disabled as specified by the field descriptions. R9T8/R8T9 read receive bits but write transmit bits; read-modify-write does not preserve the transmit value. Enabling TE can queue an idle preamble; RE/TE may remain set until the current character finishes after disable.
    byte_offset: 24
    fieldset: Ctrl
  - name: global
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Global. RST holds all LPUART logic/registers except GLOBAL in reset until software clears it; no minimum delay is required before clearing. This is not a wrapper mode or clock control.
    byte_offset: 8
    fieldset: Global
  - name: pincfg
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Pin Configuration. Change TRGSEL only with transmitter and receiver disabled. The raw trigger selector does not establish chip routing.
    byte_offset: 12
    fieldset: Pincfg
  - name: match_
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Match Address. Write MA1/MA2 only while the corresponding BAUD.MAEN1/MAEN2 is disabled.
    byte_offset: 32
    fieldset: Match
  - name: mcr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: MODEM Control.
    byte_offset: 64
    fieldset: Mcr
  - name: msr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: MODEM Status. Delta flags are write-one-to-clear; pin-state bits are read-only. Pad configuration affects observed reset values; the generated default is the documented reset, not sampled pin state. Do not read-modify-write.
    byte_offset: 68
    fieldset: Msr
  - name: reir
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Receiver Extended Idle. Change only with receiver disabled; zero disables extended idle and the minimum enabled interval is one idle character.
    byte_offset: 72
    fieldset: Reir
  - name: teir
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Transmitter Extended Idle. Change only with transmitter disabled; zero disables extended idle and the minimum enabled interval is one idle character.
    byte_offset: 76
    fieldset: Teir
  - name: hdcr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Half Duplex Control. Raw controls, not a mode or pin-ownership operation.
    byte_offset: 80
    fieldset: Hdcr
  - name: tocr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Timeout Control. Counters 0/1 monitor the receiver; 2/3 monitor the transmitter.
    byte_offset: 88
    fieldset: Tocr
  - name: tosr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Timeout Status. TOZ is read-only; each TOF bit is write-one-to-clear and disables its counter when set. Do not read-modify-write.
    byte_offset: 92
    fieldset: Tosr
  - name: timeout
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Timeout N. Write only when the corresponding timeout is disabled or its timeout flag is set. Counters 0/1 monitor receive; 2/3 monitor transmit.
    array:
      len: 4
      stride: 4
    byte_offset: 96
    fieldset: Timeout
  - name: tcbr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Transmit Command Burst aliases of DATA, not independent storage. A 32-bit or low-halfword write pushes one FIFO entry; a low-byte write stages data until the high byte is written. Upper-halfword byte/halfword writes are ignored. The field payload is 16 bits but register access remains 32 bits.
    array:
      len: 128
      stride: 4
    byte_offset: 512
    access: Write
    fieldset: Tcbr
  - name: tdbr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Transmit Data Burst aliases of DATA, not independent storage or 256 FIFO entries. A word pushes four bytes DATA0 first, with three wait states; a halfword pushes two bytes with one wait state. Bytes use CTRL R8T9/R9T8 for upper data bits and zero-extend FRETSC. UART/SPI views overlap physically; selection is external to this model.
    array:
      len: 256
      stride: 4
    byte_offset: 1024
    access: Write
    fieldset: Tdbr
