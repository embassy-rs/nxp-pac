  fields:
  - name: div
    description: Clock divider value.
    bit_offset: 0
    bit_size: 8
  - name: reset
    description: Resets the divider counter.
    bit_offset: 29
    bit_size: 1
    enum: BusclkdivReset
  - name: halt
    description: Halts the divider counter.
    bit_offset: 30
    bit_size: 1
    enum: BusclkdivHalt
  - name: unstab
    description: Divider status flag.
    bit_offset: 31
    bit_size: 1
    enum: AhbclkdivUnstab
  only_in: ^(MCXA(175|176|185|186|255|256|265|266|286|287|456|457|536|537|556|557|566|567|577)|MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947))$
fieldset/Cpu0nstckcal:
  fields:
  - name: tenms
    description: Reload value for 10 ms (100 Hz) timing, subject to system clock skew errors. If the value reads as zero, the calibration value is not known.
    bit_offset: 0
    bit_size: 24
  - name: skew
    description: Indicates whether the TENMS value is exact.
    bit_offset: 24
    bit_size: 1
    enum: Skew
  - name: noref
    description: Indicates whether the device provides a reference clock to the processor.
    bit_offset: 25
    bit_size: 1
    enum: Noref
fieldset/Cpustat:
  fields:
  - name: cpu0sleeping
    description: CPU0 sleeping state.
    bit_offset: 0
