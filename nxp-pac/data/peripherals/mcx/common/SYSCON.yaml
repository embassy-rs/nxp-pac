# Compatible MCXA/MCXN SYSCON field definitions. Register geometry stays local.
# Enum variants, values and documentation match exactly; software defaults are preserved.
enum/AhbmatprioCpu0Sbus:
  bit_size: 2
  variants:
  - name: Level0
    description: level 0.
    value: 0
  - name: Level1
    description: level 1.
    value: 1
  - name: Level2
    description: level 2.
    value: 2
  - name: Level3
    description: level 3.
    value: 3
enum/DebugFeaturesCpu0Dbgen:
  bit_size: 2
  variants:
  - name: Disable
    description: Disables debug.
    value: 1
  - name: Enable
    description: Enables debug.
    value: 2
  only_in: ^(MCXA(132|133|142|143|144|145|146|152|153|154|155|156|173|174|175|176|185|186|255|256|265|266|343|344|345|346|355|356|365|366)|MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947))$
enum/LockAll:
  bit_size: 4
  variants:
  - name: Disable
    description: 'Any other value than b1010: disables write access to all registers.'
    value: 0
  - name: Enable
    description: Enables write access to all registers.
    value: 10
  only_in: ^(MCXA(132|133|142|143|144|145|146|152|153|154|155|156|173|174|175|176|185|186|255|256|265|266|343|344|345|346|355|356|365|366)|MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947))$
enum/SecCode:
  bit_size: 32
  variants:
  - name: Disable
    description: CPU0 DAP is not allowed. Reading back register is read as 0x5.
    value: 0
  - name: Enable
    description: Value to write to enable CPU0 SWD access. Reading back register is read as 0xA.
    value: 305419896
  only_in: ^(MCXA(132|133|142|143|144|145|146|152|153|154|155|156|173|174|175|176|185|186|255|256|265|266|343|344|345|346|355|356|365|366)|MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947))$
fieldset/Ahbclkdiv:
  fields:
  - name: div
    description: Clock divider value.
    bit_offset: 0
    bit_size: 8
  - name: unstab
    description: "Divider status flag.\n\nRaw bit values: false (0) = Stable: Divider clock is stable.; true (1) = Ongoing: Clock frequency is not stable."
    bit_offset: 31
    bit_size: 1
fieldset/BinaryCodeLsb:
  fields:
  - name: code_bin_31_0
    description: Binary code [31:0].
    bit_offset: 0
    bit_size: 32
fieldset/BinaryCodeMsb:
  fields:
  - name: code_bin_41_32
    description: Binary code [41:32].
    bit_offset: 0
    bit_size: 10
fieldset/Busclkdiv:
  fields:
  - name: div
    description: Clock divider value.
    bit_offset: 0
    bit_size: 8
  - name: reset
    description: "Resets the divider counter.\n\nRaw bit values: false (0) = Released: Divider is not reset.; true (1) = Asserted: Divider is reset."
    bit_offset: 29
    bit_size: 1
  - name: halt
    description: "Halts the divider counter.\n\nRaw bit values: false (0) = Run: Divider clock is running.; true (1) = Halt: Divider clock is stopped."
    bit_offset: 30
    bit_size: 1
  - name: unstab
    description: "Divider status flag.\n\nRaw bit values: false (0) = Stable: Divider clock is stable.; true (1) = Ongoing: Clock frequency is not stable."
    bit_offset: 31
    bit_size: 1
  only_in: ^(MCXA(175|176|185|186|255|256|265|266|286|287|456|457|536|537|556|557|566|567|577)|MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947))$
fieldset/Cpu0nstckcal:
  fields:
  - name: tenms
    description: Reload value for 10 ms (100 Hz) timing, subject to system clock skew errors. If the value reads as zero, the calibration value is not known.
    bit_offset: 0
    bit_size: 24
  - name: skew
    description: "Indicates whether the TENMS value is exact.\n\nRaw bit values: false (0) = Exact: TENMS value is exact.; true (1) = Inexact: TENMS value is not exact or not given."
    bit_offset: 24
    bit_size: 1
  - name: noref
    description: "Indicates whether the device provides a reference clock to the processor.\n\nRaw bit values: false (0) = YesRef: Reference clock is provided.; true (1) = NoRef: No reference clock is provided."
    bit_offset: 25
    bit_size: 1
fieldset/Cpustat:
  fields:
  - name: cpu0sleeping
    description: "CPU0 sleeping state.\n\nRaw bit values: false (0) = Awake: CPU is not sleeping.; true (1) = Sleeping: CPU is sleeping."
    bit_offset: 0
    bit_size: 1
  - name: cpu0lockup
    description: "CPU0 lockup state.\n\nRaw bit values: false (0) = Awake: CPU is not in lockup.; true (1) = Sleeping: CPU is in lockup."
    bit_offset: 2
    bit_size: 1
  only_in: ^(MCXA(132|133|142|143|144|145|146|152|153|154|155|156|173|174|175|176|185|186|255|256|265|266|286|287|343|344|345|346|355|356|365|366|456|457|536|537|556|557|566|567|577)|MCXN(235|236|246|247))$
