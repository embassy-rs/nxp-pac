# Shared curated A/N LPSPI definitions with disjoint N reset/capability views.
block/Lpspi:
  description: Low-Power Serial Peripheral Interface.
  items:
  - name: verid
    only_in: '^MCXA'
    description: Version ID.
    byte_offset: 0
    access: Read
    fieldset: Verid
  - name: param
    only_in: '^MCXA'
    description: Parameter.
    byte_offset: 4
    access: Read
    fieldset: Param
  - name: cr
    only_in: '^MCXA'
    description: Control.
    byte_offset: 16
    fieldset: Cr
  - name: sr
    only_in: '^MCXA'
    description: Status.
    byte_offset: 20
    fieldset: Sr
  - name: ier
    description: Interrupt Enable.
    byte_offset: 24
    fieldset: Ier
  - name: der
    only_in: '^MCXA'
    description: DMA Enable.
    byte_offset: 28
    fieldset: Der
  - name: cfgr0
    only_in: '^MCXA'
    description: Configuration 0.
    byte_offset: 32
    fieldset: Cfgr0
  - name: cfgr1
    only_in: '^MCXA'
    description: Configuration 1.
    byte_offset: 36
    fieldset: Cfgr1
  - name: dmr0
    description: Data Match 0.
    byte_offset: 48
    fieldset: Dmr0
  - name: dmr1
    description: Data Match 1.
    byte_offset: 52
    fieldset: Dmr1
  - name: ccr
    only_in: '^MCXA'
    description: Clock Configuration.
    byte_offset: 64
    fieldset: Ccr
  - name: ccr1
    only_in: '^MCXA'
    description: Clock Configuration 1.
    byte_offset: 68
    fieldset: Ccr1
  - name: fcr
    only_in: '^MCXA'
    description: FIFO Control.
    byte_offset: 88
    fieldset: Fcr
  - name: fsr
    only_in: '^MCXA'
    description: FIFO Status.
    byte_offset: 92
    access: Read
    fieldset: Fsr
  - name: tcr
    only_in: '^MCXA'
    description: Transmit Command.
    byte_offset: 96
    fieldset: Tcr
  - name: tdr
    description: Transmit Data.
    byte_offset: 100
    access: Write
    fieldset: Tdr
  - name: rsr
    only_in: '^MCXA'
    description: Receive Status.
    byte_offset: 112
    access: Read
    fieldset: Rsr
  - name: rdr
    only_in: '^MCXA'
    description: Receive Data.
    byte_offset: 116
    access: Read
    fieldset: Rdr
  - name: rdror
    only_in: '^MCXA'
    description: Receive Data Read Only.
    byte_offset: 120
    access: Read
    fieldset: Rdr
  - name: tcbr
    only_in: '^MCXA'
    description: Transmit Command Burst.
    byte_offset: 1020
    access: Write
    fieldset: Tcbr
  - name: tdbr
    only_in: '^MCXA'
    description: Transmit Data Burst.
    array:
      len: 128
      stride: 4
    byte_offset: 1024
    access: Write
    fieldset: Rdbr
  - name: rdbr
    only_in: '^MCXA'
    description: Receive Data Burst.
    array:
      len: 128
      stride: 4
    byte_offset: 1536
    access: Read
    fieldset: Rdbr
  - name: cr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Control. RTF/RRF are write-only FIFO reset commands and read zero. RST holds logic/registers except CR in reset until software clears it. Change DBGEN only with MEN zero. Wrapper mode and clocks are separate controls.
    byte_offset: 16
    fieldset: Cr
  - name: cfgr0
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Configuration 0. Enable RDMO only when idle and SR.DMF is zero; clear RDMO before clearing DMF to avoid losing receive data.
    byte_offset: 32
    fieldset: Cfgr0
  - name: cfgr1
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Configuration 1. Write only with module disabled. MATCFG encoding 1 is reserved and transitions between nonzero match configurations require an intervening zero. PCSPOL is a per-PCS polarity mask, not a single polarity selector. Generic pin/PCS options do not establish chip pin routing.
    byte_offset: 36
    fieldset: Cfgr1
  - name: verid
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Version ID.
    byte_offset: 0
    access: Read
    fieldset: NVerid
  - name: param
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Parameter. Transmit/command and receive FIFOs each contain eight entries; burst address-window lengths are not FIFO depth.
    byte_offset: 4
    access: Read
    fieldset: NParam
  - name: sr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Status. TDF/RDF/MBF are read-only; WCF/FCF/TCF/TEF/REF/DMF are write-one-to-clear. Do not read-modify-write. On affected masks ERR051588 requires transmit FIFO reset after peripheral-mode underrun; no workaround is implemented here.
    byte_offset: 20
    fieldset: NSr
  - name: der
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: DMA Enable. Includes frame-complete request enable.
    byte_offset: 28
    fieldset: Der
  - name: ccr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Clock Configuration. Change only when CR.MEN is zero. SCKDIV and DBT read zero and writes update CCR1 timing fields; a 32-bit write overwrites CCR1. Use the documented byte/halfword sequence when preserving CCR1 fields; do not read-modify-write this alias as independent storage.
    byte_offset: 64
    fieldset: Ccr
  - name: ccr1
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Clock Configuration 1. Controller-mode timing; change only when CR.MEN is zero. Also updated by writes through CCR.SCKDIV and CCR.DBT.
    byte_offset: 68
    fieldset: Ccr1
  - name: fcr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: FIFO Control.
    byte_offset: 88
    fieldset: NFcr
  - name: fsr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: FIFO Status.
    byte_offset: 92
    access: Read
    fieldset: NFsr
  - name: tcr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Transmit Command. Only 32-bit writes are supported and enqueue command words into the transmit FIFO, not ordinary storage. In peripheral mode, change only while idle with no SPI bus transfer. CPOL/CPHA/PRESCALE/PCS update only with PCS deasserted. Reads can be incorrect while the command loads from the FIFO; read when the FIFO is empty or compare repeated reads. Avoid read-modify-write and FIFO reset before the command updates. WIDTH encoding 3 is reserved.
    byte_offset: 96
    fieldset: NTcr
  - name: rsr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Receive Status.
    byte_offset: 112
    access: Read
    fieldset: NRsr
  - name: rdr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Receive Data. Reads pull the first entry from the receive FIFO.
    byte_offset: 116
    access: Read
    fieldset: Rdr
  - name: rdror
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Receive Data Read Only. Returns the first FIFO entry without removing it.
    byte_offset: 120
    access: Read
    fieldset: Rdr
  - name: tcbr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Transmit Command Burst alias of TCR for DMA command writes; not independent storage.
    byte_offset: 1020
    access: Write
    fieldset: Tcbr
  - name: tdbr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Transmit Data Burst aliases of TDR for DMA FIFO writes; not independent storage or 128 FIFO entries. UART/SPI views overlap physically; selection is external to this model.
    array:
      len: 128
      stride: 4
    byte_offset: 1024
    access: Write
    fieldset: Rdbr
  - name: rdbr
    only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
    description: Receive Data Burst aliases of RDR for DMA FIFO reads. Reads remove FIFO entries; not independent storage or 128 FIFO entries.
    array:
      len: 128
      stride: 4
    byte_offset: 1536
    access: Read
    fieldset: Rdbr
fieldset/Ccr:
  description: Clock Configuration.
  fields:
  - name: sckdiv
    description: SCK Divider.
    bit_offset: 0
    bit_size: 8
  - name: dbt
    description: Delay Between Transfers.
    bit_offset: 8
    bit_size: 8
  - name: pcssck
    description: PCS-to-SCK Delay.
    bit_offset: 16
    bit_size: 8
  - name: sckpcs
    description: SCK-to-PCS Delay.
    bit_offset: 24
    bit_size: 8
fieldset/Ccr1:
  description: Clock Configuration 1.
  fields:
  - name: sckset
    description: SCK Setup.
    bit_offset: 0
    bit_size: 8
  - name: sckhld
    description: SCK Hold.
    bit_offset: 8
    bit_size: 8
  - name: pcspcs
    description: PCS to PCS Delay.
    bit_offset: 16
    bit_size: 8
  - name: scksck
    description: SCK Inter-Frame Delay.
    bit_offset: 24
    bit_size: 8
fieldset/Cfgr0:
  description: Configuration 0.
  fields:
  - name: hren
    description: Host Request Enable.
    bit_offset: 0
    bit_size: 1
  - name: hrpol
    description: Host Request Polarity.
    bit_offset: 1
    bit_size: 1
  - name: hrsel
    description: "Host Request Select.\n\nRaw bit values: false (0) = Hreqpin: HREQ pin.; true (1) = InputTrigger: Input trigger."
    bit_offset: 2
    bit_size: 1
  - name: hrdir
    description: "Host Request Direction.\n\nRaw bit values: false (0) = Input: Input.; true (1) = Output: Output."
    bit_offset: 3
    bit_size: 1
  - name: cirfifo
    description: Circular FIFO Enable.
    bit_offset: 8
    bit_size: 1
  - name: rdmo
    description: "Receive Data Match Only.\n\nRaw bit values: false (0) = Stored: Disable.; true (1) = Discarded: Enable."
    bit_offset: 9
    bit_size: 1
fieldset/Cfgr1:
  description: Configuration 1.
  fields:
  - name: master
    description: "Controller Mode.\n\nRaw bit values: false (0) = SlaveMode: Peripheral mode.; true (1) = MasterMode: Controller mode."
    bit_offset: 0
    bit_size: 1
  - name: sample
    description: "Sample Point.\n\nRaw bit values: false (0) = OnSckEdge: SCK edge.; true (1) = OnDelayedSckEdge: Delayed SCK edge."
    bit_offset: 1
    bit_size: 1
  - name: autopcs
    description: Automatic PCS.
    bit_offset: 2
    bit_size: 1
  - name: nostall
    description: No Stall.
    bit_offset: 3
    bit_size: 1
  - name: partial
    description: "Partial Enable.\n\nRaw bit values: false (0) = Discarded: Discard.; true (1) = Stored: Store."
    bit_offset: 4
    bit_size: 1
  - name: pcspol
    description: Peripheral Chip Select Polarity.
    bit_offset: 8
    bit_size: 4
    enum: Pcspol
  - name: matcfg
    description: Match Configuration.
    bit_offset: 16
    bit_size: 3
    enum: Matcfg
  - name: pincfg
    description: Pin Configuration.
    bit_offset: 24
    bit_size: 2
    enum: Pincfg
  - name: outcfg
    description: "Output Configuration.\n\nRaw bit values: false (0) = RetainLastvalue: Retain last value.; true (1) = Tristated: 3-stated."
    bit_offset: 26
    bit_size: 1
  - name: pcscfg
    description: "Peripheral Chip Select Configuration.\n\nRaw bit values: false (0) = ChipSelect: PCS[3:2] configured for chip select function.; true (1) = Halfduplex4bit: PCS[3:2] configured for half-duplex 4-bit transfers (PCS[3:2] = DATA[3:2])."
    bit_offset: 27
    bit_size: 1
fieldset/Cr:
  description: Control.
  fields:
  - name: men
    description: Module Enable.
    bit_offset: 0
    bit_size: 1
  - name: rst
    description: Software Reset.
    bit_offset: 1
    bit_size: 1
  - name: dozen
    only_in: '^MCXA(175|176|185|186|255|256|265|266|286|287|456|457|536|537|556|557|566|567|577)$'
    description: "Doze Mode Enable.\n\nRaw bit values: false (0) = Enabled: Enable.; true (1) = Disabled: Disable."
    bit_offset: 2
    bit_size: 1
  - name: dbgen
    description: Debug Enable.
    bit_offset: 3
    bit_size: 1
  - name: rtf
    description: "Reset Transmit FIFO.\n\nRaw bit values: false (0) = NoEffect: No effect.; true (1) = TxfifoRst: Reset."
    bit_offset: 8
    bit_size: 1
  - name: rrf
    description: "Reset Receive FIFO.\n\nRaw bit values: false (0) = NoEffect: No effect.; true (1) = RxfifoRst: Reset."
    bit_offset: 9
    bit_size: 1
fieldset/Der:
  description: DMA Enable.
  fields:
  - name: tdde
    description: Transmit Data DMA Enable.
    bit_offset: 0
    bit_size: 1
  - name: rdde
    description: Receive Data DMA Enable.
    bit_offset: 1
    bit_size: 1
  - name: fcde
    description: Frame Complete DMA Enable.
    bit_offset: 9
    bit_size: 1
fieldset/Dmr0:
  description: Data Match 0.
  fields:
  - name: match0
    description: Match 0 Value.
    bit_offset: 0
    bit_size: 32
fieldset/Dmr1:
  description: Data Match 1.
  fields:
  - name: match1
    description: Match 1 Value.
    bit_offset: 0
    bit_size: 32
fieldset/Fcr:
  description: FIFO Control.
  fields:
  - name: txwater
    description: Transmit FIFO Watermark.
    bit_offset: 0
    bit_size: 2
  - name: rxwater
    description: Receive FIFO Watermark.
    bit_offset: 16
    bit_size: 2
fieldset/Fsr:
  description: FIFO Status.
  fields:
  - name: txcount
    description: Transmit FIFO Count.
    bit_offset: 0
    bit_size: 3
  - name: rxcount
    description: Receive FIFO Count.
    bit_offset: 16
    bit_size: 3
fieldset/Ier:
  description: Interrupt Enable.
  fields:
  - name: tdie
    description: Transmit Data Interrupt Enable.
    bit_offset: 0
    bit_size: 1
  - name: rdie
    description: Receive Data Interrupt Enable.
    bit_offset: 1
    bit_size: 1
  - name: wcie
    description: Word Complete Interrupt Enable.
    bit_offset: 8
    bit_size: 1
  - name: fcie
    description: Frame Complete Interrupt Enable.
    bit_offset: 9
    bit_size: 1
  - name: tcie
    description: Transfer Complete Interrupt Enable.
    bit_offset: 10
    bit_size: 1
  - name: teie
    description: Transmit Error Interrupt Enable.
    bit_offset: 11
    bit_size: 1
  - name: reie
    description: Receive Error Interrupt Enable.
    bit_offset: 12
    bit_size: 1
  - name: dmie
    description: Data Match Interrupt Enable.
    bit_offset: 13
    bit_size: 1
fieldset/Param:
  description: Parameter.
  fields:
  - name: txfifo
    description: Transmit FIFO Size.
    bit_offset: 0
    bit_size: 8
  - name: rxfifo
    description: Receive FIFO Size.
    bit_offset: 8
    bit_size: 8
  - name: pcsnum
    description: PCS Number.
    bit_offset: 16
    bit_size: 8
fieldset/Rdbr:
  description: Receive Data Burst.
  fields:
  - name: data
    description: Data.
    bit_offset: 0
    bit_size: 32
fieldset/Rdr:
  description: Receive Data.
  fields:
  - name: data
    description: Receive Data.
    bit_offset: 0
    bit_size: 32
fieldset/Rsr:
  description: Receive Status.
  fields:
  - name: sof
    description: "Start of Frame.\n\nRaw bit values: false (0) = NextDataword: Subsequent data word or RX FIFO is empty (RXEMPTY=1).; true (1) = FirstDataword: First data word."
    bit_offset: 0
    bit_size: 1
  - name: rxempty
    description: RX FIFO Empty.
    bit_offset: 1
    bit_size: 1
fieldset/Sr:
  description: Status.
  fields:
  - name: tdf
    description: "Transmit Data Flag.\n\nRaw bit values: false (0) = TxdataNotReqst: Transmit data not requested.; true (1) = TxdataReqst: Transmit data requested."
    bit_offset: 0
    bit_size: 1
  - name: rdf
    description: Receive Data Flag.
    bit_offset: 1
    bit_size: 1
  - name: wcf
    description: Word Complete Flag.
    bit_offset: 8
    bit_size: 1
  - name: fcf
    description: Frame Complete Flag.
    bit_offset: 9
    bit_size: 1
  - name: tcf
    description: Transfer Complete Flag.
    bit_offset: 10
    bit_size: 1
  - name: tef
    description: Transmit Error Flag.
    bit_offset: 11
    bit_size: 1
  - name: ref_
    description: Receive Error Flag.
    bit_offset: 12
    bit_size: 1
  - name: dmf
    description: Data Match Flag.
    bit_offset: 13
    bit_size: 1
  - name: mbf
    description: "Module Busy Flag.\n\nRaw bit values: false (0) = Idle: LPSPI is idle.; true (1) = Busy: LPSPI is busy."
    bit_offset: 24
    bit_size: 1
fieldset/Tcbr:
  description: Transmit Command Burst.
  fields:
  - name: data
    description: Command Data.
    bit_offset: 0
    bit_size: 32
fieldset/Tcr:
  description: Transmit Command.
  fields:
  - name: framesz
    description: Frame Size.
    bit_offset: 0
    bit_size: 12
  - name: width
    description: Transfer Width.
    bit_offset: 16
    bit_size: 2
    enum: Width
  - name: txmsk
    description: "Transmit Data Mask.\n\nRaw bit values: false (0) = Normal: Normal transfer.; true (1) = Mask: Mask transmit data."
    bit_offset: 18
    bit_size: 1
  - name: rxmsk
    description: "Receive Data Mask.\n\nRaw bit values: false (0) = Normal: Normal transfer.; true (1) = Mask: Mask receive data."
    bit_offset: 19
    bit_size: 1
  - name: contc
    description: "Continuing Command.\n\nRaw bit values: false (0) = Start: Command word for start of new transfer.; true (1) = Continue: Command word for continuing transfer."
    bit_offset: 20
    bit_size: 1
  - name: cont
    description: Continuous Transfer.
    bit_offset: 21
    bit_size: 1
  - name: bysw
    description: Byte Swap.
    bit_offset: 22
    bit_size: 1
  - name: lsbf
    description: "LSB First.\n\nRaw bit values: false (0) = MsbFirst: MSB first.; true (1) = LsbFirst: LSB first."
    bit_offset: 23
    bit_size: 1
  - name: pcs
    description: Peripheral Chip Select.
    bit_offset: 24
    bit_size: 2
    enum: Pcs
  - name: prescale
    description: Prescaler Value.
    bit_offset: 27
    bit_size: 3
    enum: Prescale
  - name: cpha
    description: "Clock Phase.\n\nRaw bit values: false (0) = Captured: Captured.; true (1) = Changed: Changed."
    bit_offset: 30
    bit_size: 1
  - name: cpol
    description: "Clock Polarity.\n\nRaw bit values: false (0) = InactiveLow: Inactive low.; true (1) = InactiveHigh: Inactive high."
    bit_offset: 31
    bit_size: 1
fieldset/Tdr:
  description: Transmit Data.
  fields:
  - name: data
    description: Transmit Data.
    bit_offset: 0
    bit_size: 32
fieldset/Verid:
  description: Version ID.
  fields:
  - name: feature
    description: Module Identification Number.
    bit_offset: 0
    bit_size: 16
    enum: Feature
  - name: minor
    description: Minor Version Number.
    bit_offset: 16
    bit_size: 8
  - name: major
    description: Major Version Number.
    bit_offset: 24
    bit_size: 8
enum/Feature:
  bit_size: 16
  variants:
  - name: Standard
    description: Standard feature set supporting a 32-bit shift register.
    value: 4
enum/Matcfg:
  bit_size: 3
  variants:
  - name: Disabled
    description: Match is disabled.
    value: 0
  - name: EnabledFirstdatamatch
    description: Match first data word with compare word.
    value: 2
  - name: EnabledAnydatamatch
    description: Match any data word with compare word.
    value: 3
  - name: EnabledDatamatch100
    description: Sequential match, first data word.
    value: 4
  - name: EnabledDatamatch101
    description: Sequential match, any data word.
    value: 5
  - name: EnabledDatamatch110
    description: Match first data word (masked) with compare word (masked).
    value: 6
  - name: EnabledDatamatch111
    description: Match any data word (masked) with compare word (masked).
    value: 7
enum/Pcs:
  bit_size: 2
  variants:
  - name: TxPcs0
    description: Transfer using PCS[0].
    value: 0
  - name: TxPcs1
    description: Transfer using PCS[1].
    value: 1
  - name: TxPcs2
    description: Transfer using PCS[2].
    value: 2
  - name: TxPcs3
    description: Transfer using PCS[3].
    value: 3
enum/Pcspol:
  bit_size: 4
  variants:
  - name: Discarded
    description: Active low.
    value: 0
  - name: Stored
    description: Active high.
    value: 1
enum/Pincfg:
  bit_size: 2
  variants:
  - name: SinInSoutOut
    description: SIN is used for input data; SOUT is used for output data.
    value: 0
  - name: SinBothInOut
    description: SIN is used for both input and output data; only half-duplex serial transfers are supported.
    value: 1
  - name: SoutBothInOut
    description: SOUT is used for both input and output data; only half-duplex serial transfers are supported.
    value: 2
  - name: SoutInSinOut
    description: SOUT is used for input data; SIN is used for output data.
    value: 3
enum/Prescale:
  bit_size: 3
  variants:
  - name: DivideBy1
    description: Divide by 1.
    value: 0
  - name: DivideBy2
    description: Divide by 2.
    value: 1
  - name: DivideBy4
    description: Divide by 4.
    value: 2
  - name: DivideBy8
    description: Divide by 8.
    value: 3
  - name: DivideBy16
    description: Divide by 16.
    value: 4
  - name: DivideBy32
    description: Divide by 32.
    value: 5
  - name: DivideBy64
    description: Divide by 64.
    value: 6
  - name: DivideBy128
    description: Divide by 128.
    value: 7
enum/Width:
  bit_size: 2
  variants:
  - name: Onebit
    description: 1-bit transfer.
    value: 0
  - name: Twobit
    description: 2-bit transfer.
    value: 1
  - name: Fourbit
    description: 4-bit transfer.
    value: 2
# N23 RM Rev.4 50.4.5.1 and MCX N RM Rev.7 66.4.5.1.
fieldset/NVerid:
  only_in: '^MCXN(235|236|246|247|526|527|536|537|546|547|556|557|946|947)$'
  extends: Verid
  reset_value: 0x02000004
